            read_label: 📖 Đọc Sách
        -   id: 9
            title: Pháp quan kỳ án – Những kẻ buôn người
            summary: "• Pháp quan kỳ án: Vị quan xử oan người vô tội, sau con cháu\
                \ tàn tật – nhân quả công minh.  \n• Những kẻ buôn người: Bọn bắt\
                \ cóc bị báo ứng – thân bại danh liệt, chết bất đắc kỳ tử. |"
