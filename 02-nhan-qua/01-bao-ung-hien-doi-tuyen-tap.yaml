            read_label: 📖 Đọc Sách
        -   id: 8
            title: Người chồng tài hoa
            summary: '• Người chồng tài hoa: Một người đàn ông có tài nhưng ngoại
                tình, bỏ vợ. Sau bị tai nạn liệt, nhờ sám hối, đọc kinh mới thoát
                khổ. |'
