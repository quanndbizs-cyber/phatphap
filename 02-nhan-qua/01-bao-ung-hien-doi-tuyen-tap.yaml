      title: Tổ kiến và nhà ở
      summary: Người phá tổ kiến, dùng lửa thiêu đốt muôn vàn sinh linh khiến gia
        đạo bất an, nhà cửa thường xuyên gặp hỏa hoạn và tranh chấp; dạy hạnh từ bi
        bảo vệ loài vật nhỏ bé.
