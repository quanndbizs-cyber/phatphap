            read_label: 📖 Đọc Sách
        -   id: 2
            title: Nước lèo trứ danh
            summary: '• Nước lèo trứ danh: Chủ quán phở dùng xác cá, xương chết làm
                nước lèo, khoe nấu ngon. Sau bị bệnh lở loét, khách quay lưng, quán
                sụp. Thầy nói: “Ăn bằng máu thịt sinh linh, tất bệnh từ miệng mà vào.”
                |'
