            read_label: 📖 Đọc Sách
        -   id: 10
            title: Quán ngon cao cấp – Đi câu bị cảm động
            summary: "• Quán ngon cao cấp: Nhà hàng bán thịt thú rừng bị cháy rụi\
                \ – quả báo nghiệp sát và tham thực.  \n• Đi câu bị cảm động: Người\
                \ câu cá chứng kiến cảnh cá mẹ bảo vệ con, xúc động bỏ nghề. |"
