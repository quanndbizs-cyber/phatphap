            read_label: 📖 Đọc Sách
        -   id: 12
            title: Thịt rùa ngon – Tình thương khỉ lông vàng – Hứa tiên sinh – Ngọc
                Lan
            summary: "• Thịt rùa ngon: Người ăn rùa bị bệnh da nghiêm trọng.  \n•\
                \ Tình thương khỉ lông vàng: Khỉ cứu người, được tán thán là loài\
                \ hữu tình có nhân.  \n• Hứa tiên sinh: Người ác ngộ đạo sau khi gặp\
                \ tai nạn, phát tâm tu.  \n• Ngọc Lan: Cô gái thiện tâm, cảm hóa người\
                \ chồng mê tửu sắc. |"
