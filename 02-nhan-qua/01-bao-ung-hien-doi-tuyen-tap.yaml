            read_label: 📖 Đọc Sách
        -   id: 7
            title: Tiểu thư khỉ – Trộm công giảm liệu
            summary: "• Tiểu thư khỉ: Cô gái bị bệnh lạ, thầy cho biết là kiếp trước\
                \ hành hạ khỉ.  \n• Trộm công giảm liệu: Người bớt vật liệu khi xây\
                \ dựng bị liệt nửa người – báo của trộm của công. |"
