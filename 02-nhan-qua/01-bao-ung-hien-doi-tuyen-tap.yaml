        -   id: 11
            title: Chuyện nơi lâm trường – Khi máy mổ hoàn tất – Cận tử nghiệp đáng
                sợ
            summary: "• Chuyện nơi lâm trường: Người chặt phá rừng bị cây đổ đè chết\
                \ – nghiệp phá sinh mạng.  \n• Khi máy mổ hoàn tất: Bác sĩ mổ động\
                \ vật bị ám ảnh, sau mắc bệnh tim.  \n• Cận tử nghiệp đáng sợ: Người\
                \ hấp hối thấy ma quỷ do nghiệp sát hiện hình, sợ hãi đến chết. |"
