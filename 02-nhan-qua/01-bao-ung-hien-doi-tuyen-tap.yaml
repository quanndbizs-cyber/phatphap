    - id: 6
      title: Dùi lỗ lấy nhọt
      summary: Bệnh nhân bị mụn nhọt độc lở loét ở mông vô cùng đau đớn, phải dùng
        dùi chọc mủ; căn nguyên do lúc nhỏ ham vui dùng cây sắt nung chọc vào tổ côn
        trùng và nướng chết sinh linh.
