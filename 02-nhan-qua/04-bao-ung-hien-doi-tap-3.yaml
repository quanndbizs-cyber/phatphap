                \ khổ, bệnh tật.  \n• Dùng Cho Hết: Tham ăn, giấu của ăn → bệnh đường\
                \ ruột.  \n• Đừng Lấy Vật Không Phải Của Mình: Lấy đồ cúng chùa →\
                \ họa mù lòa/khốn đốn.  \n• Thân Khuyển Mã: Ngược đãi chó/ngựa → tai\
