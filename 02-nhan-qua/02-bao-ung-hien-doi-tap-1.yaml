    - id: 18
      title: Mỹ nữ và thổ phỉ
      summary: Cô Triệu chịu cảnh bị kẻ cướp hãm hiếp, mất người thân và chồng ốm
        đau. Hòa thượng chỉ ra kiếp trước cô là thủ lĩnh thổ phỉ giả trai, cướp bóc
        và cưỡng hiếp phụ nữ; người chồng hiện tại chính là anh nông dân cô từng tha
        mạng nên nay trả ơn. Sự bất hạnh của cô là nghiệp báo; chỉ có học Phật, tụng
        kinh, ăn chay mới chuyển hóa.
