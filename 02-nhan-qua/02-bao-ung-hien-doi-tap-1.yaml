    - id: 22
      title: Hộ trì Phật pháp bằng đức hạnh
      summary: Một nữ Phật tử cúng dường nhiều nhưng lại kiêu mạn, nói xấu chùa và
        chư Tăng. Sau đó bà mắc ung thư phổi. Hòa thượng khuyên cúng dường phải xuất
        phát từ lòng thành, không kèm ngã mạn; bà nên tụng Kinh Địa Tạng, khiêm hạ,
        sửa tâm. Bà làm theo, đọc kinh 19 lần thì khối u biến mất.
