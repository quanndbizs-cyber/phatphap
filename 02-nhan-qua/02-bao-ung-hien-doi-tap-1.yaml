    - id: 15
      title: Bệnh tùng khẩu nhập
      summary: Một phụ nữ hỏi về mẹ chồng đi vài trăm mét là chân đau thấu xương.
        Hòa thượng cho biết bà thích ăn chân giò kho; ai ăn bộ phận nào sẽ mắc bệnh
        ở bộ phận đó. Ngài cảnh báo quan niệm “ăn gì bổ nấy” là sai; sát hại động
        vật để bổ dưỡng sẽ nhận quả báo tương tự.
