    - id: 23
      title: Quả báo của việc mua bán thịt động vật sống (Rắn mối)
      summary: Ông Ngô hành nghề mua bán rắn mối. Ông tận mắt thấy người đồng nghiệp
        Tố Vượng mổ bụng rắn mối còn sống bằng dao tre. Sau này Tố Vượng bị tai nạn,
        bị cây tre đâm xuyên người giống như cách ông giết rắn; vợ con ông cũng chết
        thảm. Chứng kiến quả báo kinh hoàng, ông Ngô bỏ nghề buôn bán động vật.
