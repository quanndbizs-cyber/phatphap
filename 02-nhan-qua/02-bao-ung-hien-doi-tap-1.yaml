    - id: 21
      title: Nhân nào quả nấy
      summary: Ông Trương thường chóng mặt, không rõ nguyên nhân. Hòa thượng nhắc
        ông thời trẻ từng rung tổ chuột làm lũ chuột con xây xẩm rồi chết; nay ông
        phải chịu quả báo giống vậy. Ngài khuyên ông sám hối, đừng giết hại, hãy bố
        thí thức ăn cho loài chuột và tụng kinh để chuộc lỗi.
