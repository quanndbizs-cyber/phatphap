    - id: 20
      title: Ăn chay trì giới mới được lợi ích
      summary: Bà Đồng bị tiêu chảy liên tục. Hòa thượng bảo bà do ăn mặn mà gây bệnh
        nên phải niệm “Nam mô Quán Thế Âm Bồ-tát”, bỏ thịt cá và tụng kinh. Ban đầu
        bà ngần ngại nhưng thử làm thì khỏi bệnh. Từ đó bà trường chay, siêng tụng
        kinh nên sức khỏe tốt lên.
