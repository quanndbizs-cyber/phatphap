            title: Bàn về quỷ thần
            summary: "• Giải thích thế giới quỷ thần có thật; người hiền được hộ trì,\
                \ kẻ ác bị oan linh theo báo.  \n• Khuyên đừng xem thường thế giới\
                \ vô hình, hãy giữ thiện niệm. |"
