            read_label: 📖 Đọc Sách
        -   id: 7
            title: Phá thai là tội nặng
            summary: "• Phá thai → oan hồn theo báo, thân bệnh, mộng ác.  \n• Sám\
                \ hối, tụng Địa Tạng, phóng sinh mới giải oan. |"
            audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660497?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
