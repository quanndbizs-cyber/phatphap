            read_label: 📖 Đọc Sách
        -   id: 16
            title: Hoàng Đình
            summary: "• Người phỉ báng Phật pháp → bị bệnh nặng.  \n• Sám hối → khỏi\
                \ bệnh, phát tâm tu. |"
