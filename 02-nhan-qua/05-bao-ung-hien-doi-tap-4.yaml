            read_label: 📖 Đọc Sách
        -   id: 3
            title: Chơi cổ phiếu chướng ngại tu hành
            summary: "• Người tu vẫn tham lợi cổ phiếu, mất đạo tâm.  \n• Tham tài\
                \ phi nghĩa → tâm loạn, phước tiêu. |"
