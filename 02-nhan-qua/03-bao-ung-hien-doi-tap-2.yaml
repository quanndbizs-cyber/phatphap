    - id: 2
      title: Ba mỹ nhân
      summary: Ba phụ nữ dùng sắc đẹp để đạt danh lợi, khiến bao người sa đọa. Cuối
        cùng thân bại danh liệt, bệnh tật và cô độc. Hòa thượng dạy sắc đẹp là nhân
        ngắn ngủi, nên tu tâm tịnh hạnh.
