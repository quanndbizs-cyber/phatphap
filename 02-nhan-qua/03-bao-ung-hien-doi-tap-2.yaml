      read_label: 📖 Đọc Sách
    - id: 4
      title: Nguyên nhân đáng sợ
      summary: Một người bệnh tim tái phát, thầy nói do kiếp trước từng giết hại người.
        Sám hối, phóng sinh thì bệnh khỏi.
