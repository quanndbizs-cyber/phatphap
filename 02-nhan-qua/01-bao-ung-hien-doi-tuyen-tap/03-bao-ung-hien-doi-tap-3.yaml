      read_label: 📖 Đọc sách
    - id: 35
      title: Những điềm mộng báo trước
      summary: 'Nhân vật & Hoàn cảnh: Phân tích cơ chế tâm linh kỳ diệu đằng sau các
        giấc mộng điềm báo trước về tai nạn, thiên tai địa chấn và sự biến đổi vận
        mệnh của con người.

        Hành vi tạo nghiệp: Tâm thức chúng sinh luôn có sự giao cảm vi tế cùng từ
        trường trời đất và thần linh; người tạo ác nghiệp hay bị mộng mị kinh hoàng
        quấy nhiễu.

        Quả báo hiện tiền: Những giấc mộng cảnh báo về tai nạn giao thông, hỏa hoạn
        và động đất đều ứng nghiệm chuẩn xác, thức tỉnh con người về thế giới vô hình.

        Bài học & Chuyển hóa: Giấc mộng là tiếng chuông cảnh tỉnh của lương tâm và
        nghiệp thức; hãy mau chóng sám hối, phóng sinh làm lành để chuyển nguy thành
        an trước khi quả báo ập đến.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660477?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-35
      read_label: 📖 Đọc sách
    - id: 36
      title: Báo mộng địa chấn ở Vấn Châu
      summary: 'Nhân vật & Hoàn cảnh: Nhóm Phật tử trẻ tuổi tại Thâm Quyến chí thành
        thực hành công hạnh phóng sinh cứu mạng muôn loài chim cá thường xuyên mỗi
        tuần.

        Hành vi tạo nghiệp: Cứu vớt hàng vạn sinh linh cá tôm chuẩn bị bị đưa vào
        lò mổ và chảo dầu sôi của các nhà hàng quán nhậu đẫm máu.

        Quả báo hiện tiền: Cảm ứng đất trời mầu nhiệm: đàn cá nhảy múa trên mặt nước
        vẫy đuôi tạ ơn, mây ngũ sắc hiện trên bầu trời; bệnh tật của các thành viên
        tiêu trừ, công việc hanh thông tốt đẹp.

        Bài học & Chuyển hóa: Phóng sinh là phương pháp tích phước tiêu nghiệp nhanh
        nhất; đem lại sự sống cho chúng sinh chính là đem lại thọ mạng dài lâu và
        an lạc cho chính mình.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660478?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-36
      read_label: 📖 Đọc sách
    - id: 37
      title: Giáo dục rất quan trọng
      summary: 'Nhân vật & Hoàn cảnh: Câu chuyện đau lòng về một người con trai bất
        hiếu đối xử tàn tệ, hắt hủi và bỏ mặc cha mẹ già yếu trong cảnh đói rét bần
        hàn.

        Hành vi tạo nghiệp: Quên ơn mang nặng đẻ đau bú mớm nuôi nấng của cha mẹ già;
        vì nghe lời vợ mà xua đuổi cha mẹ ra chái bếp lụp xụp không cho ăn uống đủ
        bữa.

        Quả báo hiện tiền: Đứa con trai lớn lên bị chính con ruột của mình đối xử
        bạc bẽo y hệt, sau đó mắc bệnh ung thư gan đau đớn cùng cực chết trong cô
        độc không ai ngó ngàng.

        Bài học & Chuyển hóa: Bất hiếu là tội nặng đứng đầu muôn tội ác; trời đất
        quỷ thần đều căm ghét trừng phạt nghiêm khắc; phụng dưỡng cha mẹ chính là
        cúng dường Phật hiện tiền.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660479?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-37
      read_label: 📖 Đọc sách
    - id: 38
      title: Kinh nghiệm phóng sinh
      summary: 'Nhân vật & Hoàn cảnh: Nghi thức cúng thất và tụng kinh khai thị cho
        các hương linh vừa mới qua đời trong tuần thất đầu tiên của giai đoạn thân
        trung ấm 49 ngày.

        Hành vi tạo nghiệp: Thần thức người chết trong 49 ngày vô cùng hoang mang
        sợ hãi, chịu sự chi phối mãnh liệt của nghiệp lực thiện ác đã tạo lúc sinh
        tiền.

        Quả báo hiện tiền: Nếu người nhà sát sinh mổ thịt đãi đằng thì chỉ làm tăng
        thêm tội nghiệp nặng nề cho vong linh, khiến họ bị đọa đày nơi tam đồ ác đạo.

        Bài học & Chuyển hóa: Trong 49 ngày thân nhân phải làm chay thanh tịnh, chí
        thành tụng Kinh Địa Tạng và niệm Phật A Di Đà hồi hướng để cứu vớt hương linh
        siêu thăng cõi lành.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660481?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-38
      read_label: 📖 Đọc sách
    - id: 39
      title: Chú rùa xanh
      summary: 'Nhân vật & Hoàn cảnh: Lời tâm sự chân thành và sâu sắc của một nữ
        tri thức xinh đẹp buông bỏ công danh sự nghiệp rực rỡ để xuất gia làm ni cô
        nơi chốn thiền môn.

        Hành vi tạo nghiệp: Nhìn thấu bản chất vô thường mong manh của cuộc đời thế
        tục, nhận ra danh lợi và ái ân chỉ như làn khói mây bay thoáng chốc không
        bền.

        Quả báo hiện tiền: Thoát khỏi vòng xoáy cơm áo gạo tiền và tranh đoạt thị
        phi, tìm lại sự tự tại thanh thản tuyệt đối trong tâm hồn dưới bóng từ bi
        Tam Bảo.

        Bài học & Chuyển hóa: Xuất gia là việc làm của bậc đại trượng phu, không phải
        vì bi quan trốn đời mà là để tìm cầu chân lý tối thượng và cứu độ muôn loài
        thoát khỏi biển khổ sinh tử.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660482?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-39
      read_label: 📖 Đọc sách
    - id: 40
      title: Quả báo bất hiếu
      summary: 'Nhân vật & Hoàn cảnh: Lời giải đáp minh triết của Hòa thượng Diệu
        Pháp cho thắc mắc lớn của nhiều Phật tử: vì sao nhiều bậc chân tu cao tăng
        đại đức lại mang trọng bệnh trước khi viên tịch?

        Hành vi tạo nghiệp: Người tu hành chân chính phát đại bồ đề tâm nguyện gánh
        vác nghiệp chướng cho chúng sinh, chuyển đổi ác nghiệp nhiều đời thành quả
        báo nhẹ ở hiện đời.

        Quả báo hiện tiền: Bệnh tật thân xác là cơ hội thanh lọc tàn dư nghiệp lực,
        trả xong món nợ sinh tử cuối cùng để thong dong vãng sinh cõi Phật không còn
        vướng bận.

        Bài học & Chuyển hóa: Chớ nên nhìn hiện tượng bên ngoài mà sinh tâm nghi ngờ
        chánh pháp; hãy thấu hiểu hạnh nguyện xả thân vì đạo và đạo lực vô lượng của
        các bậc chân tu.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660483?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-40
      read_label: 📖 Đọc sách
    - id: 41
      title: Tuần thất đầu tiên
      summary: 'Nhân vật & Hoàn cảnh: Cuộc đời khổ tu đầy gian nan thử thách nhưng
        kiên cường bất khuất của Sư Hằng Nghiêm trải qua giai đoạn chiến tranh loạn
        lạc khốc liệt.

        Hành vi tạo nghiệp: Giữa bom đạn tàn phá và hiểm nguy rình rập, Ngài vẫn một
        lòng kiên trinh giữ gìn giới luật, không màng sống chết bảo vệ kinh điển và
        tự viện.

        Quả báo hiện tiền: Cảm ứng chư thiên hộ pháp che chở thoát chết gang tấc trong
        làn mưa bom bão đạn, đạo tâm kiên cố như bàn thạch ngàn năm.

        Bài học & Chuyển hóa: Tấm gương sáng ngời về ý chí tu hành và niềm tin son
        sắt vào Phật đạo; là nguồn cổ vũ lớn lao cho hàng hậu học vững bước trên con
        đường giải thoát.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660484?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-41
      read_label: 📖 Đọc sách
    - id: 42
      title: Vì sao cô đi tu
      summary: Mùa thu năm 2003, một ngày trời trong đẹp, gió thổi hiu hiu, tôi và
        bạn già đi đến chùa Bàn Long nổi danh ở huyện Nguyên Thị tỉnh Hà Bắc. Thắp
        hương lễ Phật xong, chúng tôi đi dạo nhìn ngắm cảnh trong chùa, lúc nãy có
        một sư nữ mặt tươi tắn...
