      read_label: 📖 Đọc sách
    - id: 23
      title: Kim giám đốc
      summary: 'Nhân vật & Hoàn cảnh: Một người vợ hiền thục siêng năng đảm đang một
        đời vì chồng vì con, nhưng người chồng lại sa đà bồ bịch ngoại tình và phụ
        bạc nghĩa tào khang.

        Hành vi tạo nghiệp: Mối nghịch duyên oan trái từ tiền kiếp: kiếp trước bà
        từng đối xử phụ bạc lạnh nhạt với người chồng, kiếp này hoán đổi vai vế để
        đền trả nợ cũ.

        Quả báo hiện tiền: Nỗi đau đớn xé ruột khi bị người đầu ấp tay gối phản bội,
        sống trong trầm cảm dằn vặt muốn hủy hoại thân thể để chấm dứt đau khổ.

        Bài học & Chuyển hóa: Hiểu rõ lý duyên nợ nhân quả nhiều đời, bà buông bỏ
        oán hận, nương tựa cửa Phật tu hành bái sám; nhờ tâm thanh tịnh chuyển hóa
        mà chồng bà hồi tâm chuyển ý quay về.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660466?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-23
      read_label: 📖 Đọc sách
    - id: 24
      title: Tần phu nhân
      summary: 'Nhân vật & Hoàn cảnh: Anh Kim là giám đốc một nhà in lớn, vốn là người
        vô thần không tin tôn giáo nhưng tình nguyện lái xe đưa tác giả và đoàn Phật
        tử đi công việc.

        Hành vi tạo nghiệp: Từng có suy nghĩ coi Phật giáo là mê tín dị đoan, ỷ vào
        sức mình và tiền tài danh vọng mà không tin có thế giới vô hình và luật nhân
        quả.

        Quả báo hiện tiền: Trên đường đi chứng kiến những hiện tượng cảm ứng nhiệm
        mầu và tài tiên tri phá án nhân quả kỳ tài của Hòa thượng Diệu Pháp khiến
        anh rùng mình kinh phục.

        Bài học & Chuyển hóa: Bừng tỉnh tín tâm chánh tín, giám đốc Kim phát tâm quy
        y Tam Bảo, tình nguyện dùng hệ thống nhà in ấn tống kinh sách Phật giáo cứu
        độ muôn người.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660465?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-24
      read_label: 📖 Đọc sách
    - id: 25
      title: Thằng cháu quý
      summary: 'Nhân vật & Hoàn cảnh: Tần phu nhân là một phụ nữ tài sắc vẹn toàn,
        có năng khiếu hội họa mỹ thuật từ nhỏ nhưng cuộc đời chịu nhiều nghịch cảnh
        truân chuyên trong hôn nhân.

        Hành vi tạo nghiệp: Tiền kiếp từng là một họa sĩ tài ba nhưng kiêu căng ngạo
        mạn, từng vẽ tranh kích động lòng tham dục và khinh miệt người kém tài hơn
        mình.

        Quả báo hiện tiền: Hôn nhân đổ vỡ, bị người tình lừa gạt tiền bạc và tình
        cảm, sống trong nỗi cô đơn cùng cực giữa chốn phồn hoa đô hội.

        Bài học & Chuyển hóa: Nhờ quy y Tam Bảo, dùng tài năng hội họa vẽ tranh Phật
        và Bồ Tát cúng dường; tâm tánh nhu hòa bái sám tiêu trừ nghiệp chướng, tìm
        lại sự thanh thản an vui tột cùng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660467?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-25
      read_label: 📖 Đọc sách
    - id: 26
      title: Tu không nên độc tài
      summary: 'Nhân vật & Hoàn cảnh: Đứa cháu đích tôn độc nhất trong một gia đình
        hào môn được ông bà cha mẹ nuông chiều như vàng như ngọc từ tấm bé.

        Hành vi tạo nghiệp: Đứa cháu lớn lên ngỗ nghịch phá phách, sa đà vào cờ bạc
        ma túy, thường xuyên đập phá đồ đạc và đe dọa tống tiền chính cha mẹ ruột
        của mình.

        Quả báo hiện tiền: Tiền tài tiêu tán, gia phong sụp đổ; Hòa thượng chỉ rõ
        đứa cháu quý chính là chủ nợ tiền kiếp đầu thai vào làm con cháu để đòi món
        nợ khổng lồ năm xưa.

        Bài học & Chuyển hóa: Nuông chiều con cháu mù quáng là hại con hại mình; phải
        giáo dục con cái bằng đạo đức nhân quả, lấy Phật pháp rèn giũa tâm tánh từ
        thuở ấu thơ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660468?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-26
      read_label: 📖 Đọc sách
    - id: 27
      title: Tình chấp nhiều đời
      summary: 'Nhân vật & Hoàn cảnh: Một vị trưởng đạo tràng tu học nhiều năm nhưng
        tính tình gia trưởng, độc tài chuyên quyền, luôn bắt mọi người phải phục tùng
        ý kiến riêng của mình.

        Hành vi tạo nghiệp: Mượn danh nghĩa hộ trì chánh pháp để thỏa mãn bản ngã
        độc đoán, áp đặt ép uổng các bạn đồng tu khiến đạo tràng chia rẽ, nhiều người
        thối thất tâm bồ đề.

        Quả báo hiện tiền: Bản thân mắc chứng đau ngực nghẹt thở, các bạn đồng tu
        xa lánh, đạo tràng tan rã; công đức tu hành bao năm tiêu tan như mây khói.

        Bài học & Chuyển hóa: Hòa thượng Diệu Pháp nghiêm khắc nhắc nhở: tu hành phải
        lấy khiêm cung, nhẫn nhục và lục hòa kính làm đầu; buông bỏ tâm độc tài mới
        thực sự bước vào cửa đạo giác ngộ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660469?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-27
      read_label: 📖 Đọc sách
    - id: 28
      title: Con đường làm giàu
      summary: 'Nhân vật & Hoàn cảnh: Đôi nam nữ Phật tử cùng nhau phát tâm xuất gia
        tu học nhưng trong lòng vẫn âm ỉ sợi dây tình cảm luyến ái chấp trước không
        thể dứt trừ.

        Hành vi tạo nghiệp: Dây tơ hồng tình chấp nhiều kiếp huân tập sâu đậm trong
        tàng thức; dù khoác áo cà sa nhưng tâm vẫn vướng bận ái dục thế gian làm chướng
        ngại đường tu.

        Quả báo hiện tiền: Tinh thần bấn loạn, công phu tu tập bế tắc không thể định
        tâm, thường xuyên bị mộng mị phiền não quấy nhiễu thân tâm.

        Bài học & Chuyển hóa: Nhờ Hòa thượng Diệu Pháp dùng gươm trí tuệ chặt đứt
        tơ vương ái chấp, chỉ rõ biển khổ sinh tử luân hồi; cả hai tỉnh ngộ buông
        xả hoàn toàn, dốc lòng tiến tu giải thoát.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660470?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-28
      read_label: 📖 Đọc sách
    - id: 29
      title: Nửa cái bánh
      summary: 'Nhân vật & Hoàn cảnh: Bài pháp thoại sâu sắc về con đường làm giàu
        chân chính và bí quyết gặt hái tài lộc theo đúng quy luật nhân quả của nhà
        Phật.

        Hành vi tạo nghiệp: Người đời vì tham giàu nhanh mà bất chấp thủ đoạn lừa
        lọc, trốn thuế gian lận, buôn bán hàng giả và sát sinh kiếm tiền bẩn.

        Quả báo hiện tiền: Của cải bất chính như bọt nước phù du, vào cửa trước ra
        cửa sau kéo theo tai ương bệnh tật và tù tội tán gia bại sản.

        Bài học & Chuyển hóa: Muốn giàu sang phú quý bền lâu phải biết gieo nhân bố
        thí, cúng dường Tam Bảo, cứu giúp người nghèo khổ; tâm rộng bao nhiêu thì
        phước lộc lớn bấy nhiêu.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660471?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-29
      read_label: 📖 Đọc sách
    - id: 30
      title: Nghiêm cư sĩ
      summary: 'Nhân vật & Hoàn cảnh: Gia đình ông Trình tu học giữ giới rất nghiêm
        mật nhưng có tính keo kiệt, đem nửa cái bánh thiu hỏng không ăn được cho một
        người ăn xin qua đường.

        Hành vi tạo nghiệp: Bố thí với tâm khinh thường, tiếc của rẻ, đem đồ ăn hỏng
        độc hại cho người đói khổ làm tổn hại hạnh bố thí thanh tịnh.

        Quả báo hiện tiền: Trong nhà đồ ăn liên tục bị ôi thiu hỏng mốc; công việc
        làm ăn bất ngờ gặp trục trặc bị khách hàng trả lại hàng hóa thiệt hại nặng
        nề.

        Bài học & Chuyển hóa: Của cho không bằng cách cho; bố thí phải xuất phát từ
        tâm từ bi cung kính chân thật mới gặt hái phước báu vô lượng vô biên.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660472?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-30
      read_label: 📖 Đọc sách
    - id: 31
      title: Khi tôi biết đến Phật pháp
      summary: 'Nhân vật & Hoàn cảnh: Nghiêm Đại cư sĩ là nhân vật hộ pháp nổi danh
        khắp các ngôi chùa lớn trong nước, cúng dường tiền của và công sức không biết
        mệt mỏi.

        Hành vi tạo nghiệp: Ỷ vào công đức hộ trì to lớn mà sinh tâm ngã mạn vi tế,
        thích được tâng bốc ca ngợi, coi thường các vị sư trẻ và những người đóng
        góp ít hơn mình.

        Quả báo hiện tiền: Thân thể mắc bệnh mãn tính không dứt, trong lòng luôn canh
        cánh phiền não so đo hơn thua với người đời.

        Bài học & Chuyển hóa: Được Hòa thượng Diệu Pháp trực tiếp chỉ điểm phá trừ
        tâm ngã mạn, ông sụp lạy ăn năn hiểu rõ lý ba la mật ''tam luân không tịch'',
        tu hành đạt cảnh giới buông xả an nhiên.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660473?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-31
      read_label: 📖 Đọc sách
    - id: 32
      title: Trong Mạt Pháp có Chánh Pháp
      summary: 'Nhân vật & Hoàn cảnh: Hồi ức tự thuật xúc động sâu sắc của tác sĩ
        Quả Khanh về hành trình từ một cán bộ vô thần chuyển hóa trở thành người con
        Phật thuần thành.

        Hành vi tạo nghiệp: Thời trẻ sống trong vô minh, từng hoài nghi giáo lý tôn
        giáo, sát sinh ăn thịt và tạo bao điều lầm lỡ theo thói quen thế tục.

        Quả báo hiện tiền: Bệnh tật hoạn nạn xảy đến khiến bế tắc tinh thần; may mắn
        hội ngộ Hòa thượng Diệu Pháp trên đỉnh Ngũ Đài Sơn linh thiêng.

        Bài học & Chuyển hóa: Ánh sáng từ bi và trí tuệ vô biên của Phật pháp đã cứu
        vớt cuộc đời tác giả; nguyện đem trọn phần đời còn lại viết sách truyền bá
        nhân quả cứu độ quần sinh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660474?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
