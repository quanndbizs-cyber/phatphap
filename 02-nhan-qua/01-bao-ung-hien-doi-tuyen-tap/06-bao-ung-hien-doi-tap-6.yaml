      title: Con Cá Ngát
      summary: 'Nhân vật & Hoàn cảnh: Nỗi đau đớn khi bị cá ngát đâm trúng và bài
        học quán chiếu nỗi đau tương đương mà loài vật phải gánh chịu khi bị con người
        làm thịt.

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Nghiệp lực chiêu cảm chướng duyên bủa vây, công danh sự
        nghiệp trắc trở, tâm thần luôn bất an sợ hãi không phút giây thanh thản.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
