    - id: 16
      title: Tâm Sự Kẻ Thứ Ba
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thú đầy nước mắt đắng cay của một phụ nữ từng cam tâm làm kẻ thứ ba chen chân phá hoại tổ ấm gia đình của người đàn ông có vợ con.
        Hành vi tạo nghiệp: Tham lam tiền tài và sự chăm sóc ngọt ngào, dùng nhan sắc mưu mẹo chia rẽ tình cảm vợ chồng người khác, gián tiếp khiến người vợ trầm cảm tự vẫn hụt.
        Quả báo hiện tiền: Bị người tình vắt chanh bỏ vỏ ruồng rẫy, mang thai bị ép phá bỏ, dư luận xã hội khinh bỉ nguyền rủa, mắc bệnh ung thư tử cung đau đớn sống trong cô độc cùng cực.
        Bài học & Chuyển hóa: Trả giá đắt cho tội cướp chồng phá hoại gia đình người; cô quỳ lạy sám hối xin lỗi người vợ bị hại, phát tâm ăn chay niệm Phật cả đời chuộc lại lỗi lầm nhục nhã.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660553?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
