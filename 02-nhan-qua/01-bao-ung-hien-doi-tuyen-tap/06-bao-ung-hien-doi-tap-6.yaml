    - id: 34
      title: Chị Của Ích Tây
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện có thật tại Phật giáo Tây Tạng do tác giả A Minh kể lại về trường hợp một phụ nữ tự sát qua đời được cứu độ kỳ diệu.
        Hành vi tạo nghiệp: Trong cơn quẫn bách bế tắc tâm lý đã dại dột hủy hoại thân mạng tự kết liễu cuộc đời, phạm vào trọng tội tự sát chiêu cảm đọa lạc địa ngục ngàn năm.
        Quả báo hiện tiền: Linh hồn rơi vào cảnh giới tăm tối đau đớn quằn quại, may mắn có người em trai là tu sĩ Ích Tây tha thiết cầu xin chư Thượng sư cứu độ.
        Bài học & Chuyển hóa: Nhờ oai lực đại bi và thần chú siêu độ của chư Thượng sư đại viên mãn, vong linh được giải thoát khỏi ngục tối và chuyển sinh làm thân nam tu học giải thoát.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660571?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
