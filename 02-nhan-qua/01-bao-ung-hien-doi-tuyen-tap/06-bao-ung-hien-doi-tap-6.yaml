    - id: 19
      title: Hấp Tinh Quỷ
      summary: |-
        Nhân vật & Hoàn cảnh: Vạch trần sự thật về loài quỷ Hấp Tinh (quỷ hút tinh khí) trong cõi vô hình chuyên rình rập hại người buông lung dâm dục theo kinh Phật miêu tả.
        Hành vi tạo nghiệp: Thói quen thủ dâm, tà dâm, xem tranh ảnh khiêu dâm ban đêm tạo ra từ trường u ám ô uế thu hút loài quỷ hấp tinh đến gá nhập hút cạn sinh lực.
        Quả báo hiện tiền: Người bị quỷ hút tinh thường có sắc mặt xám xịt u tối, mắt thâm quầng trũng sâu, đầu óc mê muội lú lẫn, thân thể suy kiệt như cái xác không hồn, tuổi thọ ngắn ngủi.
        Bài học & Chuyển hóa: Giữ tâm ý chánh định trong sáng, phòng ngủ thoáng đãng trang nghiêm, niệm danh hiệu Phật Bồ Tát trước khi ngủ để xua đuổi tà ma quỷ quái quấy phá thân tâm.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660556?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
