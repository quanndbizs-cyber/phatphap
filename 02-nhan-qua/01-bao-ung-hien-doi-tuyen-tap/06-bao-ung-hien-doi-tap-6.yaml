    - id: 14
      title: Tâm Sự Của Ba Chàng Trai
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tâm sự sám hối chân thành của ba chàng trai trẻ tuổi cùng mắc phải căn bệnh nghiện thủ dâm và sa đọa vào phim ảnh đen từ thuở học trò.
        Hành vi tạo nghiệp: Lén lút thủ dâm ngày đêm thỏa mãn dục vọng đê hèn, nói lời dâm ô báng bổ thần thánh, sống buông thả trác táng làm ô uế tâm hồn.
        Quả báo hiện tiền: Thân hình tiều tụy như bộ xương khô, mắt thâm quầng mất ngủ triền miên, trầm cảm hoảng loạn sợ tiếp xúc với xã hội, tương lai mịt mờ như ngõ cụt.
        Bài học & Chuyển hóa: Cả ba cùng tìm đến đạo tràng quy y Tam Bảo, phát nguyện ăn chay trường, kiên quyết đoạn trừ giới dâm và chăm chỉ lạy Phật; sức khỏe và trí tuệ hồi phục kỳ diệu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660551?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
