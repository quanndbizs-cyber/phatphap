    - id: 20
      title: Hiện Thế Báo Của Tà Dâm
      summary: |-
        Nhân vật & Hoàn cảnh: Tổng hợp những trường hợp báo ứng hiện đời có thật về tội tà dâm trong xã hội đương đại làm gương cảnh tỉnh cho muôn người.
        Hành vi tạo nghiệp: Cậy quyền ỷ thế cưỡng đoạt vợ người, quan hệ loạn luân, mua bán dâm và tiếp tay lan truyền các văn hóa phẩm đồi trụy độc hại trên mạng.
        Quả báo hiện tiền: Nhẹ thì gia bại thân danh liệt, sự nghiệp tiêu tan phá sản; nặng thì vướng vòng lao lý, mắc bệnh hoa liễu siđa hoại tử cơ thể, chết trong ô nhục muôn đời.
        Bài học & Chuyển hóa: Vạn ác dâm vi thủ; người khôn ngoan biết sợ hãi luật nhân quả tơ hào không sai, mau chóng quay đầu sám hối, sống đời tiết hạnh thanh tịnh để bảo vệ giống nòi.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660557?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
