    - id: 40
      title: Tòa Lầu Giải Trí
      summary: |-
        Nhân vật & Hoàn cảnh: Năm 1936 tại Nam Kinh trước khi quân Nhật chiếm đóng, một ông lão hơn 60 tuổi dắt cháu trai 8 tuổi đi bộ đến khu giải trí Thắng Kỳ Lầu dạo chơi.
        Hành vi tạo nghiệp: Quân phát xít Nhật cho máy bay oanh tạc bom đạn dữ dội xuống các khu dân cư thành phố gây nên cảnh tượng máu chảy đầu rơi tang tóc.
        Quả báo hiện tiền: Đang ngồi đọc sách chơi cờ, ông lão bỗng thấy bất an giục cháu ra về ngay; vừa bước ra khỏi cổng thì bom rơi trúng Thắng Kỳ Lầu san phẳng toàn bộ tòa nhà cướp đi sinh mạng nhiều người.
        Bài học & Chuyển hóa: Nhờ cả đời ông lão ăn ở hiền lành, hay bố thí giúp đỡ người nghèo nên được thần linh mách bảo linh tính thoát chết trong gang tấc; tích đức hành thiện là bùa hộ mệnh vững chắc nhất.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660577?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
