    - id: 11
      title: Anh Kỹ Sư Kiến Trúc
      summary: 'Nhân vật & Hoàn cảnh: Có một kỹ sư kiến trúc, tuổi trẻ giàu sang,
        rất thành đạt, mạnh khỏe. Quanh năm lui tới Giang Tôi nhận các công trình
