      read_label: 📖 Đọc sách
    - id: 27
      title: Giai Nhân Áo Phượng
      summary: |-
        Nhân vật & Hoàn cảnh: Vong linh của một giai nhân tuyệt sắc mặc áo phượng thời phong kiến hiện hình tâm sự về bi kịch cuộc đời đẫm máu chốn thâm cung nội viện.
        Hành vi tạo nghiệp: Vì tranh giành ân sủng của vua chúa đã dùng mưu mô thâm hiểm đầu độc các cung phi và con cái họ, cuối cùng chính mình cũng bị ban thuốc độc chết tức tưởi.
        Quả báo hiện tiền: Ôm hận thù ghen ghét nghìn năm chìm đắm trong cảnh giới quỷ mị lạnh lẽo đói khát, dung mạo mỹ miều biến thành hình hài ma quái đáng sợ không siêu thoát được.
        Bài học & Chuyển hóa: Nhờ gặp thiện tri thức khai thị kinh Phật, vong linh buông bỏ hận thù phát nguyện sám hối tội ghen tuông độc ác để nương nhờ Phật lực vãng sinh cõi lành.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660564?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
