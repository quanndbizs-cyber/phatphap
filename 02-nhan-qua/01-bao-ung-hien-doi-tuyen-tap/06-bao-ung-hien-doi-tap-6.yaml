    - id: 1
      title: Lời Người Dịch
      summary: 'Nhân vật & Hoàn cảnh: Việc này xảy ra vào khoảng hơn 20 năm trước,
        lúc đó nhằm thời “Văn hóa đại cách mạng” tình thế đất nước đang dầu sôi lửa
        bỏng.

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Thân thể mắc bệnh nan y hiểm nghèo hành hạ đau đớn, y học
        hiện đại bất lực; tinh thần bấn loạn chịu khổ báo hiện tiền thích đáng.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
        Đức nhắc nhở người đời mau chóng thức tỉnh, phát tâm ăn chay sám hối, dứt
        ác tu thiện và niệm Phật tiêu nghiệp chướng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660538?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-1
      read_label: 📖 Đọc sách
    - id: 2
      title: Giọt Nước Mắt Anh Tài Xế
      summary: 'Nhân vật & Hoàn cảnh: Giọt nước mắt ân hận tột cùng của một tài xế
        xe tải đường dài vì buồn ngủ và phóng nhanh đã gây ra vụ tai nạn giao thông
        thảm khốc.

        Hành vi tạo nghiệp: Bất cẩn xem thường tính mạng tha nhân, vì vội vã kiếm
        thêm chuyến hàng mà lái xe trong tình trạng say xỉn và ngủ gật gây chết người.

        Quả báo hiện tiền: Người chết oan ức hiện về đòi mạng trong đêm; bản thân
        bị kết án tù đày, gia đình phải bồi thường khánh kiệt tài sản, lương tâm cắn
        rứt suốt đời.

        Bài học & Chuyển hóa: Bài học xương máu cảnh tỉnh những người cầm lái: giữ
        vững đạo đức nghề nghiệp và sự cẩn trọng chính là bảo vệ sinh mạng và phúc
        đức cho chính mình.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660539?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-2
      read_label: 📖 Đọc sách
    - id: 3
      title: Tai Nạn Nửa Đêm
      summary: 'Nhân vật & Hoàn cảnh: Cảnh báo quả báo bất ngờ từ nghiệp sát sinh,
        rượu chè phóng túng dẫn đến tai nạn kinh hoàng lúc nửa đêm không kịp trăn
        trối.

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Thân thể mắc bệnh nan y hiểm nghèo hành hạ đau đớn, y học
        hiện đại bất lực; tinh thần bấn loạn chịu khổ báo hiện tiền thích đáng.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
        Đức nhắc nhở người đời mau chóng thức tỉnh, phát tâm ăn chay sám hối, dứt
        ác tu thiện và niệm Phật tiêu nghiệp chướng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660540?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
