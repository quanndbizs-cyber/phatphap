      read_label: 📖 Đọc sách
    - id: 23
      title: Giấc Mộng Của Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Giấc mộng kinh hoàng của tác giả được chư Phật Bồ Tát dẫn đi thị sát cảnh giới trừng phạt tội nhân dưới các tầng địa ngục âm ti.
        Hành vi tạo nghiệp: Những linh hồn lúc sống trên trần gian thỏa sức tạo nghiệp sát mổ động vật, gian dâm phản bội, phỉ báng Tam Bảo và cướp đoạt mồ hôi nước mắt kẻ nghèo.
        Quả báo hiện tiền: Bị quỷ sứ ném vào vạc dầu sôi sùng sục, trói vào cột đồng nung đỏ thiêu đốt da thịt, moi tim cắt lưỡi rên la thảm thiết vạn năm không được cứu thoát.
        Bài học & Chuyển hóa: Giấc mộng rúng động tâm can là hồi chuông cảnh tỉnh thế nhân; địa ngục hoàn toàn có thật do tâm ác chiêu cảm; hãy mau chóng ăn chay sám hối dứt ác tu thiện trước khi quá muộn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660560?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
