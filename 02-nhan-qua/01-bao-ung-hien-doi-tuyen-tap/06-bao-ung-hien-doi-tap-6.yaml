    - id: 2
      title: Giọt Nước Mắt Anh Tài Xế
      summary: |-
        Nhân vật & Hoàn cảnh: Anh tài xế lái tàu thủy chuyên chở buôn lậu lươn sống, tôm cá sống số lượng lớn trên sông nước để cung cấp cho các nhà hàng quán nhậu.
        Hành vi tạo nghiệp: Giam cầm hàng vạn con lươn cá trong khoang tối chật hẹp ngột ngạt, gián tiếp tước đoạt sinh mạng muôn loài thủy tộc kiếm đồng tiền máu tanh.
        Quả báo hiện tiền: Tàu bị lật chìm trong đêm bão, anh bị kẹt trong khoang ngập nước suýt chết đuối; sau đó mắc chứng bệnh da thịt lạnh buốt lở loét ngứa ngáy như bị ngâm nước mặn suốt đời.
        Bài học & Chuyển hóa: Rơi nước mắt sám hối trước Tam Bảo, anh dứt bỏ hoàn toàn nghề buôn cá lươn sống, phát nguyện ăn chay trường niệm Phật cứu chuộc lỗi lầm xưa.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660539?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
