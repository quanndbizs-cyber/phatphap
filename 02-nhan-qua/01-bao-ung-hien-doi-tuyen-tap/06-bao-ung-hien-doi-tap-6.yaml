      read_label: 📖 Đọc sách
    - id: 38
      title: Mối Duyên Của Dượng X
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện về dượng X (chồng của người cô tác giả) sống trong cuộc hôn nhân đầy đau khổ bế tắc với người vợ có tính khí nóng nảy cay nghiệt.
        Hành vi tạo nghiệp: Người mẹ của dượng X từng vì xung đột bế tắc gia đình mà tự sát chết thảm, để lại vết thương lòng sâu sắc và bóng ma u ám cho con cháu.
        Quả báo hiện tiền: Dượng X chịu cảnh vợ chồng lạnh nhạt xung đột triền miên, từng muốn ly hôn nhưng nhìn thấy gương con cái bạn bè tự sát vì cha mẹ chia tay nên đành nhẫn nhịn.
        Bài học & Chuyển hóa: Dượng X chọn con đường nhẫn nhục hy sinh vì con cái, dùng tình thương và sự bao dung hóa giải oán hận; minh chứng sự nhẫn nhịn và thấu hiểu có thể cứu vớt một gia đình tan vỡ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660575?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
