      read_label: 📖 Đọc sách
    - id: 31
      title: Trên Đầu Ba Thước Có Thần Linh
      summary: |-
        Nhân vật & Hoàn cảnh: Triết lý thâm sâu của người xưa: "Trên đầu ba thước có thần linh, ngẩng đầu ba thước có thanh thiên, có thể dối người nhưng không thể dối trời".
        Hành vi tạo nghiệp: Dùng sự xảo quyệt gian manh lừa đảo thiên hạ, bề ngoài đeo mặt nạ nhân đức từ thiện nhưng bên trong ngấm ngầm làm điều bỉ ổi bất chính.
        Quả báo hiện tiền: Lưới trời lồng lộng trừng phạt đích đáng: sự nghiệp sụp đổ bất ngờ, thân bại danh liệt, con cháu đời sau phải gánh chịu ác báo suy vong bần hàn.
        Bài học & Chuyển hóa: Người học Phật phải lấy đức thành thật làm nền tảng tu tập; sống quang minh chính đại, thường xuyên sám hối lỗi lầm để tự tánh luôn thanh tịnh rạng ngời.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660568?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
