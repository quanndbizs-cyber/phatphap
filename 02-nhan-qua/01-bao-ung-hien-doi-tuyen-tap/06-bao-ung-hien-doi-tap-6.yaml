    - id: 8
      title: Vì Sao Không Nên Sát Sinh
      summary: 'Nhân vật & Hoàn cảnh: Quý vị hãy nhớ tích xưa trong sử, ngày mà vua
        Tỳ Lưu Ly giết sạch giòng họ Thích-ca, đầu Đức Phật cũng bị nhức thống thiết.
        Đó là vào kiếp quá khứ xa xưa, khi giòng họ Thích là dân làng chài và đức
        Phật Thích-ca là một cậu bé trong làng chà...

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Gia đạo tan vỡ, tai nạn bất ngờ ập xuống cướp đi người
        thân và tài sản, chịu cảnh sinh ly tử biệt cay đắng tột cùng.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
        Đức nhắc nhở người đời mau chóng thức tỉnh, phát tâm ăn chay sám hối, dứt
        ác tu thiện và niệm Phật tiêu nghiệp chướng.'
