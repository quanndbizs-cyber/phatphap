      read_label: 📖 Đọc sách
    - id: 29
      title: Thiên Địa Quan Thần
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải uyên bác về chức năng và nhiệm vụ của hệ thống chư vị Thiên Địa Quan Thần tuần tra nhân gian theo lời dạy của cổ đức tiền nhân.
        Hành vi tạo nghiệp: Con người làm việc thiện hay việc ác nơi kín đáo tối tăm, tưởng không ai biết nên thỏa sức gian dối, trộm cắp, tà dâm và mưu hại người khác.
        Quả báo hiện tiền: Chư thần ghi chép rõ ràng vào sổ thiện ác, phúc báu bị cắt giảm từng ngày, tai họa bất ngờ ập xuống không báo trước khiến kẻ làm ác trở tay không kịp.
        Bài học & Chuyển hóa: Giữ tâm cung kính thanh tịnh trong từng cử chỉ hành vi; người quân tử thận trọng ngay cả khi ở một mình (thận độc) để không hổ thẹn với lương tâm và trời đất.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660566?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
