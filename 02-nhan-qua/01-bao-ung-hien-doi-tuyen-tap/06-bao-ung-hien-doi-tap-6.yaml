    - id: 44
      title: Trần Đại Gia
      summary: |-
        Nhân vật & Hoàn cảnh: Ông Trần là người tài hoa tuấn tú xuất chúng, con nhà trâm anh thế phiệt, là bậc kỳ tài chào hàng bán sản phẩm kinh doanh lừng danh một thời.
        Hành vi tạo nghiệp: Ỷ vào tài năng và nhan sắc đã buông lung đam mê cờ bạc đỏ đen, ăn chơi trác táng tại các sòng bài và lừa gạt tình cảm của nhiều phụ nữ nhẹ dạ.
        Quả báo hiện tiền: Cơ nghiệp đồ sộ tiêu tan vào chiếu bạc, nợ nần chồng chất bị xã hội đen truy lùng, vợ con bỏ rơi, tuổi già bệnh tật cô độc chết thảm trong căn phòng trọ rách nát.
        Bài học & Chuyển hóa: Tài năng mà không có đức hạnh thì tài đó chỉ là tai họa; cờ bạc và tà dâm là hai con đường ngắn nhất hủy hoại cả một đời người tài ba hiển hách.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660581?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
