    - id: 13
      title: Những Điều Phái Nam Cần Nên Biết
      summary: |-
        Nhân vật & Hoàn cảnh: Cẩm nang đạo đức thiết yếu dành cho phái nam: cảnh báo về những cạm bẫy sắc dục, bia rượu và lối sống trụy lạc ngoài xã hội.
        Hành vi tạo nghiệp: Cậy tiền tài tìm hoa ghẹo nguyệt, ngoại tình bao bồ nhí, vào vũ trường massage tà dâm phá vỡ đạo nghĩa vợ chồng tào khang.
        Quả báo hiện tiền: Hao tài tốn của, gia đạo bất hòa, con cái khinh rẻ, mắc các bệnh xã hội lở loét và suy thận liệt dương sớm, sự nghiệp đổ vỡ trắng tay.
        Bài học & Chuyển hóa: Đấng trượng phu chân chính lấy trung hiếu tiết nghĩa làm đầu; chung thủy một vợ một chồng, dứt trừ tà dâm mới giữ được sinh lực sung mãn và gia đình hưng thịnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660550?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
