      read_label: 📖 Đọc sách
    - id: 3
      title: Tai Nạn Nửa Đêm
      summary: |-
        Nhân vật & Hoàn cảnh: Đôi vợ chồng trẻ lái xe ô tô nửa đêm trên đường cao tốc phóng nhanh vượt ẩu trong tình trạng say xỉn sau bữa tiệc nhậu nhẹt linh đình.
        Hành vi tạo nghiệp: Thường xuyên sát sinh ăn thịt tươi sống chim muông dã thú, lái xe ngông cuồng coi thường tính mạng bản thân và người tham gia giao thông.
        Quả báo hiện tiền: Xe mất lái đâm nát bấy vào dải phân cách thép biến dạng hoàn toàn, đối mặt với tử thần trong gang tấc giữa đêm khuya vắng vẻ.
        Bài học & Chuyển hóa: Nhờ ở nhà người mẹ già chí thành tụng kinh niệm Phật hồi hướng nên hai vợ chồng thoát chết kỳ diệu chỉ trầy xước nhẹ; giật mình tỉnh ngộ dứt trừ sát nghiệp và rượu chè.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660540?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-2
      read_label: 📖 Đọc sách
    - id: 4
      title: Cứu Khỉ Một Nạn, Khỉ Cứu Lại Một Làng
      summary: |-
        Nhân vật & Hoàn cảnh: Một làng quê nghèo dưới chân núi bắt được một chú khỉ con định làm thịt đãi tiệc, một người thợ săn có lòng trắc ẩn đã bỏ tiền túi chuộc mạng thả khỉ về rừng.
        Hành vi tạo nghiệp: Dân làng quen thói săn bắt giết mổ dã thú rừng rậm, tàn sát loài khỉ câm nín tạo nên oán khí tích tụ ngút ngàn chốn rừng xanh.
        Quả báo hiện tiền: Trận mưa lũ lịch sử gây sạt lở núi nửa đêm ầm ầm đổ xuống đất làng, đe dọa chôn vùi toàn bộ sinh mạng dân làng trong bùn đất đổ nát.
        Bài học & Chuyển hóa: Đàn khỉ kéo về gào thét ném đá vào mái nhà đánh thức cả làng chạy nạn kịp thời thoát chết trong gang tấc; minh chứng hùng hồn cứu vật vật trả ơn vạn đời không mất.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660541?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-3
      read_label: 📖 Đọc sách
    - id: 5
      title: Một Buổi Quán Sát Nhân Quả
      summary: |-
        Nhân vật & Hoàn cảnh: Buổi diện kiến quán sát nhân quả đặc biệt của Hòa thượng Diệu Pháp giải đáp căn nguyên bệnh tật cho hàng chục Phật tử mắc các chứng nan y kỳ dị.
        Hành vi tạo nghiệp: Mỗi căn bệnh đều do nghiệp tạo tác cụ thể: dội nước sôi giết tổ kiến, dùng móc câu xé rách mang cá, đánh chết chó mèo, hoặc phá thai nhiều lần thời trẻ.
        Quả báo hiện tiền: Người thì lở loét da thịt như bị bỏng, kẻ thì ung thư vòm họng ngạt thở, người thì đau nhức xương tủy y học hiện đại hoàn toàn bất lực không tìm ra nguyên nhân.
        Bài học & Chuyển hóa: Sư phụ khai thị phương thuốc duy nhất trị gốc bệnh là chân thành quỳ trước Phật sám hối, dứt tuyệt ăn mặn, phóng sinh chuộc mạng và phát tâm ăn chay trường niệm Phật.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660542?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-4
      read_label: 📖 Đọc sách
    - id: 6
      title: Không Nên Ăn Cá
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải sâu sắc về tác hại khôn lường của việc câu cá, đánh lưới và ăn thịt các loài cá tươi sống đối với sức khỏe và số mệnh con người.
        Hành vi tạo nghiệp: Thích thú dùng lưỡi câu sắt nhọn móc rách miệng mang cá, mổ bụng cạo vảy chiên xào khi cá còn giãy giụa đau đớn trong chảo dầu sôi.
        Quả báo hiện tiền: Mắc chứng bệnh loét miệng lưỡi mãn tính, ung thư vòm họng, thực quản co thắt nghẹn thở không nuốt được thức ăn, chịu sự hành hạ đau đớn y hệt cá bị móc câu.
        Bài học & Chuyển hóa: Muôn loài thủy tộc đều biết đau đớn van xin; người tu học Phật nhất định phải đoạn trừ ăn cá thịt, bảo vệ môi trường thủy sinh và tích cực phóng sinh cứu mạng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660543?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-5
      read_label: 📖 Đọc sách
    - id: 7
      title: Ác Báo Đáng Sợ
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện có thật về một đại gia giàu có đam mê thưởng thức các món ăn độc dị dã man như ăn óc khỉ sống và tay gấu hầm thuốc bắc.
        Hành vi tạo nghiệp: Đục sọ khỉ sống chan dầu sôi múc ăn tại bàn, chặt tay gấu sống khi con vật đang gào thét đau đớn để bồi bổ tráng dương vô nhân tính.
        Quả báo hiện tiền: Đến tuổi trung niên mắc chứng tai biến xuất huyết não dữ dội, đầu đau nhức như bị búa bổ đục sọ, hai tay co quắp liệt giường, đêm đêm gào thét rú lên như tiếng khỉ rồi chết thảm.
        Bài học & Chuyển hóa: Ác báo sát sinh ăn tươi nuốt sống dã thú vô cùng khủng khiếp; quả báo hiện tiền không sai một ly; người đời chớ vì miếng ăn tàn bạo mà chuốc lấy cái chết rùng rợn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660544?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-6
      read_label: 📖 Đọc sách
    - id: 8
      title: Vì Sao Không Nên Sát Sinh
      summary: |-
        Nhân vật & Hoàn cảnh: Giáo lý căn bản và cao quý của đạo Phật về giới bất sát sinh, mở rộng lòng từ bi thương xót đến tất cả chúng sinh cùng chung hơi thở.
        Hành vi tạo nghiệp: Nhân loại cậy sức mạnh khoa học và vũ khí tự cho mình quyền thống trị, tàn sát hàng tỷ sinh mạng động vật mỗi năm để phục vụ dục vọng ăn uống khoái khẩu.
        Quả báo hiện tiền: Oán khí sát sinh tích tụ chiêu cảm thiên tai dịch bệnh triền miên, chiến tranh tàn khốc, các chứng ung thư nan y bùng phát hủy hoại đời sống con người.
        Bài học & Chuyển hóa: Bất sát sinh là gốc rễ của hòa bình và sức khỏe; ăn chay trường trì giới bất sát không chỉ cứu vớt sinh linh mà còn cứu vớt chính tương lai vận mệnh của bản thân và gia đình.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660545?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-7
      read_label: 📖 Đọc sách
    - id: 9
      title: Con Cá Ngát
      summary: |-
        Nhân vật & Hoàn cảnh: Một ngư dân chuyên nghề đánh bắt cá ven sông câu được một con cá ngát lớn hung dữ có ngạnh nhọn có nọc độc.
        Hành vi tạo nghiệp: Thay vì cẩn thận gỡ cá, anh nổi cơn tam bành dùng dao nhọn đâm nát đầu chặt đứt thân con cá ngát đang oằn mình giãy giụa trả thù.
        Quả báo hiện tiền: Bị ngạnh cá ngát đâm trúng tay nhiễm trùng cực nặng, độc tố ăn sâu hoại tử thối rữa xương khớp, bệnh viện buộc phải phẫu thuật cưa cụt cả cánh tay đau đớn tột cùng.
        Bài học & Chuyển hóa: Quả báo hiện tiền tức thì nhãn tiền không đợi kiếp sau; một phút giận dữ tàn sát loài vật phải trả giá bằng chính cánh tay tàn phế suốt đời.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660546?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-8
      read_label: 📖 Đọc sách
    - id: 10
      title: Những Điều Phái Nữ Cần Biết
      summary: |-
        Nhân vật & Hoàn cảnh: Lời khuyên răn vàng ngọc dành cho phái nữ trong xã hội hiện đại về cách ăn mặc, giữ gìn đức hạnh và bảo tồn phước báu người phụ nữ.
        Hành vi tạo nghiệp: Chạy theo mốt ăn mặc thiếu vải hở hang, thích khoe thân kích động tà niệm của nam giới, sống buông thả quan hệ trước hôn nhân và nạo phá thai.
        Quả báo hiện tiền: Nhan sắc tàn tạ nhanh chóng, mắc các bệnh phụ khoa hiểm nghèo, hôn nhân trắc trở bị chồng ruồng rẫy phản bội, con cái sinh ra ốm yếu ngỗ nghịch.
        Bài học & Chuyển hóa: Phụ nữ đoan trang kín đáo là gốc rễ của gia đình hưng thịnh; giữ gìn tiết hạnh, ăn chay hướng thiện sẽ tích tụ vô lượng âm đức bảo bọc cuộc đời an vui.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660547?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-9
      read_label: 📖 Đọc sách
    - id: 11
      title: Anh Kỹ Sư Kiến Trúc
      summary: |-
        Nhân vật & Hoàn cảnh: Một nam kỹ sư kiến trúc tài hoa xuất chúng, tốt nghiệp đại học danh tiếng nhưng cuộc đời liên tục gặp xui xẻo bế tắc, sự nghiệp lận đận nợ nần.
        Hành vi tạo nghiệp: Từ thời niên thiếu mắc chứng nghiện thủ dâm và xem phim ảnh đồi trụy suốt mười mấy năm, làm tiêu tán tinh khí thần và hao hụt sạch phước đức công danh.
        Quả báo hiện tiền: Trí nhớ sa sút, thi cử trượt dốc, các dự án thiết kế lớn đều bị hủy bỏ bất ngờ, cơ thể gầy yếu bạc nhược, vợ chồng ly tán cô độc nghèo túng.
        Bài học & Chuyển hóa: Nhờ gặp Phật pháp anh thức tỉnh dứt tuyệt thủ dâm, sám hối bái lạy Phật và khuyên bảo thanh niên giữ gìn phạm hạnh; vận mệnh từ đó dần dần hanh thông hồi phục.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660548?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
