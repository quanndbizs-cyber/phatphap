      read_label: 📖 Đọc sách
    - id: 37
      title: Tâm Sự Người Vợ
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự sự xúc động của chị Viên Viên (hội viên Tâm Thượng Liên Hoa) kể về hành trình hoán cốt trùng sinh từ một kẻ tội lỗi trở thành người con Phật thuần thành.
        Hành vi tạo nghiệp: Thuở trẻ có tính tình kiêu ngạo đố kỵ, buông thả trong ái dục tà dâm, bất hiếu với cha mẹ và làm tổn thương nhiều người thân trong gia đình.
        Quả báo hiện tiền: Cuộc sống rơi vào địa ngục trần gian: hôn nhân đổ vỡ, bệnh tật hiểm nghèo hành hạ thân xác, tâm thần trầm cảm hoảng loạn muốn tìm đến cái chết.
        Bài học & Chuyển hóa: Nhờ gặp thiện tri thức khai thị, chị dốc trọn nước mắt quỳ trước Tam Bảo sám hối từng lỗi lầm, ăn chay tu trì bền bỉ; cuộc đời tái sinh kỳ diệu tràn đầy an lạc hạnh phúc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660574?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
