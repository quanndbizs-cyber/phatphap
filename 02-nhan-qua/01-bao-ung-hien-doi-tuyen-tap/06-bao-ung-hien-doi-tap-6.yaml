      read_label: 📖 Đọc sách
    - id: 41
      title: Vương Quả Phụ
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện về Vương quả phụ một mình nuôi con côi cút thời loạn lạc, được xóm giềng cưu mang giúp đỡ từng bát gạo củ khoai qua cơn bĩ cực.
        Hành vi tạo nghiệp: Sau ngày giải phóng con trai làm quan lớn cho nhà nước, mẹ con Vương quả phụ đổi đời giàu sang liền quay sang khinh rẻ, hắt hủi và bội bạc những người ơn cũ từng cứu mình.
        Quả báo hiện tiền: Con trai phạm tội tham ô hối lộ bị bắt giam kết án tù nặng, tài sản bị tịch thu sạch sành sanh; Vương quả phụ tuổi già lại rơi vào cảnh cô độc bần hàn nhục nhã như xưa.
        Bài học & Chuyển hóa: Ăn quả nhớ kẻ trồng cây, uống nước nhớ nguồn; kẻ vong ân bội nghĩa xem thường ân nhân ắt chuốc lấy quả báo tiêu tan phúc đức, nghèo khổ trở lại như thuở ban đầu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660578?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
