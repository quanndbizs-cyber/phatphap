    - id: 15
      title: Kinh Nghiệm Tuyệt Diệu Về Giới Dâm
      summary: |-
        Nhân vật & Hoàn cảnh: Chia sẻ kinh nghiệm thực tiễn quý báu của những người tu Phật đã chiến thắng thành công dâm tâm ma chướng và cai nghiện tà hạnh dâm dục.
        Hành vi tạo nghiệp: Trước đây từng bị dục vọng thiêu đốt tâm can, lún sâu vào các thói quen xấu xa thủ dâm tà dâm làm tiêu hao nguyên khí và đạo lực tu hành.
        Quả báo hiện tiền: Thân thể suy nhược, tinh thần bất an, ngồi thiền tụng kinh tâm luôn tán loạn vọng động không thể đạt được định tĩnh an lạc.
        Bài học & Chuyển hóa: Phương pháp hiệu quả: tuyệt đối không ở một mình trong phòng tối, không dùng điện thoại khuya, siêng năng lạy Kinh Địa Tạng, niệm Quán Âm và quán chiếu thân bất tịnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660552?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
