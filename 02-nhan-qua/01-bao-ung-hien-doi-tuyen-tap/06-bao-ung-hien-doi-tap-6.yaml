      read_label: 📖 Đọc sách
    - id: 36
      title: Hướng Phật Xin Công Tác
      summary: |-
        Nhân vật & Hoàn cảnh: Một phụ nữ có con trai nhỏ mắc bệnh hiểm nghèo chữa trị khắp nơi vô hiệu, gia đình rơi vào cảnh khốn đốn bế tắc cùng đường và thất nghiệp.
        Hành vi tạo nghiệp: Thiếu hiểu biết về kinh điển Phật pháp, trước đây lười biếng tu tập và tạo nhiều nghiệp chướng vô minh trong đời sống gia đình.
        Quả báo hiện tiền: Con đau ốm quặt quẹo, nợ nần chồng chất không có việc làm mưu sinh, tâm thần hoang mang bế tắc tưởng chừng không lối thoát.
        Bài học & Chuyển hóa: Nhờ trang web Tiểu Viện Sơn Tây thỉnh Kinh Địa Tạng về quỳ tụng chí thành sám hối; kỳ tích hiển linh con trai lành bệnh hoàn toàn và bản thân xin được công việc ổn định tốt đẹp.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660573?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
