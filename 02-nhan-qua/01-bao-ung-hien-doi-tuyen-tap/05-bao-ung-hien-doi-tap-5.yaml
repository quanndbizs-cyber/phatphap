    - id: 38
      title: Tháng 6 tuyết rơi
      summary: 'Nhân vật & Hoàn cảnh: Câu chuyện oan án chấn động thời hiện đại với
        hiện tượng thiên nhiên kỳ lạ ''tháng sáu tuyết rơi'' cảm động đất trời chốn
        nhân gian.

        Hành vi tạo nghiệp: Kẻ quyền thế bức hại người lương thiện, dùng tiền mua
        chuộc công lý để đổ tội oan cho người vô tội chết trong uất ức ngút ngàn.

        Quả báo hiện tiền: Trời đất biến sắc tuyết rơi giữa mùa hạ minh oan cho nạn
        nhân; kẻ chủ mưu sau đó phát điên tự cắn lưỡi chết thảm hại.

        Bài học & Chuyển hóa: Lòng dạ con người dù hiểm độc đến đâu cũng không thể
        che mắt thần linh; nỗi oan khiên thấu tận trời xanh ắt sẽ được công lý nhân
        quả phân minh.'
