      read_label: 📖 Đọc sách
    - id: 16
      title: Nghịch duyên giữa cha mẹ và con
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải sâu sắc về bốn mối duyên dẫn dắt cha mẹ và con cái gặp nhau trong cõi đời: đền ơn, trả oán, đòi nợ và trả nợ theo lời Phật dạy.
        Hành vi tạo nghiệp: Trong các kiếp quá khứ vì lòng tham sân si đã lừa gạt, chiếm đoạt tài sản, sát hại hoặc gây oán thù sâu nặng với chúng sinh khác.
        Quả báo hiện tiền: Tái sinh làm con cái trong nhà để đòi lại từng đồng nợ cũ, cờ bạc nghiện ngập, bệnh tật hiểm nghèo hoặc bạo lực hành hạ cha mẹ sống dở chết dở.
        Bài học & Chuyển hóa: Đối diện nghịch tử cha mẹ không nên oán trách mà phải hiểu rõ luật nhân quả, cùng nhau quỳ trước Tam Bảo sám hối tội lỗi xưa, ăn chay tu thiện biến ác duyên thành thiện duyên.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660635?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-14
      read_label: 📖 Đọc sách
    - id: 17
      title: Giết cáo bị báo ứng
      summary: |-
        Nhân vật & Hoàn cảnh: Gia đình họ Tất ngụ tại Vĩnh Định Môn (Bắc Kinh) năm 1951, phát hiện một con hồ ly (cáo) mang thai trú ngụ sau vườn táo cạnh nhà.
        Hành vi tạo nghiệp: Cả nhà vây bắt, dùng gậy sắt đập chết con cáo mẹ đang mang thai dã man, sau đó lột da bán lấy tiền và xẻ thịt nấu ăn nhậu vô cảm.
        Quả báo hiện tiền: Chỉ ít lâu sau, người cha và các con cháu lần lượt phát điên sủa gầm như cáo, mắt trợn ngược cào xé thân thể, lăn lộn chết bất đắc kỳ tử tuyệt tự không người nối dõi.
        Bài học & Chuyển hóa: Loài vật mang thai có linh tính vô cùng mạnh mẽ; sát hại chúng ôm mối oán hận ngút trời chiêu cảm quả báo diệt tộc thảm khốc; khuyên người đời tuyệt đối không được giết hại loài linh thú.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660636?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-15
      read_label: 📖 Đọc sách
    - id: 18
      title: Nàng dâu bất hạnh
      summary: |-
        Nhân vật & Hoàn cảnh: Cô dâu quê gốc Thiểm Tây lấy chồng con nhà họ Phạm ở Hoàng Dương Mông Cổ năm 1965, phải chịu cảnh gia đình chồng đày đọa hành hạ dã man.
        Hành vi tạo nghiệp: Kiếp trước cô từng là chủ trại giàu có hà khắc, bóc lột đánh đập tàn nhẫn một người ở gái (người ở gái kiếp này tái sinh làm mẹ chồng cô).
        Quả báo hiện tiền: Kiếp này đổi ngôi làm dâu, bị mẹ chồng và cả nhà chồng coi như trâu ngựa, bắt làm việc đồng áng kiệt sức, ăn cơm thừa canh cặn và bị đánh đập triền miên.
        Bài học & Chuyển hóa: Oan oan tương báo xoay vần như bánh xe luân hồi; hiểu rõ nợ nợ vay trả từ tiền kiếp để không khởi tâm oán hận trả thù, lấy nhẫn nhục và sám hối tu hành hóa giải oán kết xưa.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660637?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-16
      read_label: 📖 Đọc sách
    - id: 19
      title: Cậu Hai Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Cậu Hai của tác giả là một người thợ săn cừ khôi, cả đời đam mê súng đạn săn bắn thú rừng và chim muông bồi bổ.
        Hành vi tạo nghiệp: Hàng ngàn mạng sống nai, hoẵng, lợn rừng và chim trời đã ngã gục dưới họng súng tàn nhẫn của ông suốt mấy mươi năm săn bắn.
        Quả báo hiện tiền: Về già ông mắc bệnh ung thư xương hành hạ đau đớn rên xiết suốt ngày đêm, tay chân co quắp biến dạng y như hình dáng những con thú bị bắn hạ trước khi chết thảm.
        Bài học & Chuyển hóa: Nghề săn bắn sát sinh để lại ác báo vô cùng khủng khiếp cho chính bản thân và con cháu; muốn tránh khỏi tai họa rùng rợn lúc lâm chung phải bẻ gãy súng săn, ăn chay phóng sinh chuộc tội.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660638?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-19
      read_label: 📖 Đọc sách
    - id: 20
      title: Câu chuyện khiến Tôi rơi lệ
      summary: |-
        Nhân vật & Hoàn cảnh: Mùa thu năm tác giả 12 tuổi, gia đình lâm vào cảnh ngộ bĩ cực cùng đường: cha bệnh nặng mất sức lao động, anh trượt đại học, mẹ xịt nhầm thuốc sâu làm cháy rụi 10 mẫu lúa.
        Hành vi tạo nghiệp: Nghiệp chướng nhiều đời của cả gia đình hội tụ cùng lúc chiêu cảm nghịch cảnh bủa vây, đẩy cả nhà đến bờ vực tuyệt vọng phá sản đói khát.
        Quả báo hiện tiền: Bệnh tật, thất bát mùa màng và bế tắc dồn dập khiến người mẹ nước mắt lưng tròng, gia đình rơi vào cảnh túng quẫn không chốn nương tựa.
        Bài học & Chuyển hóa: Người mẹ nuốt nước mắt quỳ trước bàn thờ Quan Thế Âm Bồ Tát chí thành lạy Phật sám hối suốt đêm; cảm ứng linh diệu ruộng lúa cháy bỗng đâm chồi xanh tốt kỳ lạ, cứu sống cả gia đình qua cơn bĩ cực.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660639?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-17
      read_label: 📖 Đọc sách
    - id: 21
      title: Chú Út của bạn Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Chú Út của người bạn tác giả là đồ tể chuyên nghiệp nổi tiếng trong vùng, có tay nghề mổ thịt giết trâu bò nhanh gọn suốt mấy mươi năm.
        Hành vi tạo nghiệp: Vung dao tước đoạt sinh mạng hàng ngàn con trâu bò vô tội, dửng dưng trước những giọt nước mắt van xin quỳ lạy của loài vật trước giờ hành quyết.
        Quả báo hiện tiền: Đến tuổi trung niên ông mắc chứng bệnh lạ co giật uốn ván, bốn chân quỳ bò dưới đất, há hốc mồm rống lên từng hồi bi thảm như tiếng trâu bị chọc tiết rồi chết tươi.
        Bài học & Chuyển hóa: Cảnh báo đanh thép cho những ai mưu sinh bằng nghề sát mổ động vật; oán linh súc sinh không bao giờ bỏ qua cho kẻ tàn sát mình; hãy mau chóng đổi nghề lương thiện để cứu lấy mạng sống.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660640?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
