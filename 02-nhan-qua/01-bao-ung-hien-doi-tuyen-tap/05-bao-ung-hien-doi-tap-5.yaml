      read_label: 📖 Đọc sách
    - id: 30
      title: Xin đừng làm việc tổn đức
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tâm sự sám hối chân thành của một cư sĩ từng lầm đường lạc lối tạo nhiều ác nghiệp nặng nề thời trai trẻ trước khi biết đến Phật pháp.
        Hành vi tạo nghiệp: Phá thai nhiều lần, ăn cắp vặt của công, sát sinh nhậu nhẹt và có những hành vi đồi bại tổn hại âm đức nghiêm trọng trong cuộc sống.
        Quả báo hiện tiền: Vận đen đeo bám liên tục, phá sản nợ nần ngập đầu, mắc bệnh nan y chữa không khỏi, tâm thần hoảng loạn đứng bên bờ vực tự sát chấm dứt cuộc đời.
        Bài học & Chuyển hóa: Nhờ gặp ánh sáng Phật pháp kịp thời thức tỉnh, anh đem toàn bộ tội lỗi công khai phát lồ sám hối trên mạng Phật giáo để cảnh tỉnh thế nhân dừng tay tạo ác nghiệp.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660649?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
