    - id: 43
      title: Chuyện các khoa học gia
      summary: |-
        Nhân vật & Hoàn cảnh: Cư sĩ Từ Quang có cha mẹ đều là những nhà khoa học lỗi lạc công tác tại Viện Khoa học Trung Quốc, cả đời chỉ tin vào thực nghiệm khoa học duy vật.
        Hành vi tạo nghiệp: Khởi tâm hoài nghi chánh pháp thế gian, phủ nhận thế giới tâm linh nhân quả luân hồi cho đến khi bà mẹ mắc bệnh nan y bước một chân vào quỷ môn quan.
        Quả báo hiện tiền: Các giáo sư y khoa đầu ngành đều lắc đầu bó tay trước căn bệnh quái ác của người mẹ khoa học gia, sự sống chỉ còn tính từng giờ trên giường bệnh.
        Bài học & Chuyển hóa: Người con Từ Quang dốc lòng quỳ tụng Kinh Địa Tạng và niệm Phật suốt ba ngày đêm cứu sống mẹ bình phục kỳ diệu; cảm hóa trọn vẹn cả gia đình khoa học gia quy y Tam Bảo thâm tín Phật pháp.
