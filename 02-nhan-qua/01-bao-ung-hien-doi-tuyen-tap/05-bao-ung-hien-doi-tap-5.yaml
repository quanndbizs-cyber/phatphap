      read_label: 📖 Đọc sách
    - id: 34
      title: Tiên tri - 02. Tiên tri là bịp bợm - 03. Quan lớn họ Đặng
      summary: |-
        Nhân vật & Hoàn cảnh: Vạch trần trò mê tín dị đoan của các thầy bói bịp bợm và vụ án quan lớn họ Đặng tham nhũng tiền tỷ sa lưới pháp luật.
        Hành vi tạo nghiệp: Lợi dụng tâm lý tham lam của người đời để bói toán bịp tiền; quan chức lợi dụng chức quyền vơ vét của công của dân xây biệt phủ nguy nga.
        Quả báo hiện tiền: Thầy bói bị vạch mặt lừa đảo phải vào tù; quan lớn họ Đặng bị kỷ luật cách chức, tịch thu toàn bộ tài sản bất chính và chịu án tù chung thân nhục nhã.
        Bài học & Chuyển hóa: Số mệnh không nằm ở lời thầy bói mà do chính hành vi thiện ác của bản thân tạo nên; làm quan bất chính gieo rắc đau khổ cho muôn dân ắt không thể thoát khỏi quả báo ngục tù.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660653?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-34
      read_label: 📖 Đọc sách
    - id: 35
      title: Tiên tri - 04. Ngài Trung tướng Lữ Cố
      summary: |-
        Nhân vật & Hoàn cảnh: Trung tướng Lữ Cố là bậc tướng lĩnh quân đội quyền cao chức trọng, công danh lừng lẫy nhưng tính tình kiêu mạn tự phụ coi trời bằng vung.
        Hành vi tạo nghiệp: Ỷ vào quyền thế chức tước trong tay, tự cho mình là đấng tối cao, coi thường luật nhân quả luân hồi và xem nhẹ công đức tu hành của người khác.
        Quả báo hiện tiền: Gặp phải những biến cố bất trắc trong gia đình và sức khỏe suy sụp, quyền lực trần thế hoàn toàn bất lực trước quy luật nghiệp báo vô thường sinh tử.
        Bài học & Chuyển hóa: Sau khi được diện kiến bậc cao tăng khai thị về lý duyên khởi nhân quả, ngài Trung tướng rúng động tâm can, hạ mình quy y Tam Bảo, phát tâm hộ trì chánh pháp và tu dưỡng khiêm cung.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660654?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-35
      read_label: 📖 Đọc sách
    - id: 36
      title: Tiên tri - 05. Giám đốc Viên Mậu
      summary: |-
        Nhân vật & Hoàn cảnh: Doanh nhân Viên Mậu làm giám đốc một công ty lớn, vì lòng tham đã cấu kết buôn bán hóa đơn giả và trốn thuế hàng chục tỷ đồng.
        Hành vi tạo nghiệp: Bất chấp pháp luật và đạo đức kinh doanh, dùng thủ đoạn lừa dối nhà nước và đối tác để làm giàu bất chính trên mồ hôi nước mắt người khác.
        Quả báo hiện tiền: Bị cơ quan chức năng điều tra bắt giữ khẩn cấp, doanh nghiệp phá sản tiêu điều, bản thân đối mặt với án phạt tù dài hạn, gia đình tan nát ly tán.
        Bài học & Chuyển hóa: Của phi nghĩa vạn đời không giữ được; làm giàu bằng con đường gian xảo trộm cướp của công chỉ chuốc lấy tai họa diệt vong cho bản thân và dòng họ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660655?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
