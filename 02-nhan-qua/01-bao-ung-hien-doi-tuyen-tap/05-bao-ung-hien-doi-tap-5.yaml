    - id: 1
      title: Lời người dịch
      summary: 'Nhân vật & Hoàn cảnh: Lời người dịch mở đầu tập 5 Báo Ứng Hiện Đời
        do Sư Cô Hạnh Đoan tuyển chọn và chuyển ngữ từ nguyên tác Hán văn của cư sĩ
        Quả Khanh.

        Hành vi tạo nghiệp: Cảnh tỉnh người đời trước những cạm bẫy đạo đức và tệ
        nạn sát sinh, lừa gạt, tà dâm ngày càng gia tăng trong xã hội hiện đại.

        Quả báo hiện tiền: Bệnh dịch lan tràn, thiên tai nhân họa liên miên, gia đình
        ly tán và con người sống trong hoang mang bất an cùng cực.

        Bài học & Chuyển hóa: Cuốn sách là tấm gương soi chiếu nhân quả giúp mỗi người
        tự phản tỉnh thân tâm, lấy ngũ giới làm chuẩn mực sống, tu nhân tích đức kiến
        tạo hạnh phúc chân thật.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660620?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-1
      read_label: 📖 Đọc sách
    - id: 2
      title: Tây Du Ký và Phong Thần
      summary: 'Nhân vật & Hoàn cảnh: Nhìn nhận các tác phẩm văn học dưới góc nhìn
        nhân quả Phật giáo, phân tích tác hại của các tư tưởng tà kiến hoang đường
        đối với thế nhân.

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Thân thể mắc bệnh nan y hiểm nghèo hành hạ đau đớn, y học
        hiện đại bất lực; tinh thần bấn loạn chịu khổ báo hiện tiền thích đáng.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
        Đức nhắc nhở người đời mau chóng thức tỉnh, phát tâm ăn chay sám hối, dứt
        ác tu thiện và niệm Phật tiêu nghiệp chướng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660621?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-1
      read_label: 📖 Đọc sách
