      read_label: 📖 Đọc sách
    - id: 37
      title: Thái Minh Thông
      summary: |-
        Nhân vật & Hoàn cảnh: Gia đình tiên sinh Thái Minh Thông vốn là phú hộ giàu sang điền sản bao la, nuôi nhiều trâu bò cày cấy ruộng đồng ở quê nhà.
        Hành vi tạo nghiệp: Ông cố xỏ mũi nghé bị nghé đá chết; ông nội nổi giận cầm búa đập chết con nghé dã man bất chấp trâu mẹ quỳ lạy khóc rống van xin thảm thiết.
        Quả báo hiện tiền: Trâu mẹ ôm hận đập đầu tự tử; sau đó gia đình họ Thái liên tiếp gặp đại nạn: người chết bất đắc kỳ tử, con cháu đời sau sinh ra tật nguyền câm điếc, gia sản tiêu tán sạch sành sanh.
        Bài học & Chuyển hóa: Nước mắt oán hận của loài trâu mẹ quỳ lạy van xin là lời cảnh tỉnh rợn người về sự tàn bạo của con người; sát hại loài vật có tình cảm sâu nặng ắt chuốc lấy đại họa tuyệt tự.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660656?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-28
      read_label: 📖 Đọc sách
    - id: 38
      title: Tháng 6 tuyết rơi
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện oan án chấn động thời hiện đại với hiện tượng thiên nhiên kỳ lạ 'tháng sáu tuyết rơi' cảm động đất trời chốn nhân gian.
        Hành vi tạo nghiệp: Kẻ quyền thế bức hại người lương thiện, dùng tiền mua chuộc công lý để đổ tội oan cho người vô tội chết trong uất ức ngút ngàn.
        Quả báo hiện tiền: Trời đất nổi cơn thịnh nộ giáng tuyết rơi giữa tháng sáu mùa hè; kẻ thủ ác sau đó bị sét đánh chết và gia đình gặp hỏa hoạn thiêu rụi toàn bộ cơ nghiệp.
        Bài học & Chuyển hóa: Lòng dạ con người có thể gian manh đổi trắng thay đen nhưng lưới trời lồng lộng; oan khuất thấu tận trời xanh ắt sẽ có ngày chân tướng hiển lộ đền tội thích đáng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660657?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
