      read_label: 📖 Đọc sách
    - id: 13
      title: Cẩn thận khi phát ngôn
      summary: |-
        Nhân vật & Hoàn cảnh: Người phụ nữ trung niên mắc chứng bệnh trĩ nội khổng lồ như cái bánh bao, suốt nhiều tuần lễ không thể đại tiểu tiện, đau đớn gào khóc quằn quại.
        Hành vi tạo nghiệp: Khẩu nghiệp cay độc, từng mở miệng nguyền rủa xối xả người hàng xóm: "Đồ trời đánh, nguyền cho mày đại tiểu tiện không thông cho chết đi!".
        Quả báo hiện tiền: Lời độc địa nói ra chiêu cảm quả báo y hệt lên thân thể mình: hậu môn tắc nghẽn sưng mủ, bác sĩ bó tay vì phẫu thuật quá nguy hiểm đến tính mạng.
        Bài học & Chuyển hóa: Người chồng hốt hoảng đến quỳ lạy van xin HT Diệu Pháp; sư phụ dạy về nhà hai vợ chồng quỳ trước Phật sám hối nghiệp ác khẩu; sau khi sám hối người vợ lập tức bài tiết được và tiêu sưng lành bệnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660632?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-11
      read_label: 📖 Đọc sách
    - id: 14
      title: Nguyên nhân do đâu
      summary: |-
        Nhân vật & Hoàn cảnh: Điền Kiệt là người Trung Quốc định cư tại Mỹ, đã có thẻ xanh và cưới vợ hiền, nhưng bỗng nhiên mắc chứng tâm thần hoang tưởng đa nghi dữ dội.
        Hành vi tạo nghiệp: Kinh doanh gian dối, trốn thuế lừa đảo đối tác, thích ăn đồ hải sản tươi sống và ra tay sát hại nhiều loài động vật trong những bữa tiệc xa hoa.
        Quả báo hiện tiền: Tinh thần bấn loạn, suốt ngày đêm nghi ngờ vợ ngoại tình với đồng nghiệp, ghen tuông vô cớ đập phá nhà cửa, suýt cầm dao giết vợ con khiến gia đình tan nát.
        Bài học & Chuyển hóa: Chị gái Điền Kiệt về nước cầu cứu HT Diệu Pháp; sư phụ vạch rõ nghiệp sát sinh và gian dối chiêu cảm oan hồn che mờ tâm trí; khuyên gia đình ăn chay phóng sinh tụng kinh giải oan.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660634?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-12
      read_label: 📖 Đọc sách
    - id: 15
      title: Kinh nghiệm cầu con
      summary: |-
        Nhân vật & Hoàn cảnh: Sư phụ Diệu Chân ghé thăm Dương Châu khai thị cho các Phật tử tại gia về phương pháp cầu tự sinh con hiếu thuận ngoan hiền theo Phật pháp.
        Hành vi tạo nghiệp: Người đời mong cầu con cái thường sát sinh mổ thịt chim thú bồi bổ, tạo nghiệp oán thù chiêu cảm ác duyên oan gia trái chủ đầu thai phá gia bại sản.
        Quả báo hiện tiền: Sinh con khó nuôi, bệnh tật quặt quẹo, lớn lên ngỗ nghịch bất hiếu, phá tán gia tài tiêu hao phúc ấm của tổ tiên dòng họ.
        Bài học & Chuyển hóa: Muốn sinh con quý tử hiền đức, cha mẹ trước khi thụ thai và trong thai kỳ phải đoạn tuyệt sát sinh ăn chay thanh tịnh, chí tâm trì tụng Kinh Phổ Môn và Kinh Địa Tạng hồi hướng bồ-đề.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660633?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
