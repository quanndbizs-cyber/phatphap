    - id: 23
      title: Nhân duyên giữa Tôi và Bồ Tát
      summary: 'Nhân vật & Hoàn cảnh: Việc này xảy ra vào cuối năm 2003, lúc đó tôi
        làm hướng dẫn du lịch tại công ty Tam Á ở Hải Nam. Hằng ngày tôi phụ trách
        lái xe đưa rước khách, chở họ tham quan đảo hay các thắng cảnh....

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
