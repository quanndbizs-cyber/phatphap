    - id: 9
      title: Kim Doanh
      summary: 'Nhân vật & Hoàn cảnh: Sau đó con đọc tiếp các sách cơ bản của Phật
        giáo, biết Phật giáo có thánh địa Ngũ Đài Sơn, nên luôn mơ tưởng, mong được
        lên đó một lần, nhưng tốt nghiệp ra trường rồi thì đi làm, mãi đến năm 27
        tuổi nguyện vọng này mới thực hiện được… Vừa ...

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
