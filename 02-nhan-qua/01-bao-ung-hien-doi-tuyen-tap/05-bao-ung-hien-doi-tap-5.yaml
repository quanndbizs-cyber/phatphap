      read_label: 📖 Đọc sách
    - id: 2
      title: Tây Du Ký và Phong Thần
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải về nguồn gốc và tác động tiêu cực của các danh tác thần thoại hư cấu như Tây Du Ký và Phong Thần Diễn Nghĩa đối với nhận thức quần chúng.
        Hành vi tạo nghiệp: Thêu dệt chuyện thần ma ly kỳ, xuyên tạc sai lệch hình tượng chư Phật, Bồ Tát và chánh pháp Đại thừa, gieo rắc tà kiến vào tâm trí người đọc.
        Quả báo hiện tiền: Người sáng tác và truyền bá các tác phẩm báng bổ chánh pháp phải thọ quả báo câm ngọng, đọa lạc vào ba đường ác địa ngục ngạ quỷ chịu khổ muôn kiếp.
        Bài học & Chuyển hóa: Người học Phật cần có chánh tri chánh kiến, biết phân định rõ ràng giữa giáo lý chân thật giải thoát của đạo Phật với những tác phẩm văn học thế tục thần quyền hư cấu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660621?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-1
      read_label: 📖 Đọc sách
    - id: 3
      title: Cư sĩ Chân Minh
      summary: |-
        Nhân vật & Hoàn cảnh: Cư sĩ Chân Minh là một đệ tử Phật tại gia suốt đời ăn chay niệm Phật, tu hành tinh tấn nghiêm trì giới luật và làm nhiều việc thiện lành.
        Hành vi tạo nghiệp: Nghiệp chướng nhiều đời nhiều kiếp trong quá khứ do vô minh đã lỡ gieo nhân sát sinh hoặc tổn hại sinh linh nay đến kỳ trổ quả cuối cùng.
        Quả báo hiện tiền: Trước lúc lâm chung ông bất ngờ mắc chứng bệnh nan y hành hạ đau đớn dữ dội, khiến một số người thiếu hiểu biết sinh tâm hoài nghi Phật pháp.
        Bài học & Chuyển hóa: HT Diệu Pháp khai thị đây là hiện tượng "tội nặng báo nhẹ", nhờ công đức tu trì dũng mãnh mà trả sạch nợ cũ trong một đời để thân tâm thanh tịnh vãng sinh Tây Phương Cực Lạc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660622?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-2
      read_label: 📖 Đọc sách
    - id: 4
      title: Đừng truyền luận thuyết hồ đồ
      summary: |-
        Nhân vật & Hoàn cảnh: Cảnh báo nghiêm khắc đối với những người tu học nhưng thích truyền bá các luận thuyết hồ đồ, sai lệch với kinh điển chánh truyền của Phật tổ.
        Hành vi tạo nghiệp: Tự mãn vào chút hiểu biết cạn cợt thế trí biện thông, bóp méo giáo lý nhân quả, xúi giục người khác bỏ giới luật, dẫn dắt tín đồ vào con đường tà đạo mê lầm.
        Quả báo hiện tiền: Đời này bị mất hết trí tuệ, điên loạn mê mờ, tiếng xấu đồn xa; tương lai đọa vào địa ngục rút lưỡi, đui mù ngọng câm muôn kiếp không thấy ánh sáng Tam Bảo.
        Bài học & Chuyển hóa: Lời nhắc nhở sâu sắc: Y pháp bất y nhân, y nghĩa bất y ngữ; người đệ tử Phật phải cẩn trọng giữ gìn khẩu nghiệp, lấy kinh điển liễu nghĩa và giới luật làm thầy dẫn đường.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660623?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-3
      read_label: 📖 Đọc sách
    - id: 5
      title: Cô Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Người cô ruột của tác giả từ nhỏ chịu khó làm lụng nhưng bản tính vô cùng cay nghiệt, ích kỷ tham lam, khinh khi Tam Bảo và bất hiếu với mẹ cha.
        Hành vi tạo nghiệp: Tranh đoạt từng tấc đất của anh em, mắng chửi cha mẹ già thậm tệ, buông lời thóa mạ người tu hành và sát sinh bồi bổ không chút xót thương.
        Quả báo hiện tiền: Về già con cái ruồng rẫy bỏ rơi, mắc chứng liệt giường thối thịt đau đớn rên xiết suốt nhiều năm, cô độc trong căn nhà rách nát không ai ngó ngàng.
        Bài học & Chuyển hóa: Tội bất hiếu và ác khẩu với ruột thịt chiêu cảm quả báo cô độc bần cùng hiện tiền; con người muốn có hậu vận tốt đẹp nhất định phải giữ tròn đạo hiếu và tu dưỡng lòng từ ái.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660624?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-4
      read_label: 📖 Đọc sách
    - id: 6
      title: Cách lìa dục niệm
      summary: |-
        Nhân vật & Hoàn cảnh: Phương pháp tu tập thù thắng của đạo Phật nhằm giúp hành giả điều phục và đoạn trừ dục niệm dâm tâm tham ái nơi tự tâm.
        Hành vi tạo nghiệp: Đắm chìm trong sắc dục thế gian, thủ dâm, xem phim ảnh đồi trụy hoặc tơ tưởng tà hạnh làm tiêu hao nguyên khí, ô uế tâm tánh thanh tịnh.
        Quả báo hiện tiền: Thân thể suy kiệt, mắc các chứng bệnh thần kinh suy nhược, trí nhớ suy giảm, công danh sự nghiệp lụi tàn và vận số ngày càng tăm tối bế tắc.
        Bài học & Chuyển hóa: Thực hành phép quán bất tịnh, thường xuyên trì niệm danh hiệu Quán Thế Âm Bồ Tát và phát tâm hổ thẹn sám hối; đó là phương thuốc mầu nhiệm chuyển hóa ái dục thành bồ-đề tâm thanh tịnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660625?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-5
      read_label: 📖 Đọc sách
    - id: 7
      title: Vì sao hài nhi khóc
      summary: |-
        Nhân vật & Hoàn cảnh: Hiện tượng trẻ sơ sinh sau khi chào đời ngày đêm khóc ngặt tím tái không dứt, gia đình chạy chữa khắp các bệnh viện nhi đều hoàn toàn bó tay.
        Hành vi tạo nghiệp: Cha mẹ tổ chức tiệc đầy tháng sát sinh gà vịt heo cá đãi khách linh đình, hoặc thai nhi bị các oan gia trái chủ từ tiền kiếp bám theo đòi nợ báo oán.
        Quả báo hiện tiền: Đứa trẻ quấy khóc kiệt sức, co giật sốt cao, cả nhà thức trắng đêm lo lắng bất an, hao tổn tiền bạc thuốc men mà bệnh không thuyên giảm.
        Bài học & Chuyển hóa: HT Diệu Pháp chỉ dạy cha mẹ phải lập tức phóng sinh chuộc mạng, ăn chay và tụng Kinh Địa Tạng hồi hướng cho thai nhi cùng oan gia; cảm ứng đứa bé ngừng khóc ngủ say ngon giấc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660626?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-6
      read_label: 📖 Đọc sách
    - id: 8
      title: Nguyên nhân bất hạnh
      summary: |-
        Nhân vật & Hoàn cảnh: Một cô gái 30 tuổi dung mạo tiều tụy khổ đau tìm đến quỳ dưới chân Hòa thượng Diệu Pháp khóc lóc kể về chuỗi bi kịch cuộc đời bất hạnh dồn dập.
        Hành vi tạo nghiệp: Năm 19 tuổi bị kẻ xấu làm nhục cưỡng hiếp, sau này lấy chồng lại bị bạo hành phản bội; nguyên nhân do tiền kiếp cô từng là công tử phong lưu ỷ thế cưỡng đoạt trinh tiết phụ nữ.
        Quả báo hiện tiền: Thân xác và tâm hồn bị chấn thương nặng nề, luôn sống trong sợ hãi cô độc, tình duyên lận đận trắc trở, từng có ý định tự tử để giải thoát nỗi đau.
        Bài học & Chuyển hóa: Thấu suốt nhân quả vay trả công bằng qua nhiều kiếp; cô gái buông bỏ oán hận kẻ hại mình, phát tâm ăn chay quy y Tam Bảo, chuyên tâm sám hối để cởi bỏ oan kết tiền khiên.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660627?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-7
      read_label: 📖 Đọc sách
    - id: 9
      title: Kim Doanh
      summary: |-
        Nhân vật & Hoàn cảnh: Cô gái Kim Doanh 30 tuổi từ nhỏ say mê đọc sách Phật giáo, luôn khát khao hướng về thánh địa Ngũ Đài Sơn như chốn quê hương linh thiêng gắn bó máu thịt.
        Hành vi tạo nghiệp: Tiền kiếp từng là một vị tu sĩ trên núi Ngũ Đài tu hành tinh tấn, nhưng vì khởi một niệm tình chấp ái luyến trần tục mà rơi vào luân hồi tái sinh làm thân nữ.
        Quả báo hiện tiền: Đời này duyên tu còn dang dở, phải mang thân phụ nữ chịu nhiều phiền muộn ràng buộc của đời sống thế tục và khát khao tìm lại con đường giải thoát xưa.
        Bài học & Chuyển hóa: HT Diệu Pháp khai thị túc mạng tiền căn, khuyên cô Kim Doanh giữ vững bồ-đề tâm kiên cố, đoạn trừ ái dục trần gian, tinh tấn tu hành để tiếp nối hạnh nguyện giải thoát giác ngộ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660628?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-8
      read_label: 📖 Đọc sách
    - id: 10
      title: Tụng kinh niệm Phật còn gặp tai nạn ư
      summary: |-
        Nhân vật & Hoàn cảnh: Một cư sĩ chí thành tụng kinh niệm Phật và làm nhiều việc thiện ở Vạn Phật Thành nhưng không may gặp tai nạn giao thông qua đời.
        Hành vi tạo nghiệp: Người đời hoài nghi thắc mắc vì sao người tu Phật vẫn bị tai nạn chết thảm, làm lung lay niềm tin của một số thiện nam tín nữ.
        Quả báo hiện tiền: Bị xe tông tử nạn trên đường đi đón người thân, để lại nghi vấn lớn cho những người học Phật chưa thấu suốt đạo lý nhân quả ba đời.
        Bài học & Chuyển hóa: Hòa thượng Diệu Pháp khai thị: Nghiệp cũ sâu nặng nay nhờ tu hành mà trả dứt trong một đời (tội nặng báo nhẹ), linh hồn được Phật tiếp dẫn giải thoát; chớ vội đem cái nhìn phàm phu phán xét thánh ý.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660629?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-10
      read_label: 📖 Đọc sách
    - id: 11
      title: Vì sao Chư Đại Đức, cao Tăng cũng bị bệnh nặng, tử vong
      summary: |-
        Nhân vật & Hoàn cảnh: Hòa thượng Diệu Pháp giải thích thắc mắc lớn: Vì sao chư vị Đại Đức, cao Tăng đạo hạnh cao dày vẫn có vị mắc bệnh nặng hoặc tử nạn?
        Hành vi tạo nghiệp: Các bậc Bồ Tát thị hiện thân người trong cõi trần chịu sự vô thường chi phối, đồng thời phát nguyện đại bi gánh bớt nghiệp chướng cho chúng sinh thời mạt pháp.
        Quả báo hiện tiền: Thân xác tứ đại hoại diệt qua bệnh tật hiểm nghèo hoặc nghịch cảnh nan y, khiến người phàm nhìn vào tưởng là bị nghiệp báo trừng phạt.
        Bài học & Chuyển hóa: Cần có chánh kiến sâu sắc về luật nhân quả và hạnh nguyện Bồ Tát nghịch hành; không được khởi tâm hoài nghi phỉ báng Tam Bảo khi thấy cao tăng mang bệnh mà phải tăng trưởng niềm tin bất hoại.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660630?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-11
      read_label: 📖 Đọc sách
    - id: 12
      title: Bồ Tát mật hạnh
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện về một vị giáo sư cư sĩ âm thầm cống hiến đời mình hộ trì Tam Bảo và dạy học cho thế hệ trẻ tại đạo tràng Vạn Phật Thành.
        Hành vi tạo nghiệp: Phát tâm Bồ Đề rộng lớn xả phú cầu bần, rời xa gia đình tiện nghi thế tục để dấn thân phụng sự chúng sinh không màng danh lợi.
        Quả báo hiện tiền: Gặp tai nạn bất ngờ qua đời khi đón vợ con, người đời lầm tưởng là bất hạnh nhưng thực chất là đã hoàn thành tâm nguyện xả thân liễu nghiệp nơi cõi trần.
        Bài học & Chuyển hóa: Hòa thượng Diệu Pháp chứng minh vị cư sĩ thị hiện Bồ Tát mật hạnh, lấy thân mạng độ hóa quần mê; nhắc nhở đại chúng chớ nhìn hiện tượng bề ngoài mà đánh giá đạo nghiệp người tu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660631?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
