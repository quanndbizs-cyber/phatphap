    - id: 32
      title: Tiếng gọi đêm khuya
      summary: |-
        Nhân vật & Hoàn cảnh: Cô gái 28 tuổi mới cưới chồng được vài tháng tràn ngập hạnh phúc, một ngày về thăm mẹ bàng hoàng nghe mẹ kể đêm nào đúng 22h05 cũng có tiếng người gọi tên cô.
        Hành vi tạo nghiệp: Thuở trẻ sống buông thả từng nạo phá thai tước đoạt sinh mạng cốt nhục của chính mình mà không hề ăn năn sám hối.
        Quả báo hiện tiền: Vong linh thai nhi cô độc đói khát đêm đêm tìm về gọi tên mẹ đòi công lý, tạo nên không khí ma quái rùng rợn đe dọa hạnh phúc hôn nhân non trẻ.
        Bài học & Chuyển hóa: Thức tỉnh trước tội ác nạo phá thai; cô gái cùng chồng lập bàn thờ chí thành quỳ tụng Kinh Địa Tạng, phóng sinh chuộc tội và phát nguyện ăn chay hồi hướng cho đứa con vô tội siêu sinh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660651?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-26
      read_label: 📖 Đọc sách
    - id: 33
      title: Tiên tri - Vua tiên tri họ Liên - 01. Chuyện Thần Phúc Lộc - 02. Ngụy Thanh Bình - 03. Điền Sắc
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải uyên thâm về Thần Phúc Lộc và cội nguồn phúc đức con người; ai sinh ra cũng có phần phúc báu nhưng do tạo ác mà tự tay thiêu rụi.
        Hành vi tạo nghiệp: Ngụy Thanh Bình và Điền Sắc vì tham lam tiền tài sắc dục đã buông lung dâm ô, bất hiếu với cha mẹ và làm nhiều việc thất đức tổn hại người khác.
        Quả báo hiện tiền: Phúc lộc trời ban bị Thần Phúc Lộc tước sạch, công danh sự nghiệp đang thăng tiến bỗng tiêu tan thành mây khói, rơi vào cảnh bần cùng khốn khó nhục nhã.
        Bài học & Chuyển hóa: Phúc báu như tài khoản ngân hàng, chỉ tiêu mà không tích tất sẽ cạn kiệt; muốn giữ trọn phúc lộc phải giữ tâm thanh tịnh, hiếu thảo mẹ cha và thường xuyên làm việc phước thiện cứu người.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660652?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
