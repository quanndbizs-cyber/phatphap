    - id: 25
      title: Chuyện kể của cảnh sát pháp y
      summary: 'Nhân vật & Hoàn cảnh: Những lời chia sẻ chân thực từ một sĩ quan cảnh
        sát pháp y lâu năm chuyên khám nghiệm hiện trường các vụ án mạng kỳ lạ bí
        ẩn.

        Hành vi tạo nghiệp: Những toan tính hiểm độc, giết người cướp của, tranh đoạt
        tình tiền tưởng chừng được che giấu hoàn hảo dưới lớp vỏ bọc tinh vi.

        Quả báo hiện tiền: Lưới trời lồng lộng, các dấu vết tâm linh kỳ bí và sự thật
        rúng động nơi hiện trường luôn tự hé lộ buộc hung thủ phải đền tội trước pháp
        luật.

        Bài học & Chuyển hóa: Không một tội ác nào có thể che giấu được luật nhân
        quả vô hình; kẻ gieo gió ắt gặt bão, lưới pháp luật và tòa án lương tâm luôn
        đợi sẵn.'
