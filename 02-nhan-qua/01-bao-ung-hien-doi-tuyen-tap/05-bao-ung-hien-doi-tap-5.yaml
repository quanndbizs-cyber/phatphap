    - id: 29
      title: Ác báo của vu khống thêu dệt
      summary: |-
        Nhân vật & Hoàn cảnh: Một người bạn của tác giả làm việc trong ngành báo chí truyền thông, vốn có thói quen thêu dệt tin đồn thất thiệt để câu khách kiếm tiền.
        Hành vi tạo nghiệp: Hai năm trước viết bài vu khống bịa đặt tung lên mạng xã hội bôi nhọ thanh danh xúc phạm danh dự của tác giả và nhiều người lương thiện.
        Quả báo hiện tiền: Đột nhiên mắc bệnh hiểm nghèo đau đớn, công việc đình trệ mất sạch uy tín, đêm đêm gặp ác mộng bị quỷ sai vặn họng rút lưỡi khiếp đảm khôn cùng.
        Bài học & Chuyển hóa: Anh hốt hoảng chạy đến tìm tác giả dập đầu xin tha thứ và công khai đính chính bài viết; bài học cảnh tỉnh sâu sắc cho những ai dùng ngòi bút vu oan giá họa cho người khác.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660648?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
