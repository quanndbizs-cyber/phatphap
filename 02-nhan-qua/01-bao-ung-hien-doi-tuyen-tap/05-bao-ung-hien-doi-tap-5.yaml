    - id: 34
      title: Tiên tri - 02. Tiên tri là bịp bợm - 03. Quan lớn họ Đặng
      summary: 'Nhân vật & Hoàn cảnh: Vạch trần trò mê tín dị đoan của các thầy bói
        bịp bợm và vụ án quan lớn họ Đặng tham nhũng tiền tỷ sa lưới pháp luật.

        Hành vi tạo nghiệp: Lợi dụng tâm lý tham lam của người đời để bói toán bịp
        tiền; quan chức lợi dụng chức quyền vơ vét của công của dân xây biệt phủ nguy
        nga.

        Quả báo hiện tiền: Thầy bói bị bắt giam vì lừa đảo; quan lớn họ Đặng bị cách
        chức tịch thu toàn bộ gia sản, lĩnh án tù chung thân nhục nhã ê chề.

        Bài học & Chuyển hóa: Số mệnh do chính tâm mình tạo tác, không một thầy bói
        nào có thể đổi mệnh; chỉ có dứt ác làm lành tích đức mới thực sự cải biến
        vận mệnh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660653?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
