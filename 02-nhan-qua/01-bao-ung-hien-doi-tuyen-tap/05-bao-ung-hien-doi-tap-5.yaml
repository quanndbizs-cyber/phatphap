    - id: 28
      title: Chuyện kể của cảnh sát pháp y - Người có miệng lưỡi độc
      summary: |-
        Nhân vật & Hoàn cảnh: Người đàn bà có biệt danh 'miệng lưỡi độc', chuyên đặt điều bịa chuyện thêu dệt ly gián phá hoại hạnh phúc của xóm làng.
        Hành vi tạo nghiệp: Dùng lời lẽ cay độc đâm thọc hai đầu, vu khống gắp lửa bỏ tay người, làm cho nhiều gia đình êm ấm phải ly tán thù hận nhau.
        Quả báo hiện tiền: Mắc chứng bệnh ung thư lưỡi và vòm họng lở loét hoại tử hôi thối nồng nặc, đau đớn không thể ăn uống nói năng, sống trong dằn vặt nhục nhã tột cùng.
        Bài học & Chuyển hóa: Khẩu nghiệp sắc như gươm đao hại người hại mình; giữ gìn lời nói chánh trực hòa ái, tuyệt đối không được buôn dưa lê thêu dệt chuyện thị phi gây họa sát thân.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660647?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
