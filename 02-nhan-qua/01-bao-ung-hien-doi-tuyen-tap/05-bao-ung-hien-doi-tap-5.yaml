    - id: 28
      title: Chuyện kể của cảnh sát pháp y - Người có miệng lưỡi độc
      summary: 'Nhân vật & Hoàn cảnh: Người đàn bà có biệt danh ''miệng lưỡi độc'',
        chuyên đặt điều bịa chuyện thêu dệt ly gián phá hoại hạnh phúc của xóm làng.

        Hành vi tạo nghiệp: Dùng lời lẽ cay độc đâm thọc hai đầu, vu khống gắp lửa
        bỏ tay người, làm cho nhiều gia đình êm ấm phải ly tán thù hận nhau.

        Quả báo hiện tiền: Mắc chứng bệnh ung thư vòm họng và ung thư lưỡi, lưỡi bị
        sưng phù lở loét thối rữa không thể nói năng, con cái sinh ra đều ngỗ nghịch
        bất hiếu.

        Bài học & Chuyển hóa: Khẩu nghiệp là lưỡi búa chém đứt phúc đức; hãy cẩn thận
        giữ gìn lời ăn tiếng nói, luôn nói lời ái ngữ từ bi xây dựng hòa khí.'
