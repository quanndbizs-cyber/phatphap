    - id: 26
      title: Chuyện kể của cảnh sát pháp y - Vụ án cặp vợ chồng chết thảm 2012
      summary: |-
        Nhân vật & Hoàn cảnh: Vụ án cặp vợ chồng buôn bán thịt động vật quy mô lớn bị sát hại thảm khốc tại nhà riêng năm 2012 gây chấn động dư luận.
        Hành vi tạo nghiệp: Nhiều năm làm nghề thu mua, giết mổ hàng vạn sinh mạng heo bò dê sống, kiếm lợi nhuận kết xù trên máu tanh của loài vật.
        Quả báo hiện tiền: Bị kẻ cướp đột nhập cắt cổ phân thây dã man y hệt cách họ đã từng mổ xẻ các loài động vật trong lò mổ; toàn bộ tài sản kết xù bị cướp sạch trong đêm.
        Bài học & Chuyển hóa: Sát nghiệp là nghiệp nặng nhất trong các ác nghiệp; máu trả bằng máu, mạng trả bằng mạng; làm giàu trên sự chết chóc của sinh linh sẽ chuốc lấy cái chết thảm khốc không ngờ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660645?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
