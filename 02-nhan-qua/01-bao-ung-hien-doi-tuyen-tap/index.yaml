    - id: 25
      title: 50 Năm Sau Mới Báo Thù
      summary: |-
        Nhân vật & Hoàn cảnh: Vụ án báo oán chấn động xảy ra tròn 50 năm sau ngày kẻ sát nhân ra tay tàn sát cướp của một thương gia giàu có thuở loạn lạc chiến tranh.
        Hành vi tạo nghiệp: Kẻ sát nhân dùng thủ đoạn tàn độc giết người cướp vàng, tưởng rằng nửa thế kỷ êm ấm trôi qua thì tội ác xưa đã chìm vào quên lãng hư vô.
        Quả báo hiện tiền: Khi phúc báu kiếp trước cạn sạch đến tuổi già, vong hồn người bị hại hiện hình đòi mạng khiến ông phát điên tự thú trước pháp luật rồi chết trong co giật đớn đau.
        Bài học & Chuyển hóa: Nhân quả báo ứng như bóng theo hình, dẫu qua trăm ngàn kiếp nghiệp đã tạo không bao giờ tự mất; lưới trời tuy thưa nhưng khó thoát một mảy may.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660562?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
