      read_label: 📖 Đọc sách
    - id: 14
      title: Không nên ăn thịt chúng sanh
      summary: |-
        Nhân vật & Hoàn cảnh: Khảo luận sâu rộng về giới luật Phật chế trong kinh Lăng Già, kinh Phạm Võng cảnh tỉnh những người tu Phật nhưng chưa dứt được thói quen ăn mặn.
        Hành vi tạo nghiệp: Thỏa mãn dục vọng ăn uống khoái khẩu nơi đầu lưỡi, trực tiếp hoặc gián tiếp giết hại thịt xương muôn loài chúng sinh có cùng Phật tính.
        Quả báo hiện tiền: Đoạn dứt hạt giống từ bi, thân thể tích tụ độc tố chiêu cảm ung thư mụn nhọt, khi lâm chung bị oan hồn súc sinh vây bủa đòi nợ đọa lạc tam đồ ác đạo.
        Bài học & Chuyển hóa: Người học đạo muốn thành tựu trí tuệ giải thoát nhất định phải ăn chay trường, kiêng ngũ vị tân, trì giới bất sát để nuôi dưỡng lòng đại từ bi cứu độ muôn loài.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660503?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
