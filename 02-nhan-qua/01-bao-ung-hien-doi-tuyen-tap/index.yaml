    - id: 37
      title: Mẹ chồng nàng dâu
      summary: 'Nhân vật & Hoàn cảnh: Vô lượng kiếp đến nay, chúng ta sinh tử trôi
        lăn trong sáu đường, vì phiền não tam độc mà kết bao oán hận cùng chúng sinh.
        Trong “Lương Hoàng Sám” nói: “Tất cả chúng sinh, đều có oán thù đối nghịch,
