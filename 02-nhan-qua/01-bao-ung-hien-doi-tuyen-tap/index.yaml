    - id: 13
      title: Thuốc trị hiếm muộn
      summary: |-
        Nhân vật & Hoàn cảnh: Cô Nhã Lâm 35 tuổi, kết hôn 10 năm tha thiết mong mỏi mụn con nhưng thuốc men chạy chữa khắp nơi đều hoàn toàn vô vọng.
        Hành vi tạo nghiệp: Dù đã phát tâm ăn chay nhưng vì thiếu hiểu biết vẫn ăn rất nhiều trứng gà, trứng vịt, trứng lộn, vô tình tàn hại vô số mầm sống sinh linh hữu tình.
        Quả báo hiện tiền: Thân thể gầy gò tiều tụy, sắc mặt xám xịt úa vàng, tử cung lạnh lẽo hiếm muộn suốt một thập kỷ không thể hoài thai.
        Bài học & Chuyển hóa: Được Quả Khanh khai thị đoạn trừ dứt hẳn việc ăn trứng, sám hối tội sát mầm sống, phóng sinh và tụng Kinh Địa Tạng; chẳng bao lâu cô mang thai và sinh con khỏe mạnh mẹ tròn con vuông.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660502?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
