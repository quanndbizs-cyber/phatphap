    - id: 41
      title: Tự tử đi về đâu
      summary: 'Nhân vật & Hoàn cảnh: Lời khai thị rúng động của Hòa thượng Diệu Pháp
        về chân tướng cảnh giới đau khổ cùng cực của những linh hồn người tự tử chết
        yểu.

        Hành vi tạo nghiệp: Trong cơn quẫn trí bế tắc hủy hoại thân mạng cha mẹ ban
        cho, tưởng rằng tự sát là kết thúc mọi khổ đau bế tắc nơi cõi trần.

        Quả báo hiện tiền: Thần thức bị giam hãm nơi u tối, mỗi ngày đúng giờ đó phải
        lặp lại hành vi tự sát đau đớn gấp ngàn lần cho đến hết tuổi thọ định sẵn.

        Bài học & Chuyển hóa: Thân người khó được Phật pháp khó nghe; dù gặp nghịch
        cảnh cùng cực cũng phải kiên cường sám hối tu hành, chớ dại dột tự tử đọa
        vào địa ngục vô gián.'
