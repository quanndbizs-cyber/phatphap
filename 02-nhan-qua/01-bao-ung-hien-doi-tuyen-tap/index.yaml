    - id: 10
      title: Tụng kinh niệm Phật còn gặp tai nạn ư
      summary: 'Nhân vật & Hoàn cảnh: Một cư sĩ chí thành tụng kinh niệm Phật và làm
        nhiều việc thiện ở Vạn Phật Thành nhưng không may gặp tai nạn giao thông qua
        đời.

        Hành vi tạo nghiệp: Người đời hoài nghi thắc mắc vì sao người tu Phật vẫn
        bị tai nạn chết thảm, làm lung lay niềm tin của một số thiện nam tín nữ.

        Quả báo hiện tiền: Hòa thượng Diệu Pháp khai thị: đây là việc trả dứt định
        nghiệp nhiều đời trong một khoảnh khắc ngắn ngủi để thần thức nhẹ nhàng siêu
        thăng cõi lành.

        Bài học & Chuyển hóa: Luật nhân quả công bằng tuyệt đối; tai nạn hiện đời
        là cơ duyên liễu sạch nợ xưa, người niệm Phật nhờ công đức tu trì vẫn được
        vãng sinh về cõi Phật an vui.'
