    - id: 1
      title: Lời người dịch
      summary: |-
        Nhân vật & Hoàn cảnh: Lời người dịch mở đầu tập 5 Báo Ứng Hiện Đời do Sư Cô Hạnh Đoan tuyển chọn và chuyển ngữ từ nguyên tác Hán văn của cư sĩ Quả Khanh.
        Hành vi tạo nghiệp: Cảnh tỉnh người đời trước những cạm bẫy đạo đức và tệ nạn sát sinh, lừa gạt, tà dâm ngày càng gia tăng trong xã hội hiện đại.
        Quả báo hiện tiền: Đời sống hỗn loạn, gia đình tan vỡ, tai ương dịch bệnh dồn dập giáng xuống do con người tự tạo nghiệp bất thiện mà không hay biết.
        Bài học & Chuyển hóa: Cung cấp những câu chuyện nhân quả có thực mắt thấy tai nghe, giúp bạn đọc xây dựng chánh tri kiến, ăn chay sám hối, dứt ác tu thiện để kiến tạo an lạc thực sự.
