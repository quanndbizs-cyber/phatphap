    - id: 20
      title: Câu chuyện khiến Tôi rơi lệ
      summary: 'Nhân vật & Hoàn cảnh: Mùa thu năm đó tôi 12 tuổi, đây là quãng thời
        gian thê thảm nhất của gia đình tôi: Phụ thân tôi bệnh nặng phải phẫu thuật,
        mất khả năng lao động. Anh Hai tôi thi rớt đại học, còn mẹ tôi thì dùng lầm
        nông dược, khiến mười mẫu lúa đang trổ bị...

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Thân thể mắc bệnh nan y hiểm nghèo hành hạ đau đớn, y học
        hiện đại bất lực; tinh thần bấn loạn chịu khổ báo hiện tiền thích đáng.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
        Đức nhắc nhở người đời mau chóng thức tỉnh, phát tâm ăn chay sám hối, dứt
        ác tu thiện và niệm Phật tiêu nghiệp chướng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660639?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
