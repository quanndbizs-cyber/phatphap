    - id: 48
      title: Hồi hướng
      summary: 'Nhân vật & Hoàn cảnh: Lời nguyện hồi hướng trang nghiêm kết thúc toàn
        bộ tác phẩm Báo Ứng Hiện Đời tập 4 của cư sĩ Quả Khanh và ban ấn tống.

        Hành vi tạo nghiệp: Nguyện sám hối muôn vàn tội lỗi đã tạo trong quá khứ do
        vô minh che lấp tâm tánh, tha thiết xin giải trừ mọi oán kết oan gia.

        Quả báo hiện tiền: Chuyển hóa ác duyên thành thiện duyên, giải thoát mọi ràng
        buộc đau khổ của thân tâm và gia đình nơi cõi thế tục.

        Bài học & Chuyển hóa: Hồi hướng toàn bộ thiện căn công đức biên soạn, đọc
        tụng và truyền bá cuốn sách này cho cửu huyền thất tổ cùng pháp giới chúng
        sinh đồng triêm lợi lạc, vãng sinh Tây Phương.'
