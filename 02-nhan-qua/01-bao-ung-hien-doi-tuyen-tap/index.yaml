    - id: 36
      title: Tình chấp trói buộc
      summary: 'Nhân vật & Hoàn cảnh: Mối quan hệ phức tạp và đau đớn giữa mẹ chồng
        và nàng dâu trong một gia đình trí thức, ngày đêm mâu thuẫn tranh cãi không
        dứt.

        Hành vi tạo nghiệp: Oan oán tiền kiếp kết thành sợi dây tình chấp hận thù;
        kiếp trước từng là kẻ thù tranh đoạt tài sản, kiếp này tái sinh làm mẹ chồng
        nàng dâu để đòi nợ.

        Quả báo hiện tiền: Gia đạo bất an, không khí gia đình ngột ngạt như địa ngục
        trần gian; con cháu sống trong sợ hãi, sức khỏe suy sụp nghiêm trọng.

        Bài học & Chuyển hóa: Nhờ Hòa thượng Diệu Pháp khai thị nhân quả tiền kiếp,
        cả hai buông bỏ oán thù, quỳ trước Phật sám hối và lấy tâm từ bi bao dung
        đối đãi nhau, gia đình thuận hòa ấm êm.'
