      read_label: 📖 Đọc sách
    - id: 12
      title: Bàn Về Giao Tế, Ăn Mặc
      summary: |-
        Nhân vật & Hoàn cảnh: Đạo lý đối nhân xử thế và quy tắc ăn mặc giao tế nơi công cộng theo tinh thần văn hóa truyền thống và chánh pháp đạo Phật.
        Hành vi tạo nghiệp: Lợi dụng giao tế kinh doanh để ăn mặc hở hang mồi chài nhục dục, buông lời lả lơi cợt nhả phá vỡ luân thường đạo lý và hạnh phúc gia đình người khác.
        Quả báo hiện tiền: Bị người đời coi khinh, chiêu cảm bạn bè xấu lừa gạt tình tiền, hậu vận bi đát cô độc và mắc các chứng bệnh nan y vùng kín hành hạ đau đớn.
        Bài học & Chuyển hóa: Trang phục kín đáo đoan chính thể hiện phẩm hạnh cao quý; giao tế chánh trực giữ khoảng cách thanh tịnh sẽ đem lại sự tôn trọng và thành công bền vững.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660549?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
