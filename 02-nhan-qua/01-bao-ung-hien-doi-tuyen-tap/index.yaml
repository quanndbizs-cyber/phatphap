    - id: 26
      title: Chuyện kể của cảnh sát pháp y - Vụ án cặp vợ chồng chết thảm 2012
      summary: 'Nhân vật & Hoàn cảnh: Vụ án cặp vợ chồng buôn bán thịt động vật quy
        mô lớn bị sát hại thảm khốc tại nhà riêng năm 2012 gây chấn động dư luận.

        Hành vi tạo nghiệp: Nhiều năm làm nghề thu mua, giết mổ hàng vạn sinh mạng
        heo bò dê sống, kiếm lợi nhuận kết xù trên máu tanh của loài vật.

        Quả báo hiện tiền: Bị kẻ cướp đột nhập sát hại dã man trong đêm, thân thể
        chịu nhiều vết thương cắt xẻo y hệt cách họ từng giết mổ súc vật trên thớt.

        Bài học & Chuyển hóa: Nghề nghiệp sát sinh nhuốm máu tanh chiêu cảm từ trường
        oán hận và hung hiểm; hãy mau chóng chuyển nghề lương thiện giữ lấy bình an
        cho gia đình.'
