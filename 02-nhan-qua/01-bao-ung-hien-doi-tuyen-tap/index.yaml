    - id: 19
      title: Cậu Hai Tôi
      summary: 'Nhân vật & Hoàn cảnh: Cậu Hai của tác giả là một người thợ săn cừ
        khôi, cả đời đam mê súng đạn săn bắn thú rừng và chim muông bồi bổ.

        Hành vi tạo nghiệp: Hàng ngàn mạng sống nai, hoẵng, lợn rừng và chim trời
        đã ngã gục dưới họng súng tàn nhẫn của ông suốt mấy mươi năm săn bắn.

        Quả báo hiện tiền: Về già mắc bệnh khó thở dữ dội, phổi bị lở loét hoại tử
        hệt như vết đạn bắn, nằm trên giường bệnh hai tay run rẩy bóp ngực rên xiết
        chờ chết.

        Bài học & Chuyển hóa: Nỗi đau đớn của muôn loài trúng đạn năm xưa nay trút
        lên chính lồng ngực người thợ săn; sát sinh tàn độc ắt phải đền mạng bằng
        cái chết đau đớn.'
