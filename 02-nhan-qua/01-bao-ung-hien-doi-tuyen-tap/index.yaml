      summary: 'Nhân vật & Hoàn cảnh: Bạn bè đều biết tôi tin Phật, do chơi thân nên
        hễ có thắc mắc gì về Phật giáo đều hỏi tôi, hoặc kể cho tôi nghe các việc
        xảy ra trong gia đình họ. Hôm nay tôi xin thuật một chuyện (trong số các câu
        chuyện của bạn tôi), hi vọng quí vị đọc xo...

