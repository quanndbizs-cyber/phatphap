    - id: 27
      title: Chuyện kể của cảnh sát pháp y - Kết cuộc bi thảm của giám đốc Triệu
      summary: 'Nhân vật & Hoàn cảnh: Kết cuộc bi thảm của giám đốc Triệu, một doanh
        nhân quyền thế cậy tiền của ức hiếp cấp dưới và bóc lột công nhân tàn nhẫn.

        Hành vi tạo nghiệp: Gian lận trốn thuế, quỵt lương công nhân nghèo, dùng mưu
        mô bức hại đối thủ làm ăn phá sản để độc chiếm thị trường.

        Quả báo hiện tiền: Bị công an bắt giam truy tố, toàn bộ tài sản bị tịch thu;
        trong tù phát bệnh ung thư máu đau đớn chết trong sự phỉ nhổ của xã hội.

        Bài học & Chuyển hóa: Tiền tài phi nghĩa kiếm từ sự đau khổ của người khác
        chỉ đem lại quả báo ngục tù và tuyệt diệt; làm giàu phải có đạo đức và lòng
        nhân từ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660646?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
