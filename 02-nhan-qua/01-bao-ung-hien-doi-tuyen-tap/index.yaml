      read_label: 📖 Đọc sách
    - id: 17
      title: Trong chết được sống
      summary: |-
        Nhân vật & Hoàn cảnh: Cư sĩ họ Lưu tuy biết đạo nhưng do gia đình ngăn cấm nên chưa giữ giới ăn chay trường trọn vẹn, tín tâm tu học còn lung lay.
        Hành vi tạo nghiệp: Tham ái vị thịt thói quen đời thường, do dự không dứt khoát đoạn trừ sát sinh ăn mặn, phung phí thời gian quý báu của kiếp người.
        Quả báo hiện tiền: Cuối năm 2007 phát hiện khối u ác tính di căn đường ruột thời kỳ cuối, bác sĩ trả về bảo thích ăn gì cứ ăn vì sự sống chỉ còn đếm từng ngày.
        Bài học & Chuyển hóa: Đứng trước bờ vực cái chết, bà thức tỉnh tột cùng, đoạn dứt ăn mặn, chí thành lạy Phật sám hối và niệm Phật ngày đêm; kỳ tích xảy ra khối u biến mất, cứu sống mạng tàn trong gang tấc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660506?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-18
      read_label: 📖 Đọc sách
    - id: 18
      title: Hoàng Đình
      summary: |-
        Nhân vật & Hoàn cảnh: Cô bé Hoàng Đình chịu cảnh cha mẹ ly hôn từ nhỏ, bị mẹ kế bạo hành chửi mắng thậm tệ nên bỏ trốn về ở với mẹ ruột buôn bán thức ăn nhanh gà vịt quay.
        Hành vi tạo nghiệp: Quán ăn của người mẹ sát hại vô số gà vịt mỗi ngày tạo nghiệp sát sinh ngập trời; Hoàng Đình ỷ vào tiền tài buôn bán mà mặc sức hưởng thụ phung phí phúc báo.
        Quả báo hiện tiền: Phúc báu cạn kiệt, tai họa liên tiếp ập xuống gia đình, sức khỏe suy kiệt bế tắc, tâm hồn cô bé rơi vào hoảng loạn đau đớn cùng cực.
        Bài học & Chuyển hóa: Hưởng phúc chính là tiêu phúc, nghề sát sinh tuy giàu tạm bợ nhưng để lại hậu quả thảm khốc; cần mau chóng đóng cửa lò sát sinh, phát tâm ăn chay phóng sinh chuộc tội.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660507?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-19
      read_label: 📖 Đọc sách
    - id: 19
      title: Gặp hung hóa cát
      summary: |-
        Nhân vật & Hoàn cảnh: Tác giả một đêm mưa bão hạ tuần tháng 7/1998 phải lái xe đi trực ban trong cơn cuồng phong gió giật mù mịt đường phố.
        Hành vi tạo nghiệp: Nghiệp chướng nhiều đời tiềm ẩn có nguy cơ trổ ra những tai nạn bất ngờ trên đường giao thông hiểm trở giữa đêm giông bão.
        Quả báo hiện tiền: Vừa chạy xe đến khúc cua ngã tư thì lồng ngực bỗng đau nhói nghẹt thở bất thường khiến tác giả phải dừng xe lại ôm ngực kiểm tra.
        Bài học & Chuyển hóa: Nhờ thói quen vừa đi vừa liên tục niệm "Nam Mô Quán Thế Âm Bồ Tát", việc dừng xe do nghẹt thở đã giúp tác giả tránh được cây cổ thụ bật gốc đè bẹp ngay phía trước; Bồ Tát che chở người chí tâm niệm danh hiệu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660508?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-20
      read_label: 📖 Đọc sách
    - id: 20
      title: Thiện thần hộ người trì giới
      summary: |-
        Nhân vật & Hoàn cảnh: Dì Trần 72 tuổi là một Phật tử thuần thành, trước đây mắc đủ thứ bệnh tuổi già đau đớn quanh năm lo âu sợ chết, sau khi đọc sách BUHD đã phát tâm ăn chay trì ngũ giới.
        Hành vi tạo nghiệp: Thói quen ăn mặn tạo nghiệp vô minh trước khi biết đạo khiến thân thể suy nhược gánh chịu bệnh tật tuổi già.
        Quả báo hiện tiền: Một buổi chiều đi dạo công viên cùng cháu gái, bất ngờ bị một người đàn ông đi xe đạp tông cực mạnh từ phía sau ngay khúc quanh.
        Bài học & Chuyển hóa: Nhờ công đức nghiêm trì ngũ giới được 25 vị thiện thần theo hộ trì, chiếc xe đạp vừa đụng phải dì liền dội ngược bắn xa 10 mét văng xuống hồ còn dì Trần hoàn toàn vô sự không một vết trầy; chứng minh lời Phật dạy trì giới được thiện thần che chở.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660509?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-20
      read_label: 📖 Đọc sách
    - id: 21
      title: Bệnh của ba tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Người cha của tác giả mắc bệnh đau bao tử kinh niên suốt nhiều năm, một ngày đông lạnh nôn mửa phun ra lượng máu tươi xối xả như núi lửa phun trào phải cấp cứu nguy kịch.
        Hành vi tạo nghiệp: Cả đời thích ăn đồ tươi sống, sát sinh nhậu nhẹt tiếp khách và tạo nhiều khẩu nghiệp bất thiện khiến tỳ vị ứ huyết kết oán sâu nặng.
        Quả báo hiện tiền: Xuất huyết bao tử cấp tính dữ dội, mạch đập yếu ớt hôn mê trên bàn cấp cứu bệnh viện, tính mạng ngàn cân treo sợi tóc.
        Bài học & Chuyển hóa: Tác giả quỳ bên giường bệnh chí thành trì tụng thần chú Chuẩn Đề và Kinh Địa Tạng hồi hướng oan gia trái chủ của cha; kỳ tích hiển linh máu ngừng chảy tức thì, hồi phục bình an xuất viện.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660510?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-21
      read_label: 📖 Đọc sách
    - id: 22
      title: Không nên ham cầu thần thông
      summary: |-
        Nhân vật & Hoàn cảnh: Cư sĩ trẻ tuổi tên Du trong lúc ngồi thiền tụng kinh thường nghe thấy những âm thanh lạ bên tai mách bảo về tương lai và tự xưng danh tánh.
        Hành vi tạo nghiệp: Tâm hiếu kỳ ham cầu thần thông dị năng, khởi tâm đắc ý dính mắc vào huyễn cảnh ma sự thay vì an trú trong định tĩnh chánh niệm.
        Quả báo hiện tiền: Bị ngũ ấm ma xâm nhập quấy nhiễu 24/24 giờ, thần trí hoảng loạn mất ngủ phát điên, nửa đêm gào thét cầu cứu vì bị các giọng nói vô hình bức bách khủng bố.
        Bài học & Chuyển hóa: Lời cảnh tỉnh sâu sắc y cứ Kinh Lăng Nghiêm về 50 hiện tượng ngũ ấm ma; người tu thiền định phải xả bỏ tâm tham thần thông, lấy giới luật và chánh tri kiến làm kim chỉ nam.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660511?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
