    - id: 18
      title: Hơn Ba Trăm Mạng
      summary: |-
        Nhân vật & Hoàn cảnh: Một chủ trang trại chăn nuôi gia cầm quy mô lớn, trong đợt dịch cúm bùng phát vì sợ tổn thất tiền bạc đã nhẫn tâm chôn sống hơn ba trăm mạng gà vịt.
        Hành vi tạo nghiệp: Đào hố sâu đổ hàng trăm con gà vịt còn sống nhảy loi nhoi xuống hố rồi xúc đất lấp kín, dửng dưng trước tiếng kêu la thảm thiết ngạt thở của muôn ngàn sinh linh.
        Quả báo hiện tiền: Chỉ ít lâu sau toàn thân ông nổi mụn nhọt lở loét ngứa ngáy dữ dội, ban đêm nghe tiếng mỏ gà vịt mổ xé thịt da đau buốt, thuốc men chữa trị suốt nhiều năm không bớt.
        Bài học & Chuyển hóa: Sát hại chôn sống sinh linh ôm hận thù thấu xương; ông hoảng sợ lập đàn cầu siêu sám hối tội lỗi, dốc hết tài sản phóng sinh chuộc mạng và phát nguyện ăn chay trường.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660555?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
