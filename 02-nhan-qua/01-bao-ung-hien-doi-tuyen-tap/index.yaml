      read_label: 📖 Đọc sách
    - id: 8
      title: Phá thai là tội nặng
      summary: |-
        Nhân vật & Hoàn cảnh: Cô Kim dung mạo thanh tú nhưng nét mặt u tối, thân hình tiều tụy khổ đau tìm đến phòng khám cầu cứu sự trợ giúp.
        Hành vi tạo nghiệp: Trẻ người non dạ nạo phá thai nhiều lần, tước đoạt quyền sống thiêng liêng của chính cốt nhục giọt máu do mình hoài thai.
        Quả báo hiện tiền: Vong thai oán hận bám riết không rời, thân thể cô mắc bệnh phụ khoa hành hạ đau đớn, tinh thần trầm cảm bấn loạn, hạnh phúc hôn nhân đứng bên bờ vực tan vỡ.
        Bài học & Chuyển hóa: Thức tỉnh trước tội ác sát sinh cốt nhục; cô Kim phát tâm sám hối tội lỗi, phóng sinh chuộc mạng và chí thành tụng Kinh Địa Tạng hồi hướng cho thai nhi được siêu thoát.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660497?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
