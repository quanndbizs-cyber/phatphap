    - id: 34
      title: Không in sách tà được thiện báo
      summary: 'Nhân vật & Hoàn cảnh: Người chủ một xưởng in ấn từ chối hợp đồng béo
        bở in ấn các loại sách báo đồi trụy và tranh ảnh kích dục độc hại.

        Hành vi tạo nghiệp: Thà chịu thiệt thòi kinh tế trước mắt chứ kiên quyết không
        tiếp tay truyền bá văn hóa phẩm độc hại làm hư hỏng tâm trí thanh thiếu niên.

        Quả báo hiện tiền: Nhờ giữ gìn chánh mạng và đạo đức nghề nghiệp, công việc
        làm ăn sau đó phát đạt vượt bậc, ký được nhiều hợp đồng lớn lương thiện.

        Bài học & Chuyển hóa: Không in sách tà được thiện báo vô lượng; con cháu đỗ
        đạt thành tài, gia đình nhiều đời hiển vinh nhờ tích lũy đại âm đức che chở
        hậu thế.'
