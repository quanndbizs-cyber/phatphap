  tap2_stories:
    items:
    - id: 1
      title: Ba Mỹ Nhân
      summary: 'Nhân vật & Hoàn cảnh: Vợ chồng giáo sư Quan thuộc tầng lớp thượng
        lưu trí thức giàu sang, sinh được ba cô con gái tuổi 25, 23, 20 đẹp kiều diễm
        như tiên nữ nhưng cả ba đều bị câm bẩm sinh, không chàng trai nào dám cầu
        hôn.

        Hành vi tạo nghiệp: Hai mươi lăm năm trước khi đi du lịch chùa ở Thái Lan,
        xe hơi sang trọng bị trầy xước, ông tức giận xông tới đánh đập tàn bạo một
        đứa trẻ ăn xin câm vô tội, đạp mạnh vào ngực khiến nó hộc máu tươi và tàn
        phế suốt đời.

        Quả báo hiện tiền: Vợ ông lần lượt sinh ra ba đứa con gái đều bị câm như hình
        ảnh đứa bé câm hộc máu năm xưa; gia đình sống trong đau khổ dằn vặt vô phương
        cứu chữa.

        Bài học & Chuyển hóa: Nghe vị cao tăng thuyết giảng lý nhân quả, giáo sư Quan
        kinh hoàng nhớ lại cú đá ác nghiệt năm xưa, hiểu rõ lưới trời lồng lộng; hai
        vợ chồng chí thành quỳ trước Phật sám hối, dốc lòng làm lành tích đức.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660416?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-1
      read_label: 📖 Đọc sách
    - id: 2
      title: Nước Lèo Trứ Danh
      summary: 'Nhân vật & Hoàn cảnh: Quán hủ tiếu nức tiếng ở miền bắc Thái Lan mỗi
        ngày bán hàng trăm tô, thu lợi nhuận kết xù nhờ bí quyết nồi nước lèo thơm
        ngon ngọt nước gia truyền.

        Hành vi tạo nghiệp: Bí quyết nấu nước lèo là ninh hầm xương thịt và các loại
        động vật tươi sống với số lượng khổng lồ qua nhiều năm tháng, tước đoạt sinh
        mạng của muôn vàn sinh linh.

        Quả báo hiện tiền: Người chủ quán mắc phải chứng bệnh lạ vô phương cứu chữa:
        khắp thân thể lở loét rỉ nước vàng hôi thối như xác chết phân hủy, đau đớn
        bỏng rát ngày đêm gào thét như đang bị dìm trong nồi nước sôi.

        Bài học & Chuyển hóa: Của cải làm giàu từ nghề sát sinh nhuốm đầy máu tanh
        chẳng thể đem lại an lạc; người chủ chết trong đau đớn tột cùng là lời cảnh
        tỉnh đanh thép cho những ai mưu sinh bằng việc tàn hại sinh vật.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660417?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-2
      read_label: 📖 Đọc sách
    - id: 3
      title: Nguyên Nhân Đáng Sợ
      summary: 'Nhân vật & Hoàn cảnh: Bác sĩ trẻ Trương Vĩ Lục tiền đồ xán lạn, sau
        khi kết hôn bỗng nhiên phát hiện cơ thể biến đổi dị tật, mất hoàn toàn khả
        năng sinh dục và biến thành người bán nam bán nữ, đau đớn nhảy lầu tự sát.

        Hành vi tạo nghiệp: Điều tra cội nguồn nhân quả hé lộ: ông nội và cha của
        anh suốt mấy mươi năm chuyên làm nghề thiến heo, thiến gà sống để kiếm tiền,
        hủy hoại bộ phận sinh dục của muôn vạn con vật.

        Quả báo hiện tiền: Ác nghiệp thiến hoạn động vật tích tụ qua nhiều đời đã
        trút xuống người con cháu đích tôn độc nhất, khiến gia đình họ Trương tuyệt
        tự tuyệt tôn trong bi kịch thảm thương.

        Bài học & Chuyển hóa: Nghề nghiệp sát hại hoặc làm thương tổn thân thể chúng
        sinh đều chiêu cảm quả báo tương ứng không sai chạy mảy may, di họa khôn lường
        đến con cháu đời sau.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660418?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-3
      read_label: 📖 Đọc sách
    - id: 4
      title: Đám Tang Chó
      summary: 'Nhân vật & Hoàn cảnh: Một gia đình tổ chức tang lễ hết sức trang nghiêm,
        chu đáo cho một chú chó cưng trung nghĩa đã trung thành gắn bó suốt nhiều
        năm.

        Hành vi tạo nghiệp: Đối chiếu giữa lòng trung thành xả thân bảo vệ chủ của
        loài chó với thói vong ân bội nghĩa, phản trắc của nhiều con người trong xã
        hội kim tiền.

        Quả báo hiện tiền: Kẻ phản bạn lừa thầy, sống phụ bạc ân tình đều chiêu cảm
        ác báo thân bại danh liệt, bị người khinh bỉ và đọa lạc vào ác đạo.

        Bài học & Chuyển hóa: Câu chuyện thức tỉnh tình thương loài vật và Phật tính
        nơi muôn loài chúng sinh; làm người phải biết giữ gìn chữ tín và lòng tri
        ân sâu sắc, chớ sống thua loài súc vật có nghĩa.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660419?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-4
      read_label: 📖 Đọc sách
    - id: 5
      title: Người Ưa Câu Cá
      summary: 'Nhân vật & Hoàn cảnh: Một người đàn ông có thú vui đam mê câu cá suốt
        mấy mươi năm, tự hào với kỹ thuật giật cần và găm lưỡi câu sắc bén vào miệng
        cá.

        Hành vi tạo nghiệp: Dùng lưỡi câu sắt nhọn móc rách môi, thủng họng hàng ngàn
        con cá sống, biến nỗi đau đớn xé thịt của loài vật thành niềm vui tiêu khiển
        mỗi ngày.

        Quả báo hiện tiền: Cuối đời mắc bệnh ung thư vòm họng và ung thư môi, toàn
        bộ môi và hàm dưới bị lở loét hoại tử đục thủng từng lỗ to y như bị lưỡi câu
        xé toạc, không thể ăn uống chỉ có thể rên rỉ đau đớn.

        Bài học & Chuyển hóa: Cảnh tượng đau đớn trên giường bệnh tái hiện chân thực
        nỗi đau xé họng loài cá năm xưa; gieo nhân nào gặt quả nấy, tuyệt đối không
        nên lấy sát sinh làm thú vui tiêu khiển.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660420?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-5
      read_label: 📖 Đọc sách
    - id: 6
      title: Thức Ngon Đặc Chế
      summary: 'Nhân vật & Hoàn cảnh: Chủ quán ăn đặc sản nghĩ ra những món ăn man
        rợ để chiều chuộng thú ẩm thực tàn ác của thực khách nhà giàu nhằm thu lợi
        nhuận cao.

        Hành vi tạo nghiệp: Khóa chặt đầu khỉ sống rồi dùng dao phạt ngang hộp sọ
        ăn óc khỉ tại bàn; nướng rùa sống trên chảo gang đỏ lửa để rùa uống cạn gia
        vị cay nồng rồi quằn quại chết từ từ.

        Quả báo hiện tiền: Quán ăn bốc cháy dữ dội trong đêm, người chủ kẹt trong
        phòng kín bị lửa thiêu cháy đen thui hệt như cảnh rùa trên chảo lửa, đầu bị
        thanh xà gồ rớt trúng vỡ toác như cách ông từng phạt đầu khỉ.

        Bài học & Chuyển hóa: Quả báo hiện đời rùng rợn giáng xuống kẻ thủ ác; miếng
        ăn tàn nhẫn lấy đi sinh mạng của chúng sinh trong đau đớn ắt phải đền mạng
        bằng chính mạng sống của mình.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660421?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-6
      read_label: 📖 Đọc sách
    - id: 7
      title: Người Chân Voi
      summary: 'Nhân vật & Hoàn cảnh: Một phụ nữ giàu có mắc phải chứng bệnh phù chân
        voi kỳ quái: hai chân sưng phồng thô ráp, nứt nẻ chảy nước vàng tanh tưởi,
        nặng nề không thể bước đi.

        Hành vi tạo nghiệp: Thuở nhỏ và thời trẻ có thói quen dẫm đạp tàn nhẫn lên
        ốc sên, cóc nhái trong vườn cho nát bét để làm trò vui, lại thường sai gia
        nhân rắc vôi bột đốt chân các loài thú nhỏ.

        Quả báo hiện tiền: Đôi chân bà biến dạng to lớn sần sùi hệt như chân voi,
        đau đớn buốt nhức từng ngày không thuốc men nào chữa lành, phải chịu sự cô
        độc hành hạ thể xác.

        Bài học & Chuyển hóa: Thân thể con người là tấm gương phản chiếu nghiệp lực;
        làm tổn thương bàn chân và sinh mạng của muôn loài ắt phải nhận lấy sự hủy
        hoại trên chính đôi chân mình.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660422?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-7
      read_label: 📖 Đọc sách
    - id: 8
      title: Bán Rắn Mối
      summary: 'Nhân vật & Hoàn cảnh: Kẻ chuyên săn bắt, thu mua và buôn bán rắn mối
        sống số lượng lớn cho các nhà hàng quán nhậu ngâm rượu thuốc bổ.

        Hành vi tạo nghiệp: Để rắn mối không thể chạy thoát, anh ta dùng kìm bẻ gãy
        từng khớp chân và dùng dây thép sắc nhọn xâu xuyên qua mắt và miệng chúng,
        phơi nắng hành hạ dã man.

        Quả báo hiện tiền: Anh ta gặp tai nạn giao thông kinh hoàng, cẳng chân bị
        bánh xe nghiền nát gãy vụn, mắt bị mảnh kính đâm mù lòa, nằm liệt giường rên
        xiết suốt nhiều năm trong cảnh túng quẫn bần hàn.

        Bài học & Chuyển hóa: Hành hạ thân xác chúng sinh ra sao thì quả báo giáng
        xuống bản thân y hệt như vậy; hãy mau chóng từ bỏ nghề nghiệp tàn ác để giữ
        lấy phúc mạng cho mình.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660423?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-8
      read_label: 📖 Đọc sách
    - id: 9
      title: Cá “Câu” Người
      summary: 'Nhân vật & Hoàn cảnh: Gia đình làm nghề chài lưới và câu cá chuyên
        nghiệp nhiều đời ven sông lớn, nổi tiếng sát cá và có thù đoạn đánh bắt tàn
        nhẫn.

        Hành vi tạo nghiệp: Dùng xiên sắt và lưỡi câu chùm đâm thủng yết hầu cá sống,
        để cá giẫy giụa đau đớn cho đến chết rồi mới mang ra chợ bán kiếm lời.

        Quả báo hiện tiền: Trong một lần lặn sông gỡ lưỡi câu mắc kẹt, dây câu bị
        một con cá lớn giãy mạnh quấn chặt nhiều vòng quanh cổ, lưỡi câu sắc nhọn
        đâm xuyên qua cổ họng kéo người cha chết chìm dưới đáy nước.

        Bài học & Chuyển hóa: ''Người móc cá, cá móc người'' – quy luật nhân quả tuần
        hoàn báo ứng đích đáng và công bằng, không ai có thể thoát khỏi nghiệp sát
        của chính mình.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660424?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-9
      read_label: 📖 Đọc sách
    - id: 10
      title: Bệnh Của Văn Lai
      summary: 'Nhân vật & Hoàn cảnh: Anh Văn Lai 43 tuổi làm nghề nông, vì tin theo
        lời đồn ăn ba ba bổ dương trừ phong thấp nên suốt 20 năm liên tục giết thịt
        ăn ba ba sống.

        Hành vi tạo nghiệp: Mua được con ba ba khổng lồ nặng hơn mười ký, anh nghĩ
        ra cách tàn ác: mỗi ngày dùng dao xẻo một miếng thịt trên mình ba ba còn sống
        để xào ớt ăn dần, rồi quẹt vôi cầm máu cho nó sống tiếp nửa tháng.

        Quả báo hiện tiền: Anh bị ba ba cắn vào ngón tay và ngón chân, độc tố ăn sâu
        vào tủy xương khiến bác sĩ phải phẫu thuật cưa bỏ từng đốt ngón, rồi cưa dần
        bàn tay và bàn chân qua 5 lần mổ xẻ kinh hoàng.

        Bài học & Chuyển hóa: Nỗi đau bị cắt xẻo từng phần thân thể khi còn sống nay
        chính bản thân phải nếm trải dưới lưỡi dao phẫu thuật; sát sinh tàn độc ắt
        rước lấy quả báo tàn phế hiện tiền.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660425?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-10
      read_label: 📖 Đọc sách
    - id: 11
      title: Tiểu Thư Khỉ
      summary: 'Nhân vật & Hoàn cảnh: Cô gái có biệt danh ''Tiểu Thư Khỉ'', tuy gương
        mặt xinh đẹp nhưng tính khí và cử chỉ lại mang đầy tập tính của loài vượn
        khỉ.

        Hành vi tạo nghiệp: Mẹ cô thời trẻ từng giúp cha mổ bụng một con khỉ mẹ đang
        mang thai để lấy con nấu cao bồi bổ, nhẫn tâm nhìn khỉ mẹ quằn quại ôm con
        chết trong đau đớn.

        Quả báo hiện tiền: Người con gái sinh ra toàn thân mọc lông xám dày đặc, các
        ngón tay cong quắp và luôn có thói quen nhảy nhót, cào cấu phát ra tiếng kêu
        như loài khỉ, khiến cha mẹ xấu hổ đau lòng.

        Bài học & Chuyển hóa: Oan hồn loài khỉ mẹ nương vào thai nhi để đòi nợ nghiệp
        chướng; cảnh báo sâu sắc về việc sát hại động vật mang thai đem lại quả báo
        dị tật cho con cháu đời sau.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660426?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-11
      read_label: 📖 Đọc sách
    - id: 12
      title: Trộm Công Giảm Liệu
      summary: 'Nhân vật & Hoàn cảnh: Nhà thầu xây dựng vì lòng tham lợi nhuận đã
        gian lận, rút bớt sắt thép và pha trộn xi măng kém chất lượng khi thi công
        các công trình trường học và bệnh viện.

        Hành vi tạo nghiệp: Bỏ túi hàng triệu đồng tiền bẩn bất chính trên sự an nguy
        tính mạng của hàng ngàn người dân và trẻ nhỏ vô tội.

        Quả báo hiện tiền: Căn biệt thự sang trọng của chính ông ta bất ngờ bị sụp
        đổ trong một trận giông lốc; gạch đá đổ sập đè gãy hai chân ông và làm chết
        người con trai duy nhất mà ông yêu quý nhất trên đời.

        Bài học & Chuyển hóa: Của phi nghĩa làm từ sự gian dối rút ruột công trình
        không những chẳng giữ được mà còn rước lấy thảm họa nhà tan cửa nát, mất đi
        người thân ruột thịt.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660427?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-12
      read_label: 📖 Đọc sách
    - id: 13
      title: Người Chồng Tài Hoa
      summary: 'Nhân vật & Hoàn cảnh: Một nghệ sĩ tài hoa, phong nhã và có tài ăn
        nói nhưng tâm tánh phóng túng tà dâm, xem thường đạo đức luân thường lừa gạt
        nhiều phụ nữ.

        Hành vi tạo nghiệp: Lợi dụng tài hoa và lời đường mật lừa gạt tình cảm của
        nhiều cô gái trong trắng, làm tan vỡ gia đình người khác rồi rũ bỏ trách nhiệm
        khi họ mang thai.

        Quả báo hiện tiền: Cuối đời mắc bệnh ung thư hạ bộ thối rữa đau đớn, bị mọi
        người xa lánh ghê tởm, sống cô độc trong viện dưỡng lão không một người thân
        chăm sóc, chết trong tủi nhục bần hàn.

        Bài học & Chuyển hóa: Tà dâm phá hoại gia can người khác là tội nặng bậc nhất;
        tài hoa bạc phận cũng bởi không có đức hạnh giữ gìn, gieo cay đắng ắt gặt
        lấy bi kịch cô độc.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660428?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-13
      read_label: 📖 Đọc sách
    - id: 14
      title: Pháp Quan Kỳ Án
      summary: 'Nhân vật & Hoàn cảnh: Một vị thẩm phán nắm giữ quyền cân đo công lý
        nhưng tham lam nhận tiền hối lộ, bẻ cong pháp luật xử ép người vô tội chịu
        án oan sai.

        Hành vi tạo nghiệp: Vì túi tiền bất chính mà đẩy người lương thiện vào cảnh
        tù đày chết oan trong ngục tối, để mặc kẻ thủ ác thực sự nhởn nhơ ngoài vòng
        pháp luật.

        Quả báo hiện tiền: Sau khi về hưu thường xuyên thấy oan hồn hiện về đòi mạng
        trong đêm, tâm thần hoảng loạn phát điên, tự tay rạch ngực thú tội trước công
        chúng rồi đập đầu tự sát.

        Bài học & Chuyển hóa: Cán cân công lý của luật trời không bao giờ thiên vị;
        làm nghề xét xử mà bẻ cong sự thật vì tiền bạc ắt phải chịu sự trừng phạt
        thảm khốc của tòa án lương tâm và âm luật.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660429?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-14
      read_label: 📖 Đọc sách
    - id: 15
      title: Những Kẻ Buôn Người
      summary: 'Nhân vật & Hoàn cảnh: Đường dây buôn người tàn nhẫn bắt cóc phụ nữ
        và trẻ em đem bán qua biên giới vào các động mại dâm và hầm mỏ bóc lột, phá
        nát vô số gia đình êm ấm.

        Hành vi tạo nghiệp: Xem thân xác và mạng sống con người như món hàng trao
        đổi kiếm tiền, gây ra cảnh chia lìa cốt nhục đẫm nước mắt cho biết bao người
        mẹ mất con, chồng mất vợ.

        Quả báo hiện tiền: Kẻ cầm đầu sinh con ra đều bị dị tật ngớ ngẩn, bản thân
        bị đồng bọn phản trắc cướp sạch tài sản, bị bắt giam lĩnh án tử hình; cả dòng
        họ lưu lạc ăn mày tủi nhục.

        Bài học & Chuyển hóa: Tội ác buôn bán đồng loại là ác nghiệp tày trời; tiền
        tài kiếm được từ xương máu tha nhân sẽ biến thành ngọn lửa thiêu rụi toàn
        bộ phúc lộc ba đời.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660430?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-15
      read_label: 📖 Đọc sách
    - id: 16
      title: Quán Ngon Cao Cấp
      summary: 'Nhân vật & Hoàn cảnh: Nhà hàng ẩm thực cao cấp chuyên phục vụ các
        món thú rừng quý hiếm tươi sống, quảng cáo giết mổ động vật tại chỗ để chứng
        minh độ tươi ngon.

        Hành vi tạo nghiệp: Nhẫn tâm dùng búa đập đầu hươu nai sống, mổ bụng chim
        muông khi chúng còn giẫy giụa thở dốc trước mắt thực khách để phô trương đẳng
        cấp ẩm thực.

        Quả báo hiện tiền: Một vụ nổ bình gas kinh hoàng tại gian bếp đã thiêu rụi
        toàn bộ nhà hàng trong biển lửa; chủ quán và đầu bếp bị bỏng nặng toàn thân
        biến dạng, tán gia bại sản.

        Bài học & Chuyển hóa: Của cải xây dựng trên sự tàn sát sinh linh chẳng bao
        giờ bền vững; ngọn lửa sân hận của muôn loài bị giết thịt sẽ trở thành ngọn
        lửa thiêu rụi sự nghiệp kẻ gieo nhân.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660431?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-16
      read_label: 📖 Đọc sách
    - id: 17
      title: Đi Câu Bị Cảm Động
      summary: 'Nhân vật & Hoàn cảnh: Một người đàn ông có thói quen câu cá giải trí,
        trong một chuyến đi câu bên hồ lớn đã móc trúng một con cá chép bụng to sắp
        đẻ.

        Hành vi tạo nghiệp: Thường xuyên dùng mồi câu lừa cá cắn câu, thỏa mãn thú
        vui săn bắt nhưng chưa từng nghĩ đến nỗi đau đớn và tình mẫu tử của loài thủy
        tộc.

        Quả báo hiện tiền: Kéo con cá lên bờ, ông bàng hoàng thấy hai mắt cá ứa lệ,
        miệng cử động van lơn như khẩn cầu tha mạng cho bầy con thơ đang chờ chào
        đời trong bụng.

        Bài học & Chuyển hóa: Trực giác từ bi bừng tỉnh, ông vội vã tháo lưỡi câu
        thả cá về hồ, bẻ gãy cần câu và phát nguyện từ bỏ vĩnh viễn việc sát sinh,
        chuyển sang bảo vệ sinh thái và phóng sinh cứu vật.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660432?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-17
      read_label: 📖 Đọc sách
    - id: 18
      title: Chuyện Nơi Lâm Trường
      summary: 'Nhân vật & Hoàn cảnh: Nhóm công nhân khai thác gỗ tại vùng rừng sâu
        lâm trường hẻo lánh, thường xuyên đặt bẫy săn bắn thú rừng hoang dã làm mồi
        nhậu bồi dưỡng.

        Hành vi tạo nghiệp: Dùng bẫy chông sắt và súng săn tàn sát gấu ngựa, lợn rừng,
        khỉ vượn vô tội, chặt phá cây đại thụ cổ thụ ngàn năm không chút kiêng dè.

        Quả báo hiện tiền: Trong đêm mưa bão kinh hoàng, một cây cổ thụ ngàn năm bất
        ngờ gãy đổ đè trúng lều trại khiến hai người tử nạn tại chỗ, những người còn
        lại bị thương tật tàn phế suốt đời.

        Bài học & Chuyển hóa: Rừng thiêng nước độc đều có linh khí và thần linh bảo
        hộ; tàn phá thiên nhiên và sát hại sinh linh nơi rừng thẳm ắt chiêu cảm tai
        ương hủy diệt bất ngờ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660433?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-18
      read_label: 📖 Đọc sách
    - id: 19
      title: Khi Máy Mổ Hoàn Tất
      summary: 'Nhân vật & Hoàn cảnh: Một kỹ sư cơ khí tài ba dày công thiết kế và
        chế tạo dây chuyền máy móc giết mổ gia súc tự động hóa quy mô lớn, công suất
        hàng ngàn con mỗi ngày.

        Hành vi tạo nghiệp: Đem trí tuệ và tài năng kỹ thuật phục vụ cho việc tàn
        sát sinh mạng hàng loạt, biến cái chết của muôn loài thành guồng máy công
        nghiệp lạnh lùng vô cảm.

        Quả báo hiện tiền: Đúng ngày chạy thử nghiệm cỗ máy, do sơ suất vạt áo bị
        cuốn vào bánh răng lưỡi cưa tự động, chính ông bị cỗ máy do mình sáng chế
        cưa đứt thân thể chết thảm tại chỗ.

        Bài học & Chuyển hóa: Cỗ máy giết chóc đã lấy mạng chính người tạo ra nó;
        bài học xương máu cảnh tỉnh con người chớ dùng trí tuệ phát minh công cụ phục
        vụ cho sự hủy diệt sinh mạng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660435?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-19
      read_label: 📖 Đọc sách
    - id: 20
      title: Cận Tử Nghiệp Đáng Sợ
      summary: 'Nhân vật & Hoàn cảnh: Một đồ tể chuyên nghề mổ heo mổ bò suốt cả cuộc
        đời, đến tuổi già lâm bệnh nặng nằm liệt trên giường chờ phút lâm chung.

        Hành vi tạo nghiệp: Hàng vạn sinh mạng heo bò đã ngã gục dưới lưỡi dao thọc
        huyết sắc lạnh của ông suốt mấy mươi năm mưu sinh kiếm sống.

        Quả báo hiện tiền: Giây phút cận tử nghiệp hiện về, ông hai mắt trợn trừng,
        miệng rống lên từng hồi eng éc y hệt tiếng heo bị chọc tiết, tay chân co giật
        quào cấu kinh hoàng trước mắt con cháu.

        Bài học & Chuyển hóa: Nghiệp lực huân tập cả đời sẽ trổ hiện chân thực lúc
        lâm chung; sát sinh tạo nghiệp bao nhiêu thì giây phút ra đi đau đớn bấy nhiêu,
        không ai có thể gánh thay.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660434?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-20
      read_label: 📖 Đọc sách
    - id: 21
      title: Thịt Rùa Ngon
      summary: 'Nhân vật & Hoàn cảnh: Một nhóm thực khách sành ăn rủ nhau đến quán
        đặc sản thưởng thức món lẩu rùa sống bổ dưỡng trứ danh để tẩm bổ sinh lực.

        Hành vi tạo nghiệp: Thả từng con rùa còn sống nguyên vào nồi nước lẩu đang
        sôi sùng sục đậy kín vung, khoái trá nhìn rùa quằn quại cào xước nắp nồi trong
        đau đớn tột cùng rồi mới ăn.

        Quả báo hiện tiền: Vài ngày sau cả nhóm đi chung xe hơi thì xe bất ngờ bốc
        cháy dữ dội trên đường cao tốc; các cửa xe bị kẹt cứng khiến tất cả bị thiêu
        cháy quằn quại trong xe y hệt cảnh rùa trong nồi nước sôi.

        Bài học & Chuyển hóa: Miếng ăn khoái khẩu trong chốc lát đổi lấy cái chết
        thảm khốc trong biển lửa; sự tàn nhẫn đối với loài vật sẽ quay trở lại trừng
        phạt chính con người với cấp độ gấp trăm lần.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660436?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-21
      read_label: 📖 Đọc sách
    - id: 22
      title: Tình Thương Con Của Khỉ Lông Vàng
      summary: 'Nhân vật & Hoàn cảnh: Một người thợ săn thiện xạ đi săn trong rừng
        sâu, phát hiện một con khỉ mẹ lông vàng đang ôm khỉ con trên cành cây cao.

        Hành vi tạo nghiệp: Lạnh lùng giương cung bắn mũi tên độc xuyên qua tim khỉ
        mẹ để cướp khỉ con mang về bán lấy tiền.

        Quả báo hiện tiền: Khỉ mẹ trúng tên độc nhưng gắng gượng chút tàn lực cuối
        cùng ôm chặt con thơ cho bú nốt giọt sữa rồi mới rơi xuống đất; khi mổ bụng
        phát hiện ruột non của nó đã đứt ra từng đoạn vì đau đớn xót con.

        Bài học & Chuyển hóa: Tình mẫu tử thiêng liêng chấn động trời đất của loài
        vật khiến người thợ săn bật khóc kinh hãi, bẻ gãy cung tên sám hối và phát
        nguyện quy y cửa Phật suốt đời chuộc tội.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660437?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-22
      read_label: 📖 Đọc sách
    - id: 23
      title: Hứa Tiên Sinh
      summary: 'Nhân vật & Hoàn cảnh: Hứa tiên sinh là một thương gia buôn bán ngũ
        cốc giàu có nức tiếng nhưng tâm địa gian xảo, tham lam keo kiệt không ai bằng.

        Hành vi tạo nghiệp: Lợi dụng lúc thiên tai mất mùa gom hàng đầu cơ tích trữ
        rồi tăng giá cắt cổ, lại còn trộn thêm cát sạn và thóc lép vào gạo bán cho
        dân nghèo đói khổ kiếm lời bất chính.

        Quả báo hiện tiền: Về già con cháu hư hỏng cờ bạc phá sạch cơ nghiệp; bản
        thân ông mắc bệnh ung thư thực quản nghẹn nghẹt không nuốt nổi một giọt nước
        cháo, chết đói bên đống vàng bạc mục rỗng.

        Bài học & Chuyển hóa: Bóc lột người nghèo trong lúc hoạn nạn là tội ác tổn
        phước nặng nề nhất; của cải phi nghĩa đổi lấy cái chết nghẹn ngào đói khát
        là quy luật đào thải tất yếu của đạo trời.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660438?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-23
      read_label: 📖 Đọc sách
    - id: 24
      title: Ngọc Lan
      summary: 'Nhân vật & Hoàn cảnh: Cô gái trẻ xinh đẹp tên Ngọc Lan vì khao khát
        cuộc sống xa hoa giàu sang và giữ gìn vóc dáng làm người mẫu nên đã phá thai
        nhiều lần không chút thương tiếc.

        Hành vi tạo nghiệp: Tước đoạt quyền sống của những giọt máu ruột thịt của
        chính mình, coi rẻ sinh mạng hài nhi vô tội để chạy theo dục vọng và danh
        lợi phù phiếm.

        Quả báo hiện tiền: Nhan sắc tàn phai nhanh chóng, người tình phụ bạc ruồng
        bỏ; tử cung bị nhiễm trùng hoại tử phải phẫu thuật cắt bỏ toàn bộ, vĩnh viễn
        mất đi thiên chức làm mẹ thiêng liêng.

        Bài học & Chuyển hóa: Đêm đêm sống trong ám ảnh bởi tiếng khóc đòi mẹ của
        những vong thai; cô đau đớn thức tỉnh tìm về cửa Phật ăn năn sám hối, làm
        lễ cầu siêu chuộc lại lỗi lầm đẫm máu.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660439?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-24
      read_label: 📖 Đọc sách
    - id: 25
      title: Con Lừa
      summary: 'Nhân vật & Hoàn cảnh: Người đánh xe ngựa lừa tính tình hung tợn, thường
        xuyên dùng roi sắt và gậy gộc đánh đập con lừa già kéo xe đến tóe máu rách
        da.

        Hành vi tạo nghiệp: Ép con lừa già chở hàng quá tải giữa trưa nắng gắt mà
        không cho ăn uống nghỉ ngơi, đến khi con vật kiệt sức gục ngã chết thảm bên
        vệ đường vẫn thẳng tay quất roi.

        Quả báo hiện tiền: Nhiều năm sau người chủ sinh được một đứa con trai có thân
        hình gù vẹo, da dẻ chai sần thô ráp và tính tình ương bướng, suốt đời cha
        mẹ phải nai lưng làm lụng nuôi nấng trả nợ.

        Bài học & Chuyển hóa: Đối xử tàn bạo bạc đãi với súc vật có công phục vụ mình
        ắt sẽ chiêu cảm oan gia đầu thai làm con để đòi nợ nhọc nhằn; nhân quả đền
        trả công bằng không sai chạy.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660440?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-25
      read_label: 📖 Đọc sách
    - id: 26
      title: Công Chúa Thăng Hoa
      summary: 'Nhân vật & Hoàn cảnh: Câu chuyện nhân duyên luân hồi của một vị công
        chúa lá ngọc cành vàng thời xưa, sinh ra trong nhung lụa quyền quý tối cao
        nhưng tâm tánh kiêu kỳ ngạo mạn.

        Hành vi tạo nghiệp: Ỷ vào quyền thế coi thường kẻ hầu người hạ, tạo khẩu nghiệp
        nặng nề và đắm chìm trong thú vui xa hoa hưởng lạc lãng phí biết bao phước
        báo trời ban.

        Quả báo hiện tiền: Hết phước đọa lạc qua nhiều kiếp trầm luân khổ ải trong
        cõi trần, nếm trải nỗi đau tan nát sinh ly tử biệt và sự vô thường mong manh
        của danh lợi thế gian.

        Bài học & Chuyển hóa: Thấu tỏ biển khổ luân hồi không lối thoát, nàng phát
        đại nguyện quy y Tam Bảo, tinh tấn niệm Phật trì giới đoạn trừ tham ái, cầu
        sinh Tây Phương Tịnh Độ vĩnh viễn thăng hoa giải thoát.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660442?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-26
      read_label: 📖 Đọc sách
    - id: 27
      title: Chu Tú Hoa
      summary: 'Nhân vật & Hoàn cảnh: Vụ án ''Mượn xác hoàn hồn'' có thật chấn động
        toàn thế giới tại Đài Loan năm 1959, được các cơ quan y tế, truyền thông và
        chính quyền kiểm chứng xác thực 100%.

        Hành vi tạo nghiệp: Cô gái Chu Tú Hoa bị sóng đánh dạt vào bờ biển nhưng bị
        kẻ xấu cướp vàng và đẩy thuyền ra biển sâu dìm chết oan uổng; nhờ tâm niệm
        trong sáng và luôn niệm Phật nên linh hồn không tan.

        Quả báo hiện tiền: Bọn cướp biển sau đó đều phát điên chết thảm hoặc chịu
        án tử hình; linh hồn cô nương nhờ thiện nghiệp được thần linh che chở, sau
        mượn thân xác bà Ngô Lâm Cẩm Đôn đã chết để sống lại.

        Bài học & Chuyển hóa: Sau khi hoàn hồn bà sống đời ăn chay niệm Phật, làm
        việc thiện cứu người; sự kiện là bằng chứng hùng hồn chứng minh sự tồn tại
        bất diệt của thần thức và luật nhân quả luân hồi.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660441?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-27
      read_label: 📖 Đọc sách
  tap3_stories:
    items:
    - id: 1
      title: Loi noi dau
      summary: 'Nhân vật & Hoàn cảnh: Cư sĩ Quả Khanh cùng các đạo hữu ghi chép lại
        những câu chuyện nhân quả người thật việc thật được chứng kiến qua các buổi
        thuyết pháp khai thị của Hòa thượng Diệu Pháp.

        Hành vi tạo nghiệp: Chúng sinh đời mạt pháp mê mờ không tin nhân quả, phóng
        túng sát sinh, trộm cắp, tà dâm, vọng ngữ và tạo muôn vàn ác nghiệp khiến
        tai ương tật bệnh bủa vây.

        Quả báo hiện tiền: Bệnh nan y, gia đình tan nát, con cái bất hiếu, làm ăn
        thất bát và tâm thần bất an ngày đêm gặm nhấm nỗi đau khổ triền miên trong
        cõi hồng trần.

        Bài học & Chuyển hóa: Lời người dịch và tác giả tha thiết khuyên răn người
        đời lấy giới luật làm thầy, ăn chay sám hối, dứt ác tu thiện và niệm Phật
        cầu sinh Tịnh Độ để vĩnh viễn thoát ly sinh tử luân hồi.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660443?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-1
      read_label: 📖 Đọc sách
    - id: 2
      title: Tâm sự trùm du đãng
      summary: 'Nhân vật & Hoàn cảnh: Một trùm giang hồ khét tiếng xưng bá một vùng,
        quy tụ hàng chục đàn em đao búa hung hãn, coi thường luật pháp và luân thường
        đạo lý.

        Hành vi tạo nghiệp: Đâm thuê chém mướn, bảo kê sòng bạc, đập phá cướp bóc
        và nhẫn tâm đánh đập làm tàn phế nhiều người vô tội để tranh giành địa bàn
        làm ăn phi pháp.

        Quả báo hiện tiền: Bị đồng bọn phản trắc truy sát trong đêm mưa, người thân
        liên tiếp gặp nạn chết bất đắc kỳ hồ, bản thân mắc chứng bệnh đau nhức gân
        cốt toàn thân như bị dao chém róc thịt.

        Bài học & Chuyển hóa: Giữa ranh giới sinh tử được diện kiến Phật pháp, anh
        rơi lệ kinh hãi nhận ra tội đồ ngập trời, phát tâm quy y Tam Bảo, giải tán
        băng đảng, ăn chay trường sám hối chuộc lại lỗi xưa.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660444?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-2
      read_label: 📖 Đọc sách
    - id: 3
      title: Tâm sự Quý phu nhân
      summary: 'Nhân vật & Hoàn cảnh: Nữ cư sĩ Mã Kim Lộ (vợ của Lữ Sơn Kiệt), một
        phụ nữ giàu sang quyền quý sống trong nhung lụa nhưng gia đình luôn trên bờ
        vực tan vỡ, vợ chồng xung khắc bất hòa.

        Hành vi tạo nghiệp: Do nhiều đời kết ác duyên và tích tụ tâm sân hận, ngạo
        mạn ỷ vào tiền tài nhan sắc mà coi khinh người khác, ghen tuông mù quáng làm
        tổn thương tình nghĩa vợ chồng.

        Quả báo hiện tiền: Chồng sinh tật bồ bịch cờ bạc, con cái xa lánh, tổ ấm biến
        thành địa ngục trần gian; tâm trạng u uất trầm cảm đến mức muốn tìm đến cái
        chết giải thoát.

        Bài học & Chuyển hóa: Nhờ hữu duyên bái kiến Hòa thượng Diệu Pháp chỉ rõ nhân
        duyên oán kết tiền kiếp, bà rơi lệ ăn năn, buông bỏ chấp trước, chuyên tâm
        lạy Phật tụng kinh; gia đình chuyển hóa nhiệm mầu, vợ chồng con cái đoàn viên
        hạnh phúc.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660445?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-3
      read_label: 📖 Đọc sách
    - id: 4
      title: Không nên mặc tình làm hại cây cỏ
      summary: 'Nhân vật & Hoàn cảnh: Nhóm công nhân và chủ thầu thi công khu đô thị
        mới, tự tiện đốn hạ và thiêu đốt các gốc cây cổ thụ ngàn năm trong khu rừng
        tự nhiên.

        Hành vi tạo nghiệp: Coi thường sinh mạng cây cối, không biết rằng các cây
        đại thụ cổ xưa đều có thần linh và chư hương linh quỷ thần nương ngụ trú xứ,
        thẳng tay cưa đứt phá nát nơi cư ngụ của họ.

        Quả báo hiện tiền: Người ra lệnh đốn cây bất ngờ mắc chứng đau đầu kinh niên
        thuốc men vô hiệu; máy ủi thi công liên tục lật nhào gây tai nạn thương vong
        cho công nhân.

        Bài học & Chuyển hóa: Vạn vật đều có linh tính nương tựa; trước khi chặt cây
        sửa đất phải thắp hương khấn nguyện báo trước ba ngày và tụng kinh hồi hướng,
        chớ nên mặc tình tàn phá cây cỏ thiên nhiên.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660447?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-4
      read_label: 📖 Đọc sách
    - id: 5
      title: Nước tràn Kim Sơn Tự
      summary: 'Nhân vật & Hoàn cảnh: Phân tích nhân quả sâu xa đằng sau câu chuyện
        truyền thuyết Bạch Xà dâng nước nhấn chìm Kim Sơn Tự để giành lại người tình
        Hứa Tiên.

        Hành vi tạo nghiệp: Vì lòng si mê ái dục và cơn giận ngút trời mà không tiếc
        dùng pháp thuật dâng sóng thần nhấn chìm tự viện, dìm chết hàng ngàn sinh
        mạng dân lành vô tội ven sông.

        Quả báo hiện tiền: Dù tu luyện ngàn năm vẫn phải chịu quả báo bị đè dưới tháp
        Lôi Phong chịu khổ, đọa lạc nhiều đời không thể giải thoát do nợ máu của ngàn
        vạn oan hồn.

        Bài học & Chuyển hóa: Ái dục và sân hận là cội nguồn của mọi khổ đau đọa lạc;
        người tu hành phải lấy trí tuệ bát nhã quán chiếu vô thường, chặt đứt sợi
        dây tình chấp mê muội.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660446?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-5
      read_label: 📖 Đọc sách
    - id: 6
      title: Bệnh tùng khẩu nhập
      summary: 'Nhân vật & Hoàn cảnh: Người mắc nhiều chứng bệnh nan y lở loét, ung
        thư dạ dày và đau nhức lục phủ ngũ tạng tìm đến Hòa thượng Diệu Pháp thỉnh
        giáo căn nguyên.

        Hành vi tạo nghiệp: Thói quen ăn tươi nuốt sống, ưa chuộng các món ăn mổ bụng
        moi gan động vật còn giẫy giụa, nuốt mật sống, ăn tủy sống và coi nhà bếp
        như chốn đồ tể hành hình chúng sinh.

        Quả báo hiện tiền: Độc tố oán hận của các sinh mạng bị giết thịt tích tụ trong
        lục phủ ngũ tạng, chuyển thành khối u ác tính và ung nhọt đau đớn như bị xé
        thịt cắn xé ngày đêm.

        Bài học & Chuyển hóa: Bệnh từ miệng vào, họa từ miệng ra; muốn thân thể bình
        an mạnh khỏe thì căn bản phải ăn chay niệm Phật, phát khởi lòng từ bi thương
        xót muôn loài chúng sinh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660448?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-6
      read_label: 📖 Đọc sách
    - id: 7
      title: Phí phạm của trời tội rất lớn
      summary: 'Nhân vật & Hoàn cảnh: Một gia đình buôn bán khá giả nhưng có thói
        quen ăn uống xa xỉ, thường xuyên nấu nướng thừa thãi rồi vứt bỏ thức ăn, cơm
        thừa canh cặn vào sọt rác không thương tiếc.

        Hành vi tạo nghiệp: Phí phạm hạt ngọc của trời ban, xem thường công sức người
        nông dân một nắng hai sương; tích tụ nghiệp tiêu xài hoang phí qua nhiều năm
        tháng.

        Quả báo hiện tiền: Làm ăn sa sút thất bát bất ngờ, tài sản đội nón ra đi;
        đời sau sinh ra con cái ốm yếu gầy mòn, luôn mắc chứng biếng ăn, thiếu thốn
        đói khát bần hàn.

        Bài học & Chuyển hóa: Một hạt cơm, một giọt nước đều chứa đựng phước báo trời
        ban; người biết tiết kiệm tri túc mới giữ gìn được phúc đức dài lâu cho gia
        đình và dòng họ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660450?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-7
      read_label: 📖 Đọc sách
    - id: 8
      title: Dùng cho hết
      summary: 'Nhân vật & Hoàn cảnh: Lời dạy quý báu của Hòa thượng Diệu Pháp cho
        các Phật tử về việc quý trọng và tận dụng triệt để mọi vật dụng sinh hoạt
        hàng ngày trong tự viện và gia đình.

        Hành vi tạo nghiệp: Thói quen chê bai đồ cũ, vứt bỏ những vật phẩm còn dùng
        được, xài xể lãng phí đồ đạc của công và tài vật của Tam Bảo cúng dường.

        Quả báo hiện tiền: Tổn hao phước báu vô hình; đến khi gặp hoạn nạn thì lâm
        vào cảnh cùng quẫn ngặt nghèo không ai giúp đỡ, phước mỏng nghiệp dày.

        Bài học & Chuyển hóa: Học hạnh cần kiệm của chư Phật và chư Tổ; một mẩu giấy,
        một giọt nước thừa cũng dùng cho hết, vun bồi phước điền thanh tịnh cho đời
        sau.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660449?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-8
      read_label: 📖 Đọc sách
    - id: 9
      title: Thân khuyển mã
      summary: 'Nhân vật & Hoàn cảnh: Một nhân viên văn phòng có thói quen tiện tay
        lấy đồ dùng của cơ quan và tài sản của bạn bè mang về nhà sử dụng riêng mà
        không xin phép.

        Hành vi tạo nghiệp: Phạm vào giới trộm cắp dù vật phẩm giá trị nhỏ, tâm tham
        vi tế tích tụ lâu ngày làm tổn hại nghiêm trọng đạo đức và tư cách người cư
        sĩ.

        Quả báo hiện tiền: Trong nhà đồ đạc liên tục hư hỏng, tiền lương vừa lĩnh
        ra đã bị trộm cắp hoặc rơi mất một khoản tiền lớn gấp nhiều lần những thứ
        đã lén lấy của người khác.

        Bài học & Chuyển hóa: Vật không cho thì không được lấy; của phi nghĩa dù chỉ
        là một cây kim sợi chỉ cũng kết thành sợi dây nợ nần nghiệp báo phải đền trả
        công bằng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660451?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-9
      read_label: 📖 Đọc sách
    - id: 10
      title: Nguyên nhân không ngờ
      summary: 'Nhân vật & Hoàn cảnh: Một đại gia đình giàu có sang Mỹ định cư, sinh
        được người con trai nhưng hành vi cử chỉ và thói quen sinh hoạt lại dị kỳ
        hệt như loài chó ngựa.

        Hành vi tạo nghiệp: Tiền kiếp người con từng là con ngựa chiến và con chó
        trung thành phục vụ gia đình người chủ; do món nợ ân nghĩa và nghiệp súc sinh
        chưa dứt nên tái sinh làm con trong nhà.

        Quả báo hiện tiền: Thân người nhưng tập khí súc vật nặng nề, thích ăn thức
        ăn thừa dưới đất, hay sủa và gầm gừ làm cha mẹ đau lòng xấu hổ khôn xiết.

        Bài học & Chuyển hóa: Hòa thượng khai thị cho gia đình chí thành tụng kinh
        Địa Tạng và niệm Phật hồi hướng cho nghiệp thức súc sinh của người con được
        siêu thoát thăng hoa trí tuệ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660452?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-10
      read_label: 📖 Đọc sách
    - id: 11
      title: Cẩn thận khi gieo nhân
      summary: 'Nhân vật & Hoàn cảnh: Một nữ cư sĩ hơn 60 tuổi mắc bệnh đau đớn kỳ
        quái khắp mình mẩy suốt mấy mươi năm, các khớp xương nhức nhối như bị kim
        châm lửa đốt không thuốc nào giảm đau.

        Hành vi tạo nghiệp: Thuở nhỏ thời thơ ấu, bà thường bắt các loài dế mèn, cào
        cào, bọ cạp rồi dùng kim nhọn xuyên qua thân chúng đem nướng trên que than
        hồng làm thú vui.

        Quả báo hiện tiền: Hàng ngàn mũi kim châm trong tủy xương hiện nay chính là
        dư báo chân thực từ những mũi kim xuyên qua thân thể côn trùng nhỏ bé năm
        xưa.

        Bài học & Chuyển hóa: Bàng hoàng nhận ra cội nguồn đau đớn, bà quỳ trước bàn
        thờ Phật khóc lóc sám hối lỗi lầm thuở ấu thơ, phát nguyện ăn chay trường
        và phóng sinh muôn loài chuộc tội.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660454?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-11
      read_label: 📖 Đọc sách
    - id: 12
      title: Mang thai không nên nổi giận
      summary: 'Nhân vật & Hoàn cảnh: Cung tiên sinh hơn 40 tuổi có má bên phải bị
        một vết bỏng đỏ lở loét kinh niên, bôi bao nhiêu thuốc kháng sinh đắt tiền
        cũng không thể lành miệng.

        Hành vi tạo nghiệp: Thuở thiếu niên nghịch ngợm, ông từng nấu nồi nước sôi
        sùng sục rồi đổ thẳng vào hang chuột mẹ đang nuôi đàn chuột con sơ sinh để
        bắt thịt nướng nhậu.

        Quả báo hiện tiền: Đàn chuột con bị luộc chín đỏ loét trong hang tối; vết
        bỏng rát trên má phải của ông chính là hình ảnh tái hiện của đàn chuột con
        chết cháy vì nước sôi.

        Bài học & Chuyển hóa: Cẩn thận trong từng hành vi gieo nhân dù là nhỏ nhặt;
        ông thành tâm bái sám trước Phật và làm việc thiện hồi hướng cho loài chuột
        giải trừ oán thù truyền kiếp.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660453?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-12
      read_label: 📖 Đọc sách
    - id: 13
      title: Hai đồng dưa cải
      summary: 'Nhân vật & Hoàn cảnh: Người mẹ sinh con ra thì đứa trẻ mắc chứng bệnh
        kỳ lạ: tính tình hung hãn, hay la hét co giật, mặt mũi đỏ bừng nổi mẩn ngứa
        và còi cọc khó nuôi.

        Hành vi tạo nghiệp: Trong suốt thời kỳ thai nghén 9 tháng 10 ngày, người mẹ
        thường xuyên nổi giận lôi đình, cãi vã đập phá đồ đạc và ôm lòng uất hận thù
        hằn với gia đình chồng.

        Quả báo hiện tiền: Độc khí sân hận theo máu huyết truyền thẳng vào thai nhi,
        làm biến đổi thể chất và tâm lý của đứa trẻ, gieo rắc mầm bệnh tật và bất
        an ngay từ trong bụng mẹ.

        Bài học & Chuyển hóa: Thai giáo bằng tâm từ bi hỷ xả là điều tối quan trọng;
        người mẹ mang thai phải luôn giữ tâm thanh tịnh, nghe kinh niệm Phật để con
        sinh ra được đoan trang hiền thiện.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660455?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-13
      read_label: 📖 Đọc sách
    - id: 14
      title: Nên sống chánh nghiệp
      summary: 'Nhân vật & Hoàn cảnh: Đôi vợ chồng cư sĩ lớn tuổi mới quy y Tam Bảo,
        đến chùa làm công quả nhưng lén lút lấy trộm một đĩa dưa cải muối trị giá
        hai đồng mang về nhà ăn.

        Hành vi tạo nghiệp: Xem thường của cải nhà chùa dù chỉ là hai đồng dưa cải
        muối, vi phạm giới luật lấy của Tam Bảo không cho mà lấy.

        Quả báo hiện tiền: Ngay ngày hôm sau người chồng đi xe đạp bị té gãy xương
        bánh chè, tiền thuốc men viện phí tổn thất gấp hàng trăm lần giá trị của đĩa
        dưa cải.

        Bài học & Chuyển hóa: Lời cảnh tỉnh răn đe cho người đi chùa: một hạt gạo,
        một ngọn cỏ của Tam Bảo cũng không được tùy tiện chiếm đoạt; gieo nhân tham
        nhỏ gặt quả đắng to.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660456?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-14
      read_label: 📖 Đọc sách
    - id: 15
      title: Quả báo bội tín
      summary: 'Nhân vật & Hoàn cảnh: Lời khai thị sâu sắc về duyên nghiệp vợ chồng
        và con cái: ''Trai cưới vợ, gái lấy chồng là do duyên thiện hoặc ác; sinh
        con trai hay gái là đòi nợ hay trả nợ''.

        Hành vi tạo nghiệp: Con người trong đời sống mưu sinh thường bất chấp luân
        thường đạo lý, chọn những nghề nghiệp tà mạng như sát sinh, sản xuất vũ khí,
        buôn bán độc dược và rượu chè.

        Quả báo hiện tiền: Con cái hư hỏng phá gia chi tử, gia đình lục đục bất hòa,
        tai họa liên tiếp bủa vây khiến hậu vận rơi vào cảnh cô độc khốn cùng.

        Bài học & Chuyển hóa: Phải biết chọn nghề chánh mạng để mưu sinh; giữ tâm
        thiện lương tích đức cho con cháu đời sau, chuyển hóa nghịch duyên thành thuận
        duyên giải thoát.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660457?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-15
      read_label: 📖 Đọc sách
    - id: 16
      title: Bà hàng trứng rán
      summary: 'Nhân vật & Hoàn cảnh: Ký Văn Đông hơn 40 tuổi quỳ khóc thảm thiết
        trước ngôi mộ mới đắp của người con trai độc nhất vừa tử nạn bất đắc kỳ hồ.

        Hành vi tạo nghiệp: Năm xưa trong lúc hoạn nạn được người bạn thân cưu mang
        giúp đỡ vốn liếng làm ăn; sau khi giàu có lại trở mặt bội tín, chiếm đoạt
        toàn bộ tài sản và bỏ mặc ân nhân chết trong nghèo khó.

        Quả báo hiện tiền: Con trai cưng chết thảm, gia sản tiêu tán trong các vụ
        kiện tụng tranh chấp, bản thân mang trọng bệnh không người chăm sóc; quả báo
        vong ân bội nghĩa hiện tiền rõ rệt.

        Bài học & Chuyển hóa: Sống trên đời phải lấy chữ tín và lòng biết ơn làm đầu;
        phụ ân phản bạn là tội ác trời đất không tha, gieo nhân ác ắt phải gánh chịu
        kết cục bi thảm.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660458?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-16
      read_label: 📖 Đọc sách
    - id: 17
      title: Ham chút lợi nhỏ bị thiệt to
      summary: 'Nhân vật & Hoàn cảnh: Một phụ nữ làm nghề bán bánh rán chiên trứng
        nhiều năm nơi góc phố sầm uất, mắc chứng bệnh da liễu kinh hoàng khắp toàn
        thân.

        Hành vi tạo nghiệp: Vì tham lợi nhuận cao đã thu mua các loại trứng ung thối,
        trứng dập và dầu chiên tái chế độc hại để chiên bánh lừa bán cho học sinh
        và người đi đường.

        Quả báo hiện tiền: Toàn thân nổi mụn nhọt mưng mủ tanh tưởi, ngứa ngáy lở
        loét như mùi trứng ung thối rữa; tiền kiếm được bao nhiêu đều đổ hết vào viện
        phí chạy chữa không khỏi.

        Bài học & Chuyển hóa: Buôn bán gian lận độc hại đầu độc sức khỏe người khác
        là tự chuốc lấy quả báo hủy hoại thân xác; hãy kinh doanh lương thiện bằng
        cái tâm trong sạch.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660459?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
