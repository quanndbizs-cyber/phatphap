      read_label: 📖 Đọc sách
    - id: 15
      title: Phỉ báng Phật pháp, phải sám hối
      summary: |-
        Nhân vật & Hoàn cảnh: Lời cảnh tỉnh nghiêm khắc dựa trên kinh Phật Thuyết Diệu Pháp Quyết Định Nghiệp Chướng cho những kẻ vô tri ngạo mạn phỉ báng Tam Bảo.
        Hành vi tạo nghiệp: Khởi tâm kiêu mạn, phát ngôn bừa bãi chê bai kinh điển Đại thừa là mê tín dị đoan, ngăn cản xúi giục người khác từ bỏ con đường tu học chánh pháp.
        Quả báo hiện tiền: Chiêu cảm quả báo cắt lưỡi câm ngọng, đọa ngục A-tỳ chịu cực hình muôn kiếp, sau làm ngạ quỷ ăn đờm dãi phân nhơ chịu đói khát thiêu đốt vô tận.
        Bài học & Chuyển hóa: Người từng lỡ miệng tạo khẩu nghiệp hủy báng Phật pháp phải lập tức run sợ phát lồ sám hối trước Tam Bảo, dốc lòng ấn tống kinh sách chuộc tội để cứu vãn linh hồn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660504?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
