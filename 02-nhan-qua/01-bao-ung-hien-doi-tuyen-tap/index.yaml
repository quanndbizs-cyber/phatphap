      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=S0QkSzNk6Ao
    - id: 19
      title: Tiên sinh dạy học
      summary: 'Nhân vật & Hoàn cảnh: Một cặp vợ chồng trẻ có đứa con trai 3 tuổi
        vẫn câm điếc, không biết đi và ngơ ngác như người vô hồn, chạy chữa khắp nơi
        vô hiệu.

        Hành vi tạo nghiệp: Tiền kiếp đứa trẻ từng là một vị tú tài dạy học kiêu ngạo,
        thông minh nhưng ỷ tài khinh người, thường dùng lời lẽ châm chọc miệt thị
        những người nghèo dốt và phỉ báng kinh sách thánh hiền, bảo kinh sách là mê
        tín dị đoan.

        Quả báo hiện tiền: Do khẩu nghiệp khinh chê giáo pháp và chê bai người khác,
        kiếp này tái sinh làm kẻ câm điếc ngu ngơ, mất hết năng lực giao tiếp ngôn
        ngữ.

        Bài học & Chuyển hóa: Hòa thượng khuyên cha mẹ ăn chay sám hối, thay con đọc
        tụng kinh Phật hồi hướng để mở mang trí tuệ, tiêu trừ ác nghiệp phỉ báng thánh
        hiền.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660411?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-21
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=j48GHb-UKOw
    - id: 20
      title: Ăn chay trì giới mới được lợi ích
      summary: 'Nhân vật & Hoàn cảnh: Đổng phu nhân bị chứng tiêu chảy mãn tính hành
        hạ suốt mười mấy năm, ăn gì vào cũng đau bụng tháo dạ, thân thể gầy mòn xanh
        xao chữa khắp đông tây y không bớt.

        Hành vi tạo nghiệp: Được khuyên ăn chay niệm Phật nhưng ban đầu bà chỉ ăn
        chay giả tạo, vẫn nêm nước mắm và nước hầm xương động vật vì tiếc rẻ khẩu
        vị, tâm chưa dứt trừ sát nghiệp.

        Quả báo hiện tiền: Đường ruột tiếp tục viêm nhiễm lở loét, chứng tiêu chảy
        không hề thuyên giảm do tiếp tục dung nạp độc tố oán hận của động vật vào
        cơ thể.

        Bài học & Chuyển hóa: Sau khi được chỉ rõ cội rễ, bà mới quyết tâm ăn chay
        thanh tịnh hoàn toàn, giữ gìn ngũ giới nghiêm mật; chỉ trong vòng một tuần
        lễ căn bệnh tiêu chảy kéo dài hơn một thập kỷ tự nhiên dứt hẳn, da dẻ hồng
        hào khỏe mạnh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660411?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
