    - id: 5
      title: Sức mạnh của sám hối
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải sâu sắc về giáo pháp sám hối trong đạo Phật, dành cho những người mang thân tâm nặng trĩu nghiệp chướng tội lỗi từ vô lượng kiếp.
        Hành vi tạo nghiệp: Do vô minh sai khiến từ nhiều đời nhiều kiếp đã lỡ tạo ác nghiệp sát sinh, trộm cắp, tà dâm, dối trá, làm ô nhiễm tự tánh thanh tịnh.
        Quả báo hiện tiền: Bị bệnh nan y hành hạ, vận mệnh trắc trở, nội tâm luôn dằn vặt lo sợ và chịu chướng ngại trùng trùng trên đường đời lẫn đường đạo.
        Bài học & Chuyển hóa: Sám hối chân thành như dòng nước cam lồ gột rửa cấu uế; chí tâm quỳ trước Tam Bảo phát lồ lỗi lầm, đọc tụng Lương Hoàng Sám, Kinh Địa Tạng và phát nguyện dứt ác làm lành sẽ tiêu trừ vạn kiếp nghiệp chướng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660494?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
