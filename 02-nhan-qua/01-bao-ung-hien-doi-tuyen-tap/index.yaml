      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=MfV_PgrEWZE
    - id: 18
      title: Mỹ nữ và thổ phỉ
      summary: 'Nhân vật & Hoàn cảnh: Nữ luật sư tiếp nhận vụ ly hôn kỳ lạ: một thiếu
        phụ xinh đẹp, học thức giàu sang lại nằng nặc đòi ly dị người chồng hết mực
        yêu thương chu đáo để chạy theo một gã đàn ông cờ bạc, nghiện ngập và vũ phu
        thô bạo.

        Hành vi tạo nghiệp: Tiền kiếp thiếu phụ là một tiểu thư khuê các bị thổ phỉ
        bắt cóc, tên đầu sỏ thổ phỉ đã cứu mạng và che chở cho nàng; món nợ ân tình
        mù quáng kiếp xưa chiêu cảm duyên nghiệp kiếp này khiến nàng mê muội theo
        gã du côn.

        Quả báo hiện tiền: Bị dục vọng và ảo tưởng chi phối làm tan nát gia đình hạnh
        phúc, suýt rơi vào cảnh tù đày tủi nhục nơi chốn giang hồ đen tối.

        Bài học & Chuyển hóa: Hòa thượng Diệu Pháp soi sáng nhân duyên tiền kiếp,
        giúp thiếu phụ tỉnh ngộ buông bỏ mê tình ái dục nhiều đời, quay trở về tạ
        lỗi với chồng và giữ gìn gia đạo bình an.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660410?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
