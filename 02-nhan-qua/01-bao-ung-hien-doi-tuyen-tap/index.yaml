    - id: 7
      title: Thai giáo tuyệt vời
      summary: |-
        Nhân vật & Hoàn cảnh: Đôi vợ chồng trẻ Tiết Đình chuẩn bị đón đứa con đầu lòng, được hướng dẫn phương pháp thai giáo theo giáo lý nhà Phật.
        Hành vi tạo nghiệp: Người đời khi mang thai thường sát sinh bồi bổ vô tội vạ, ăn uống ô uế, tâm tính sân hận cáu gắt khiến thai nhi nhiễm độc khí và oán hận.
        Quả báo hiện tiền: Trẻ sinh ra hay ốm đau quặt quẹo, đêm khóc ngặt, tính tình hung bạo ngỗ nghịch, gia đình bất an do chiêu cảm oan gia trái chủ đầu thai.
        Bài học & Chuyển hóa: Suốt thai kỳ cha mẹ phát tâm ăn chay thanh tịnh, ngày ngày mở kinh và chí tâm niệm danh hiệu Địa Tạng, Quan Âm; nhờ đó sinh con đoan chính, thông minh tuấn tú, dễ nuôi và giàu lòng nhân ái.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660496?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
