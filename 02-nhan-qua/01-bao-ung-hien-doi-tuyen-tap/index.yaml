      read_label: 📖 Đọc sách
    - id: 17
      title: Giết cáo bị báo ứng
      summary: |-
        Nhân vật & Hoàn cảnh: Gia đình họ Tất ngụ tại Vĩnh Định Môn (Bắc Kinh) năm 1951, phát hiện một con hồ ly (cáo) mang thai trú ngụ sau vườn táo cạnh nhà.
        Hành vi tạo nghiệp: Cả nhà vây bắt, dùng gậy sắt đập chết con cáo mẹ đang mang thai dã man, sau đó lột da bán lấy tiền và xẻ thịt nấu ăn nhậu vô cảm.
        Quả báo hiện tiền: Chỉ ít lâu sau, người cha và các con cháu lần lượt phát điên sủa gầm như cáo, mắt trợn ngược cào xé thân thể, lăn lộn chết bất đắc kỳ tử tuyệt tự không người nối dõi.
        Bài học & Chuyển hóa: Loài vật mang thai có linh tính vô cùng mạnh mẽ; sát hại chúng ôm mối oán hận ngút trời chiêu cảm quả báo diệt tộc thảm khốc; khuyên người đời tuyệt đối không được giết hại loài linh thú.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660636?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-15
      read_label: 📖 Đọc sách
    - id: 18
      title: Nàng dâu bất hạnh
      summary: |-
        Nhân vật & Hoàn cảnh: Cô dâu quê gốc Thiểm Tây lấy chồng con nhà họ Phạm ở Hoàng Dương Mông Cổ năm 1965, phải chịu cảnh gia đình chồng đày đọa hành hạ dã man.
        Hành vi tạo nghiệp: Kiếp trước cô từng là chủ trại giàu có hà khắc, bóc lột đánh đập tàn nhẫn một người ở gái (người ở gái kiếp này tái sinh làm mẹ chồng cô).
        Quả báo hiện tiền: Kiếp này đổi ngôi làm dâu, bị mẹ chồng và cả nhà chồng coi như trâu ngựa, bắt làm việc đồng áng kiệt sức, ăn cơm thừa canh cặn và bị đánh đập triền miên.
        Bài học & Chuyển hóa: Oan oan tương báo xoay vần như bánh xe luân hồi; hiểu rõ nợ nợ vay trả từ tiền kiếp để không khởi tâm oán hận trả thù, lấy nhẫn nhục và sám hối tu hành hóa giải oán kết xưa.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660637?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-16
      read_label: 📖 Đọc sách
    - id: 19
      title: Cậu Hai Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Cậu Hai của tác giả là một người thợ săn cừ khôi, cả đời đam mê súng đạn săn bắn thú rừng và chim muông bồi bổ.
        Hành vi tạo nghiệp: Hàng ngàn mạng sống nai, hoẵng, lợn rừng và chim trời đã ngã gục dưới họng súng tàn nhẫn của ông suốt mấy mươi năm săn bắn.
        Quả báo hiện tiền: Về già ông mắc bệnh ung thư xương hành hạ đau đớn rên xiết suốt ngày đêm, tay chân co quắp biến dạng y như hình dáng những con thú bị bắn hạ trước khi chết thảm.
        Bài học & Chuyển hóa: Nghề săn bắn sát sinh để lại ác báo vô cùng khủng khiếp cho chính bản thân và con cháu; muốn tránh khỏi tai họa rùng rợn lúc lâm chung phải bẻ gãy súng săn, ăn chay phóng sinh chuộc tội.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660638?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-19
      read_label: 📖 Đọc sách
    - id: 20
      title: Câu chuyện khiến Tôi rơi lệ
      summary: |-
        Nhân vật & Hoàn cảnh: Mùa thu năm tác giả 12 tuổi, gia đình lâm vào cảnh ngộ bĩ cực cùng đường: cha bệnh nặng mất sức lao động, anh trượt đại học, mẹ xịt nhầm thuốc sâu làm cháy rụi 10 mẫu lúa.
        Hành vi tạo nghiệp: Nghiệp chướng nhiều đời của cả gia đình hội tụ cùng lúc chiêu cảm nghịch cảnh bủa vây, đẩy cả nhà đến bờ vực tuyệt vọng phá sản đói khát.
        Quả báo hiện tiền: Bệnh tật, thất bát mùa màng và bế tắc dồn dập khiến người mẹ nước mắt lưng tròng, gia đình rơi vào cảnh túng quẫn không chốn nương tựa.
        Bài học & Chuyển hóa: Người mẹ nuốt nước mắt quỳ trước bàn thờ Quan Thế Âm Bồ Tát chí thành lạy Phật sám hối suốt đêm; cảm ứng linh diệu ruộng lúa cháy bỗng đâm chồi xanh tốt kỳ lạ, cứu sống cả gia đình qua cơn bĩ cực.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660639?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-17
      read_label: 📖 Đọc sách
    - id: 21
      title: Chú Út của bạn Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Chú Út của người bạn tác giả là đồ tể chuyên nghiệp nổi tiếng trong vùng, có tay nghề mổ thịt giết trâu bò nhanh gọn suốt mấy mươi năm.
        Hành vi tạo nghiệp: Vung dao tước đoạt sinh mạng hàng ngàn con trâu bò vô tội, dửng dưng trước những giọt nước mắt van xin quỳ lạy của loài vật trước giờ hành quyết.
        Quả báo hiện tiền: Đến tuổi trung niên ông mắc chứng bệnh lạ co giật uốn ván, bốn chân quỳ bò dưới đất, há hốc mồm rống lên từng hồi bi thảm như tiếng trâu bị chọc tiết rồi chết tươi.
        Bài học & Chuyển hóa: Cảnh báo đanh thép cho những ai mưu sinh bằng nghề sát mổ động vật; oán linh súc sinh không bao giờ bỏ qua cho kẻ tàn sát mình; hãy mau chóng đổi nghề lương thiện để cứu lấy mạng sống.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660640?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-18
      read_label: 📖 Đọc sách
    - id: 22
      title: Ông hàng xóm hung dữ
      summary: |-
        Nhân vật & Hoàn cảnh: Ông hàng xóm ở Nam Đầu tính khí hung tợn thô bạo, gia đình có ba anh em thì đều bị tàn tật bẩm sinh: người điếc ngọng, người què quặt dị dạng.
        Hành vi tạo nghiệp: Cả đời quen thói ức hiếp kẻ yếu, đánh đập vợ con dã man, bắt giết chó mèo súc vật trong xóm chòm xóm hành hạ tiêu khiển không chút từ tâm.
        Quả báo hiện tiền: Về già bị tai biến ngã liệt giường, toàn thân lở loét hôi thối dòi bọ bu đầy, vợ con khiếp sợ lánh xa, chịu cảnh đói khát đau đớn kêu la rên rỉ chờ chết trong nhục nhã.
        Bài học & Chuyển hóa: Thói hung bạo ngược đãi sinh linh và bạo hành gia đình sớm muộn cũng chuốc lấy quả báo thân tàn ma dại; gieo gió gặt bão là quy luật nhân quả thép không ai có thể trốn thoát.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660641?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-19
      read_label: 📖 Đọc sách
    - id: 23
      title: Nhân duyên giữa Tôi và Bồ Tát
      summary: |-
        Nhân vật & Hoàn cảnh: Tác giả làm nghề hướng dẫn viên du lịch lái xe đưa đón khách tham quan tại công ty du lịch Tam Á đảo Hải Nam vào cuối năm 2003.
        Hành vi tạo nghiệp: Hằng ngày trên xe luôn giữ thói quen mở máy phát bài Chú Đại Bi và chí thành niệm danh hiệu Quán Thế Âm Bồ Tát cầu nguyện an lành cho hành khách.
        Quả báo hiện tiền: Trong một khúc cua đèo dốc hiểm trở ven biển, xe mất thắng suýt lao thẳng xuống vực thẳm sâu hun hút cướp đi sinh mạng mấy mươi con người.
        Bài học & Chuyển hóa: Trong giây phút ngàn cân treo sợi tóc, vô hình như có bàn tay khổng lồ đẩy xe trở lại lòng đường an toàn; minh chứng người trì niệm Chú Đại Bi luôn được chư Phật Bồ Tát gia hộ gặp nạn hóa an.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660642?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-20
      read_label: 📖 Đọc sách
    - id: 24
      title: Sáu chuyện nhân quả
      summary: |-
        Nhân vật & Hoàn cảnh: Tuyển tập sáu câu chuyện nhân quả chân thực do ông Trương ở thôn Hồ Khẩu (huyện Tân Trúc) đích thân chứng kiến và ghi chép lại gởi đến ban biên tập.
        Hành vi tạo nghiệp: Phản ánh các hành vi bất thiện phổ biến trong đời sống: sát sinh ăn nhậu tươi sống, trộm cắp quỵt nợ, bất hiếu với song thân và lừa đảo phản bội bạn bè.
        Quả báo hiện tiền: Những kẻ làm ác đều lần lượt gánh chịu ác báo nhãn tiền: tai nạn đứt tay chân, bệnh tật ung thư hoại tử, con cái phá gia chi tử, lâm chung đau đớn rợn người.
        Bài học & Chuyển hóa: Khẳng định quy luật nhân quả là có thực 100%, thiện ác phân minh tơ hào không sai lệch; khuyên bảo thế nhân lấy đó làm gương soi để dứt trừ điều ác, chăm làm việc thiện.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660643?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-21
      read_label: 📖 Đọc sách
    - id: 25
      title: Chuyện kể của cảnh sát pháp y
      summary: |-
        Nhân vật & Hoàn cảnh: Những lời chia sẻ chân thực từ một sĩ quan cảnh sát pháp y lâu năm chuyên khám nghiệm hiện trường các vụ án mạng kỳ lạ bí ẩn.
        Hành vi tạo nghiệp: Những toan tính hiểm độc, giết người cướp của, tranh đoạt tình tiền tưởng chừng được che giấu hoàn hảo dưới lớp vỏ bọc tinh vi.
        Quả báo hiện tiền: Lưới trời lồng lộng thưa mà khó lọt; các dấu vết tử thi và linh hồn người chết đều hiển lộ chân tướng giúp pháp y tìm ra bằng chứng vạch trần tội ác đền tội trước pháp luật.
        Bài học & Chuyển hóa: Đừng tưởng làm ác trong bóng tối không ai hay biết; quỷ thần hai vai ghi chép rõ ràng, lưới pháp luật và luật nhân quả công minh luôn trừng trị thích đáng kẻ bất lương.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660644?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-25
      read_label: 📖 Đọc sách
    - id: 26
      title: Chuyện kể của cảnh sát pháp y - Vụ án cặp vợ chồng chết thảm 2012
      summary: |-
        Nhân vật & Hoàn cảnh: Vụ án cặp vợ chồng buôn bán thịt động vật quy mô lớn bị sát hại thảm khốc tại nhà riêng năm 2012 gây chấn động dư luận.
        Hành vi tạo nghiệp: Nhiều năm làm nghề thu mua, giết mổ hàng vạn sinh mạng heo bò dê sống, kiếm lợi nhuận kết xù trên máu tanh của loài vật.
        Quả báo hiện tiền: Bị kẻ cướp đột nhập cắt cổ phân thây dã man y hệt cách họ đã từng mổ xẻ các loài động vật trong lò mổ; toàn bộ tài sản kết xù bị cướp sạch trong đêm.
        Bài học & Chuyển hóa: Sát nghiệp là nghiệp nặng nhất trong các ác nghiệp; máu trả bằng máu, mạng trả bằng mạng; làm giàu trên sự chết chóc của sinh linh sẽ chuốc lấy cái chết thảm khốc không ngờ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660645?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
