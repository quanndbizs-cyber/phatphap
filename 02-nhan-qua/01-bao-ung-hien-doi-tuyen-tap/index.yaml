      read_label: 📖 Đọc sách
    - id: 47
      title: Lý do tôi đến với đạo
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thuật của một thanh niên 32 tuổi ở thành phố Mai Châu, thời niên thiếu bất hảo theo băng nhóm quậy phá học đường, kết bè đánh lộn giang hồ.
        Hành vi tạo nghiệp: Bỏ học lưu đãng, sống phóng túng sa đọa vào cờ bạc, gái gú tà dâm, trộm cắp và bức hại người thế cô, khinh thường lời khuyên dạy của cha mẹ thầy cô.
        Quả báo hiện tiền: Cơ thể suy kiệt bệnh tật đầy mình, công việc bấp bênh nợ nần, đêm đêm ác mộng thấy quỷ sứ âm cung đến trói kéo xuống địa ngục tra tấn kinh hoàng.
        Bài học & Chuyển hóa: Giật mình thức tỉnh trước bờ vực địa ngục, anh may mắn gặp được Bồ Tát Địa Tạng điểm hóa trong mơ; quỳ trước Phật sám hối toàn bộ tội lỗi quá khứ, phát nguyện cải tà quy chánh trọn đời tu học.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660536?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-46
      read_label: 📖 Đọc sách
    - id: 48
      title: Hồi hướng
      summary: |-
        Nhân vật & Hoàn cảnh: Lời nguyện hồi hướng trang nghiêm kết thúc toàn bộ tác phẩm Báo Ứng Hiện Đời tập 4 của cư sĩ Quả Khanh, Quả Hồng và ban ấn tống Hạnh Đoan.
        Hành vi tạo nghiệp: Nguyện sám hối muôn vàn tội lỗi sát, đạo, dâm, vọng đã tạo trong vô lượng kiếp do vô minh che lấp tự tánh thanh tịnh.
        Quả báo hiện tiền: Chuyển hóa oan trái nghịch duyên thành thiện duyên bồ-đề, giải thoát mọi ràng buộc đau khổ bệnh tật của thân tâm nơi cõi thế tục tạm bợ.
        Bài học & Chuyển hóa: Hồi hướng toàn bộ công đức biên dịch, in ấn, đọc tụng và lưu truyền tập sách này đến khắp pháp giới chúng sinh, nguyện đồng triêm lợi lạc, dứt trừ ác nghiệp, đồng vãng sinh Tây Phương Cực Lạc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660537?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
