      read_label: 📖 Đọc sách
    - id: 35
      title: Tự Sát Đọa Cõi Ác
      summary: |-
        Nhân vật & Hoàn cảnh: Thượng sư Đặc-ni là bậc hóa thân thành tựu đại viên mãn với thần thông tự tại, quán chiếu cảnh giới vô hình cứu độ chúng sinh lầm lạc.
        Hành vi tạo nghiệp: Người đời thiếu hiểu biết nhân quả, khi gặp bế tắc tình cảm tiền bạc liền chọn cách tự sát để trốn tránh trách nhiệm trần gian.
        Quả báo hiện tiền: Thượng sư chứng kiến cảnh các vong linh tự sát bị quỷ sứ xiềng xích lôi kéo tra tấn nơi hỏa ngục, ngày ngày phải lặp lại cảnh chết đau đớn gấp muôn lần lúc sống.
        Bài học & Chuyển hóa: Lời cảnh tỉnh nghiêm khắc của bậc Thượng sư: thân người vô cùng quý giá, tự sát là cửa ngõ đọa thẳng địa ngục; hãy dùng Phật pháp chuyển hóa khổ đau vượt qua nghịch cảnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660572?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-34
      read_label: 📖 Đọc sách
    - id: 36
      title: Hướng Phật Xin Công Tác
      summary: |-
        Nhân vật & Hoàn cảnh: Một phụ nữ có con trai nhỏ mắc bệnh hiểm nghèo chữa trị khắp nơi vô hiệu, gia đình rơi vào cảnh khốn đốn bế tắc cùng đường và thất nghiệp.
        Hành vi tạo nghiệp: Thiếu hiểu biết về kinh điển Phật pháp, trước đây lười biếng tu tập và tạo nhiều nghiệp chướng vô minh trong đời sống gia đình.
        Quả báo hiện tiền: Con đau ốm quặt quẹo, nợ nần chồng chất không có việc làm mưu sinh, tâm thần hoang mang bế tắc tưởng chừng không lối thoát.
        Bài học & Chuyển hóa: Nhờ trang web Tiểu Viện Sơn Tây thỉnh Kinh Địa Tạng về quỳ tụng chí thành sám hối; kỳ tích hiển linh con trai lành bệnh hoàn toàn và bản thân xin được công việc ổn định tốt đẹp.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660573?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-35
      read_label: 📖 Đọc sách
    - id: 37
      title: Tâm Sự Người Vợ
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự sự xúc động của chị Viên Viên (hội viên Tâm Thượng Liên Hoa) kể về hành trình hoán cốt trùng sinh từ một kẻ tội lỗi trở thành người con Phật thuần thành.
        Hành vi tạo nghiệp: Thuở trẻ có tính tình kiêu ngạo đố kỵ, buông thả trong ái dục tà dâm, bất hiếu với cha mẹ và làm tổn thương nhiều người thân trong gia đình.
        Quả báo hiện tiền: Cuộc sống rơi vào địa ngục trần gian: hôn nhân đổ vỡ, bệnh tật hiểm nghèo hành hạ thân xác, tâm thần trầm cảm hoảng loạn muốn tìm đến cái chết.
        Bài học & Chuyển hóa: Nhờ gặp thiện tri thức khai thị, chị dốc trọn nước mắt quỳ trước Tam Bảo sám hối từng lỗi lầm, ăn chay tu trì bền bỉ; cuộc đời tái sinh kỳ diệu tràn đầy an lạc hạnh phúc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660574?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-36
      read_label: 📖 Đọc sách
    - id: 38
      title: Mối Duyên Của Dượng X
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện về dượng X (chồng của người cô tác giả) sống trong cuộc hôn nhân đầy đau khổ bế tắc với người vợ có tính khí nóng nảy cay nghiệt.
        Hành vi tạo nghiệp: Người mẹ của dượng X từng vì xung đột bế tắc gia đình mà tự sát chết thảm, để lại vết thương lòng sâu sắc và bóng ma u ám cho con cháu.
        Quả báo hiện tiền: Dượng X chịu cảnh vợ chồng lạnh nhạt xung đột triền miên, từng muốn ly hôn nhưng nhìn thấy gương con cái bạn bè tự sát vì cha mẹ chia tay nên đành nhẫn nhịn.
        Bài học & Chuyển hóa: Dượng X chọn con đường nhẫn nhục hy sinh vì con cái, dùng tình thương và sự bao dung hóa giải oán hận; minh chứng sự nhẫn nhịn và thấu hiểu có thể cứu vớt một gia đình tan vỡ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660575?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-37
      read_label: 📖 Đọc sách
    - id: 39
      title: Đôi Mắt Trẻ Thơ
      summary: |-
        Nhân vật & Hoàn cảnh: Mùa xuân năm 1976 tại khu chợ Cáp Nhĩ, một bà ngoại dẫn cháu trai nhỏ 3-4 tuổi lên chuyến xe khách đường dài chuẩn bị khởi hành về quê.
        Hành vi tạo nghiệp: Nghiệp lực chiêu cảm chuyến xe khách gặp đại nạn tử thần trên cung đường hiểm trở núi cao vực sâu.
        Quả báo hiện tiền: Vừa lên xe đứa cháu nhỏ bỗng khóc thét lên nằng nặc đòi xuống xe, người bà dỗ dành không được đành chiều cháu dắt xuống; ít phút sau xe lao xuống vực tan tành cướp đi sinh mạng toàn bộ hành khách.
        Bài học & Chuyển hóa: Đôi mắt trẻ thơ thanh tịnh vô nhiễm nhìn thấy được điềm báo nguy hiểm vô hình mà người lớn không thấy; một niệm chiều cháu đã cứu sống hai bà cháu thoát khỏi lưỡi hái tử thần.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660576?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-38
      read_label: 📖 Đọc sách
    - id: 40
      title: Tòa Lầu Giải Trí
      summary: |-
        Nhân vật & Hoàn cảnh: Năm 1936 tại Nam Kinh trước khi quân Nhật chiếm đóng, một ông lão hơn 60 tuổi dắt cháu trai 8 tuổi đi bộ đến khu giải trí Thắng Kỳ Lầu dạo chơi.
        Hành vi tạo nghiệp: Quân phát xít Nhật cho máy bay oanh tạc bom đạn dữ dội xuống các khu dân cư thành phố gây nên cảnh tượng máu chảy đầu rơi tang tóc.
        Quả báo hiện tiền: Đang ngồi đọc sách chơi cờ, ông lão bỗng thấy bất an giục cháu ra về ngay; vừa bước ra khỏi cổng thì bom rơi trúng Thắng Kỳ Lầu san phẳng toàn bộ tòa nhà cướp đi sinh mạng nhiều người.
        Bài học & Chuyển hóa: Nhờ cả đời ông lão ăn ở hiền lành, hay bố thí giúp đỡ người nghèo nên được thần linh mách bảo linh tính thoát chết trong gang tấc; tích đức hành thiện là bùa hộ mệnh vững chắc nhất.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660577?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-39
      read_label: 📖 Đọc sách
    - id: 41
      title: Vương Quả Phụ
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện về Vương quả phụ một mình nuôi con côi cút thời loạn lạc, được xóm giềng cưu mang giúp đỡ từng bát gạo củ khoai qua cơn bĩ cực.
        Hành vi tạo nghiệp: Sau ngày giải phóng con trai làm quan lớn cho nhà nước, mẹ con Vương quả phụ đổi đời giàu sang liền quay sang khinh rẻ, hắt hủi và bội bạc những người ơn cũ từng cứu mình.
        Quả báo hiện tiền: Con trai phạm tội tham ô hối lộ bị bắt giam kết án tù nặng, tài sản bị tịch thu sạch sành sanh; Vương quả phụ tuổi già lại rơi vào cảnh cô độc bần hàn nhục nhã như xưa.
        Bài học & Chuyển hóa: Ăn quả nhớ kẻ trồng cây, uống nước nhớ nguồn; kẻ vong ân bội nghĩa xem thường ân nhân ắt chuốc lấy quả báo tiêu tan phúc đức, nghèo khổ trở lại như thuở ban đầu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660578?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-40
      read_label: 📖 Đọc sách
    - id: 42
      title: Chuyện Của Ba Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Ký ức thời sinh viên của người cha tác giả trong giai đoạn chiến tranh loạn lạc trường học bị bom đạn đe dọa thường xuyên.
        Hành vi tạo nghiệp: Chiến tranh tàn phá cướp đi sinh mạng của bao thế hệ thanh niên vô tội do cộng nghiệp sát phạt giữa các đảng phái đối nghịch.
        Quả báo hiện tiền: Đêm trước ngày trường bị ném bom tan tành, người cha tình cờ thấy một con dơi bị rơi xuống ao nước giãy giụa sắp chết đuối liền tìm cành cây cứu vớt nó lên bờ.
        Bài học & Chuyển hóa: Ngày hôm sau nhờ bận đi tìm chỗ thả con dơi mà ông không có mặt tại ký túc xá lúc bom rơi, thoát chết kỳ diệu; một niệm từ bi cứu mạng loài vật nhỏ bé đã cứu chính sinh mạng mình.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660579?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-41
      read_label: 📖 Đọc sách
    - id: 43
      title: Chuyện Các Vũ Trường
      summary: |-
        Nhân vật & Hoàn cảnh: Thực trạng các quán bar vũ trường mọc lên như nấm ở các thành phố lớn cách đây mười năm, bên ngoài khiêu vũ nhưng bên trong ngầm buôn bán ma túy và mại dâm.
        Hành vi tạo nghiệp: Các ông chủ vũ trường dùng mọi thủ đoạn tinh vi giăng bẫy mồi chài thanh niên sa đọa vào trụy lạc để làm giàu bất chính trên sự suy đồi của thế hệ trẻ.
        Quả báo hiện tiền: Các giám đốc vũ trường lần lượt gặp tai nạn giao thông thảm khốc đứt đầu gãy chân, con cái họ nghiện ngập sốc thuốc chết đường chết chợ, gia sản tiền tỷ tiêu tan sạch sành sanh.
        Bài học & Chuyển hóa: Kiếm tiền bằng con đường đầu độc đạo đức xã hội là tự đào mồ chôn mình và con cháu; quả báo phá sản tuyệt tự nhãn tiền là bài học đắt giá cho những kẻ kinh doanh vô lương tâm.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660580?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-42
      read_label: 📖 Đọc sách
    - id: 44
      title: Trần Đại Gia
      summary: |-
        Nhân vật & Hoàn cảnh: Ông Trần là người tài hoa tuấn tú xuất chúng, con nhà trâm anh thế phiệt, là bậc kỳ tài chào hàng bán sản phẩm kinh doanh lừng danh một thời.
        Hành vi tạo nghiệp: Ỷ vào tài năng và nhan sắc đã buông lung đam mê cờ bạc đỏ đen, ăn chơi trác táng tại các sòng bài và lừa gạt tình cảm của nhiều phụ nữ nhẹ dạ.
        Quả báo hiện tiền: Cơ nghiệp đồ sộ tiêu tan vào chiếu bạc, nợ nần chồng chất bị xã hội đen truy lùng, vợ con bỏ rơi, tuổi già bệnh tật cô độc chết thảm trong căn phòng trọ rách nát.
        Bài học & Chuyển hóa: Tài năng mà không có đức hạnh thì tài đó chỉ là tai họa; cờ bạc và tà dâm là hai con đường ngắn nhất hủy hoại cả một đời người tài ba hiển hách.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660581?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-43
      read_label: 📖 Đọc sách
    - id: 45
      title: Con Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Lời khai thị xót xa rúng động của Đức Lạt ma về thực trạng mỗi năm có hàng chục triệu ca nạo phá thai tàn sát sinh linh vô tội trên thế giới.
        Hành vi tạo nghiệp: Quan hệ bừa bãi rồi nhẫn tâm nạo hút phá thai, tước đoạt sự sống thiêng liêng của chính giọt máu cốt nhục người thân yêu tiền kiếp tái sinh đến với mình.
        Quả báo hiện tiền: Vong thai ôm hận bám riết đòi nợ, người mẹ mắc các bệnh ung thư tử cung buồng trứng, gia đình bất an lục đục, con cái đời sau sinh ra khó nuôi ngỗ nghịch.
        Bài học & Chuyển hóa: Lời nhắn nhủ khẩn thiết: hãy có trách nhiệm với hành vi của mình, tuyệt đối không được phá thai; nếu lỡ lầm phải chí thành sám hối ăn chay tụng kinh siêu độ vong nhi.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660582?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-44
      read_label: 📖 Đọc sách
    - id: 46
      title: Kinh Nghiệm Cầu Siêu Cho Vong Thai
      summary: |-
        Nhân vật & Hoàn cảnh: Tác giả chia sẻ kinh nghiệm cầu siêu thực tế cho con gái mang thai ngoài ý muốn lần hai, kiên quyết giữ lại thai nhi không phá bỏ và sinh con an toàn.
        Hành vi tạo nghiệp: Rất nhiều cặp vợ chồng vì toan tính kinh tế hoặc tiện nghi bản thân đã nhẫn tâm phá bỏ thai nhi, gieo rắc oán thù truyền kiếp không thể hóa giải.
        Quả báo hiện tiền: Oan oan tương báo khiến gia đạo suy sụp, thân xác người mẹ mang bệnh tật nan y và tinh thần luôn bị ám ảnh tội lỗi dày vò suốt đời.
        Bài học & Chuyển hóa: Gia đình kiên quyết giữ con, lập bàn thờ chí thành quỳ tụng Kinh Địa Tạng, ăn chay phóng sinh hồi hướng công đức; kết quả sinh bé gái đoan trang ngoan ngoãn mẹ tròn con vuông.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660583?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
