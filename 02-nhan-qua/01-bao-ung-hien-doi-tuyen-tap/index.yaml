    - id: 2
      title: Giọt Nước Mắt Anh Tài Xế
      summary: |-
        Nhân vật & Hoàn cảnh: Anh tài xế lái tàu thủy chuyên chở buôn lậu lươn sống, tôm cá sống số lượng lớn trên sông nước để cung cấp cho các nhà hàng quán nhậu.
        Hành vi tạo nghiệp: Giam cầm hàng vạn con lươn cá trong khoang tối chật hẹp ngột ngạt, gián tiếp tước đoạt sinh mạng muôn loài thủy tộc kiếm đồng tiền máu tanh.
        Quả báo hiện tiền: Tàu bị lật chìm trong đêm bão, anh bị kẹt trong khoang ngập nước suýt chết đuối; sau đó mắc chứng bệnh da thịt lạnh buốt lở loét ngứa ngáy như bị ngâm nước mặn suốt đời.
        Bài học & Chuyển hóa: Rơi nước mắt sám hối trước Tam Bảo, anh dứt bỏ hoàn toàn nghề buôn cá lươn sống, phát nguyện ăn chay trường niệm Phật cứu chuộc lỗi lầm xưa.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660539?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-2
      read_label: 📖 Đọc sách
    - id: 3
      title: Tai Nạn Nửa Đêm
      summary: |-
        Nhân vật & Hoàn cảnh: Đôi vợ chồng trẻ lái xe ô tô nửa đêm trên đường cao tốc phóng nhanh vượt ẩu trong tình trạng say xỉn sau bữa tiệc nhậu nhẹt linh đình.
        Hành vi tạo nghiệp: Thường xuyên sát sinh ăn thịt tươi sống chim muông dã thú, lái xe ngông cuồng coi thường tính mạng bản thân và người tham gia giao thông.
        Quả báo hiện tiền: Xe mất lái đâm nát bấy vào dải phân cách thép biến dạng hoàn toàn, đối mặt với tử thần trong gang tấc giữa đêm khuya vắng vẻ.
        Bài học & Chuyển hóa: Nhờ ở nhà người mẹ già chí thành tụng kinh niệm Phật hồi hướng nên hai vợ chồng thoát chết kỳ diệu chỉ trầy xước nhẹ; giật mình tỉnh ngộ dứt trừ sát nghiệp và rượu chè.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660540?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-2
      read_label: 📖 Đọc sách
    - id: 4
      title: Cứu Khỉ Một Nạn, Khỉ Cứu Lại Một Làng
      summary: |-
        Nhân vật & Hoàn cảnh: Một làng quê nghèo dưới chân núi bắt được một chú khỉ con định làm thịt đãi tiệc, một người thợ săn có lòng trắc ẩn đã bỏ tiền túi chuộc mạng thả khỉ về rừng.
        Hành vi tạo nghiệp: Dân làng quen thói săn bắt giết mổ dã thú rừng rậm, tàn sát loài khỉ câm nín tạo nên oán khí tích tụ ngút ngàn chốn rừng xanh.
        Quả báo hiện tiền: Trận mưa lũ lịch sử gây sạt lở núi nửa đêm ầm ầm đổ xuống đất làng, đe dọa chôn vùi toàn bộ sinh mạng dân làng trong bùn đất đổ nát.
        Bài học & Chuyển hóa: Đàn khỉ kéo về gào thét ném đá vào mái nhà đánh thức cả làng chạy nạn kịp thời thoát chết trong gang tấc; minh chứng hùng hồn cứu vật vật trả ơn vạn đời không mất.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660541?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-3
      read_label: 📖 Đọc sách
    - id: 5
      title: Một Buổi Quán Sát Nhân Quả
      summary: |-
        Nhân vật & Hoàn cảnh: Buổi diện kiến quán sát nhân quả đặc biệt của Hòa thượng Diệu Pháp giải đáp căn nguyên bệnh tật cho hàng chục Phật tử mắc các chứng nan y kỳ dị.
        Hành vi tạo nghiệp: Mỗi căn bệnh đều do nghiệp tạo tác cụ thể: dội nước sôi giết tổ kiến, dùng móc câu xé rách mang cá, đánh chết chó mèo, hoặc phá thai nhiều lần thời trẻ.
        Quả báo hiện tiền: Người thì lở loét da thịt như bị bỏng, kẻ thì ung thư vòm họng ngạt thở, người thì đau nhức xương tủy y học hiện đại hoàn toàn bất lực không tìm ra nguyên nhân.
        Bài học & Chuyển hóa: Sư phụ khai thị phương thuốc duy nhất trị gốc bệnh là chân thành quỳ trước Phật sám hối, dứt tuyệt ăn mặn, phóng sinh chuộc mạng và phát tâm ăn chay trường niệm Phật.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660542?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-6#truyen-4
      read_label: 📖 Đọc sách
    - id: 6
      title: Không Nên Ăn Cá
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải sâu sắc về tác hại khôn lường của việc câu cá, đánh lưới và ăn thịt các loài cá tươi sống đối với sức khỏe và số mệnh con người.
        Hành vi tạo nghiệp: Thích thú dùng lưỡi câu sắt nhọn móc rách miệng mang cá, mổ bụng cạo vảy chiên xào khi cá còn giãy giụa đau đớn trong chảo dầu sôi.
        Quả báo hiện tiền: Mắc chứng bệnh loét miệng lưỡi mãn tính, ung thư vòm họng, thực quản co thắt nghẹn thở không nuốt được thức ăn, chịu sự hành hạ đau đớn y hệt cá bị móc câu.
        Bài học & Chuyển hóa: Muôn loài thủy tộc đều biết đau đớn van xin; người tu học Phật nhất định phải đoạn trừ ăn cá thịt, bảo vệ môi trường thủy sinh và tích cực phóng sinh cứu mạng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660543?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
