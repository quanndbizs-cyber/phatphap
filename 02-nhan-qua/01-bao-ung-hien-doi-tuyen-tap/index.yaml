      read_label: 📖 Đọc sách
    - id: 36
      title: Tiên tri - 05. Giám đốc Viên Mậu
      summary: |-
        Nhân vật & Hoàn cảnh: Doanh nhân Viên Mậu làm giám đốc một công ty lớn, vì lòng tham đã cấu kết buôn bán hóa đơn giả và trốn thuế hàng chục tỷ đồng.
        Hành vi tạo nghiệp: Bất chấp pháp luật và đạo đức kinh doanh, dùng thủ đoạn lừa dối nhà nước và đối tác để làm giàu bất chính trên mồ hôi nước mắt người khác.
        Quả báo hiện tiền: Bị cơ quan chức năng điều tra bắt giữ khẩn cấp, doanh nghiệp phá sản tiêu điều, bản thân đối mặt với án phạt tù dài hạn, gia đình tan nát ly tán.
        Bài học & Chuyển hóa: Của phi nghĩa vạn đời không giữ được; làm giàu bằng con đường gian xảo trộm cướp của công chỉ chuốc lấy tai họa diệt vong cho bản thân và dòng họ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660655?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
