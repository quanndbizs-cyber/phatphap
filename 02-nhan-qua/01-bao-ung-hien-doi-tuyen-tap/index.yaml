    - id: 36
      title: Tình chấp trói buộc
      summary: |-
        Nhân vật & Hoàn cảnh: Những mối quan hệ oan trái, ái dục giằng xé và ràng buộc sâu sắc giữa mẹ con, vợ chồng trong vòng luân hồi lục đạo sinh tử.
        Hành vi tạo nghiệp: Đắm chìm trong si mê ái dục ích kỷ, phá thai tước đoạt sinh mạng giọt máu, vì tham đắm danh lợi sắc dục mà kết oán thù sâu nặng với người thân.
        Quả báo hiện tiền: Tình cảm đổ vỡ, bệnh tật phụ khoa hoành hành, gia đình bất an, con cái sinh ra chịu khổ nạn do cộng nghiệp và biệt nghiệp đan xen trói buộc chặt chẽ.
        Bài học & Chuyển hóa: Dứt trừ lưới ái trói buộc bằng cách buông xả chấp niệm tham ái, thâm tín nhân quả, chí tâm ăn chay bái sám và phát bồ-đề tâm chuyển hóa tình chấp thế tục thành tình thương đại bi.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660525?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-36
      read_label: 📖 Đọc sách
    - id: 37
      title: Mẹ chồng nàng dâu
      summary: |-
        Nhân vật & Hoàn cảnh: Trương Lan là dâu hiền dâu thảo hết lòng phụng dưỡng gia đình chồng, nhưng mẹ chồng luôn kiếm cớ vô lý mắng chửi xối xả đay nghiến thậm tệ.
        Hành vi tạo nghiệp: Đời Đường Trương Lan là Quý phi sủng ái, mẹ chồng kiếp đó là viên Võ tướng bị vu oan bãi chức thọ hình; do hiểu lầm Quý phi nói xấu ám hại mình nên ôm mối hận thù thấu xương.
        Quả báo hiện tiền: Kiếp này tái sinh làm mẹ chồng nàng dâu để đòi nợ oan gia, Trương Lan dù nín nhịn phục tùng cúc cung tận tụy vẫn bị mẹ chồng đay nghiến như kẻ thù không đội trời chung.
        Bài học & Chuyển hóa: Hiểu rõ nguồn cơn oán kết tiền kiếp, Trương Lan không oán trách mà phát nguyện ăn chay quỳ tụng 49 bộ Kinh Địa Tạng hồi hướng cho mẹ chồng; mẹ chồng hoát nhiên đổi tính yêu thương nàng dâu như con đẻ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660526?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-36
      read_label: 📖 Đọc sách
    - id: 38
      title: Gieo gì gặt nấy
      summary: |-
        Nhân vật & Hoàn cảnh: Dì Triệu nửa đêm hoảng loạn gọi điện thoại cầu cứu Quả Hồng vì con gái 33 tuổi bị ung thư phổi di căn toàn thân, bệnh viện trả về chờ chết trong ngột ngạt.
        Hành vi tạo nghiệp: Tiền kiếp trong Đệ nhị thế chiến, cô gái từng là sĩ quan phát xít Đức độc ác vận hành phòng hơi ngạt, bức tử hàng vạn thường dân Do Thái chết ngạt đau đớn khôn cùng.
        Quả báo hiện tiền: Bị quả báo hiện tiền ung thư phổi nghẹt thở khạc đờm ra máu, lồng ngực bỏng rát đau đớn y hệt cảm giác nghẹt thở chết vì khí độc của các nạn nhân xưa.
        Bài học & Chuyển hóa: Gieo nhân độc ác ắt gặt quả thảm khốc; Quả Hồng khuyên gia đình chí thành quỳ trước Tam Bảo sám hối tội diệt chủng tiền kiếp, ăn chay phóng sinh cầu xin chư oan linh tha thứ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660527?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-37
      read_label: 📖 Đọc sách
    - id: 39
      title: Con vật chết thảm
      summary: |-
        Nhân vật & Hoàn cảnh: Lộ cư sĩ và Tiểu Man vừa bước ra khỏi quán cơm chay thì bàng hoàng phát hiện thi thể một con bồ câu chết thảm thương tâm trong vũng nước bên đường.
        Hành vi tạo nghiệp: Người đời nhẫn tâm tàn sát loài vật câm nín, phanh thây xé thịt bồ câu chỉ còn trơ chút xương cánh để phục vụ cho các bữa ăn nhậu vô cảm.
        Quả báo hiện tiền: Gieo rắc cái chết đau đớn cho sinh linh ắt chiêu cảm thân mạng bị tai nạn đập nát tương tự, linh hồn đọa lạc tam đồ chịu quả báo phân thây xẻ thịt.
        Bài học & Chuyển hóa: Hai cư sĩ xót thương bọc xác bồ câu tụng chú Vãng Sinh an táng; câu chuyện cảnh tỉnh con người tôn trọng mạng sống muôn loài, tuyệt đối không được sát hại sinh linh kẻo chuốc ác báo tương tàn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660528?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-39
      read_label: 📖 Đọc sách
    - id: 40
      title: Cảm ứng khi siêu độ vong linh
      summary: |-
        Nhân vật & Hoàn cảnh: Thảm họa địa chấn sóng thần Ấn Độ Dương tháng 12/2004 cướp đi sinh mạng hơn 20 vạn người, xác chết la liệt ven bờ biển các nước Đông Nam Á khiến thế giới bàng hoàng.
        Hành vi tạo nghiệp: Cộng nghiệp sát sinh tàn hại thủy tộc muôn loài của nhân loại tích tụ ngút ngàn, đến khi hội đủ nhân duyên trổ ra thiên tai sóng thần quét sạch vạn vật.
        Quả báo hiện tiền: Hàng vạn gia đình tan nát trong tích tắc, thi thể chất đống trôi dạt, các vong linh chết bất đắc kỳ tử lang thang chìm đắm trong đau đớn lạnh lẽo mịt mùng.
        Bài học & Chuyển hóa: Tác giả phát tâm bi mẫn quỳ tụng Kinh Kim Cang hồi hướng cho các nạn nhân sóng thần, cảm ứng hào quang Phật quang minh soi chiếu tiếp dẫn vô số vong linh siêu sinh thiện cảnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660529?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-39
      read_label: 📖 Đọc sách
    - id: 41
      title: Không nên ăn mặc hở hang
      summary: |-
        Nhân vật & Hoàn cảnh: Thực trạng xã hội tràn lan các biển quảng cáo, tranh ảnh thời trang và mạng xã hội lăng xê người mẫu ăn mặc thiếu vải, khêu gợi nhục dục nơi công cộng.
        Hành vi tạo nghiệp: Khoe thân hở hang kích động tâm tà dâm ô uế nơi người khác, khiến thanh thiếu niên khởi tâm dâm loạn, thủ dâm và sa đọa đạo đức.
        Quả báo hiện tiền: Người khêu gợi phải gánh chịu ác báo nhan sắc tàn phai sớm, mắc các bệnh nan y vùng kín lở loét hôi thối, sau khi chết đọa địa ngục cột đồng giường sắt chịu hình phạt thiêu đốt.
        Bài học & Chuyển hóa: Cần giữ gìn trang phục kín đáo trang nghiêm thanh tịnh; những ai dũng cảm tiêu hủy dẹp bỏ các ấn phẩm khiêu dâm gợi dục sẽ tích lũy được vô lượng phước báu trời người.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660530?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
