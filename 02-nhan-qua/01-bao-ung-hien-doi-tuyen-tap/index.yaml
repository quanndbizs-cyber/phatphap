      read_label: 📖 Đọc sách
    - id: 38
      title: Tháng 6 tuyết rơi
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện oan án chấn động thời hiện đại với hiện tượng thiên nhiên kỳ lạ 'tháng sáu tuyết rơi' cảm động đất trời chốn nhân gian.
        Hành vi tạo nghiệp: Kẻ quyền thế bức hại người lương thiện, dùng tiền mua chuộc công lý để đổ tội oan cho người vô tội chết trong uất ức ngút ngàn.
        Quả báo hiện tiền: Trời đất nổi cơn thịnh nộ giáng tuyết rơi giữa tháng sáu mùa hè; kẻ thủ ác sau đó bị sét đánh chết và gia đình gặp hỏa hoạn thiêu rụi toàn bộ cơ nghiệp.
        Bài học & Chuyển hóa: Lòng dạ con người có thể gian manh đổi trắng thay đen nhưng lưới trời lồng lộng; oan khuất thấu tận trời xanh ắt sẽ có ngày chân tướng hiển lộ đền tội thích đáng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660657?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-38
      read_label: 📖 Đọc sách
    - id: 39
      title: Tâm sự một nữ kỹ sư
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự sự xót xa của một nữ kỹ sư 37 tuổi ở huyện Bảo Thanh (tỉnh Hắc Long Giang) mắc bệnh ung thư túi mật thời kỳ cuối di căn khắp thân thể.
        Hành vi tạo nghiệp: Thuở trẻ có thói quen ham ăn thịt tươi sống, cá tôm sống bồi bổ, từng nhiều lần phá thai và có tính tình cố chấp sân hận với người thân.
        Quả báo hiện tiền: Cắt bỏ túi mật xong thì tử cung mọc 3 khối u ác tính, buồng trứng hai bên đều hoại tử mọc bướu độc, đau đớn cùng cực y học hiện đại hoàn toàn bó tay chờ chết.
        Bài học & Chuyển hóa: Đứng trước lưỡi hái tử thần, cô may mắn tiếp cận Phật pháp, phát nguyện ăn chay trường, chí thành quỳ lạy sám hối tội sát sinh và phá thai; kỳ tích bệnh tình thuyên giảm thần kỳ tìm lại sự sống.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660658?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-30
      read_label: 📖 Đọc sách
    - id: 40
      title: Vị khách đến sớm
      summary: |-
        Nhân vật & Hoàn cảnh: Đêm trước tiết Thanh minh, tác giả thức dậy sớm tụng khóa kinh sáng, vừa mở rèm cửa sổ nhìn ra bàng hoàng chứng kiến cảnh tượng rợn người nơi cõi vô hình.
        Hành vi tạo nghiệp: Hàng ngàn vong linh cô hồn chết bờ chết bụi, uổng tử đói khát chìm đắm trong bóng tối lạnh lẽo vì lúc sống không biết tu phúc tạo nghiệp sát đọa lạc.
        Quả báo hiện tiền: Chịu cực hình đói khát lang thang cơ cực nơi ngạ quỷ, chen chúc tìm đến trước cửa sổ đạo tràng mong cầu nương tựa ánh sáng kinh Phật để được siêu thoát.
        Bài học & Chuyển hóa: Người tu học Phật cần phát đại từ bi tâm, mỗi khi tụng kinh lễ bái phải chí tâm hồi hướng công đức thí thực cho khắp pháp giới chúng sinh cõi âm đồng triêm lợi lạc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660659?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-31
      read_label: 📖 Đọc sách
    - id: 41
      title: Tự tử đi về đâu
      summary: |-
        Nhân vật & Hoàn cảnh: Lời khai thị rúng động của Hòa thượng Diệu Pháp về chân tướng cảnh giới đau khổ cùng cực của những linh hồn người tự tử chết yểu.
        Hành vi tạo nghiệp: Trong cơn quẫn trí bế tắc hủy hoại thân mạng cha mẹ ban cho, tưởng rằng tự sát là kết thúc mọi khổ đau bế tắc nơi cõi trần.
        Quả báo hiện tiền: Linh hồn bị giam cầm tại nơi tự tử, ngày ngày phải lặp lại hành động đau đớn tự sát theo đúng giờ giấc cũ, chịu sự đói khát lạnh lẽo và đọa thẳng địa ngục ngàn năm.
        Bài học & Chuyển hóa: Thân người khó được Phật pháp khó nghe; tự sát không giải quyết được nghiệp chướng mà chỉ tăng thêm vô lượng tội lỗi; hãy dũng cảm đối diện nghịch cảnh bằng sám hối và niệm Phật.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660660?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-41
      read_label: 📖 Đọc sách
    - id: 42
      title: Quán nhậu Long Hổ
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thuật của chàng trai trẻ làm phục vụ bàn tại 'Quán Nhậu Long Hổ' chuyên kinh doanh thịt dã thú rừng rậm vùng thâm sơn hẻo lánh.
        Hành vi tạo nghiệp: Ông chủ quán họ Vi mưu mô dùng đủ loại bẫy săn bắt giết thịt tê tê, trăn rắn, cầy hương, nai hoẵng phục vụ bàn nhậu đại gia kiếm bạc tỷ mỗi tháng.
        Quả báo hiện tiền: Ông chủ Vi đang lúc giàu có tột đỉnh thì bị tai nạn giao thông xe tải cán nát bấy cơ thể đứt lìa tứ chi y hệt cảnh thú rừng bị phanh thây mổ xẻ; quán nhậu sụp đổ đóng cửa.
        Bài học & Chuyển hóa: Kiếm tiền trên xương máu đau đớn của muôn loài hoang dã là con đường ngắn nhất dẫn đến cái chết thảm khốc banh thây xẻ thịt; người đời hãy mau chóng tỉnh ngộ từ bỏ nghề sát sinh dã man.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660661?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-33
      read_label: 📖 Đọc sách
    - id: 43
      title: Chuyện các khoa học gia
      summary: |-
        Nhân vật & Hoàn cảnh: Cư sĩ Từ Quang có cha mẹ đều là những nhà khoa học lỗi lạc công tác tại Viện Khoa học Trung Quốc, cả đời chỉ tin vào thực nghiệm khoa học duy vật.
        Hành vi tạo nghiệp: Khởi tâm hoài nghi chánh pháp thế gian, phủ nhận thế giới tâm linh nhân quả luân hồi cho đến khi bà mẹ mắc bệnh nan y bước một chân vào quỷ môn quan.
        Quả báo hiện tiền: Các giáo sư y khoa đầu ngành đều lắc đầu bó tay trước căn bệnh quái ác của người mẹ khoa học gia, sự sống chỉ còn tính từng giờ trên giường bệnh.
        Bài học & Chuyển hóa: Người con Từ Quang dốc lòng quỳ tụng Kinh Địa Tạng và niệm Phật suốt ba ngày đêm cứu sống mẹ bình phục kỳ diệu; cảm hóa trọn vẹn cả gia đình khoa học gia quy y Tam Bảo thâm tín Phật pháp.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660662?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
