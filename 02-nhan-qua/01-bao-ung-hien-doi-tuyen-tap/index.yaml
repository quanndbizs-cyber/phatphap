    - id: 24
      title: Linh Xá Cứu Nạn Dân
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện cảm động về loài linh xà (rắn thần) có linh tính báo ơn cứu mạng dân làng thoát khỏi trận lũ quét kinh hoàng ở vùng núi rừng hiểm trở.
        Hành vi tạo nghiệp: Dân làng trước đây từng có tâm từ bi giải cứu con rắn lớn thoát khỏi bẫy rập của cánh thợ săn hung bạo và thả nó trở về hang sâu chốn thâm sơn.
        Quả báo hiện tiền: Nước lũ dâng cao cuốn trôi đường sá, con linh xà bơi qua cuộn thân làm cầu nối cho người dân leo qua bờ an toàn cứu sống hàng chục mạng người.
        Bài học & Chuyển hóa: Vạn vật chúng sinh đều có Phật tính và tình cảm sâu nặng; gieo một niệm lành cứu vớt sinh linh ắt gặt hái phước đức cứu mạng vô giá khi hoạn nạn cận kề.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660561?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
