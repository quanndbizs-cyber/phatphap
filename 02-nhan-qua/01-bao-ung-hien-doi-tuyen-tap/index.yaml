    - id: 28
      title: Bái Kinh Cứu Mẹ
      summary: |-
        Nhân vật & Hoàn cảnh: Người con trai chí hiếu có mẹ già mắc bệnh ung thư giai đoạn cuối đau đớn liệt giường, bệnh viện trả về chuẩn bị hậu sự trong tuyệt vọng.
        Hành vi tạo nghiệp: Người mẹ thời trẻ từng tạo nghiệp sát sinh nuôi gà vịt buôn bán và buông lung khẩu nghiệp khiến tuổi già thọ nhận thân thể bệnh tật hiểm nghèo.
        Quả báo hiện tiền: Đau đớn quằn quại từng cơn, không ăn uống được, sự sống mong manh chỉ còn tính từng ngày khiến cả gia đình chìm trong nước mắt bi thương.
        Bài học & Chuyển hóa: Người con phát đại nguyện quỳ lạy từng chữ trong bộ Kinh Địa Tạng và Kinh Pháp Hoa hồi hướng cứu mẹ; cảm ứng đất trời người mẹ thuyên giảm kỳ diệu và bình phục sống khỏe.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660565?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
