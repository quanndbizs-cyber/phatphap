    - id: 21
      title: Chuyện Anh K
      summary: |-
        Nhân vật & Hoàn cảnh: Anh K là một doanh nhân trẻ thành đạt có địa vị và tiền tài, nhưng vì say mê nhan sắc bên ngoài đã lén lút bao bồ nhí phụ bạc người vợ hiền đức.
        Hành vi tạo nghiệp: Dối trá vợ con, đem tiền của gia đình chu cấp cho nhân tình, sống buông thả trác táng trong các khách sạn sang trọng bỏ bê gia đình.
        Quả báo hiện tiền: Nhân tình ôm tiền bỏ trốn theo kẻ khác, công ty bị lừa đảo phá sản nợ nần ngập đầu, bản thân mắc bệnh viêm tuyến tiền liệt mãn tính đau buốt co giật ngày đêm.
        Bài học & Chuyển hóa: Mất hết tất cả mới nhận ra giá trị của người vợ tào khang; anh K quỳ gối xin lỗi vợ tha thứ, ăn chay niệm Phật sám hối tội lỗi và làm lại cuộc đời từ hai bàn tay trắng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660558?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
