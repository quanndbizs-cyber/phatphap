    - id: 26
      title: Đôi Mắt Âm Dương
      summary: |-
        Nhân vật & Hoàn cảnh: Trải nghiệm thực tế của một cư sĩ có khả năng nhìn thấy thế giới vô hình bằng đôi mắt âm dương đặc biệt bẩm sinh.
        Hành vi tạo nghiệp: Người trần mắt thịt vô tri buông thả tạo nghiệp nạo phá thai, sát sinh buôn bán thịt sống và gian lận trong các giao dịch thương mại hàng ngày.
        Quả báo hiện tiền: Nhìn thấy rõ ràng các vong thai đầy máu me bám chặt trên vai cổ người mẹ, và đàn oan hồn động vật bu kín quanh những sạp bán thịt tươi sống chờ cơ hội báo oán.
        Bài học & Chuyển hóa: Thế giới tâm linh nhân quả hiện hữu ngay trước mắt; đừng vì mắt phàm không thấy mà ngông cuồng làm càn; hãy sống lương thiện trì giới để tâm hồn luôn thanh tịnh bình an.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660563?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
