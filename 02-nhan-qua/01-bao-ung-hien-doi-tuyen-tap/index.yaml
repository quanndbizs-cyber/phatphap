      read_label: 📖 Đọc sách
    - id: 11
      title: Anh Kỹ Sư Kiến Trúc
      summary: |-
        Nhân vật & Hoàn cảnh: Một nam kỹ sư kiến trúc tài hoa xuất chúng, tốt nghiệp đại học danh tiếng nhưng cuộc đời liên tục gặp xui xẻo bế tắc, sự nghiệp lận đận nợ nần.
        Hành vi tạo nghiệp: Từ thời niên thiếu mắc chứng nghiện thủ dâm và xem phim ảnh đồi trụy suốt mười mấy năm, làm tiêu tán tinh khí thần và hao hụt sạch phước đức công danh.
        Quả báo hiện tiền: Trí nhớ sa sút, thi cử trượt dốc, các dự án thiết kế lớn đều bị hủy bỏ bất ngờ, cơ thể gầy yếu bạc nhược, vợ chồng ly tán cô độc nghèo túng.
        Bài học & Chuyển hóa: Nhờ gặp Phật pháp anh thức tỉnh dứt tuyệt thủ dâm, sám hối bái lạy Phật và khuyên bảo thanh niên giữ gìn phạm hạnh; vận mệnh từ đó dần dần hanh thông hồi phục.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660548?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
