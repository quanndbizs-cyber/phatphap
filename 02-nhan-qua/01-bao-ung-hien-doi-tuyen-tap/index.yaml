    - id: 12
      title: Bồ Tát mật hạnh
      summary: 'Nhân vật & Hoàn cảnh: Vị cư sĩ này mấy năm nay chưa từng gặp vợ con,
        đến giờ mới hội ngộ. Khi đó ông lái xe đón vợ con từ phi trường về, lúc sắp
        đến Vạn Phật Thành thì xảy ra tai nạn, vợ con bị thương nhẹ, chỉ mình ông
        tử vong....

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Thân thể mắc bệnh nan y hiểm nghèo hành hạ đau đớn, y học
        hiện đại bất lực; tinh thần bấn loạn chịu khổ báo hiện tiền thích đáng.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
        Đức nhắc nhở người đời mau chóng thức tỉnh, phát tâm ăn chay sám hối, dứt
        ác tu thiện và niệm Phật tiêu nghiệp chướng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/ce8e045a-32b6-482c-b4b9-37ea8102db1d/file/660631?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
