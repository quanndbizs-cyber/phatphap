      read_label: 📖 Đọc sách
    - id: 23
      title: Tội nặng báo nhẹ
      summary: |-
        Nhân vật & Hoàn cảnh: Hồ cư sĩ thuở chưa biết đạo là vua bếp đầu bếp đồ tể nổi danh, ra tay sát hại động vật chớp nhoáng, ngày ngày thuốc lá rượu thịt ê chề.
        Hành vi tạo nghiệp: Bàn tay đẫm máu tước đoạt sinh mạng vô số loài vật phục vụ bàn nhậu, tạo sát nghiệp nặng như núi và từng ngông cuồng coi Phật pháp là mê tín.
        Quả báo hiện tiền: Sau khi gặp Quả Khanh thức tỉnh ăn chay trường tu tập, trong chuyến hành hương Phổ Đà Sơn ông trượt chân té gãy dập xương đầu gối phải phẫu thuật.
        Bài học & Chuyển hóa: Nhờ công phu niệm Phật sám hối dũng mãnh, sát nghiệp đọa địa ngục đã được chuyển thành quả báo nhẹ ở gối chân, mổ xong không hề đau đớn và hồi phục thần kỳ; chứng minh lý "tội nặng báo nhẹ".
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660512?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-24
      read_label: 📖 Đọc sách
    - id: 24
      title: Bệnh nan y phải chí thành sám hối
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải đạo lý Đông y kết hợp Phật pháp về cội nguồn của các chứng nan y do phong hàn thất tình và đặc biệt là nghiệp báo chiêu cảm.
        Hành vi tạo nghiệp: Phóng túng lục dục, ăn uống tàn hại sinh linh, buông thả cảm xúc sân hận tà vạy làm tiêu tán chánh khí nuôi dưỡng tà ma trong thân thể.
        Quả báo hiện tiền: Thân thể phát sinh các khối u độc hại, khí huyết tắc nghẽn, đông tây y đều lắc đầu bất lực vì đây là bệnh nghiệp do oan gia trái chủ đòi nợ.
        Bài học & Chuyển hóa: Y học chữa bệnh thân nhưng sám hối chữa lành gốc bệnh nghiệp; người bệnh cần phát lồ tội lỗi, kiêng thịt ăn chay, quán xét nội tâm và quỳ lạy sám hối tha thiết để đẩy lùi tật bệnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660513?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-24
      read_label: 📖 Đọc sách
    - id: 25
      title: Bay qua miền hạnh phúc
      summary: |-
        Nhân vật & Hoàn cảnh: Một nữ Phật tử trung niên vốn là người hiền lành đức hạnh trong mắt mọi người, tháng 9/2006 bàng hoàng nhận kết quả ung thư vú thời kỳ cuối ác tính cực nặng.
        Hành vi tạo nghiệp: Dù bề ngoài hiền thục nhưng trong tâm còn ôm giữ oán hận dồn nén, ăn uống sát sinh tích tụ oán khí độc chất muôn loài qua nhiều năm tháng.
        Quả báo hiện tiền: Vú sưng mủ lở loét hoại tử đau đớn tận tủy xương, trải qua phẫu thuật cắt bỏ và hóa trị rụng tóc nôn mửa, cận kề cái chết trong cô đơn tột cùng.
        Bài học & Chuyển hóa: Buông bỏ mọi uất ức oán thù, cô dốc trọn sinh mạng còn lại để lạy Phật sám hối, ăn chay phóng sinh và niệm Phật bất thoái chuyển; tế bào ung thư teo biến kỳ diệu, tìm lại sự sống an lạc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660514?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-26
      read_label: 📖 Đọc sách
    - id: 26
      title: Vợ chồng họ Sử
      summary: |-
        Nhân vật & Hoàn cảnh: Sử cư sĩ và vợ là trí thức bận rộn công tác khảo cứu, mùa đông năm 1998 vì công việc mới khởi nghiệp nên đã khinh suất quyết định đi bệnh viện nạo phá thai.
        Hành vi tạo nghiệp: Giết hại đứa con vô tội đang tượng hình trong bụng mẹ vì lợi ích công việc và tiện nghi thế tục cá nhân.
        Quả báo hiện tiền: Năm 2003 người vợ phát bệnh trĩ rò mủ quanh hậu môn đau đớn thấu trời xanh, phẫu thuật mổ xẻ nhiều lần vẫn tái phát lở loét không dứt.
        Bài học & Chuyển hóa: Thức tỉnh hiểu rõ vết mổ rò rỉ hậu môn chính là hình phạt từ vong thai oán hận; hai vợ chồng ăn chay trường sám hối, phóng sinh tụng kinh giải oan, bệnh trĩ nan y liền khỏi hẳn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660515?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-27
      read_label: 📖 Đọc sách
    - id: 27
      title: Diễm Tuyết
      summary: |-
        Nhân vật & Hoàn cảnh: Diễm Tuyết 26 tuổi mang thai đứa con đầu lòng thì chồng là anh Trương công khai ngoại tình với cô Diệp, bỏ bê ruồng rẫy vợ bầu khiến cô đau khổ muốn quyên sinh.
        Hành vi tạo nghiệp: Tiền kiếp Diễm Tuyết từng là một người đàn ông dùng quyền thế cướp đoạt vợ của người khác (người vợ kiếp đó nay là cô Diệp, người chồng bị cướp kiếp đó nay là anh Trương).
        Quả báo hiện tiền: Bị nhân quả quả báo phụ bạc ngược lại, chịu nỗi đắng cay cùng cực của cảnh chồng chung và sự phản bội trong lúc mang nặng đẻ đau.
        Bài học & Chuyển hóa: Nhờ Quả Hồng soi rõ nhân quả tiền kiếp, cô buông bỏ hận thù, quỳ tụng 49 bộ Kinh Địa Tạng hồi hướng chuộc lỗi cho chồng và tình địch; kỳ tích người chồng hối hận quay về yêu thương gia đình.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660516?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-27
      read_label: 📖 Đọc sách
    - id: 28
      title: Mối tình tay ba
      summary: |-
        Nhân vật & Hoàn cảnh: Hiểu Mỹ là nữ doanh nhân giàu sang xinh đẹp sống êm ấm bên chồng là An Vĩ và hai con ngoan, nhưng vì nhan sắc và giao tế đã vướng vào lưới tình vụng trộm với anh Điền.
        Hành vi tạo nghiệp: Phạm giới tà dâm phá vỡ luân thường đạo lý, say đắm nhân tình đến mức anh Điền đến tận nhà ép An Vĩ ký đơn ly hôn nhường vợ.
        Quả báo hiện tiền: Bị người chồng phẫn nộ đánh đập tàn tệ trước mặt các con, danh dự sự nghiệp tan tành, gia đình tan nát, quẫn bách tuyệt vọng toan nhảy lầu tự tử.
        Bài học & Chuyển hóa: Được khai thị món nợ oan trái tiền kiếp của ái dục luân hồi, cô quỳ lạy sám hối tội tà dâm, phát tâm ăn chay niệm Phật chuộc lại lỗi lầm, cứu vãn được mái ấm và hàn gắn tình vợ chồng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660517?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-28
      read_label: 📖 Đọc sách
    - id: 29
      title: Quả báo tà hạnh
      summary: |-
        Nhân vật & Hoàn cảnh: Đôi vợ chồng trẻ bồng bé gái 2 tuổi thơ ngây đến cầu cứu đạo tràng trong tiếng khóc nghẹn ngào vì chứng bệnh quái ác chưa từng thấy.
        Hành vi tạo nghiệp: Tiền kiếp linh hồn đứa bé là một người đàn ông hoang dâm vô độ, cậy sức cậy tiền chuyên cưỡng bức làm nhục phụ nữ và lan truyền tà hạnh.
        Quả báo hiện tiền: Mới tròn 2 tuổi đã mọc một khối u ác tính khổng lồ ngay tại âm đạo lở loét đau đớn, các bác sĩ đầu ngành đều lắc đầu bất lực vì phẫu thuật sẽ nguy hiểm tính mạng.
        Bài học & Chuyển hóa: Bài học rúng động về quả báo của tội tà dâm đeo bám qua nhiều kiếp; cha mẹ bé thay mặt cốt nhục quỳ lạy sám hối Tam Bảo, ăn chay tụng kinh siêu giải nghiệp chướng tiền khiên.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660518?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-29
      read_label: 📖 Đọc sách
    - id: 30
      title: Ác báo sát sinh
      summary: |-
        Nhân vật & Hoàn cảnh: Chuyến tàu hỏa đầu xuân gặp đôi vợ chồng trẻ đưa bé gái 3 tuổi đi chữa bệnh, trên lưng đứa bé nổi chi chít những mụt bỏng loét phồng rộp như bị nước sôi thiêu đốt.
        Hành vi tạo nghiệp: Kiếp trước đôi vợ chồng nuôi vịt bị mèo rừng bắt trộm, bèn rình bẫy bắt được mèo rừng rồi nhẫn tâm đổ nước sôi sùng sục vào thùng nấu chết con vật dã man.
        Quả báo hiện tiền: Con mèo rừng ôm nỗi oán hận ngút trời tái sinh làm chính con gái họ, mang tấm lưng phỏng loét bỏng rát đau đớn bẩm sinh để ngày đêm hành hạ cha mẹ hao tài tốn của.
        Bài học & Chuyển hóa: Oan oan tương báo như bóng theo hình; cha mẹ bé bàng hoàng phát nguyện ăn chay trường, phóng sinh và tụng Kinh Địa Tạng hồi hướng cho vong linh mèo rừng tha thứ buông xả oán thù.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660519?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-30
      read_label: 📖 Đọc sách
    - id: 31
      title: Cảnh sát và phú ông
      summary: |-
        Nhân vật & Hoàn cảnh: Tiết Thành và Sử Đình là cặp vợ chồng kim đồng ngọc nữ giàu có, nhưng bé gái út Bảo Châu cầu tự được lại có tính nết kỳ quái: hễ thấy cha là nổi điên gào thét đánh chửi.
        Hành vi tạo nghiệp: Đời trước Tiết Thành là cảnh sát tham tàn, bức hại vu oan một phú ông đến chết trong ngục tối để chiếm đoạt tài sản kếch xù của nạn nhân.
        Quả báo hiện tiền: Vị phú ông ôm hận đầu thai làm đứa con gái rượu Bảo Châu, liên tục ốm đau quặt quẹo và trút cơn thịnh nộ bạo hành lên người cha mỗi khi ông bước chân về nhà.
        Bài học & Chuyển hóa: Tiết Thành run sợ trước luật nhân quả tơ hào không sai, đem toàn bộ tài sản làm việc phúc thiện, quỳ trước Tam Bảo sám hối tội xưa và tụng kinh giải oan cho con gái.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660523?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-31
      read_label: 📖 Đọc sách
    - id: 32
      title: Hai cậu quý tử
      summary: |-
        Nhân vật & Hoàn cảnh: Cán bộ công an lão thành Thân Khoa Trường phá án lừng lẫy, công danh vang dội nhưng gia đình đau đớn vì hai cậu quý tử nghịch ngợm phá gia chi tử.
        Hành vi tạo nghiệp: Đời trước ông Thân làm quan cậy quyền ức hiếp dân chúng, xử oan ép chết hai thương nhân giàu có và tịch thu toàn bộ gia sản làm của riêng.
        Quả báo hiện tiền: Hai nạn nhân oán thù đầu thai làm hai con trai: con lớn say rượu là đập phá đánh đập cha mẹ, con út cờ bạc nợ nần bòn rút hàng trăm vạn đồng khiến gia sản tiêu tán.
        Bài học & Chuyển hóa: Con cái đến trong đời có bốn duyên đền ơn, trả oán, đòi nợ, trả nợ; cha mẹ muốn hóa giải nghịch tử phải ăn chay sám hối nghiệp bất chính và dùng công đức tu hành hồi hướng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660521?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-32
      read_label: 📖 Đọc sách
    - id: 33
      title: Chủ và tớ
      summary: |-
        Nhân vật & Hoàn cảnh: Bà Trương là Tổng giám đốc đại xí nghiệp hơn một vạn công nhân hiển hách, nhưng đau đớn bất lực trước cậu con trai tên Cường nghiện game online bỏ học, đánh cha chửi mẹ.
        Hành vi tạo nghiệp: Tiền kiếp bà Trương là phú hộ giàu có tàn ác, bóc lột và đánh đập dã man một người làm công khốn khổ đến kiệt sức bỏ mạng nơi xó nhà.
        Quả báo hiện tiền: Người đầy tớ tái sinh làm con trai Cường để đòi nợ, cắm mặt vào thế giới ảo, hung bạo mắng chửi đánh đập cha mẹ khiến bà Trương uất ức sống dở chết dở.
        Bài học & Chuyển hóa: Thức tỉnh trước món nợ tớ chủ tiền khiên, vợ chồng bà Trương quỳ tụng 49 bộ Kinh Địa Tạng sám hối tội hà khắc xưa; cảm ứng con trai thức tỉnh từ bỏ game online và đi học trở lại.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660520?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-33
      read_label: 📖 Đọc sách
    - id: 34
      title: Sống lại
      summary: |-
        Nhân vật & Hoàn cảnh: Cư sĩ Tịnh Hằng xuất thân nghèo khó có cha nghiện rượu bạo lực, khi lớn lên làm ăn khấm khá thành đạt thì liền sa ngã vào lối sống buông tuồng trụy lạc.
        Hành vi tạo nghiệp: Suốt nhiều năm ăn chơi trác táng, sát sinh nhậu nhẹt tiếp khách, quan hệ bất chính tà dâm và khinh khi Tam Bảo chánh pháp.
        Quả báo hiện tiền: Cơ nghiệp làm ăn sụp đổ tan tành, thân thể mắc đủ chứng bệnh hiểm nghèo tàn phá, nội tâm hoảng loạn sợ hãi đứng bên bờ vực cái chết tăm tối.
        Bài học & Chuyển hóa: Gặp Phật pháp như người chết đuối vớ được phao, ông cắt đứt rượu thịt, ăn chay nghiêm trì ngũ giới, sám hối tụng kinh lạy Phật tái tạo lại cuộc đời mới tràn đầy hỷ lạc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660522?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-34
      read_label: 📖 Đọc sách
    - id: 35
      title: Đồng nghiệp chiêu cảm
      summary: |-
        Nhân vật & Hoàn cảnh: Cô Mỹ Đình 30 tuổi liên tục gặp xui xẻo, bị công ty lừa đảo mất sạch tiền của nợ nần ngập đầu, bạn trai phụ bạc lừa tình khiến cô phải nạo thai cay đắng.
        Hành vi tạo nghiệp: Mẹ cô là bà Mỹ Linh thời trẻ cậy nhan sắc ngoại tình với hàng loạt nam lãnh đạo để thăng tiến, phá thai 8 lần và sống buông thả phóng túng.
        Quả báo hiện tiền: Ác nghiệp tà dâm của mẹ chiêu cảm quả báo lên con cái; bà mẹ bị viêm ruột thừa mổ 4 lần vẫn tái phát, gai xương hành hạ, con gái Mỹ Đình tình duyên lận đận nợ nần cùng cực.
        Bài học & Chuyển hóa: Bà Mỹ Linh khóc lóc thú nhận tội lỗi, ngày ngày quỳ tụng Kinh Địa Tạng sám hối tội tà dâm sát sinh để chuộc lỗi với các thai nhi và cứu vãn vận mệnh tương lai cho con gái.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660524?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
