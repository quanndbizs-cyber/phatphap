    - id: 16
      title: Báo ứng không ngờ
      summary: 'Nhân vật & Hoàn cảnh: Ông Hạ có đứa con trai tên Cún năm 12 tuổi bỗng
        mắc bệnh tâm thần phân liệt, tính tình hung bạo hay đập phá đồ đạc và cầm
        dao rượt đuổi cha mẹ, gia đình tan nát.

        Hành vi tạo nghiệp: Tiền kiếp ông Hạ là một tên quan tham mưu mô hiểm ác,
        từng vu oan giá họa để cướp đoạt toàn bộ gia sản của một thương gia nghèo
        khiến người đó uất ức tự vẫn trong ngục tối.

        Quả báo hiện tiền: Vị thương gia nọ đầu thai làm con trai ông để đòi nợ, phá
        tán toàn bộ gia tài tích cóp và hành hạ tinh thần ông suốt ngày đêm không
        cho giây phút bình yên.

        Bài học & Chuyển hóa: Hòa thượng vạch trần món nợ tiền kiếp; ông Hạ bàng hoàng
        sụp lạy trước bàn thờ Phật sám hối tội lỗi gian ác xưa kia, phát tâm tu hành
        cúng dường cầu xin giải nghiệp.'
