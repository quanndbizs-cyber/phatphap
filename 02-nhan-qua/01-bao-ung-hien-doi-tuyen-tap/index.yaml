      summary: 'Nhân vật & Hoàn cảnh: Mỹ Đình năm nay 30 tuổi, công tác sinh hoạt
        gì cũng không thuận lợi. Mấy năm trước, vì ham lợi nhuận nhiều, cô từ bỏ công
