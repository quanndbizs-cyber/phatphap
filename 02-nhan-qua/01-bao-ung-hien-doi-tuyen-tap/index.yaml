    - id: 12
      title: Đọc nhiều kinh Phật tăng trí tuệ
      summary: 'Nhân vật & Hoàn cảnh: Một nữ cư sĩ mắc bệnh tim nhiều năm chữa không
        khỏi, tâm trí hẹp hòi hay lo âu sợ hãi, đến xin Hòa thượng Diệu Pháp chỉ dạy
        phương pháp chữa trị.

        Hành vi tạo nghiệp: Tu hành nhiều năm nhưng chỉ tụng đọc vài câu ngắn ngủi,
        không chịu thâm nhập kinh tạng, tâm trí cố chấp phiền não, thường xuyên nghi
        kỵ và chấp ngã nặng nề.

        Quả báo hiện tiền: Tâm khí uất kết làm nghẽn tắc mạch máu tim, sinh ra chứng
        tim đập loạn nhịp, đau ngực khó thở, tinh thần suy sụp.

        Bài học & Chuyển hóa: Hòa thượng khuyên bà mở rộng đọc tụng các bộ kinh Đại
        Thừa như Kim Cang, Lăng Nghiêm, Pháp Hoa, Địa Tạng để khai mở trí tuệ Bát
        Nhã; nhờ hiểu lý vô ngã tâm bà buông xả an vui, huyết mạch lưu thông và bệnh
        tim lành hẳn.'
