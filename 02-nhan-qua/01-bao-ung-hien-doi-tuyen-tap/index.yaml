    - id: 46
      title: Lòng từ của Bồ Tát Địa Tạng
      summary: |-
        Nhân vật & Hoàn cảnh: Liêm Minh chia sẻ câu chuyện có thật trong gia đình: người cha già bị bệnh tim nặng phải phẫu thuật, mùa đông bệnh tim tái phát trầm trọng liệt giường không thể tự mặc áo.
        Hành vi tạo nghiệp: Người cha thời trẻ tạo nghiệp sát sinh và ăn thịt thú vật tích tụ độc tố, đêm đêm ác mộng thấy quỷ sứ chập chờn đòi mạng.
        Quả báo hiện tiền: Bệnh tim trở nặng nguy kịch, hoa mắt chóng mặt đau đớn, mất ngủ triền miên, y học bó tay chờ đợi lưỡi hái tử thần.
        Bài học & Chuyển hóa: Người con chí hiếu thay cha quỳ tụng Kinh Địa Tạng, ăn chay phóng sinh hồi hướng công đức cho các oan linh; người cha bình phục kỳ diệu khỏe mạnh, gia đình phát tâm thâm tín Tam Bảo.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660535?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
