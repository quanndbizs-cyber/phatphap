    - id: 17
      title: Chứng bệnh sợ bóng tối
      summary: 'Nhân vật & Hoàn cảnh: Một phụ nữ hơn 40 tuổi mắc chứng sợ bóng tối
        kỳ lạ từ thuở ấu thơ; cứ hễ trời sụp tối là cả người run rẩy hoảng loạn, phải
        bật sáng trưng tất cả bóng đèn trong nhà mới dám thở.

        Hành vi tạo nghiệp: Kiếp trước bà từng là một người đàn ông keo kiệt tàn nhẫn,
        đã nhốt nhịn đói một con mèo mẹ cùng đàn mèo con trong hầm tối tăm kín mít
        nhiều ngày cho đến chết ngạt chỉ vì nó lỡ ăn vụng một miếng thịt.

        Quả báo hiện tiền: Nỗi kinh hoàng, tuyệt vọng trong bóng tối của đàn mèo con
        chết ngạt đã chuyển thành chứng bệnh ám ảnh sợ bóng tối kiếp này của bà, thuốc
        men hoàn toàn bất lực.

        Bài học & Chuyển hóa: Bà phát tâm chí thành sám hối nghiệp ác với đàn mèo
        con, thường xuyên cúng dường đèn dầu nơi Tam Bảo để xua tan bóng tối u minh,
        nhờ đó tâm thần dần trở lại an định bình an.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660411?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
