      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-39
      read_label: 📖 Đọc sách
    - id: 43
      title: Lời người dịch
      summary: 'Nhân vật & Hoàn cảnh: Lời bộc bạch tâm huyết của dịch giả Sư Cô Hạnh
        Đoan gửi gắm đến quý độc giả và Phật tử bốn phương khi hoàn thành tập 3 Báo
        Ứng Hiện Đời.

        Hành vi tạo nghiệp: Thế nhân thời nay mê mờ theo đuổi danh lợi, xem nhẹ luật
        nhân quả báo ứng, phóng túng tạo ác nghiệp mà không hay biết hiểm họa cận
        kề.

        Quả báo hiện tiền: Đau khổ triền miên trong biển luân hồi lục đạo, ốm đau
        bệnh tật bủa vây không lối thoát, chết đi đọa vào ba đường ác.

        Bài học & Chuyển hóa: Người dịch phát nguyện đem ánh sáng nhân quả soi rọi
        nhân gian, khuyến hóa mọi người quay về nương tựa chánh pháp, dứt ác tu thiện
        và niệm Phật cầu sinh Tịnh Độ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660486?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-43
      read_label: 📖 Đọc sách
    - id: 44
      title: Vì sao các tu sĩ hay bệnh nặng
      summary: 'Nhân vật & Hoàn cảnh: Lời giải thích minh triết của Hòa thượng Diệu
        Pháp về thắc mắc vì sao các bậc tu sĩ chân chính đôi khi lại mắc phải những
        chứng bệnh hiểm nghèo nan y.

        Hành vi tạo nghiệp: Người tu hành phát đại Bồ Đề tâm gánh vác nghiệp chướng
        cho chúng sinh, đồng thời chuyển hóa định nghiệp nặng của nhiều đời thành
        quả báo nhẹ ở hiện kiếp.

        Quả báo hiện tiền: Thân bệnh là cơ hội thanh lọc tàn dư nghiệp chướng cuối
        cùng, dứt sạch mọi nợ nần thế gian trước khi xả bỏ báo thân giả tạm.

        Bài học & Chuyển hóa: Chớ thấy người tu có bệnh mà sinh tâm nghi ngờ chánh
        pháp; hãy noi gương nhẫn nhục kiên cường và tinh tấn tu hành để liễu thoát
        tử sinh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660487?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-44
      read_label: 📖 Đọc sách
    - id: 45
      title: Hồi ký của sư Hằng Nghiêm
      summary: Vào thời Nhật xâm chiếm Trung Quốc, phi cơ Nhật oanh tạc cả tỉnh Hồ
        Bắc làng quê tôi. Năm đó tôi 22 tuổi, cha mẹ dẫn hết cả nhà đến ga Hạ Thắng
        Kiều để lên xe lửa đi Trùng Khánh....
