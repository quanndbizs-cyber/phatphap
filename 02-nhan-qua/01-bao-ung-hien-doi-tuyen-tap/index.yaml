      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=H7HdGhYes1Y
    - id: 21
      title: Nhân nào quả nấy
      summary: 'Nhân vật & Hoàn cảnh: Bác Trương là người luyện khí công lâu năm và
        thường dùng khí công chữa bệnh cho người khác, nhưng bản thân lại mắc chứng
        đau đầu kinh niên dữ dội, đầu óc lúc nào cũng quay cuồng say xẩm như uống
        phải rượu độc.

        Hành vi tạo nghiệp: Thường xuyên sát sinh ăn nhậu các loại rượu ngâm rắn độc,
        bọ cạp, rết sống và ngâm nuốt sinh linh còn cử động để bồi bổ nội công và
        tăng cường sinh lực.

        Quả báo hiện tiền: Độc tố và oan hồn loài bò sát tụ lại trên đỉnh đầu ông
        hành hạ cắn xé, khiến các huyệt đạo bế tắc, đầu óc đau nhức như muốn nổ tung.

        Bài học & Chuyển hóa: Hòa thượng chỉ rõ muốn hết bệnh phải chấm dứt ngay việc
        uống rượu ngâm thú độc, chí thành sám hối nghiệp sát và phóng sinh loài bò
        sát để chuộc lại lỗi lầm.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660412?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-23
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=RdKsWFM3aTM
    - id: 22
      title: Hộ trì Phật Pháp bằng đức hạnh
      summary: 'Nhân vật & Hoàn cảnh: Một nữ cư sĩ rất hăng hái đi chùa làm công quả,
        cúng dường tiền của nhưng gia đình vẫn gặp nghịch cảnh triền miên và bản thân
        mắc bệnh hiểm nghèo nan y.

        Hành vi tạo nghiệp: Đi chùa hộ trì Tam Bảo nhưng tâm còn nhiều tham sân si,
        thích tranh quyền đoạt vị, buôn bán trục lợi nơi cửa Phật, hay gièm pha đố
        kỵ với các bạn đồng tu khác.

        Quả báo hiện tiền: Phước đức hữu lậu không bù nổi ác nghiệp thân khẩu ý, khiến
        gia đạo bất an, bản thân chịu quả báo bệnh tật hao tài tốn của.

        Bài học & Chuyển hóa: Hòa thượng khai thị hộ trì Phật pháp phải lấy đức hạnh
        thanh tịnh làm gốc; người tu phải tu tâm dưỡng tánh trước tiên, lấy khiêm
        hạ từ bi đối đãi mọi người mới mong tích tụ công đức chân thật.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660413?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-24
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=U1nNBC3irKM
    - id: 23
      title: Quả báo của việc mua bán thịt động vật sống (Rắn mối)
      summary: 'Nhân vật & Hoàn cảnh: Ngô tiên sinh là thương gia chuyên thu mua rắn
        mối và tắc kè sống số lượng lớn để cung cấp cho các nhà hàng đặc sản và lò
        ngâm rượu thuốc bổ, kiếm lợi nhuận kết xù.

        Hành vi tạo nghiệp: Trực tiếp bẫy bắt, nhốt chật chội và bán hàng vạn con
        rắn mối sống để người ta lột da, mổ bụng, ngâm rượu sống trong đau đớn tột
        cùng.

        Quả báo hiện tiền: Toàn thân phát bệnh vảy ngứa lở loét kinh hoàng, các ngón
        tay co quắp như móng vuốt bò sát, da dẻ bong tróc tanh tưởi, ngứa ngáy thấu
        tận xương tủy dù bôi thuốc gì cũng rát buốt không ngủ được.

        Bài học & Chuyển hóa: Nhận ra quả báo hiện tiền khủng khiếp từ muôn ngàn sinh
        linh rắn mối bị sát hại, ông kinh hãi bỏ nghề buôn bán thú sống, phát tâm
        phóng sinh và ăn chay chuộc tội.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660414?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
