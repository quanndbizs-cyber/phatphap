    - id: 37
      title: Thái Minh Thông
      summary: |-
        Nhân vật & Hoàn cảnh: Gia đình tiên sinh Thái Minh Thông vốn là phú hộ giàu sang điền sản bao la, nuôi nhiều trâu bò cày cấy ruộng đồng ở quê nhà.
        Hành vi tạo nghiệp: Ông cố xỏ mũi nghé bị nghé đá chết; ông nội nổi giận cầm búa đập chết con nghé dã man bất chấp trâu mẹ quỳ lạy khóc rống van xin thảm thiết.
        Quả báo hiện tiền: Trâu mẹ ôm hận đập đầu tự tử; sau đó gia đình họ Thái liên tiếp gặp đại nạn: người chết bất đắc kỳ tử, con cháu đời sau sinh ra tật nguyền câm điếc, gia sản tiêu tán sạch sành sanh.
        Bài học & Chuyển hóa: Nước mắt oán hận của loài trâu mẹ quỳ lạy van xin là lời cảnh tỉnh rợn người về sự tàn bạo của con người; sát hại loài vật có tình cảm sâu nặng ắt chuốc lấy đại họa tuyệt tự.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660656?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
