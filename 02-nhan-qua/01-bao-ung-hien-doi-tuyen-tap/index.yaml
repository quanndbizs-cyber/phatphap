    - id: 11
      title: Ăn thịt chướng ngại thiện chung
      summary: 'Nhân vật & Hoàn cảnh: Một phụ nữ hơn 50 tuổi đã quy y niệm Phật nhiều
        năm nhưng vẫn không dứt được thói quen ăn thịt cá bồi bổ, lại mắc bệnh tiểu
        đường nặng chạy chữa khắp nơi không khỏi.

        Hành vi tạo nghiệp: Tuy miệng tụng kinh niệm Phật nhưng tâm vẫn luyến ái vị
        ngon của thịt cá, thường xuyên ăn hải sản tươi sống và chim muông bồi bổ sức
        khỏe.

        Quả báo hiện tiền: Thân thể nặng trĩu bệnh tật, tâm trí tán loạn; Hòa thượng
        Diệu Pháp cảnh giác rằng sát sinh ăn thịt là chướng ngại lớn nhất lúc lâm
        chung, oan gia sẽ hiện đến đòi nợ khiến mất chánh niệm khó vãng sinh.

        Bài học & Chuyển hóa: Người phụ nữ giật mình kinh sợ trước bờ vực sinh tử,
        lập tức phát nguyện đoạn tuyệt thịt cá, chuyển sang ăn chay trường thanh tịnh
        và dốc lòng niệm Phật cầu sanh Cực Lạc.'
