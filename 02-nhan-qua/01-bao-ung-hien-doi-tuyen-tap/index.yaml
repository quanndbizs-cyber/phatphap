      read_label: 📖 Đọc sách
    - id: 31
      title: Tình chấp uyên ương
      summary: |-
        Nhân vật & Hoàn cảnh: Một người vốn theo chủ nghĩa vô thần mới kết hôn được sáu tháng, nửa đêm thức dậy bàng hoàng chạm trán một nữ quỷ áo trắng mặt đầy máu me hiện hình.
        Hành vi tạo nghiệp: Tiền kiếp người chồng từng thề non hẹn biển rồi phụ bạc ruồng rẫy một cô gái khiến người yêu phẫn uất tự vẫn mang theo mối hận thù sâu nặng.
        Quả báo hiện tiền: Nữ quỷ tìm về báo oán đòi mạng, quấy phá khiến gia đình mới cưới ngày đêm lục đục, người chồng suy sụp thần kinh hoảng loạn sợ hãi phát điên.
        Bài học & Chuyển hóa: Nhờ gặp thiện tri thức khai thị giải trừ tình chấp oan kết; người chồng quỳ trước Tam Bảo sám hối tội phụ tình tiền kiếp, tụng kinh siêu độ giúp nữ quỷ siêu thoát buông bỏ oán hận.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660650?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
