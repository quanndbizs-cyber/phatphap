      read_label: 📖 Đọc sách
    - id: 33
      title: Vấn Xuyên Đại Địa Chấn
      summary: |-
        Nhân vật & Hoàn cảnh: Thảm họa đại địa chấn Vấn Xuyên (Tứ Xuyên) năm 2008 làm rung chuyển đất trời, cướp đi sinh mạng hàng vạn người trong tích tắc kinh hoàng.
        Hành vi tạo nghiệp: Phân tích về cộng nghiệp sát sinh sâu nặng của vùng miền nơi các lò mổ và quán nhậu thịt động vật mọc lên như nấm phục vụ dục vọng ăn uống.
        Quả báo hiện tiền: Nhà cửa trường học sụp đổ chôn vùi vô số nạn nhân, cảnh tượng tang thương thảm khốc khiến cả thế giới bàng hoàng xót xa rơi lệ.
        Bài học & Chuyển hóa: Sự sống sót kỳ diệu của những gia đình ăn chay trường trì niệm danh hiệu Quán Âm chứng minh sức mạnh của thiện nghiệp; khuyên nhân loại mau chóng dứt trừ sát sinh tích đức.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660570?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
