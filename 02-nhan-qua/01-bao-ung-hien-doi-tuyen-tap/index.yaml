    - id: 17
      title: Ích Lợi Kỳ Diệu Của Việc Giới Dâm
      summary: |-
        Nhân vật & Hoàn cảnh: Đúc kết những lợi ích thù thắng không thể nghĩ bàn của việc giữ gìn giới dâm thanh tịnh đối với thân tâm và sự nghiệp của hành giả.
        Hành vi tạo nghiệp: Người buông thả phóng túng tà dâm làm cạn kiệt tủy não, tổn thương nguyên khí trời ban, khiến thần sắc tối tăm và phúc lộc tiêu tán.
        Quả báo hiện tiền: Giữ giới dâm nghiêm mật giúp tinh ba tụ lại, thân thể cường tráng không bệnh tật, trí tuệ mẫn tiệp minh triết, dung mạo đoan nghiêm sáng rỡ được người người kính trọng.
        Bài học & Chuyển hóa: Người kiên quyết giới dâm được chư thiên thiện thần ngày đêm âm thầm bảo hộ, gặp hung hóa cát, công danh sự nghiệp phát đạt và con cháu đời sau đỗ đạt hiển vinh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660554?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
