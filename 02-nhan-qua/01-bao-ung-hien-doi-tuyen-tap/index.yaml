    - id: 18
      title: Lòng tốt của cây Tượng Ba
      summary: 'Nhân vật & Hoàn cảnh: Cô gái trẻ 28 tuổi mắc chứng bệnh thính giác
        kỳ quái: tai lúc nghe được lúc không, chữa trị khắp các bệnh viện chuyên khoa
        tai mũi họng đều vô hiệu.

        Hành vi tạo nghiệp: Buôn bán hàng điện tử và mỹ phẩm giả mạo, dùng lời dối
        trá lừa gạt khách hàng ham rẻ để kiếm lời từng đồng bạc bất chính.

        Quả báo hiện tiền: Bị đối tác lừa gạt lại một vố lớn mất sạch toàn bộ vốn
        liếng tích cóp, đôi tai điếc nghễnh ngãng không nghe rõ lời người khác, tâm
        thần luôn hoang mang lo sợ.

        Bài học & Chuyển hóa: Tham chút lợi nhỏ trước mắt để rồi chịu thiệt hại to
        lớn về sau; người tu Phật phải giữ gìn giới không nói dối, buôn bán chân thật
        mới có phước đức bền lâu.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660460?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
