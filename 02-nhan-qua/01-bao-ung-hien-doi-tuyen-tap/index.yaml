    - id: 46
      title: Hồi hướng
      summary: 'Nhân vật & Hoàn cảnh: Bài văn phát nguyện hồi hướng công đức sâu sắc
        của toàn thể ban biên tập, dịch giả và quý Phật tử ấn tống bộ sách Báo Ứng
        Hiện Đời tập 3.

        Hành vi tạo nghiệp: Hóa giải tất cả những oan kết, tội chướng vô minh từ vô
        thỉ kiếp đến nay do tham sân si thúc đẩy thân khẩu ý tạo tác.

        Quả báo hiện tiền: Nguyện cho tất cả chúng sinh hữu duyên thoát khỏi bệnh
        tật tai ương, tiêu trừ nghiệp chướng và dứt sạch khổ đau nơi cõi trần.

        Bài học & Chuyển hóa: Đem công đức lành này hồi hướng khắp mười phương pháp
        giới, cầu nguyện quốc thái dân an, cha mẹ hiện tiền tăng long phước thọ, vạn
        loại đồng vãng sinh Cực Lạc.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660489?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
