      read_label: 📖 Đọc sách
    - id: 42
      title: Phần 2 - Lời sám hối của cô người mẫu
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thuật đẫm nước mắt của cô người mẫu trẻ hơn 20 tuổi sinh ra trong gia đình giàu có nhưng thiếu tình thương, sớm sa đọa vào nghề chụp ảnh khỏa thân khêu gợi.
        Hành vi tạo nghiệp: Bán rẻ thân xác chụp ảnh gợi dục cho các tạp chí, kích động tà dâm cho hàng vạn độc giả, sống buông thả trác táng và phá thai nhiều lần.
        Quả báo hiện tiền: Thân thể mắc bệnh phụ khoa nan y lở loét hôi thối hành hạ đau đớn, nhan sắc tàn tạ, tâm thần trầm cảm sợ hãi không dám ngẩng đầu nhìn ai, sống dở chết dở.
        Bài học & Chuyển hóa: Rúng động lương tâm trước luật nhân quả báo ứng, cô phát tâm giã từ nghề người mẫu, quỳ trước Tam Bảo sám hối tội truyền bá tà dâm và khuyên bảo thế nhân chớ đi vào vết xe đổ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660531?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-41
      read_label: 📖 Đọc sách
    - id: 43
      title: Niềm đau tuổi nhỏ
      summary: |-
        Nhân vật & Hoàn cảnh: Ký ức tuổi thơ học lớp 5 bên dòng sông Đạm Thủy Đài Bắc của tác giả cùng hai người bạn học rong chơi ven bờ cỏ sau giờ tan trường.
        Hành vi tạo nghiệp: Bắt cua nghịch ngợm bẻ sạch càng ngoe chân của chúng rồi lấy đá đập chết nát bét; sau đó nhẫn tâm đánh đập giết chết một con rắn đang mang thai.
        Quả báo hiện tiền: Tay chân tác giả suốt mấy mươi năm liền mắc chứng bệnh đau nhức tê dại buốt giá hành hạ triền miên không một thang thuốc nào chữa khỏi.
        Bài học & Chuyển hóa: Trò chơi nghịch dại tuổi thơ tưởng chừng vô hại nhưng gieo mối hận thù sâu nặng cho sinh linh; khuyên phụ huynh dạy con trẻ lòng từ bi thương xót loài vật ngay từ thuở ấu thơ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660533?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-42
      read_label: 📖 Đọc sách
    - id: 44
      title: Anh bạn khó thở
      summary: |-
        Nhân vật & Hoàn cảnh: Một người bạn của tác giả suốt một năm thì bị khó thở nghẹt lồng ngực hành hạ suốt 6 tháng, chữa trị khắp đông tây y đều hoàn toàn bế tắc.
        Hành vi tạo nghiệp: Nhớ lại thuở nhỏ ở quê thường dùng bẫy chuột, thắt thòng lọng bóp nghẹt cổ chuột và trói cổ chim chóc cho đến chết nghẹt thở trong đau đớn.
        Quả báo hiện tiền: Quả báo hiện tiền y hệt những gì đã gây ra: lồng ngực co thắt khó thở, cổ họng nghẹn ứ sặc sụa như bị bàn tay vô hình bóp nghẹt suốt nhiều năm tháng.
        Bài học & Chuyển hóa: Nhờ chỉ rõ nghiệp sát bóp cổ động vật, anh phát tâm sám hối và noi gương Đại sư Hải Đào tích cực phóng sinh chuộc mạng; chứng khó thở dần biến mất kỳ diệu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660532?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
