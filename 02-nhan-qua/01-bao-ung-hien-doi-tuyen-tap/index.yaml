    - id: 11
      title: Lão Điền
      summary: |-
        Nhân vật & Hoàn cảnh: Lão Điền là một nông phu chất phác cần cù ở miền nam, cha của Tiểu Điền, hằng ngày lam lũ đồng áng nuôi sống gia đình.
        Hành vi tạo nghiệp: Thuở trẻ làm nông từng bắt giết đào ổ rắn, ếch nhái và các loài sinh vật đồng ruộng để làm mồi nhậu mà không hề hay biết sát nghiệp.
        Quả báo hiện tiền: Nửa đêm 11 giờ đi làm đồng về qua đoạn đường vắng, bị nhiều bóng đen oan hồn quỷ dữ xông ra chặn đường thét gầm đòi mạng khiến ông kinh hoàng bạt vía.
        Bài học & Chuyển hóa: May nhờ tâm tính thật thà và có chút phước đức, ông dốc lòng niệm danh hiệu Bồ Tát Quan Âm khiến lũ quỷ tản đi; từ đó cả nhà lão Điền tỉnh ngộ phát tâm quy y Tam Bảo tu tập.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660500?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
