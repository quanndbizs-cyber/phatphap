      read_label: 📖 Đọc sách
    - id: 32
      title: Thần Thổ Địa
      summary: |-
        Nhân vật & Hoàn cảnh: Chân tướng về Thần Thổ Địa (Phúc Đức Chánh Thần) cai quản địa giới xóm làng theo lời dạy của chư vị cao tăng đại đức.
        Hành vi tạo nghiệp: Người dân cúng tế Thần Thổ Địa bằng đầu heo gà vịt sát sinh ô uế, hoặc sống bất lương bất hiếu nhưng lại cầu xin thần linh ban tài phát lộc.
        Quả báo hiện tiền: Thần Thổ Địa phẫn nộ bỏ đi, ma quỷ tà thần thừa cơ chiếm giữ quấy phá khiến gia đạo xào xáo, làm ăn thất bát lụi tàn liên miên.
        Bài học & Chuyển hóa: Thổ địa chỉ phù hộ cho người có đức hạnh và tâm từ bi; cúng tế thần linh chỉ nên dùng hoa quả thanh tịnh, ăn ở hiền lành tích đức thì tự nhiên được thần linh che chở.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660569?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
