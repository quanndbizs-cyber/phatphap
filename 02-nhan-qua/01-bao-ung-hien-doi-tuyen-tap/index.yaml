      read_label: 📖 Đọc sách
    - id: 30
      title: Tôi Đã Thấy Hai Vị Thần Đồng Sinh, Đồng Danh
      summary: |-
        Nhân vật & Hoàn cảnh: Lời chứng thực của một hành giả tu thiền định nhìn thấy rõ ràng hai vị thần linh vô hình túc trực ngày đêm trên hai vai của mỗi con người trần thế.
        Hành vi tạo nghiệp: Vị thần bên vai trái ghi chép từng ý nghĩ tà ác, hành vi xấu xa; vị thần bên vai phải ghi chép từng niệm lành và việc làm từ bi cứu giúp người khác.
        Quả báo hiện tiền: Khi lâm chung hai cuốn sổ thiện ác được mở ra trước tòa Diêm Vương phán xét, không một chi tiết nhỏ nào có thể chối cãi hay che giấu được.
        Bài học & Chuyển hóa: Thần Đồng Sinh và Thần Đồng Danh là tấm gương phản chiếu tâm hồn; hãy luôn khởi tâm từ bi, nói lời hòa ái và làm việc lợi ích cho muôn loài để tích lũy tư lương thiện nghiệp.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660567?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
