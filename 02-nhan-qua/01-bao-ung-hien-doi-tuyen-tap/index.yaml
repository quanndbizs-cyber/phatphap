    - id: 36
      title: Tiên tri - 05. Giám đốc Viên Mậu
      summary: 'Nhân vật & Hoàn cảnh: Doanh nhân Viên Mậu làm giám đốc một công ty
        lớn, vì lòng tham đã cấu kết buôn bán hóa đơn giả và trốn thuế hàng chục tỷ
        đồng.

        Hành vi tạo nghiệp: Bất chấp pháp luật và đạo đức kinh doanh, dùng thủ đoạn
        lừa dối nhà nước và đối tác để làm giàu bất chính trên mồ hôi nước mắt người
        khác.

        Quả báo hiện tiền: Xe hơi chở ông ta bất ngờ gặp tai nạn lao xuống vực sâu;
        Viên Mậu bị chấn thương sọ não sống thực vật, công ty phá sản gia đình khánh
        kiệt.

        Bài học & Chuyển hóa: Lưới trời tuy thưa nhưng khó lọt; của cải phi nghĩa
        như lâu đài xây trên cát, sớm muộn cũng sụp đổ tan tành theo nghiệp lực ác
        báo.'
