      read_label: 📖 Đọc sách
    - id: 27
      title: Chuyện kể của cảnh sát pháp y - Kết cuộc bi thảm của giám đốc Triệu
      summary: |-
        Nhân vật & Hoàn cảnh: Kết cuộc bi thảm của giám đốc Triệu, một doanh nhân quyền thế cậy tiền của ức hiếp cấp dưới và bóc lột công nhân tàn nhẫn.
        Hành vi tạo nghiệp: Gian lận trốn thuế, quỵt lương công nhân nghèo, dùng mưu mô bức hại đối thủ làm ăn phá sản để độc chiếm thị trường.
        Quả báo hiện tiền: Bị tai nạn giao thông xe nát bét dập nát nội tạng, tài sản tiêu tán vào tiền viện phí, chết trong cô độc không một người thân bên cạnh tiễn đưa.
        Bài học & Chuyển hóa: Cậy quyền ỷ thế ức hiếp người thế cô chỉ chuốc lấy bại vong; người làm kinh doanh phải lấy chữ đức và lòng từ bi làm trọng mới mong có được phúc lộc bền lâu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660646?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-5#truyen-27
      read_label: 📖 Đọc sách
    - id: 28
      title: Chuyện kể của cảnh sát pháp y - Người có miệng lưỡi độc
      summary: |-
        Nhân vật & Hoàn cảnh: Người đàn bà có biệt danh 'miệng lưỡi độc', chuyên đặt điều bịa chuyện thêu dệt ly gián phá hoại hạnh phúc của xóm làng.
        Hành vi tạo nghiệp: Dùng lời lẽ cay độc đâm thọc hai đầu, vu khống gắp lửa bỏ tay người, làm cho nhiều gia đình êm ấm phải ly tán thù hận nhau.
        Quả báo hiện tiền: Mắc chứng bệnh ung thư lưỡi và vòm họng lở loét hoại tử hôi thối nồng nặc, đau đớn không thể ăn uống nói năng, sống trong dằn vặt nhục nhã tột cùng.
        Bài học & Chuyển hóa: Khẩu nghiệp sắc như gươm đao hại người hại mình; giữ gìn lời nói chánh trực hòa ái, tuyệt đối không được buôn dưa lê thêu dệt chuyện thị phi gây họa sát thân.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/72efab34-81f6-43ee-b367-6e446a5b0ceb/file/660647?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
