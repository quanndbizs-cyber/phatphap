    - id: 7
      title: Ác Báo Đáng Sợ
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện có thật về một đại gia giàu có đam mê thưởng thức các món ăn độc dị dã man như ăn óc khỉ sống và tay gấu hầm thuốc bắc.
        Hành vi tạo nghiệp: Đục sọ khỉ sống chan dầu sôi múc ăn tại bàn, chặt tay gấu sống khi con vật đang gào thét đau đớn để bồi bổ tráng dương vô nhân tính.
        Quả báo hiện tiền: Đến tuổi trung niên mắc chứng tai biến xuất huyết não dữ dội, đầu đau nhức như bị búa bổ đục sọ, hai tay co quắp liệt giường, đêm đêm gào thét rú lên như tiếng khỉ rồi chết thảm.
        Bài học & Chuyển hóa: Ác báo sát sinh ăn tươi nuốt sống dã thú vô cùng khủng khiếp; quả báo hiện tiền không sai một ly; người đời chớ vì miếng ăn tàn bạo mà chuốc lấy cái chết rùng rợn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660544?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
