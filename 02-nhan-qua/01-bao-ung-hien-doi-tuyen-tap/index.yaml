      read_label: 📖 Đọc sách
    - id: 19
      title: Phải thấy ưu điểm của người
      summary: 'Nhân vật & Hoàn cảnh: Câu chuyện có thật về cây Tượng Ba cổ thụ trong
        sân vườn của tác giả vào tiết trung thu tỏa bóng mát và hương thơm thanh khiết.

        Hành vi tạo nghiệp: Đối chiếu giữa tấm lòng che chở bao dung của cỏ cây muôn
        loài với sự tàn nhẫn chặt phá, hủy hoại môi trường sống của con người vô ơn.

        Quả báo hiện tiền: Cây xanh che chở cho gia chủ tránh khỏi tai ương rủi ro
        trong một trận giông bão lớn, chứng minh cỏ cây hoa lá đều có linh tri giao
        cảm cùng người có tâm từ bi.

        Bài học & Chuyển hóa: Mở rộng lòng từ thương yêu vạn vật thiên nhiên; bảo
        vệ môi trường, trồng cây gây rừng và trân quý từng mầm sống cỏ cây trên mặt
        đất.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660461?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-19
      read_label: 📖 Đọc sách
    - id: 20
      title: Mê hồn thang
      summary: 'Nhân vật & Hoàn cảnh: Lời khai thị từ bi của Hòa thượng Diệu Pháp
        dành cho những đệ tử thường hay chấp nhặt, nhìn thấy lỗi lầm khuyết điểm của
        bạn đồng tu mà sinh tâm chê bai bài xích.

        Hành vi tạo nghiệp: Thói quen xoi mói tật xấu của tha nhân, coi mình là thanh
        tịnh còn người khác là ô uế, nuôi dưỡng bản ngã cống cao ngã mạn làm tổn hại
        hòa khí đạo tràng.

        Quả báo hiện tiền: Tâm hồn luôn bất an phiền não, đi đến đâu cũng sinh chuyện
        thị phi tranh chấp, mất hết công đức tu tập bấy lâu nay.

        Bài học & Chuyển hóa: Người tu chân chính phải luôn phản quan tự kỷ, thấy
        ưu điểm đức hạnh của người để học hỏi và nhận rõ khuyết điểm của mình để sửa
        chữa, lấy khiêm nhường làm hạnh đầu đà.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660462?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-20
      read_label: 📖 Đọc sách
    - id: 21
      title: Công tử áo xanh
      summary: 'Nhân vật & Hoàn cảnh: Bài pháp luận sâu sắc cảnh báo về cạm bẫy ''Mê
        hồn thang'' của cõi trần gian: rượu chè, cờ bạc, thuốc lá và sắc dục đen tối.

        Hành vi tạo nghiệp: Đắm chìm trong thú vui trụy lạc tạm bợ, coi tứ đổ tường
        là phong lưu sành điệu, bất chấp gia đình khuyên can mà lún sâu vào vũng bùn
        tội lỗi.

        Quả báo hiện tiền: Thân tàn ma dại, trí tuệ lu mờ, tiêu tán gia sản và đẩy
        vợ con vào cảnh bần cùng khốn khó, chết đi đọa lạc vào ba đường ác địa ngục
        ngạ quỷ súc sinh.

        Bài học & Chuyển hóa: Dũng cảm chặt đứt ma chướng tứ đổ tường; lấy ngũ giới
        làm hàng rào hộ trì thân tâm, quay về nương tựa ánh sáng chánh pháp để tìm
        lại hạnh phúc chân thật.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660463?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-21
      read_label: 📖 Đọc sách
    - id: 22
      title: Người vợ đau khổ
      summary: 'Nhân vật & Hoàn cảnh: Gia đình ở thành phố Lạc Dương tỉnh Hà Nam sinh
        được người con gái 17 tuổi xinh đẹp khả ái nhưng tính tình bướng bỉnh, thường
        xuyên bị bóng đen chàng công tử áo xanh quấy rối.

        Hành vi tạo nghiệp: Tiền kiếp là món nợ ân oán tình ái sâu nặng giữa hai linh
        hồn; chàng công tử áo xanh vì si tình uất ức mà chết theo mối tơ vương chưa
        dứt.

        Quả báo hiện tiền: Hồn ma công tử áo xanh bám theo đòi nợ tình ái, khiến cô
        gái đau ốm triền miên, tâm thần hoảng loạn và gia đình lục đục không một ngày
        yên ả.

        Bài học & Chuyển hóa: Hòa thượng Diệu Pháp khai thị hóa giải oán kết nhiều
        đời; gia đình lập đàn tụng kinh Địa Tạng siêu độ cho hương linh công tử áo
        xanh được siêu sinh tịnh độ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660464?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-22
      read_label: 📖 Đọc sách
    - id: 23
      title: Kim giám đốc
      summary: 'Nhân vật & Hoàn cảnh: Một người vợ hiền thục siêng năng đảm đang một
        đời vì chồng vì con, nhưng người chồng lại sa đà bồ bịch ngoại tình và phụ
        bạc nghĩa tào khang.

        Hành vi tạo nghiệp: Mối nghịch duyên oan trái từ tiền kiếp: kiếp trước bà
        từng đối xử phụ bạc lạnh nhạt với người chồng, kiếp này hoán đổi vai vế để
        đền trả nợ cũ.

        Quả báo hiện tiền: Nỗi đau đớn xé ruột khi bị người đầu ấp tay gối phản bội,
        sống trong trầm cảm dằn vặt muốn hủy hoại thân thể để chấm dứt đau khổ.

        Bài học & Chuyển hóa: Hiểu rõ lý duyên nợ nhân quả nhiều đời, bà buông bỏ
        oán hận, nương tựa cửa Phật tu hành bái sám; nhờ tâm thanh tịnh chuyển hóa
        mà chồng bà hồi tâm chuyển ý quay về.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660466?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-23
      read_label: 📖 Đọc sách
    - id: 24
      title: Tần phu nhân
      summary: 'Nhân vật & Hoàn cảnh: Anh Kim là giám đốc một nhà in lớn, vốn là người
        vô thần không tin tôn giáo nhưng tình nguyện lái xe đưa tác giả và đoàn Phật
        tử đi công việc.

        Hành vi tạo nghiệp: Từng có suy nghĩ coi Phật giáo là mê tín dị đoan, ỷ vào
        sức mình và tiền tài danh vọng mà không tin có thế giới vô hình và luật nhân
        quả.

        Quả báo hiện tiền: Trên đường đi chứng kiến những hiện tượng cảm ứng nhiệm
        mầu và tài tiên tri phá án nhân quả kỳ tài của Hòa thượng Diệu Pháp khiến
        anh rùng mình kinh phục.

        Bài học & Chuyển hóa: Bừng tỉnh tín tâm chánh tín, giám đốc Kim phát tâm quy
        y Tam Bảo, tình nguyện dùng hệ thống nhà in ấn tống kinh sách Phật giáo cứu
        độ muôn người.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660465?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-24
      read_label: 📖 Đọc sách
    - id: 25
      title: Thằng cháu quý
      summary: 'Nhân vật & Hoàn cảnh: Tần phu nhân là một phụ nữ tài sắc vẹn toàn,
        có năng khiếu hội họa mỹ thuật từ nhỏ nhưng cuộc đời chịu nhiều nghịch cảnh
        truân chuyên trong hôn nhân.

        Hành vi tạo nghiệp: Tiền kiếp từng là một họa sĩ tài ba nhưng kiêu căng ngạo
        mạn, từng vẽ tranh kích động lòng tham dục và khinh miệt người kém tài hơn
        mình.

        Quả báo hiện tiền: Hôn nhân đổ vỡ, bị người tình lừa gạt tiền bạc và tình
        cảm, sống trong nỗi cô đơn cùng cực giữa chốn phồn hoa đô hội.

        Bài học & Chuyển hóa: Nhờ quy y Tam Bảo, dùng tài năng hội họa vẽ tranh Phật
        và Bồ Tát cúng dường; tâm tánh nhu hòa bái sám tiêu trừ nghiệp chướng, tìm
        lại sự thanh thản an vui tột cùng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660467?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-25
      read_label: 📖 Đọc sách
    - id: 26
      title: Tu không nên độc tài
      summary: 'Nhân vật & Hoàn cảnh: Đứa cháu đích tôn độc nhất trong một gia đình
        hào môn được ông bà cha mẹ nuông chiều như vàng như ngọc từ tấm bé.

        Hành vi tạo nghiệp: Đứa cháu lớn lên ngỗ nghịch phá phách, sa đà vào cờ bạc
        ma túy, thường xuyên đập phá đồ đạc và đe dọa tống tiền chính cha mẹ ruột
        của mình.

        Quả báo hiện tiền: Tiền tài tiêu tán, gia phong sụp đổ; Hòa thượng chỉ rõ
        đứa cháu quý chính là chủ nợ tiền kiếp đầu thai vào làm con cháu để đòi món
        nợ khổng lồ năm xưa.

        Bài học & Chuyển hóa: Nuông chiều con cháu mù quáng là hại con hại mình; phải
        giáo dục con cái bằng đạo đức nhân quả, lấy Phật pháp rèn giũa tâm tánh từ
        thuở ấu thơ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660468?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-26
      read_label: 📖 Đọc sách
    - id: 27
      title: Tình chấp nhiều đời
      summary: 'Nhân vật & Hoàn cảnh: Một vị trưởng đạo tràng tu học nhiều năm nhưng
        tính tình gia trưởng, độc tài chuyên quyền, luôn bắt mọi người phải phục tùng
        ý kiến riêng của mình.

        Hành vi tạo nghiệp: Mượn danh nghĩa hộ trì chánh pháp để thỏa mãn bản ngã
        độc đoán, áp đặt ép uổng các bạn đồng tu khiến đạo tràng chia rẽ, nhiều người
        thối thất tâm bồ đề.

        Quả báo hiện tiền: Bản thân mắc chứng đau ngực nghẹt thở, các bạn đồng tu
        xa lánh, đạo tràng tan rã; công đức tu hành bao năm tiêu tan như mây khói.

        Bài học & Chuyển hóa: Hòa thượng Diệu Pháp nghiêm khắc nhắc nhở: tu hành phải
        lấy khiêm cung, nhẫn nhục và lục hòa kính làm đầu; buông bỏ tâm độc tài mới
        thực sự bước vào cửa đạo giác ngộ.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660469?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-27
      read_label: 📖 Đọc sách
    - id: 28
      title: Con đường làm giàu
      summary: 'Nhân vật & Hoàn cảnh: Đôi nam nữ Phật tử cùng nhau phát tâm xuất gia
        tu học nhưng trong lòng vẫn âm ỉ sợi dây tình cảm luyến ái chấp trước không
        thể dứt trừ.

        Hành vi tạo nghiệp: Dây tơ hồng tình chấp nhiều kiếp huân tập sâu đậm trong
        tàng thức; dù khoác áo cà sa nhưng tâm vẫn vướng bận ái dục thế gian làm chướng
        ngại đường tu.

        Quả báo hiện tiền: Tinh thần bấn loạn, công phu tu tập bế tắc không thể định
        tâm, thường xuyên bị mộng mị phiền não quấy nhiễu thân tâm.

        Bài học & Chuyển hóa: Nhờ Hòa thượng Diệu Pháp dùng gươm trí tuệ chặt đứt
        tơ vương ái chấp, chỉ rõ biển khổ sinh tử luân hồi; cả hai tỉnh ngộ buông
        xả hoàn toàn, dốc lòng tiến tu giải thoát.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660470?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-28
      read_label: 📖 Đọc sách
    - id: 29
      title: Nửa cái bánh
      summary: 'Nhân vật & Hoàn cảnh: Bài pháp thoại sâu sắc về con đường làm giàu
        chân chính và bí quyết gặt hái tài lộc theo đúng quy luật nhân quả của nhà
        Phật.

        Hành vi tạo nghiệp: Người đời vì tham giàu nhanh mà bất chấp thủ đoạn lừa
        lọc, trốn thuế gian lận, buôn bán hàng giả và sát sinh kiếm tiền bẩn.

        Quả báo hiện tiền: Của cải bất chính như bọt nước phù du, vào cửa trước ra
        cửa sau kéo theo tai ương bệnh tật và tù tội tán gia bại sản.

        Bài học & Chuyển hóa: Muốn giàu sang phú quý bền lâu phải biết gieo nhân bố
        thí, cúng dường Tam Bảo, cứu giúp người nghèo khổ; tâm rộng bao nhiêu thì
        phước lộc lớn bấy nhiêu.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660471?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-29
      read_label: 📖 Đọc sách
    - id: 30
      title: Nghiêm cư sĩ
      summary: 'Nhân vật & Hoàn cảnh: Gia đình ông Trình tu học giữ giới rất nghiêm
        mật nhưng có tính keo kiệt, đem nửa cái bánh thiu hỏng không ăn được cho một
        người ăn xin qua đường.

        Hành vi tạo nghiệp: Bố thí với tâm khinh thường, tiếc của rẻ, đem đồ ăn hỏng
        độc hại cho người đói khổ làm tổn hại hạnh bố thí thanh tịnh.

        Quả báo hiện tiền: Trong nhà đồ ăn liên tục bị ôi thiu hỏng mốc; công việc
        làm ăn bất ngờ gặp trục trặc bị khách hàng trả lại hàng hóa thiệt hại nặng
        nề.

        Bài học & Chuyển hóa: Của cho không bằng cách cho; bố thí phải xuất phát từ
        tâm từ bi cung kính chân thật mới gặt hái phước báu vô lượng vô biên.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660472?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-30
      read_label: 📖 Đọc sách
    - id: 31
      title: Khi tôi biết đến Phật pháp
      summary: 'Nhân vật & Hoàn cảnh: Nghiêm Đại cư sĩ là nhân vật hộ pháp nổi danh
        khắp các ngôi chùa lớn trong nước, cúng dường tiền của và công sức không biết
        mệt mỏi.

        Hành vi tạo nghiệp: Ỷ vào công đức hộ trì to lớn mà sinh tâm ngã mạn vi tế,
        thích được tâng bốc ca ngợi, coi thường các vị sư trẻ và những người đóng
        góp ít hơn mình.

        Quả báo hiện tiền: Thân thể mắc bệnh mãn tính không dứt, trong lòng luôn canh
        cánh phiền não so đo hơn thua với người đời.

        Bài học & Chuyển hóa: Được Hòa thượng Diệu Pháp trực tiếp chỉ điểm phá trừ
        tâm ngã mạn, ông sụp lạy ăn năn hiểu rõ lý ba la mật ''tam luân không tịch'',
        tu hành đạt cảnh giới buông xả an nhiên.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660473?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-31
      read_label: 📖 Đọc sách
    - id: 32
      title: Trong Mạt Pháp có Chánh Pháp
      summary: 'Nhân vật & Hoàn cảnh: Hồi ức tự thuật xúc động sâu sắc của tác sĩ
        Quả Khanh về hành trình từ một cán bộ vô thần chuyển hóa trở thành người con
        Phật thuần thành.

        Hành vi tạo nghiệp: Thời trẻ sống trong vô minh, từng hoài nghi giáo lý tôn
        giáo, sát sinh ăn thịt và tạo bao điều lầm lỡ theo thói quen thế tục.

        Quả báo hiện tiền: Bệnh tật hoạn nạn xảy đến khiến bế tắc tinh thần; may mắn
        hội ngộ Hòa thượng Diệu Pháp trên đỉnh Ngũ Đài Sơn linh thiêng.

        Bài học & Chuyển hóa: Ánh sáng từ bi và trí tuệ vô biên của Phật pháp đã cứu
        vớt cuộc đời tác giả; nguyện đem trọn phần đời còn lại viết sách truyền bá
        nhân quả cứu độ quần sinh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660474?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-32
      read_label: 📖 Đọc sách
    - id: 33
      title: Sư ni Diệu Dung
      summary: 'Nhân vật & Hoàn cảnh: Lời khai thị phá tan tâm lý hoang mang bi quan
        của hàng Phật tử trước viễn cảnh thời kỳ Mạt pháp tà sư thuyết pháp như cát
        sông Hằng.

        Hành vi tạo nghiệp: Người tu thời mạt pháp chạy theo danh vọng hình thức,
        buông lỏng giới luật, mượn đạo tạo đời khiến Chánh pháp bị lu mờ mai một.

        Quả báo hiện tiền: Chánh tín suy vi, tà đạo lộng hành làm lầm lạc biết bao
        thiện nam tín nữ trên bước đường tìm cầu chân lý giải thoát.

        Bài học & Chuyển hóa: Hễ nơi nào có người chân thật nghiêm trì giới luật,
        ăn chay niệm Phật, tu sửa thân tâm thì nơi đó Chánh pháp hiện tiền; tự thân
        mỗi người hãy là một ngọn đuốc sáng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660475?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-33
      read_label: 📖 Đọc sách
    - id: 34
      title: Nguyên nhân sư Diệu Dung xuất gia
      summary: 'Nhân vật & Hoàn cảnh: Hành trình xuất gia tu hành phi thường và đầy
        xúc động của Ni sư Diệu Dung, vượt qua muôn vàn chướng ngại nghịch cảnh thế
        gian.

        Hành vi tạo nghiệp: Từng trải qua đau khổ thăng trầm nơi cõi trần, nếm trải
        vị đắng cay của tình đời vô thường và sự trói buộc của gia đình thế tục.

        Quả báo hiện tiền: Bị thân nhân phản đối kịch liệt, đối mặt với bạo bệnh hiểm
        nghèo và thử thách sinh tử trong những ngày đầu xuất gia tầm đạo.

        Bài học & Chuyển hóa: Bằng ý chí sắt đá và niềm tin kiên định vào Tam Bảo,
        Sư cô tinh tấn bái sám niệm Phật, chuyển hóa mọi chướng duyên thành bồ đề
        quyến thuộc, trở thành bậc thạch trụ chốn tùng lâm.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660476?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-34
      read_label: 📖 Đọc sách
    - id: 35
      title: Những điềm mộng báo trước
      summary: 'Nhân vật & Hoàn cảnh: Phân tích cơ chế tâm linh kỳ diệu đằng sau các
        giấc mộng điềm báo trước về tai nạn, thiên tai địa chấn và sự biến đổi vận
        mệnh của con người.

        Hành vi tạo nghiệp: Tâm thức chúng sinh luôn có sự giao cảm vi tế cùng từ
        trường trời đất và thần linh; người tạo ác nghiệp hay bị mộng mị kinh hoàng
        quấy nhiễu.

        Quả báo hiện tiền: Những giấc mộng cảnh báo về tai nạn giao thông, hỏa hoạn
        và động đất đều ứng nghiệm chuẩn xác, thức tỉnh con người về thế giới vô hình.

        Bài học & Chuyển hóa: Giấc mộng là tiếng chuông cảnh tỉnh của lương tâm và
        nghiệp thức; hãy mau chóng sám hối, phóng sinh làm lành để chuyển nguy thành
        an trước khi quả báo ập đến.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660477?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-35
      read_label: 📖 Đọc sách
    - id: 36
      title: Báo mộng địa chấn ở Vấn Châu
      summary: 'Nhân vật & Hoàn cảnh: Nhóm Phật tử trẻ tuổi tại Thâm Quyến chí thành
        thực hành công hạnh phóng sinh cứu mạng muôn loài chim cá thường xuyên mỗi
        tuần.

        Hành vi tạo nghiệp: Cứu vớt hàng vạn sinh linh cá tôm chuẩn bị bị đưa vào
        lò mổ và chảo dầu sôi của các nhà hàng quán nhậu đẫm máu.

        Quả báo hiện tiền: Cảm ứng đất trời mầu nhiệm: đàn cá nhảy múa trên mặt nước
        vẫy đuôi tạ ơn, mây ngũ sắc hiện trên bầu trời; bệnh tật của các thành viên
        tiêu trừ, công việc hanh thông tốt đẹp.

        Bài học & Chuyển hóa: Phóng sinh là phương pháp tích phước tiêu nghiệp nhanh
        nhất; đem lại sự sống cho chúng sinh chính là đem lại thọ mạng dài lâu và
        an lạc cho chính mình.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660478?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-36
      read_label: 📖 Đọc sách
    - id: 37
      title: Giáo dục rất quan trọng
      summary: 'Nhân vật & Hoàn cảnh: Câu chuyện đau lòng về một người con trai bất
        hiếu đối xử tàn tệ, hắt hủi và bỏ mặc cha mẹ già yếu trong cảnh đói rét bần
        hàn.

        Hành vi tạo nghiệp: Quên ơn mang nặng đẻ đau bú mớm nuôi nấng của cha mẹ già;
        vì nghe lời vợ mà xua đuổi cha mẹ ra chái bếp lụp xụp không cho ăn uống đủ
        bữa.

        Quả báo hiện tiền: Đứa con trai lớn lên bị chính con ruột của mình đối xử
        bạc bẽo y hệt, sau đó mắc bệnh ung thư gan đau đớn cùng cực chết trong cô
        độc không ai ngó ngàng.

        Bài học & Chuyển hóa: Bất hiếu là tội nặng đứng đầu muôn tội ác; trời đất
        quỷ thần đều căm ghét trừng phạt nghiêm khắc; phụng dưỡng cha mẹ chính là
        cúng dường Phật hiện tiền.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660479?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-37
      read_label: 📖 Đọc sách
    - id: 38
      title: Kinh nghiệm phóng sinh
      summary: 'Nhân vật & Hoàn cảnh: Nghi thức cúng thất và tụng kinh khai thị cho
        các hương linh vừa mới qua đời trong tuần thất đầu tiên của giai đoạn thân
        trung ấm 49 ngày.

        Hành vi tạo nghiệp: Thần thức người chết trong 49 ngày vô cùng hoang mang
        sợ hãi, chịu sự chi phối mãnh liệt của nghiệp lực thiện ác đã tạo lúc sinh
        tiền.

        Quả báo hiện tiền: Nếu người nhà sát sinh mổ thịt đãi đằng thì chỉ làm tăng
        thêm tội nghiệp nặng nề cho vong linh, khiến họ bị đọa đày nơi tam đồ ác đạo.

        Bài học & Chuyển hóa: Trong 49 ngày thân nhân phải làm chay thanh tịnh, chí
        thành tụng Kinh Địa Tạng và niệm Phật A Di Đà hồi hướng để cứu vớt hương linh
        siêu thăng cõi lành.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660481?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-38
      read_label: 📖 Đọc sách
    - id: 39
      title: Chú rùa xanh
      summary: 'Nhân vật & Hoàn cảnh: Lời tâm sự chân thành và sâu sắc của một nữ
        tri thức xinh đẹp buông bỏ công danh sự nghiệp rực rỡ để xuất gia làm ni cô
        nơi chốn thiền môn.

        Hành vi tạo nghiệp: Nhìn thấu bản chất vô thường mong manh của cuộc đời thế
        tục, nhận ra danh lợi và ái ân chỉ như làn khói mây bay thoáng chốc không
        bền.

        Quả báo hiện tiền: Thoát khỏi vòng xoáy cơm áo gạo tiền và tranh đoạt thị
        phi, tìm lại sự tự tại thanh thản tuyệt đối trong tâm hồn dưới bóng từ bi
        Tam Bảo.

        Bài học & Chuyển hóa: Xuất gia là việc làm của bậc đại trượng phu, không phải
        vì bi quan trốn đời mà là để tìm cầu chân lý tối thượng và cứu độ muôn loài
        thoát khỏi biển khổ sinh tử.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660482?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-39
      read_label: 📖 Đọc sách
    - id: 40
      title: Quả báo bất hiếu
      summary: 'Nhân vật & Hoàn cảnh: Lời giải đáp minh triết của Hòa thượng Diệu
        Pháp cho thắc mắc lớn của nhiều Phật tử: vì sao nhiều bậc chân tu cao tăng
        đại đức lại mang trọng bệnh trước khi viên tịch?

        Hành vi tạo nghiệp: Người tu hành chân chính phát đại bồ đề tâm nguyện gánh
        vác nghiệp chướng cho chúng sinh, chuyển đổi ác nghiệp nhiều đời thành quả
        báo nhẹ ở hiện đời.

        Quả báo hiện tiền: Bệnh tật thân xác là cơ hội thanh lọc tàn dư nghiệp lực,
        trả xong món nợ sinh tử cuối cùng để thong dong vãng sinh cõi Phật không còn
        vướng bận.

        Bài học & Chuyển hóa: Chớ nên nhìn hiện tượng bên ngoài mà sinh tâm nghi ngờ
        chánh pháp; hãy thấu hiểu hạnh nguyện xả thân vì đạo và đạo lực vô lượng của
        các bậc chân tu.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660483?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-40
      read_label: 📖 Đọc sách
    - id: 41
      title: Tuần thất đầu tiên
      summary: 'Nhân vật & Hoàn cảnh: Cuộc đời khổ tu đầy gian nan thử thách nhưng
        kiên cường bất khuất của Sư Hằng Nghiêm trải qua giai đoạn chiến tranh loạn
        lạc khốc liệt.

        Hành vi tạo nghiệp: Giữa bom đạn tàn phá và hiểm nguy rình rập, Ngài vẫn một
        lòng kiên trinh giữ gìn giới luật, không màng sống chết bảo vệ kinh điển và
        tự viện.

        Quả báo hiện tiền: Cảm ứng chư thiên hộ pháp che chở thoát chết gang tấc trong
        làn mưa bom bão đạn, đạo tâm kiên cố như bàn thạch ngàn năm.

        Bài học & Chuyển hóa: Tấm gương sáng ngời về ý chí tu hành và niềm tin son
        sắt vào Phật đạo; là nguồn cổ vũ lớn lao cho hàng hậu học vững bước trên con
        đường giải thoát.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/258914e3-214b-447f-80eb-1aacbe2e4525/file/660484?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-3#truyen-41
      read_label: 📖 Đọc sách
    - id: 42
      title: Vì sao cô đi tu
      summary: Mùa thu năm 2003, một ngày trời trong đẹp, gió thổi hiu hiu, tôi và
        bạn già đi đến chùa Bàn Long nổi danh ở huyện Nguyên Thị tỉnh Hà Bắc. Thắp
        hương lễ Phật xong, chúng tôi đi dạo nhìn ngắm cảnh trong chùa, lúc nãy có
        một sư nữ mặt tươi tắn...
