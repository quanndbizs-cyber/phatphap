      read_label: 📖 Đọc sách
    - id: 16
      title: Thiện niệm và ác niệm
      summary: |-
        Nhân vật & Hoàn cảnh: Giáo lý thâm sâu về luật tâm niệm "Vạn pháp do tâm tạo, một niệm thiện thiên đường mở lối, một niệm ác địa ngục chực chờ".
        Hành vi tạo nghiệp: Buông thả tâm ý theo tham lam, sân hận, đố kỵ và mưu mô hãm hại người khác trong từng phút giây sinh hoạt thường nhật.
        Quả báo hiện tiền: Ác niệm chiêu cảm ác cảnh tai ương bệnh tật, tướng mạo trở nên hung dữ xấu xí, gia đình xào xáo bất an do từ trường tiêu cực bao trùm.
        Bài học & Chuyển hóa: Người tu cần quán sát từng khởi tâm động niệm, luôn giữ chánh niệm tỉnh giác, nuôi dưỡng lòng từ ái bao dung để chuyển hóa cảnh giới sống an vui thanh tịnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660505?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
