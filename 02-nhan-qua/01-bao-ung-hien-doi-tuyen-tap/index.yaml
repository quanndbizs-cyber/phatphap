      read_label: 📖 Đọc sách
    - id: 9
      title: Con Cá Ngát
      summary: |-
        Nhân vật & Hoàn cảnh: Một ngư dân chuyên nghề đánh bắt cá ven sông câu được một con cá ngát lớn hung dữ có ngạnh nhọn có nọc độc.
        Hành vi tạo nghiệp: Thay vì cẩn thận gỡ cá, anh nổi cơn tam bành dùng dao nhọn đâm nát đầu chặt đứt thân con cá ngát đang oằn mình giãy giụa trả thù.
        Quả báo hiện tiền: Bị ngạnh cá ngát đâm trúng tay nhiễm trùng cực nặng, độc tố ăn sâu hoại tử thối rữa xương khớp, bệnh viện buộc phải phẫu thuật cưa cụt cả cánh tay đau đớn tột cùng.
        Bài học & Chuyển hóa: Quả báo hiện tiền tức thì nhãn tiền không đợi kiếp sau; một phút giận dữ tàn sát loài vật phải trả giá bằng chính cánh tay tàn phế suốt đời.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660546?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
