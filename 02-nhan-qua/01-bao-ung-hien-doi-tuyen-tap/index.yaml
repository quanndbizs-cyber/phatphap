    - id: 12
      title: Đại Sư Thăm Bệnh
      summary: 'Nhân vật & Hoàn cảnh: Hòa thượng Diệu Pháp đích thân đến bệnh viện
        thăm hỏi và khai thị giải trừ nghiệp chướng cho một bệnh nhân ung thư giai
        đoạn cuối.

        Hành vi tạo nghiệp: Bệnh nhân thuở sinh tiền làm nghề buôn bán gia súc gia
        cầm, giết hại vô số sinh linh để kiếm sống bồi bổ gia đình.

        Quả báo hiện tiền: Thân thể đau đớn rên rỉ, khối u di căn khắp nơi; oan hồn
        các loài vật bám chặt đòi mạng khiến bác sĩ không thể chích thuốc giảm đau.

        Bài học & Chuyển hóa: Nhờ Hòa thượng từ bi chỉ điểm món nợ máu xương, bệnh
        nhân rơi lệ chí thành sám hối trước Phật; tâm an định buông xả, cơn đau thuyên
        giảm kỳ diệu trước giờ phút ra đi an lành.'
