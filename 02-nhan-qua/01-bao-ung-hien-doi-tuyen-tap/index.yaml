      read_label: 📖 Đọc sách
    - id: 22
      title: Tâm Sự Của Thiên Thần
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện tâm linh cảm động về nỗi niềm trăn trở của vị thiện thần hộ pháp được giao nhiệm vụ theo bảo vệ một người xưng là đệ tử Phật.
        Hành vi tạo nghiệp: Người học Phật bề ngoài tỏ vẻ tu hành tinh tấn, nhưng nơi phòng kín tâm ý vẫn buông thả suy nghĩ dâm tà, nói dối lừa gạt và xem thường giới luật.
        Quả báo hiện tiền: Hào quang hộ thể biến mất, thiện thần rơi nước mắt thở dài bỏ đi vì không thể dung thứ cho sự giả dối; tà ma ác quỷ thừa cơ xâm nhập quấy phá gia đạo bất an.
        Bài học & Chuyển hóa: Tu hành cốt ở tịnh hóa nội tâm chân thật chứ không phải hình thức giả tạo bên ngoài; người tu phải giữ giới nghiêm mật từ trong ý nghĩ mới mong được thiện thần hộ trì.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660559?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
