    - id: 35
      title: Lời sám hối của một nữ nhân
      summary: 'Nhân vật & Hoàn cảnh: Lời sám hối đẫm nước mắt của một phụ nữ thời
        trẻ từng lầm lỡ ngoại tình và phá thai nhiều lần vì nông nổi dại khờ.

        Hành vi tạo nghiệp: Tước đoạt mạng sống của những giọt máu ruột thịt chưa
        kịp chào đời, phản bội lòng tin của người bạn đời để chạy theo dục vọng si
        mê.

        Quả báo hiện tiền: Thân thể mắc bệnh phụ khoa ung thư hoành hành, đêm đêm
        bị ác mộng và vong thai đòi mẹ cắn xé tâm can sống trong dằn vặt khôn nguôi.

        Bài học & Chuyển hóa: Dưới chân đài sen chư Phật, bà quỳ sụp khóc lóc ăn năn
        chuộc tội; phát nguyện ăn chay trường trọn đời, lập đàn cầu siêu và in ấn
        kinh sách cứu độ vong thai giải tỏa oán kết.'
