    - id: 9
      title: Mã Thanh
      summary: |-
        Nhân vật & Hoàn cảnh: Mã Thanh là một nam doanh nhân trẻ tài ba thành đạt, thuở nhỏ từng ưa chuộng ngồi thiền tĩnh tọa và sống hiền lành.
        Hành vi tạo nghiệp: Khi thành đạt lao vào thương trường giao tế chè chén, buông lung phạm đủ giới sát, đạo, dâm, vọng, phản bội tình cảm vợ con.
        Quả báo hiện tiền: Khí sắc u ám tối tăm, tim đau thắt như dao cắt y học không tìm ra bệnh, vợ chồng ngày đêm cãi vã đánh nhau dữ dội, hôn nhân trên bờ vực đổ vỡ tan tành.
        Bài học & Chuyển hóa: Được Quả Hồng vạch rõ nhân quả nghiệp chướng, Mã Thanh rúng động lương tâm, quỳ trước Phật sám hối tà dâm sát sinh, ăn chay trường cứu vãn tổ ấm gia đình hòa thuận.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660498?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
