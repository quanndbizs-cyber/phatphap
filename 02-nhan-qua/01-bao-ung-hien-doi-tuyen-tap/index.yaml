    - id: 11
      title: Vì sao Chư Đại Đức, cao Tăng cũng bị bệnh nặng, tử vong
      summary: 'Nhân vật & Hoàn cảnh: Hòa thượng Diệu Pháp giải thích thắc mắc lớn:
        Vì sao chư vị Đại Đức, cao Tăng đạo hạnh cao dày vẫn có vị mắc bệnh nặng hoặc
        tử nạn?

        Hành vi tạo nghiệp: Các bậc Bồ Tát thị hiện thân người trong cõi trần chịu
        sự vô thường chi phối, đồng thời phát nguyện đại bi gánh bớt nghiệp chướng
        cho chúng sinh thời mạt pháp.

        Quả báo hiện tiền: Dùng tấm thân bệnh tật làm bài học sống động cảnh tỉnh
        đệ tử về lẽ vô thường, khổ, không, vô ngã của thân tứ đại giả hợp.

        Bài học & Chuyển hóa: Người học Phật không nên chấp vào tướng bên ngoài; hãy
        nhìn vào tâm nguyện đại từ đại bi xả thân vì chánh pháp của chư vị Tăng già
        mà tinh tấn tu trì.'
