    - id: 1
      title: Lời Người Dịch
      summary: |-
        Nhân vật & Hoàn cảnh: Lời người dịch mở đầu tập 6 Báo Ứng Hiện Đời do Sư Cô Hạnh Đoan tuyển dịch, tiếp tục cung cấp những bài học nhân quả rúng động lòng người.
        Hành vi tạo nghiệp: Phơi bày các góc khuất đạo đức trong xã hội đương đại: sát sinh tàn sát động vật, buông lung tà dâm, nạo phá thai và bội bạc ân nghĩa.
        Quả báo hiện tiền: Bệnh nan y bủa vây, gia đình ly tán, linh hồn bị đọa đày nơi cõi tối tăm đau khổ do không thấu suốt luật nhân quả báo ứng công minh.
        Bài học & Chuyển hóa: Kêu gọi người đời mau chóng phản tỉnh hồi đầu, nghiêm trì ngũ giới, ăn chay niệm Phật, phát tâm từ bi phóng sinh và sám hối để chuyển hóa nghiệp duyên.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/990d7c79-c5a3-410e-acd4-0b03dd887439/file/660538?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
