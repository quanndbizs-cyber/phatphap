    - id: 33
      title: Niệm danh bồ tát Địa Tạng thoát khỏi vận mệnh xấu
      summary: |-
        Nhân vật & Hoàn cảnh: Câu chuyện có thật về một người nghèo khổ bệnh tật nhờ chí thành niệm danh hiệu Bồ Tát Địa Tạng mà thoát khỏi vận mệnh đen tối.
        Hành vi tạo nghiệp: Nghiệp chướng nhiều đời khiến thân thể ốm yếu, gia cảnh bần hàn làm ăn thất bát, đi đến đâu cũng gặp tai ương xui xẻo bủa vây.
        Quả báo hiện tiền: Sống trong cảnh bế tắc tuyệt vọng, cùng đường không nơi nương tựa giữa chốn nhân gian lạnh lùng.
        Bài học & Chuyển hóa: Nghe lời khuyên chí thành lạy Phật niệm danh hiệu Địa Tạng Vương Bồ Tát mỗi ngày; cảm ứng nhiệm mầu bệnh tật tiêu trừ, gặp quý nhân giúp đỡ chuyển nghèo thành giàu phúc lộc tràn đầy.
