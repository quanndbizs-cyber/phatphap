    - id: 16
      title: Tiền Kiếp Của Cụ Rùa
      summary: |-
        Nhân vật & Hoàn cảnh: Ngày 25/6/2011 tại chùa Thúy Phong (núi Cửu Hoa), một Phật tử đem cặp rùa khổng lồ sống hơn trăm tuổi mua từ tay lái buôn đến chùa phóng sinh.
        Hành vi tạo nghiệp: Bậc cao tăng khai thị tiền kiếp hai cụ rùa từng là hai tăng sĩ xuất gia tu hành nhưng phạm giới tham lam, biển thủ tiền của Tam Bảo tiêu xài cá nhân.
        Quả báo hiện tiền: Thác sinh làm loài rùa mang mai nặng nề, chịu cảnh giam cầm bùn lầy tăm tối hơn một thế kỷ, suýt bị người đời mổ thịt nấu cao trong đau đớn.
        Bài học & Chuyển hóa: Của Tam Bảo nặng hơn núi Thái Sơn; phạm giới tham ô của chùa chiền đọa lạc súc sinh muôn kiếp; hai cụ rùa rơi nước mắt quy y Tam Bảo trước khi được thả về hồ tự do.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660599?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
