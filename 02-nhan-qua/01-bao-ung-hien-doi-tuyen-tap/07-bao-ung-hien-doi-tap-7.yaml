    - id: 2
      title: Anh Bạn Sinh Viên
      summary: |-
        Nhân vật & Hoàn cảnh: Anh sinh viên tên Tú học Văn khoa cùng trường với tác giả, xuất thân nghèo khó, tính tình nhút nhát rụt rè, thường lướt net chơi bời giết thời gian.
        Hành vi tạo nghiệp: Tự ti mặc cảm, buông thả trong thói quen lười biếng trễ nải, chưa có định hướng tương lai và từng bị gia đình bạn gái chê nghèo hắt hủi coi khinh.
        Quả báo hiện tiền: Tình cảm đổ vỡ, đứng trước nguy cơ ra trường thất nghiệp bế tắc, tâm thần luôn lo âu tự ti và cuộc sống bấp bênh không lối thoát.
        Bài học & Chuyển hóa: Nhờ gặp Phật pháp, anh Tú chăm chỉ ăn chay tụng kinh bái sám, nuôi dưỡng tâm đức; sau khi tốt nghiệp anh gặp cơ duyên tốt có việc làm thu nhập cao và cưới được vợ hiền đức.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660585?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
