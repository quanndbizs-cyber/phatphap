    - id: 13
      title: Quỷ Thần
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải uyên thâm về thế giới quỷ thần sống trong các chiều không gian đa chiều song song cùng thế giới loài người theo khoa học và Phật giáo.
        Hành vi tạo nghiệp: Con người vô tri cho rằng không thấy quỷ thần nên thỏa sức làm điều gian ác, tà dâm, trộm cắp và phóng túng khẩu nghiệp nơi phòng tối vắng người.
        Quả báo hiện tiền: Quỷ thần hai vai ghi chép không sót một niệm; phúc báu bị bào mòn nhanh chóng, chiêu cảm các loài quỷ mị quấy phá khiến bệnh tật xui xẻo ập đến liên miên.
        Bài học & Chuyển hóa: Tăng Tử từng dạy người quân tử phải thận trọng khi ở một mình (thận độc); sống quang minh chính đại, giữ tâm cung kính và giữ giới để được chư thiện thần hộ trì.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660596?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
