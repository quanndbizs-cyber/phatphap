    - id: 14
      title: Già Lam Có Thêm Một Vị Hộ Pháp
      summary: |-
        Nhân vật & Hoàn cảnh: Đại Tướng quân Lý Mật lẫy lừng triều Đường sau khi tử trận đã thọ sinh làm một vị đại thần linh có uy quyền trong cõi u minh.
        Hành vi tạo nghiệp: Sinh tiền từng cầm quân chém giết trên chiến trường tạo nhiều sát nghiệp, nhưng có tâm trung nghĩa ái quốc và bản tính hào kiệt thương dân.
        Quả báo hiện tiền: Sau khi chết làm Thần nơi cõi âm nhưng vẫn chưa thoát khỏi luân hồi sinh tử tam giới, chứng kiến nỗi thống khổ khôn cùng của các cô hồn tử sĩ.
        Bài học & Chuyển hóa: Đại tướng quân Lý Mật hồi tâm quy y Tam Bảo, phát nguyện trở thành Bồ Tát Già Lam hộ pháp vệ giáo, khuyên hóa hàng ngàn quỷ chúng quy hướng Phật đạo tu hành.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660597?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
