    - id: 26
      title: Chuyện tình Lan và Dũng
      summary: |-
        Nhân vật & Hoàn cảnh: Chuyện tình đầy nước mắt và trắc trở giữa đôi bạn trẻ Lan và Dũng, yêu nhau tha thiết nhưng luôn gặp nghịch cảnh ngăn trở không thành duyên nợ.
        Hành vi tạo nghiệp: Món nợ ân oán tình ái sâu nặng từ tiền kiếp: một bên đến đòi nợ tình, một bên đến trả nợ duyên nhưng chưa dứt hết nghiệp chướng.
        Quả báo hiện tiền: Yêu nhau trong dằn vặt khổ đau, chịu sự phản đối gay gắt của hai gia đình và sự trớ trêu của số phận định đoạt.
        Bài học & Chuyển hóa: Nhờ quy y Tam Bảo hiểu rõ luật nhân duyên, cả hai chuyển hóa tình ái chấp trước thành tình thương đạo vị bè bạn đồng tu, cùng nhau hướng thiện an vui.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660609?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
