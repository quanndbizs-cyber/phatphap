      read_label: 📖 Đọc sách
    - id: 24
      title: Vì Sao Hay Bị Tình Làm Tổn Thương
      summary: 'Nhân vật & Hoàn cảnh: Lời giải đáp sâu sắc về câu hỏi muôn thuở của
        giới trẻ: Vì sao trong tình yêu con người lại hay bị tổn thương, phụ bạc đau
        đớn?

        Hành vi tạo nghiệp: Tơ duyên ái dục tiền kiếp đan xen nợ nần; kẻ đi lừa gạt
        tình cảm người khác kiếp trước thì kiếp này ắt phải chịu cảnh bị người phụ
        tình trả lại.

        Quả báo hiện tiền: Nỗi đau đớn xé lòng khi bị người mình tin yêu nhất phản
        bội, sống trong oán hận dằn vặt làm hủy hoại tương lai và sức khỏe.

        Bài học & Chuyển hóa: Hiểu rõ duyên tụ duyên tan là do nghiệp lực chi phối;
        hãy buông bỏ hận thù, dùng tình thương bao dung và ánh sáng Phật pháp chữa
        lành vết thương lòng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660607?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-24
      read_label: 📖 Đọc sách
    - id: 25
      title: Ân nào cao hơn
      summary: 'Nhân vật & Hoàn cảnh: Bài pháp luận sâu sắc so sánh giữa hai ân đức
        lớn nhất của đời người: Ơn sinh thành dưỡng dục của cha mẹ và Ơn cứu độ giới
        thân huệ mạng của Tam Bảo.

        Hành vi tạo nghiệp: Con người thường nặng bên tình nhẹ bên hiếu, hoặc quên
        lãng công ơn trời biển của các bậc ân nhân đã dìu dắt mình qua cơn hoạn nạn.

        Quả báo hiện tiền: Bất hiếu bội ân chiêu cảm ác báo thân bại danh liệt, con
        cái ngỗ nghịch đối xử tệ bạc y hệt khi về già.

        Bài học & Chuyển hóa: Làm người phải lấy hiếu đạo làm đầu; vừa tận hiếu phụng
        dưỡng cha mẹ chu đáo, vừa hướng cha mẹ quy y Tam Bảo niệm Phật để trọn vẹn
        cả thế gian lẫn xuất thế gian ân.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660608?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-25
      read_label: 📖 Đọc sách
    - id: 26
      title: Chuyện tình Lan và Dũng
      summary: 'Nhân vật & Hoàn cảnh: Chuyện tình đầy nước mắt và trắc trở giữa đôi
        bạn trẻ Lan và Dũng, yêu nhau tha thiết nhưng luôn gặp nghịch cảnh ngăn trở
        không thành duyên nợ.

        Hành vi tạo nghiệp: Món nợ ân oán tình ái sâu nặng từ tiền kiếp: một bên đến
        đòi nợ tình, một bên đến trả nợ duyên nhưng chưa dứt hết nghiệp chướng.

        Quả báo hiện tiền: Yêu nhau trong dằn vặt khổ đau, chịu sự phản đối gay gắt
        của hai gia đình và sự trớ trêu của số phận định đoạt.

        Bài học & Chuyển hóa: Nhờ quy y Tam Bảo hiểu rõ luật nhân duyên, cả hai chuyển
        hóa tình ái chấp trước thành tình thương đạo vị bè bạn đồng tu, cùng nhau
        hướng thiện an vui.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660609?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-26
      read_label: 📖 Đọc sách
    - id: 27
      title: Người chồng mê nhậu
      summary: 'Nhân vật & Hoàn cảnh: Tấn bi kịch của một người chồng nghiện rượu
        chè be bét, suốt ngày say xỉn chửi bới đánh đập vợ con làm tan nát gia phong.

        Hành vi tạo nghiệp: Đắm chìm trong ma men rượu độc, để lòng sân hận và vô
        minh sai khiến biến bản thân thành quỷ dữ hủy hoại hạnh phúc gia đình.

        Quả báo hiện tiền: Vợ con khiếp sợ bỏ đi, bản thân mắc bệnh xơ gan cổ trướng
        giai đoạn cuối, cơ thể phù nề đau đớn sống cô độc một mình không ai chăm sóc.

        Bài học & Chuyển hóa: Rượu là cội nguồn của mọi tội lỗi; người tu Phật phải
        nghiêm trì giới không uống rượu để bảo vệ trí tuệ và giữ gìn tổ ấm gia đình
        an vui.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660610?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-27
      read_label: 📖 Đọc sách
    - id: 28
      title: Chuyện vụ án chấn động
      summary: 'Nhân vật & Hoàn cảnh: Phân tích nguyên nhân tâm linh và nghiệp báo
        sâu xa đằng sau các vụ thảm án giết người chấn động xã hội thời gian gần đây.

        Hành vi tạo nghiệp: Lòng tham lam, sân hận mù quáng và tâm tà dâm đen tối
        thúc đẩy con người ra tay sát hại đồng loại tàn bạo không gớm tay.

        Quả báo hiện tiền: Kẻ thủ ác phải đền mạng trước pháp luật và chịu sự đọa
        đày muôn kiếp nơi địa ngục A Tỳ chịu muôn ngàn hình phạt lửa thiêu dao cắt.

        Bài học & Chuyển hóa: Cảnh báo đanh thép cho nhân gian: hãy kiềm chế cơn giận,
        quán chiếu nhân quả trong từng ý nghĩ hành vi trước khi quá muộn màng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660611?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-28
      read_label: 📖 Đọc sách
    - id: 29
      title: Cảnh báo về khẩu nghiệp
      summary: 'Nhân vật & Hoàn cảnh: Lời cảnh tỉnh nghiêm khắc về khẩu nghiệp: nói
        lời đâm thọc hai đầu, thêu dệt ly gián, chửi rủa và nói lời dối trá hại người.

        Hành vi tạo nghiệp: Dùng miệng lưỡi làm vũ khí sát thương danh dự và sinh
        mạng của người khác, gieo rắc mối bất hòa chia rẽ khắp nơi để trục lợi cá
        nhân.

        Quả báo hiện tiền: Bị người đời khinh bỉ xa lánh, mắc các bệnh nan y vùng
        miệng họng; đời sau sinh ra câm ngọng hoặc miệng hôi thối như xác chết.

        Bài học & Chuyển hóa: Tu thân trước hết phải tu cái miệng; luôn nói lời chân
        thật, hòa nhã, ái ngữ và tán thán điều thiện để tích lũy vô lượng phước đức.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660612?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-29
      read_label: 📖 Đọc sách
    - id: 30
      title: Những nguy hại cần biết
      summary: 'Nhân vật & Hoàn cảnh: Những nguy hại khôn lường của lối sống buông
        thả, chạy theo trào lưu hưởng thụ trụy lạc và thực phẩm bẩn độc hại thời hiện
        đại.

        Hành vi tạo nghiệp: Tự hủy hoại thân tâm bằng ma túy, cờ bạc mạng, phim ảnh
        đồi trụy và thói quen ăn uống sát sinh tàn độc không kiêng kỵ.

        Quả báo hiện tiền: Thân thể suy kiệt, mắc các chứng bệnh tâm thần hoang tưởng,
        tuổi trẻ tàn phai và tương lai sự nghiệp tiêu tán hoàn toàn.

        Bài học & Chuyển hóa: Hãy tỉnh táo nhận diện cạm bẫy trần gian; quay về với
        lối sống giản dị thanh tịnh, ăn chay giữ giới để bảo vệ thân tâm an lạc lành
        mạnh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660613?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-30
      read_label: 📖 Đọc sách
    - id: 31
      title: Vì sao phải giới dâm
      summary: 'Nhân vật & Hoàn cảnh: Lời khai thị chỉ rõ vì sao Đức Phật chế giới
        cấm tà dâm là một trong những giới trọng hàng đầu của hàng Phật tử tại gia.

        Hành vi tạo nghiệp: Hành vi tà dâm, ngoại tình phá hoại gia đình người khác
        làm tổn hao nguyên khí tinh thần và chiêu cảm nghiệp chướng nặng nề.

        Quả báo hiện tiền: Mắc các bệnh hiểm nghèo vùng sinh dục, công danh sự nghiệp
        sụp đổ, con cái hư hỏng và hậu vận cô độc bần hàn cùng cực.

        Bài học & Chuyển hóa: Giữ giới không tà dâm giúp bảo tồn tinh khí thần, tăng
        trưởng trí tuệ và phúc thọ, bảo vệ hạnh phúc gia đình bền vững dài lâu.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660614?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-31
      read_label: 📖 Đọc sách
    - id: 32
      title: Sự mê muội đáng sợ khi nhập thai cách ấm
      summary: 'Nhân vật & Hoàn cảnh: Chân tướng về sự mê muội đáng sợ khi thần thức
        con người nhập thai (Cách ấm chi mê) trải qua cửa sinh tử luân hồi.

        Hành vi tạo nghiệp: Trong lúc đầu thai bị dục vọng và tham ái chi phối, vừa
        chui vào bụng mẹ liền quên sạch tiền kiếp và những công phu tu tập thuở xưa.

        Quả báo hiện tiền: Tái sinh làm người lại tiếp tục đắm chìm trong danh lợi
        thế gian, mê mờ tạo thêm ác nghiệp mới nối tiếp vòng luân hồi đau khổ không
        dứt.

        Bài học & Chuyển hóa: Hiểu rõ sự hiểm nguy của luân hồi; người trí phải dốc
        lòng niệm Phật cầu sinh Tây Phương Tịnh Độ ngay trong kiếp này để vĩnh viễn
        không còn mê muội nhập thai.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660615?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
