    - id: 36
      title: Sám hối đổi tâm chuyển tướng
      summary: |-
        Nhân vật & Hoàn cảnh: Quy luật mầu nhiệm 'Tâm sinh tướng, tướng tùy tâm diệt': Một người phụ nữ có tướng mạo hung dữ xấu xí sau khi chân thành sám hối đã chuyển thành dung mạo đoan trang phúc hậu.
        Hành vi tạo nghiệp: Tâm chứa đầy đố kỵ, tham lam và giận dữ khiến khuôn mặt hằn sâu những nét cau có u ám, đi đến đâu cũng bị mọi người xa lánh ghét bỏ.
        Quả báo hiện tiền: Tướng mạo khắc khổ chiêu cảm cuộc đời lận đận trắc trở, gia đạo bất hòa không một ngày vui vẻ.
        Bài học & Chuyển hóa: Sau khi quy y Tam Bảo, ngày ngày lạy Phật sám hối, mở rộng lòng từ bi thương yêu muôn loài; chỉ sau ba năm tướng mạo biến đổi kỳ diệu trở nên hiền từ sáng sủa, phúc tướng rạng ngời.
