    - id: 18
      title: Hậu Thân Lý Bạch
      summary: |-
        Nhân vật & Hoàn cảnh: Nhà thôi miên nổi tiếng Hàng Minh tại New York tổ chức buổi thuyết giảng và thôi miên tiền kiếp đặc biệt tại Los Angeles vào ngày 28/9.
        Hành vi tạo nghiệp: Một học giả tham gia thôi miên nhớ lại tiền kiếp từng là thi tiên Lý Bạch tài hoa cái thế, cả đời đắm chìm trong thơ rượu, danh vọng và phong lưu thế tục.
        Quả báo hiện tiền: Dù tài hoa nghìn thu để lại nhưng linh hồn vẫn trôi lăn trong lục đạo luân hồi sinh tử chịu bao phen đau khổ bấp bênh nơi cõi trần tạm bợ.
        Bài học & Chuyển hóa: Tài hoa thơ phú và danh vọng trần gian chỉ là ảo ảnh thoảng qua như mây khói; chỉ có tu tập giải thoát giác ngộ mới là con đường chân thật cứu vớt linh hồn vĩnh cửu.
