    - id: 17
      title: Ông Trùm Xã Hội Đen
      summary: |-
        Nhân vật & Hoàn cảnh: Mã huynh là đại hán Sơn Đông tướng mạo uy nghi như Võ Tòng đánh hổ, từng là ông trùm xã hội đen khét tiếng chỉ huy hàng trăm đàn em đâm chém.
        Hành vi tạo nghiệp: Tung hoành chốn giang hồ đòi nợ thuê, bảo kê, mở sòng bài và đâm chém thanh trừng đối thủ tạo nên nghiệp chướng đẫm máu ngút trời.
        Quả báo hiện tiền: Chứng kiến các đàn em thân tín lần lượt bị bắn chết phanh thây hoặc chịu án tử hình tù đày; bản thân đêm đêm gặp ác mộng oan hồn đòi mạng sợ hãi tột độ.
        Bài học & Chuyển hóa: Giác ngộ quay đầu là bờ, ông trùm giã từ giới giang hồ, đem toàn bộ gia sản đi phóng sinh chim cá cứu vật và ngày đêm quỳ lạy Phật sám hối chuộc lại tội xưa.
