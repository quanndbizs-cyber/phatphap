    - id: 31
      title: Vì sao phải giới dâm
      summary: |-
        Nhân vật & Hoàn cảnh: Lời khai thị chỉ rõ vì sao Đức Phật chế giới cấm tà dâm là một trong những giới trọng hàng đầu của hàng Phật tử tại gia.
        Hành vi tạo nghiệp: Hành vi tà dâm, ngoại tình phá hoại gia đình người khác làm tổn hao nguyên khí tinh thần và chiêu cảm nghiệp chướng nặng nề.
        Quả báo hiện tiền: Mắc các bệnh hiểm nghèo vùng sinh dục, công danh sự nghiệp sụp đổ, con cái hư hỏng và hậu vận cô độc bần hàn cùng cực.
        Bài học & Chuyển hóa: Giữ giới không tà dâm giúp bảo tồn tinh khí thần, tăng trưởng trí tuệ và phúc thọ, bảo vệ hạnh phúc gia đình bền vững dài lâu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660614?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
