    - id: 30
      title: Những nguy hại cần biết
      summary: |-
        Nhân vật & Hoàn cảnh: Những nguy hại khôn lường của lối sống buông thả, chạy theo trào lưu hưởng thụ trụy lạc và thực phẩm bẩn độc hại thời hiện đại.
        Hành vi tạo nghiệp: Tự hủy hoại thân tâm bằng ma túy, cờ bạc mạng, phim ảnh đồi trụy và thói quen ăn uống sát sinh tàn độc không kiêng kỵ.
        Quả báo hiện tiền: Thân thể suy kiệt, mắc các chứng bệnh tâm thần hoang tưởng, tuổi trẻ tàn phai và tương lai sự nghiệp tiêu tán hoàn toàn.
        Bài học & Chuyển hóa: Hãy tỉnh táo nhận diện cạm bẫy trần gian; quay về với lối sống giản dị thanh tịnh, ăn chay giữ giới để bảo vệ thân tâm an lạc lành mạnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660613?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
