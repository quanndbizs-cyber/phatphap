    - id: 27
      title: Người chồng mê nhậu
      summary: |-
        Nhân vật & Hoàn cảnh: Tấn bi kịch của một người chồng nghiện rượu chè be bét, suốt ngày say xỉn chửi bới đánh đập vợ con làm tan nát gia phong.
        Hành vi tạo nghiệp: Đắm chìm trong ma men rượu độc, để lòng sân hận và vô minh sai khiến biến bản thân thành quỷ dữ hủy hoại hạnh phúc gia đình.
        Quả báo hiện tiền: Vợ con khiếp sợ bỏ đi, bản thân mắc bệnh xơ gan cổ trướng giai đoạn cuối, cơ thể phù nề đau đớn sống cô độc một mình không ai chăm sóc.
        Bài học & Chuyển hóa: Rượu là cội nguồn của mọi tội lỗi; người tu Phật phải nghiêm trì giới không uống rượu để bảo vệ trí tuệ và giữ gìn tổ ấm gia đình an vui.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660610?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
