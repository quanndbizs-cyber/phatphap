      title: Hai Bản Kinh Đầu Tiên
      summary: 'Nhân vật & Hoàn cảnh: Đây là câu chuyện có thực do tôi đích thân trải
        qua, tuyệt không nói dối. Nhà chúng tôi vốn không khá giả, trước đây sống
        rất gian khổ, xem như khó thể mua nhà....

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
