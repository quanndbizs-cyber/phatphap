    - id: 29
      title: Cảnh báo về khẩu nghiệp
      summary: |-
        Nhân vật & Hoàn cảnh: Lời cảnh tỉnh nghiêm khắc về khẩu nghiệp: nói lời đâm thọc hai đầu, thêu dệt ly gián, chửi rủa và nói lời dối trá hại người.
        Hành vi tạo nghiệp: Dùng miệng lưỡi làm vũ khí sát thương danh dự và sinh mạng của người khác, gieo rắc mối bất hòa chia rẽ khắp nơi để trục lợi cá nhân.
        Quả báo hiện tiền: Bị người đời khinh bỉ xa lánh, mắc các bệnh nan y vùng miệng họng; đời sau sinh ra câm ngọng hoặc miệng hôi thối như xác chết.
        Bài học & Chuyển hóa: Tu thân trước hết phải tu cái miệng; luôn nói lời chân thật, hòa nhã, ái ngữ và tán thán điều thiện để tích lũy vô lượng phước đức.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660612?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
