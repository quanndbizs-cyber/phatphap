    - id: 22
      title: Chuyện Bồ Tát Cảm Ứng Mẹ Tròn Con Vuông
      summary: |-
        Nhân vật & Hoàn cảnh: Chuyện cảm ứng màu nhiệm của một sản phụ gặp ca sinh khó nguy kịch tính mạng cả mẹ lẫn con tại bệnh viện phụ sản lớn.
        Hành vi tạo nghiệp: Nghiệp chướng tiền kiếp và sự sợ hãi lo âu làm tắc nghẽn huyết mạch; thai nhi nằm ngược ngôi, bác sĩ chuẩn bị mổ cấp cứu nguy hiểm.
        Quả báo hiện tiền: Đối mặt với ranh giới sinh tử mong manh của hai mẹ con, gia đình rơi vào cảnh hoảng loạn tột cùng.
        Bài học & Chuyển hóa: Người mẹ nhất tâm niệm danh hiệu Bồ Tát Quán Thế Âm cầu cứu; kỳ diệu thay thai nhi tự xoay đầu thuận lợi, sinh nở mẹ tròn con vuông trong sự ngỡ ngàng của y bác sĩ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660605?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
