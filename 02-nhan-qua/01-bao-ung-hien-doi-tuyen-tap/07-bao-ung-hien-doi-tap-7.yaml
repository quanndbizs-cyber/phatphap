      read_label: 📖 Đọc sách
    - id: 25
      title: Ân nào cao hơn
      summary: |-
        Nhân vật & Hoàn cảnh: Bài pháp luận sâu sắc so sánh giữa hai ân đức lớn nhất của đời người: Ơn sinh thành dưỡng dục của cha mẹ và Ơn cứu độ giới thân huệ mạng của Tam Bảo.
        Hành vi tạo nghiệp: Con người thường nặng bên tình nhẹ bên hiếu, hoặc quên lãng công ơn trời biển của các bậc ân nhân đã dìu dắt mình qua cơn hoạn nạn.
        Quả báo hiện tiền: Bất hiếu bội ân chiêu cảm ác báo thân bại danh liệt, con cái ngỗ nghịch đối xử tệ bạc y hệt khi về già.
        Bài học & Chuyển hóa: Làm người phải lấy hiếu đạo làm đầu; vừa tận hiếu phụng dưỡng cha mẹ chu đáo, vừa hướng cha mẹ quy y Tam Bảo niệm Phật để trọn vẹn cả thế gian lẫn xuất thế gian ân.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660608?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
