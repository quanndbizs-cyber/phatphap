      read_label: 📖 Đọc sách
    - id: 3
      title: Câu Chuyện Của Tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thú của chàng trai 27 tuổi về chuỗi ngày đen tối sa ngã vào vực thẳm dâm dục từ thuở còn là học sinh lớp ba tiểu học.
        Hành vi tạo nghiệp: Tiếp xúc với đĩa phim đồi trụy từ nhỏ, nghiện thủ dâm triền miên suốt thời trung học và đại học, nói lời ô uế và xem nhẹ đạo đức truyền thống.
        Quả báo hiện tiền: Thân thể suy kiệt như người chết sống, trí nhớ suy giảm trầm trọng, công danh thi cử lận đận, tình duyên trắc trở và tâm thần hoang mang bế tắc.
        Bài học & Chuyển hóa: Thức tỉnh trước ánh sáng Phật pháp, anh kiên quyết đoạn trừ thủ dâm, ngày đêm quỳ trước Tam Bảo phát lồ sám hối; sức khỏe hồi phục và vận mệnh dần chuyển sang tươi sáng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660586?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-2
      read_label: 📖 Đọc sách
    - id: 4
      title: Chuyện Của Frank
      summary: |-
        Nhân vật & Hoàn cảnh: Frank là người thợ sửa chữa đồ dùng nhân phẩm tốt người gốc Áo đến sửa chữa vật dụng cho gia đình tác giả vào ngày 28/4/1982.
        Hành vi tạo nghiệp: Đam mê săn bắn dã thú rừng rậm, bỏ ngoài tai lời khuyên can tha thiết của tác giả về tội sát sinh hại vật, xách súng vào rừng săn thú tiêu khiển.
        Quả báo hiện tiền: Vừa vào rừng súng săn bất ngờ bị cướp cò bắn thẳng vào chân dập nát xương khớp, phải nằm viện phẫu thuật chịu đau đớn và mang thương tật suốt đời.
        Bài học & Chuyển hóa: Quả báo sát sinh đến nhanh như điện xẹt; loài vật nơi rừng sâu cũng ham sống sợ chết; tước đoạt sinh mạng chúng ắt phải đền mạng bằng chính máu huyết của mình.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660587?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-3
      read_label: 📖 Đọc sách
    - id: 5
      title: Đại Lễ Mông Sơn Cứu Độ Vong Linh
      summary: |-
        Nhân vật & Hoàn cảnh: Đại lễ Mông Sơn Thí Thực quy mô lớn suốt ba ngày do lão Pháp sư Trúc Ma chủ trì tại thành phố Vancouver (Canada) thu hút hàng ngàn người tham dự.
        Hành vi tạo nghiệp: Vô lượng chúng sinh trong tiền kiếp do mê muội tạo nghiệp sát, đạo, dâm, vọng hoặc chết bờ chết bụi nơi đất khách quê người không ai thờ cúng.
        Quả báo hiện tiền: Đọa làm ngạ quỷ đói khát lạnh lẽo lang thang vất vưởng trong bóng tối mịt mùng, cuống họng nhỏ như kim bụng to như trống không nuốt được thức ăn.
        Bài học & Chuyển hóa: Nhờ oai lực gia trì của pháp hội Mông Sơn và tâm từ bi của chư Tăng, vô số vong linh được thọ nhận pháp thực no đủ, cởi bỏ oán thù và siêu sinh thiện cảnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660588?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-4
      read_label: 📖 Đọc sách
    - id: 6
      title: Bình Rượu Thuốc
      summary: |-
        Nhân vật & Hoàn cảnh: Người mẹ của một bạn đồng tu mắc bệnh tiểu đường và ung bàng quang giai đoạn cuối đau đớn dữ dội, bệnh viện trả về nằm chờ chết.
        Hành vi tạo nghiệp: Cả đời có thói quen bắt rắn độc, bò cạp, tắc kè và lươn sống bỏ vào bình rượu ngâm để uống bồi bổ khí huyết tráng dương trị đau nhức.
        Quả báo hiện tiền: Tác giả nhìn thấy linh hồn con vật ngâm rượu đóng chặt nơi bàng quang cắn xé; thân xác người mẹ lở loét hôi thối, tiểu tiện ra máu đau buốt tận tủy xương.
        Bài học & Chuyển hóa: Dùng sinh mạng muôn loài để bồi bổ thân xác mình là đại tội; người con dốc lòng thay mẹ sám hối, đập bỏ bình rượu thuốc và phóng sinh chuộc tội giúp mẹ vơi bớt đau đớn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660589?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-5
      read_label: 📖 Đọc sách
    - id: 7
      title: Nơi Mẹ Tôi Đến
      summary: |-
        Nhân vật & Hoàn cảnh: Tác giả xuất gia tu hành tại chùa Đại Giác (Cơ Long, Đài Loan), đem toàn bộ công đức tu hành thanh tịnh hồi hướng cho người mẹ đã mất nơi Đại Lục.
        Hành vi tạo nghiệp: Người mẹ khi còn sống nơi cõi trần do vô minh chưa biết Phật pháp, từng sát sinh tạo nhiều ác nghiệp nuôi nấng gia đình trong thời loạn lạc.
        Quả báo hiện tiền: Sau khi chết thần thức bị đọa vào địa ngục chịu khổ hình giam cầm, đêm đêm hiện về trong giấc mơ níu áo con sầu thảm van xin cứu vớt.
        Bài học & Chuyển hóa: Người con chí hiếu lập đàn bái sám niệm Phật suốt 49 ngày đêm tại điện Địa Tạng; cảm ứng linh diệu chứng kiến mẹ thăng thiên sáng rỡ thoát khỏi ngục tối địa ngục.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660591?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-6
      read_label: 📖 Đọc sách
    - id: 8
      title: Buổi Cầu Siêu Kỳ Lạ
      summary: |-
        Nhân vật & Hoàn cảnh: Pháp sư được mời đến làm lễ siêu độ cho một thiếu gia con nhà đại phú thương giàu có bậc nhất nhưng bất ngờ đột tử khi tuổi đời còn rất trẻ.
        Hành vi tạo nghiệp: Cậy gia thế giàu sang đã buông thả trác táng, ăn chơi trụy lạc thâu đêm, quan hệ bừa bãi và dùng tiền bạc mua chuộc phá hoại trinh tiết nhiều cô gái.
        Quả báo hiện tiền: Vừa lên pháp tòa Táo Thần hiện ra giơ tấm vải trắng ghi hai chữ "DÂM BÁO"; chàng thiếu gia bị cạn kiệt tinh tủy, đột tử chết bất đắc kỳ tử đọa thẳng vào ác đạo.
        Bài học & Chuyển hóa: Tiền tài triệu phú không mua được mạng sống và công lý nhân quả; tà dâm làm tiêu tán phúc ấm tổ tiên nhanh nhất; bài học cảnh tỉnh sâu sắc cho giới trẻ con nhà giàu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660590?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-7
      read_label: 📖 Đọc sách
    - id: 9
      title: Cô Bạn Tiến Sĩ
      summary: |-
        Nhân vật & Hoàn cảnh: Cô bạn đồng nghiệp là Tiến sĩ Kinh tế kiêm Giảng sư cao học, vốn theo tư tưởng khoa học thực nghiệm và hoàn toàn không tin vào Phật giáo.
        Hành vi tạo nghiệp: Người đời ỷ lại bằng cấp trí thức thế gian, xem thường chuyện luân hồi nhân quả cho đến khi chứng kiến người thân lâm chung đau đớn hoảng loạn.
        Quả báo hiện tiền: Bị ám ảnh bởi nỗi sợ hãi cái chết của người thân; nhận thấy mọi học thức và tiền tài đều hoàn toàn bất lực trước giây phút sinh tử biệt ly.
        Bài học & Chuyển hóa: Bằng trực giác tâm linh cô nhận ra chỉ có tiếng niệm Phật mới giúp người mất bình an, tiêu trừ sợ hãi; từ đó cô tiến sĩ thán phục và phát tâm tán thán pháp môn Tịnh Độ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660592?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-8
      read_label: 📖 Đọc sách
    - id: 10
      title: Ngọn Giáo Nơi Tượng Quan Công
      summary: |-
        Nhân vật & Hoàn cảnh: Đội cảnh sát điều tra hình sự tại Bắc Kinh trong quá trình phá giải các vụ trọng án ly kỳ không thể giải thích bằng khoa học duy vật.
        Hành vi tạo nghiệp: Kẻ cướp sát nhân tàn bạo ra tay giết người cướp của tinh vi, tưởng chừng che giấu được dấu vết để trốn thoát sự truy lùng của pháp luật.
        Quả báo hiện tiền: Trên đường lẩn trốn hắn lẻn vào đền Quan Công ẩn nấp; ngọn giáo sắt trên tay bức tượng Quan Công bỗng rơi xuống đâm gãy chân hắn, khiến hắn bị bắt tại trận.
        Bài học & Chuyển hóa: Đa số cảnh sát đều thờ Phật và tin sâu nhân quả; lưới trời lồng lộng thần linh hộ trì chánh nghĩa; kẻ làm ác dẫu trốn chạy đến góc biển chân trời cũng không thoát khỏi lưới nghiệp.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660593?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-9
      read_label: 📖 Đọc sách
    - id: 11
      title: Hai Bản Kinh Đầu Tiên
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thuật chân thành của tác giả về giai đoạn gia cảnh nghèo khó khốn cùng, sống trong cảnh thuê trọ chật hẹp không dám mơ đến việc mua nhà.
        Hành vi tạo nghiệp: Do nhiều đời thiếu tu phúc bố thí nên đời này chịu quả báo bần hàn, công việc vất vả thu nhập ít ỏi không đủ trang trải cuộc sống.
        Quả báo hiện tiền: Thiếu thốn vật chất, thân tâm bất an, sống trong cảnh bế tắc mưu sinh giữa chốn phồn hoa đô thị đắt đỏ.
        Bài học & Chuyển hóa: Được thiện tri thức chỉ dạy, tác giả chí thành ngày ngày trì tụng Bát Nhã Tâm Kinh và Chú Đại Bi; Phật lực gia trì nhiệm màu giúp kinh tế hanh thông, mua được nhà khang trang.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660594?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
