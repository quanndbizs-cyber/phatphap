    - id: 1
      title: Lời Người Dịch
      summary: 'Nhân vật & Hoàn cảnh: Lời người dịch mở đầu tác phẩm Báo Ứng Hiện
        Đời tập 7 do Sư Cô Hạnh Đoan chuyển ngữ, đúc kết tinh hoa nhân quả thực tế.

        Hành vi tạo nghiệp: Chúng sinh trôi lăn trong sinh tử vì vô minh tạo nghiệp;
        cuốn sách như hồi chuông cảnh tỉnh giúp người đời tỉnh giấc mê lầm nơi trần
        thế.

        Quả báo hiện tiền: Vô vàn khổ đau bệnh tật và nghịch cảnh bủa vây; chỉ khi
        thấu hiểu luật nhân quả con người mới biết sợ nhân mà cẩn trọng giữ mình.

        Bài học & Chuyển hóa: Nguyện đem công đức biên dịch cuốn sách này gieo duyên
        bồ đề cho khắp muôn người, cùng nhau xây dựng cuộc sống an lạc, từ bi và trí
        tuệ giải thoát.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660584?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-7#truyen-1
      read_label: 📖 Đọc sách
    - id: 2
      title: Anh Bạn Sinh Viên
      summary: 'Nhân vật & Hoàn cảnh: Chàng sinh viên trẻ nghiện game và hưởng thụ
        trụy lạc, sau biến cố sinh tử đã thức tỉnh nhờ lời Phật dạy, trở thành người
        sống có ích và hướng thiện.

        Hành vi tạo nghiệp: Nghiệp sát sinh tàn hại mạng sống động vật, ham muốn khẩu
        dục tươi sống hoặc bức hại muôn loài chúng sinh không chút thương xót.

        Quả báo hiện tiền: Thân thể mắc bệnh nan y hiểm nghèo hành hạ đau đớn, y học
        hiện đại bất lực; tinh thần bấn loạn chịu khổ báo hiện tiền thích đáng.

        Bài học & Chuyển hóa: Lời khai thị từ bi của Hòa thượng Diệu Pháp và chư Đại
        Đức nhắc nhở người đời mau chóng thức tỉnh, phát tâm ăn chay sám hối, dứt
        ác tu thiện và niệm Phật tiêu nghiệp chướng.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660585?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
