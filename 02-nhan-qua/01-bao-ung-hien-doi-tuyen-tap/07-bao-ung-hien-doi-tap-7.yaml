    - id: 32
      title: Sự mê muội đáng sợ khi nhập thai cách ấm
      summary: |-
        Nhân vật & Hoàn cảnh: Chân tướng về sự mê muội đáng sợ khi thần thức con người nhập thai (Cách ấm chi mê) trải qua cửa sinh tử luân hồi.
        Hành vi tạo nghiệp: Trong lúc đầu thai bị dục vọng và tham ái chi phối, vừa chui vào bụng mẹ liền quên sạch tiền kiếp và những công phu tu tập thuở xưa.
        Quả báo hiện tiền: Tái sinh làm người lại tiếp tục đắm chìm trong danh lợi thế gian, mê mờ tạo thêm ác nghiệp mới nối tiếp vòng luân hồi đau khổ không dứt.
        Bài học & Chuyển hóa: Hiểu rõ sự hiểm nguy của luân hồi; người trí phải dốc lòng niệm Phật cầu sinh Tây Phương Tịnh Độ ngay trong kiếp này để vĩnh viễn không còn mê muội nhập thai.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660615?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
