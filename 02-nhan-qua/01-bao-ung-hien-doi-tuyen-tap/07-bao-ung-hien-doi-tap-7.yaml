    - id: 12
      title: Đại Sư Thăm Bệnh
      summary: |-
        Nhân vật & Hoàn cảnh: Hòa thượng Diệu Pháp đích thân đến bệnh viện thăm hỏi và khai thị giải trừ nghiệp chướng cho một bệnh nhân ung thư giai đoạn cuối.
        Hành vi tạo nghiệp: Bệnh nhân thuở sinh tiền làm nghề buôn bán gia súc gia cầm, giết hại vô số sinh linh để kiếm sống bồi bổ gia đình.
        Quả báo hiện tiền: Thân thể đau đớn rên rỉ, khối u di căn khắp nơi; oan hồn các loài vật bám chặt đòi mạng khiến bác sĩ không thể chích thuốc giảm đau.
        Bài học & Chuyển hóa: Nhờ Hòa thượng từ bi chỉ điểm món nợ máu xương, bệnh nhân rơi lệ chí thành sám hối trước Phật; tâm an định buông xả, cơn đau thuyên giảm kỳ diệu trước giờ phút ra đi an lành.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660595?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
