      read_label: 📖 Đọc sách
    - id: 21
      title: Những Lần Triều Sơn Cùng Ngài Hư Vân
      summary: |-
        Nhân vật & Hoàn cảnh: Ký ức thiêng liêng và đạo hạnh phi phàm của Đại lão Hòa thượng Hư Vân – bậc thiền sư thạch trụ tùng lâm sống thọ 120 tuổi của Phật giáo Trung Hoa.
        Hành vi tạo nghiệp: Hạnh nguyện Bồ Tát xả thân vì chánh pháp, ba bước một lạy triều bái Ngũ Đài Sơn đền đáp công ơn sinh thành của cha mẹ suốt nhiều năm trường kỳ gian khổ.
        Quả báo hiện tiền: Cảm ứng đất trời chấn động: cây khô sống lại, chuông mõ tự ngân, hoa sen trổ trên nến và rau cải, hổ dữ quy phục quỳ lạy nghe kinh sám hối dưới chân ngài.
        Bài học & Chuyển hóa: Tấm gương sáng ngời muôn đời về chí nguyện tu hành bất thoái chuyển; nhắc nhở hàng hậu học lấy giới luật làm thầy, kiên trì vượt qua mọi nghịch cảnh phong ba thử thách nơi trần thế.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660604?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
