      read_label: 📖 Đọc sách
    - id: 20
      title: Siêu Độ Ông Ngoại
      summary: |-
        Nhân vật & Hoàn cảnh: Năm 2011 cuộc sống và sức khỏe của tác giả rơi vào giai đoạn suy sụp khủng hoảng nhất, bèn lên mạng tìm kiếm phương pháp thay đổi số mệnh.
        Hành vi tạo nghiệp: Vô minh nhiều đời tạo ác nghiệp khiến vận hạn bế tắc; ông ngoại quá cố nhiều năm trước khi mất tạo nghiệp sát sinh ăn mặn chịu đọa lạc nơi cõi ngạ quỷ đói khát.
        Quả báo hiện tiền: Bản thân ốm đau quặt quẹo, gia đình xui xẻo dồn dập, đêm đêm nằm mộng thấy ông ngoại hiện về trong hình hài rách rưới đói khát van xin cứu độ.
        Bài học & Chuyển hóa: Được tặng các bộ kinh điển, tác giả phát nguyện quỳ tụng 108 bộ Kinh Địa Tạng hồi hướng cho ông ngoại; cảm ứng mộng thấy ông ngoại được Phật quang tiếp dẫn siêu sinh thiên giới.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660603?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
