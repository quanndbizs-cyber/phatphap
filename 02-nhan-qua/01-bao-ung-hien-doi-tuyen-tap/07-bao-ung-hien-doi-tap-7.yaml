    - id: 19
      title: Nhất Kiến Chung Tình
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải thấu đáo về hiện tượng tâm lý "nhất kiến chung tình" (vừa gặp đã say đắm yêu thương) dưới lăng kính nhân quả luân hồi ba đời của đạo Phật.
        Hành vi tạo nghiệp: Trong tiền kiếp hai người từng là vợ chồng sâu sắc hoặc từng cùng nhau thề non hẹn biển dưới trăng thề nguyện kiếp sau tiếp tục tái hợp bên nhau.
        Quả báo hiện tiền: Vừa chạm mặt trong kiếp này liền bùng cháy ngọn lửa tình si mê mệt, bất chấp mọi rào cản luân thường gia đình và đạo đức thế tục để đến với nhau.
        Bài học & Chuyển hóa: Tình cảm thế tục là sợi dây oan trái trói buộc luân hồi; hiểu rõ tiền duyên để không buông thả theo ái dục si mê mà phải chuyển hóa thành đạo tình tương trợ tu hành giải thoát.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660602?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
