    - id: 15
      title: Người Xưa Nay Ở Đây
      summary: |-
        Nhân vật & Hoàn cảnh: Cô X là ca sĩ nhạc viện xinh đẹp tài năng, sớm gặt hái danh tiếng lớn và ký hợp đồng biểu diễn chuyên nghiệp với các đoàn ca vũ nổi tiếng.
        Hành vi tạo nghiệp: Đắm chìm trong ánh hào quang sân khấu thế tục, nhưng sâu thẳm tâm hồn luôn thôi thúc tìm về cội nguồn tâm linh giải thoát thanh tịnh.
        Quả báo hiện tiền: Danh lợi trần thế không mang lại an lạc thực sự; cô thường cảm thấy lạc lõng cô đơn giữa chốn phù hoa náo nhiệt.
        Bài học & Chuyển hóa: Năm 2000 quy y Tam Bảo, trong một chuyến triều bái chùa cổ cô nhận ra tiền kiếp mình từng là một ni cô tu hành thanh tịnh nơi đây; thấu suốt luân hồi cô phát tâm đại tinh tấn tu học.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660598?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
