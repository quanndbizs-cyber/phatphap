    - id: 24
      title: Vì Sao Hay Bị Tình Làm Tổn Thương
      summary: |-
        Nhân vật & Hoàn cảnh: Lời giải đáp sâu sắc về câu hỏi muôn thuở của giới trẻ: Vì sao trong tình yêu con người lại hay bị tổn thương, phụ bạc đau đớn?
        Hành vi tạo nghiệp: Tơ duyên ái dục tiền kiếp đan xen nợ nần; kẻ đi lừa gạt tình cảm người khác kiếp trước thì kiếp này ắt phải chịu cảnh bị người phụ tình trả lại.
        Quả báo hiện tiền: Nỗi đau đớn xé lòng khi bị người mình tin yêu nhất phản bội, sống trong oán hận dằn vặt làm hủy hoại tương lai và sức khỏe.
        Bài học & Chuyển hóa: Hiểu rõ duyên tụ duyên tan là do nghiệp lực chi phối; hãy buông bỏ hận thù, dùng tình thương bao dung và ánh sáng Phật pháp chữa lành vết thương lòng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660607?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
