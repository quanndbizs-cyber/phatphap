      read_label: 📖 Đọc sách
    - id: 28
      title: Chuyện vụ án chấn động
      summary: |-
        Nhân vật & Hoàn cảnh: Phân tích nguyên nhân tâm linh và nghiệp báo sâu xa đằng sau các vụ thảm án giết người chấn động xã hội thời gian gần đây.
        Hành vi tạo nghiệp: Lòng tham lam, sân hận mù quáng và tâm tà dâm đen tối thúc đẩy con người ra tay sát hại đồng loại tàn bạo không gớm tay.
        Quả báo hiện tiền: Kẻ thủ ác phải đền mạng trước pháp luật và chịu sự đọa đày muôn kiếp nơi địa ngục A Tỳ chịu muôn ngàn hình phạt lửa thiêu dao cắt.
        Bài học & Chuyển hóa: Cảnh báo đanh thép cho nhân gian: hãy kiềm chế cơn giận, quán chiếu nhân quả trong từng ý nghĩ hành vi trước khi quá muộn màng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/a026d5dc-222b-43ce-8483-4859a623b92a/file/660611?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
