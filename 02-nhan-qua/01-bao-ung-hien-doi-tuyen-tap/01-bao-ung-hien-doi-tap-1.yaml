    - id: 13
      title: Thân phụ cầu siêu độ
      summary: 'Nhân vật & Hoàn cảnh: Một bác sĩ họ Hoàng mắc chứng bệnh kỳ quái,
        cứ trời vừa sụp tối là hai mắt đứng tròng, người cứng đờ không nói năng cử
        động được, 6 bác sĩ chuyên khoa đầu ngành đều bó tay.

        Hành vi tạo nghiệp: Người cha quá cố của ông thuở sinh tiền tạo nhiều ác nghiệp
        sát sinh và bất kính Tam Bảo nên sau khi chết bị đọa vào cảnh giới u minh
        tối tăm lạnh lẽo, chịu muôn vàn thống khổ.

        Quả báo hiện tiền: Hương linh người cha nương gá vào thân xác con trai trong
        cơn tuyệt vọng để phát tín hiệu cầu cứu siêu độ nơi chốn dương gian.

        Bài học & Chuyển hóa: Hòa thượng chỉ rõ duyên do; bác sĩ Hoàng cùng gia đình
        thành tâm phát nguyện lập đàn tụng kinh Địa Tạng, làm nhiều việc thiện hồi
        hướng cho cha; người cha được siêu thoát và ông lập tức bình phục hoàn toàn.'
