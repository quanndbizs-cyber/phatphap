    - id: 1
      title: Thiếu niên bất lương
      summary: 'Nhân vật & Hoàn cảnh: Một thanh niên hơn 30 tuổi người Đài Loan mắc
        chứng bệnh đau ngực dữ dội và đau nhức toàn thân suốt 3 năm, tứ chi rã rời
        không còn sức lực, các bệnh viện lớn đều bó tay chỉ chẩn đoán là rối loạn
        thần kinh thực vật.

        Hành vi tạo nghiệp: Thuở thiếu niên bất lương, kết bè đảng du côn cướp giật,
        ngỗ nghịch, thường xuyên đập phá đồ đạc, chửi rủa và đánh đập cha mẹ tàn nhẫn
        khiến mẹ uất ức thổ huyết qua đời, sau đó cha cũng đau buồn chết theo.

        Quả báo hiện tiền: Thân thể toát ra tà khí hắc ám, ngực đau nhói như bị xé
        rách; khi vạch áo trước Hòa thượng Diệu Pháp thì lộ rõ 4 chữ ''ngỗ nghịch
        bất hiếu'' tím bầm hằn sâu trên da thịt.

        Bài học & Chuyển hóa: Hòa thượng nghiêm khắc quở trách, anh sụp lạy khóc lóc
        sám hối, phát nguyện ăn chay trường và tụng 49 bộ Kinh Địa Tạng hồi hướng
        cho cha mẹ; sau đó 4 chữ biến mất và bệnh lành hoàn toàn.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660398?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-3
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=rXbPRWdLpOI
    - id: 2
      title: Giật mình tỉnh ngộ
      summary: 'Nhân vật & Hoàn cảnh: Trương Nghĩa bị viêm cột sống dính khớp hành
        hạ đau đớn dữ dội đến mức còng lưng, gập người không thể đi lại hay nằm thẳng,
        y học hiện đại không có thuốc chữa.

        Hành vi tạo nghiệp: Từ thuở nhỏ có sở thích tàn nhẫn bắt ếch, lươn và bẻ sống
        xương sống của chúng để nấu ăn, lại thích ăn ốc sống, nuốt mật sống của các
        loài thủy tộc.

        Quả báo hiện tiền: Toàn bộ cột sống bị dính cứng, biến dạng cong gập y hệt
        hình dạng con ếch, con lươn bị bẻ gãy lưng quằn quại trước khi chết, chịu
        đau đớn thấu tận tâm can.

        Bài học & Chuyển hóa: Nhờ quy y sám hối và ăn chay trường mà lưng dần thẳng
        lại, đi đứng bình thường; tuy nhiên khi khởi tâm thèm thịt ăn lại thì bệnh
        lập tức tái phát dữ dội, khiến anh rùng mình tỉnh ngộ kiên trì giữ giới ăn
        chay suốt đời.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660396?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-4
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=fd54QngrHCA
    - id: 3
      title: Gà trống lông vàng
      summary: 'Nhân vật & Hoàn cảnh: Một người nông dân mắc bệnh ung thư phổi thời
        kỳ cuối, ho ra máu, khó thở và ngực đau như bị dao đâm, bệnh viện trả về chờ
        chết.

        Hành vi tạo nghiệp: Nhiều năm làm nghề giết mổ hàng ngàn con gà, đặc biệt
        từng trộm bắt và cắt cổ một con gà trống lông vàng to lớn của hàng xóm để
        làm thịt nhậu.

        Quả báo hiện tiền: Khối u ác tính trong phổi hình thành và tản mác, các đốm
        u khi chụp X-quang tụ lại hệt như đàn gà đang mổ xé phổi; oan hồn con gà trống
        lông vàng cùng ngàn vạn con gà khác tụ lại nơi buồng phổi đòi mạng.

        Bài học & Chuyển hóa: Nhờ chí thành sám hối, phát nguyện bỏ hẳn nghề sát sinh
        và tụng 49 bộ Kinh Địa Tạng siêu độ, các khối u tiêu tan kỳ diệu, bệnh viện
        chụp phim lại kinh ngạc xác nhận phổi hoàn toàn bình phục.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660397?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-5
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=P_nCIZAGmaA
    - id: 4
      title: Bệnh trời cho
      summary: 'Nhân vật & Hoàn cảnh: Một người phụ nữ đưa con trai bị chứng động
        kinh co giật liên miên, sùi bọt mép đến cầu cứu Hòa thượng Diệu Pháp và than
        khóc rằng đây là ''bệnh trời cho'' vô cớ.

        Hành vi tạo nghiệp: Hòa thượng chỉ rõ trong thời gian mang thai, người mẹ
        rất thích ăn cua sống ngâm rượu, thường xuyên dùng dao chặt đôi những con
        cua còn sống ngoe nguẩy đang giẫy giụa, miệng sùi bọt mép.

        Quả báo hiện tiền: Đứa trẻ khi phát bệnh co giật hai tay co quắp, miệng trào
        bọt mép, mắt trợn trừng y hệt hình ảnh loài cua bị chặt sống trong hũ rượu
        năm xưa.

        Bài học & Chuyển hóa: Người mẹ bàng hoàng thức tỉnh nhận ra sự tàn độc của
        khẩu nghiệp ăn uống, quỳ sụp trước bàn thờ Phật chí thành sám hối, phát nguyện
        ăn chay trường và tụng kinh hồi hướng cho loài cua giải trừ oán thù.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660399?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-6
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=Le2-ta7r-ns
    - id: 5
      title: Trong xưởng có cái gì, nhà tôi có cái đó
      summary: 'Nhân vật & Hoàn cảnh: Một gia đình công nhân nhà máy có thói quen
        hễ xưởng sản xuất hay có vật tư gì là lén lút lấy trộm mang về nhà dùng, từ
        ốc vít, bóng đèn đến sắt thép, tự hào khoe khoang ''trong xưởng có gì nhà
        tôi có nấy''.

        Hành vi tạo nghiệp: Xem thường tài sản công cộng, coi trộm cắp là bổng lộc
        đương nhiên, tích tụ đồ phi nghĩa qua nhiều năm tháng làm tổn hại nghiêm trọng
        phước đức gia đình.

        Quả báo hiện tiền: Con cái trong nhà đau ốm quặt quẹo liên miên, tiền bạc
        làm ra bao nhiêu đều phải dồn hết vào thuốc men viện phí, tai họa liên tiếp
        xảy đến khiến gia cảnh kiệt quệ.

        Bài học & Chuyển hóa: Hòa thượng chỉ rõ của phi nghĩa vào cửa trước sẽ ra
        cửa sau kéo theo cả gia tài; gia đình hối hận sâu sắc, gom trả lại tài sản
        cho nhà máy và tích cực tu thiện phóng sinh tích đức.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660400?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-7
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=ciO-SiQl7wc
    - id: 6
      title: Dùi lỗ lấy nhọt
      summary: 'Nhân vật & Hoàn cảnh: Người đàn ông bị mọc một cái nhọt độc kỳ lạ
        ở vùng mông, sưng tấy đau đớn khôn xiết, mưng mủ thối rữa và phải đến bệnh
        viện dùng dùi sắt chọc sâu vào thấu xương để nặn mủ.

        Hành vi tạo nghiệp: Thuở thiếu niên chăn trâu nghịch ngợm, ông từng lấy que
        sắt nung đỏ chọc thẳng vào các tổ kiến, tổ dế và hang bọ cạp dưới đất rồi
        thổi lửa hun khói nướng chết hàng vạn sinh linh vô tội.

        Quả báo hiện tiền: Nỗi đau đớn khi bác sĩ dùng dao dùi khoét sâu vào vết nhọt
        thấu tận xương tủy chính là sự tái hiện quả báo tương ứng từ hành vi chọc
        que sắt đốt tổ côn trùng năm xưa.

        Bài học & Chuyển hóa: Thấu suốt luật nhân quả báo ứng công bằng đến từng chi
        tiết nhỏ, ông thành tâm quỳ trước Phật sám hối nghiệp sát thuở nhỏ, dốc lòng
        làm lành lánh dữ cứu vớt chúng sinh.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660401?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-8
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=-pzgJcA7jt4
    - id: 7
      title: Nhai xương mút tuỷ
      summary: 'Nhân vật & Hoàn cảnh: Một cán bộ trung niên bị bệnh đau nhức xương
        tủy cùng cực, các khớp xương như bị nghiền nát, thuốc giảm đau hoàn toàn vô
        hiệu, ngày đêm rên rỉ quằn quại.

        Hành vi tạo nghiệp: Có sở thích ẩm thực tàn ác, mỗi lần ăn nhậu đều đòi ăn
        các món hầm xương thú, đặc biệt có thói quen cầm ống hút mút sạch tủy xương
        và đập vỡ xương sống của các loài vật sống để thưởng thức.

        Quả báo hiện tiền: Thần thức các con vật bị đập xương hút tủy oán hận bám
        chặt vào xương tủy ông báo thù, khiến xương cốt ông nhức nhối như có hàng
        ngàn mũi kim châm vào tủy sống.

        Bài học & Chuyển hóa: Được Hòa thượng Diệu Pháp khai thị, ông kinh hãi trước
        món nợ máu thịt của khẩu nghiệp, phát tâm ăn chay trường, tụng kinh niệm Phật
        hồi hướng cho các chúng sinh bị mình hại.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660402?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-9
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=zYnX_fg49Hw
    - id: 8
      title: Cư sĩ cũng phải có đủ đức hạnh
      summary: 'Nhân vật & Hoàn cảnh: Một cư sĩ đã quy y Tam Bảo nhiều năm nhưng gia
        đạo bất an, công việc trắc trở, thân thể mắc nhiều bệnh tật mãn tính không
        khỏi.

        Hành vi tạo nghiệp: Tính tình kiêu căng ngạo mạn, ỷ vào việc mình đọc nhiều
        kinh sách và thân cận quý thầy mà coi thường bạn đồng tu; trong việc buôn
        bán làm ăn thì cân gian đo thiếu, lừa dối khách hàng kiếm lợi bất chính.

        Quả báo hiện tiền: Mang danh người tu Phật nhưng hành vi trái đạo khiến tổn
        hao phước báu, chiêu cảm sự khinh miệt của thế gian và sự quở trách của hộ
        pháp thiện thần.

        Bài học & Chuyển hóa: Hòa thượng nhắc nhở người tu Phật phải lấy giới luật
        làm thầy, tâm hạnh phải chân thật thanh tịnh; nếu mượn danh cư sĩ làm điều
        bất nghĩa thì tội nghiệp càng nặng hơn người thường.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660403?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-1#truyen-10
      read_label: 📖 Đọc sách
      video_url: https://www.youtube.com/watch?v=AeQHZQ6gRHY
    - id: 9
      title: Tổ kiến và nhà ở
      summary: 'Nhân vật & Hoàn cảnh: Hai vợ chồng dắt con trai định cư nước ngoài
        suốt ba năm nhưng không thể nào mua được một căn nhà an cư lạc nghiệp, mỗi
        lần định mua là gia đình lại cãi vã dữ dội hoặc gặp trục trặc hợp đồng bị
        hủy bỏ.

        Hành vi tạo nghiệp: Trước khi xuất ngoại, khi dọn dẹp vườn nhà cũ, hai vợ
        chồng đã dùng xăng và nước sôi đốt trụi, tiêu diệt cả một đàn kiến khổng lồ
        khiến muôn vàn sinh mạng mất tổ ấm và chết cháy thê thảm.

        Quả báo hiện tiền: Oan nghiệp phá nhà cướp mạng của loài kiến khiến gia đình
        họ đi đến đâu cũng không tìm được chốn dung thân an ổn, nhà cửa lận đận trắc
        trở.

        Bài học & Chuyển hóa: Nghe Hòa thượng chỉ điểm, hai vợ chồng ăn năn sám hối
        tội ác diệt kiến, phát tâm cúng dường Tam Bảo và phóng sinh tu phước; sau
        đó mới thuận lợi mua được căn nhà như ý.'
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/2560ff8a-dda1-4428-9afc-b1ebc431a6e5/file/660404?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
