    - id: 14
      title: Bịnh tùng khẩu nhập
      summary: 'Nhân vật & Hoàn cảnh: Lời khai thị vàng ngọc của Hòa thượng Diệu Pháp
        về quy luật bệnh tật của chúng sinh: ''Bệnh từ miệng vào, họa từ miệng ra'',
        làm sáng tỏ nguồn gốc của mọi chứng bệnh nan y trên cõi đời.

        Hành vi tạo nghiệp: Con người vì ham sướng ba tấc lưỡi trong chốc lát mà nhẫn
        tâm nuốt vào bụng biết bao sinh mạng cá, tôm, chim, thú đang quằn quại trong
        oán hận; độc tố sân hận ngấm sâu vào từng tế bào.

        Quả báo hiện tiền: Khối u ác tính, đột quỵ, tai biến, suy tạng và đủ thứ bệnh
        tật hiểm nghèo bộc phát, tiền mất tật mang chịu đau đớn cùng cực trên giường
        bệnh.

        Bài học & Chuyển hóa: Muốn thân thể an khang, gia đạo bình yên thì căn bản
        phải ăn chay niệm Phật, giữ tâm thanh tịnh, đoạn dứt nghiệp sát sinh và phát
        khởi lòng từ bi thương yêu muôn loài.'
