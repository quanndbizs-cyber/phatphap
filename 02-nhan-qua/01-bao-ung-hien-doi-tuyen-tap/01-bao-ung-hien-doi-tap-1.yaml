    - id: 10
      title: Thai phụ tụng Kinh Địa Tạng
      summary: 'Nhân vật & Hoàn cảnh: Nữ sinh viên tốt nghiệp tên Hải Ba mang thai
        được 7 tháng thì thai nhi trong bụng quậy phá dữ dội, đạp liên tục làm cô
        đau đớn không ngủ được, sức khỏe suy kiệt lo âu.

        Hành vi tạo nghiệp: Do oan gia trái chủ đời trước đầu thai vào làm con để
        đòi nợ oán thù, khiến mẹ con xung khắc ngay từ trong bụng mẹ.

        Quả báo hiện tiền: Cơn đau thắt bụng kéo dài, nguy cơ sảy thai cao, mẹ con
        xung đột nghiệp lực khiến cả gia đình sống trong lo âu hoảng sợ tột cùng.

        Bài học & Chuyển hóa: Được cư sĩ Quả Khanh khuyên bảo, người mẹ mỗi ngày chí
        thành tụng một bộ Kinh Địa Tạng hồi hướng cho thai nhi liên tục 7 ngày; thai
        nhi lập tức nằm yên an ổn, sinh nở mẹ tròn con vuông, đứa trẻ sinh ra đoan
        trang thông minh dễ nuôi.'
