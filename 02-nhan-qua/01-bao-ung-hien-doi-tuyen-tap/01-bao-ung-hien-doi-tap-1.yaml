    - id: 21
      title: Nhân nào quả nấy
      summary: 'Nhân vật & Hoàn cảnh: Bác Trương là người luyện khí công lâu năm và
        thường dùng khí công chữa bệnh cho người khác, nhưng bản thân lại mắc chứng
        đau đầu kinh niên dữ dội, đầu óc lúc nào cũng quay cuồng say xẩm như uống
        phải rượu độc.

        Hành vi tạo nghiệp: Thường xuyên sát sinh ăn nhậu các loại rượu ngâm rắn độc,
        bọ cạp, rết sống và ngâm nuốt sinh linh còn cử động để bồi bổ nội công và
        tăng cường sinh lực.

        Quả báo hiện tiền: Độc tố và oan hồn loài bò sát tụ lại trên đỉnh đầu ông
        hành hạ cắn xé, khiến các huyệt đạo bế tắc, đầu óc đau nhức như muốn nổ tung.

        Bài học & Chuyển hóa: Hòa thượng chỉ rõ muốn hết bệnh phải chấm dứt ngay việc
        uống rượu ngâm thú độc, chí thành sám hối nghiệp sát và phóng sinh loài bò
        sát để chuộc lại lỗi lầm.'
