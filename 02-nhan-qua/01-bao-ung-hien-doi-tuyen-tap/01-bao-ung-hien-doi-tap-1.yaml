    - id: 15
      title: Thai nhi nghe Kinh, giải oán hờn
      summary: 'Nhân vật & Hoàn cảnh: Đôi vợ chồng trẻ Mạnh Vĩ và Chung Hồng mang
        thai đứa con đầu lòng, nhưng người mẹ thường xuyên bị những cơn đau thắt bụng
        dữ dội và những giấc mộng đe dọa đòi mạng.

        Hành vi tạo nghiệp: Thai nhi vốn là oan gia kiếp trước tìm đến đầu thai để
