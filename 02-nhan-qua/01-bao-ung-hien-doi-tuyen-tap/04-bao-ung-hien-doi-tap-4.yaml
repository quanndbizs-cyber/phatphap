    - id: 12
      title: Chuyển đổi số mệnh
      summary: |-
        Nhân vật & Hoàn cảnh: Phùng Lập Khiêm tốt nghiệp đại học, thông minh tài hoa nhưng đam mê nghiên cứu Kinh Dịch, bói toán số mệnh để đoán vận tương lai.
        Hành vi tạo nghiệp: Tự mãn vào thuật bói toán xem số, ỷ lại thiên mệnh mà buông lung không lo tích đức hành thiện, tâm trí chấp trước vào những điềm báo bi quan bế tắc.
        Quả báo hiện tiền: Cuộc sống lận đận trắc trở triền miên, công danh bế tắc không như ý, rơi vào ngõ cụt bế tắc của định mệnh tưởng chừng không lối thoát.
        Bài học & Chuyển hóa: Ngộ ra chân lý "Mệnh do mình lập" từ Liễu Phàm Tứ Huấn, anh chuyển hướng tu tâm dưỡng tánh, phóng sinh tích đức bái sám; vận mệnh từ đó đổi thay kỳ diệu hanh thông tốt lành.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660501?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
