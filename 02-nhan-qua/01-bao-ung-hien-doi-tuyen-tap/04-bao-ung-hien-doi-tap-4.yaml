      read_label: 📖 Đọc sách
    - id: 37
      title: Mẹ chồng nàng dâu
      summary: |-
        Nhân vật & Hoàn cảnh: Trương Lan là dâu hiền dâu thảo hết lòng phụng dưỡng gia đình chồng, nhưng mẹ chồng luôn kiếm cớ vô lý mắng chửi xối xả đay nghiến thậm tệ.
        Hành vi tạo nghiệp: Đời Đường Trương Lan là Quý phi sủng ái, mẹ chồng kiếp đó là viên Võ tướng bị vu oan bãi chức thọ hình; do hiểu lầm Quý phi nói xấu ám hại mình nên ôm mối hận thù thấu xương.
        Quả báo hiện tiền: Kiếp này tái sinh làm mẹ chồng nàng dâu để đòi nợ oan gia, Trương Lan dù nín nhịn phục tùng cúc cung tận tụy vẫn bị mẹ chồng đay nghiến như kẻ thù không đội trời chung.
        Bài học & Chuyển hóa: Hiểu rõ nguồn cơn oán kết tiền kiếp, Trương Lan không oán trách mà phát nguyện ăn chay quỳ tụng 49 bộ Kinh Địa Tạng hồi hướng cho mẹ chồng; mẹ chồng hoát nhiên đổi tính yêu thương nàng dâu như con đẻ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660526?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-36
      read_label: 📖 Đọc sách
    - id: 38
      title: Gieo gì gặt nấy
      summary: |-
        Nhân vật & Hoàn cảnh: Dì Triệu nửa đêm hoảng loạn gọi điện thoại cầu cứu Quả Hồng vì con gái 33 tuổi bị ung thư phổi di căn toàn thân, bệnh viện trả về chờ chết trong ngột ngạt.
        Hành vi tạo nghiệp: Tiền kiếp trong Đệ nhị thế chiến, cô gái từng là sĩ quan phát xít Đức độc ác vận hành phòng hơi ngạt, bức tử hàng vạn thường dân Do Thái chết ngạt đau đớn khôn cùng.
        Quả báo hiện tiền: Bị quả báo hiện tiền ung thư phổi nghẹt thở khạc đờm ra máu, lồng ngực bỏng rát đau đớn y hệt cảm giác nghẹt thở chết vì khí độc của các nạn nhân xưa.
        Bài học & Chuyển hóa: Gieo nhân độc ác ắt gặt quả thảm khốc; Quả Hồng khuyên gia đình chí thành quỳ trước Tam Bảo sám hối tội diệt chủng tiền kiếp, ăn chay phóng sinh cầu xin chư oan linh tha thứ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660527?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-37
      read_label: 📖 Đọc sách
    - id: 39
      title: Con vật chết thảm
      summary: |-
        Nhân vật & Hoàn cảnh: Lộ cư sĩ và Tiểu Man vừa bước ra khỏi quán cơm chay thì bàng hoàng phát hiện thi thể một con bồ câu chết thảm thương tâm trong vũng nước bên đường.
        Hành vi tạo nghiệp: Người đời nhẫn tâm tàn sát loài vật câm nín, phanh thây xé thịt bồ câu chỉ còn trơ chút xương cánh để phục vụ cho các bữa ăn nhậu vô cảm.
        Quả báo hiện tiền: Gieo rắc cái chết đau đớn cho sinh linh ắt chiêu cảm thân mạng bị tai nạn đập nát tương tự, linh hồn đọa lạc tam đồ chịu quả báo phân thây xẻ thịt.
        Bài học & Chuyển hóa: Hai cư sĩ xót thương bọc xác bồ câu tụng chú Vãng Sinh an táng; câu chuyện cảnh tỉnh con người tôn trọng mạng sống muôn loài, tuyệt đối không được sát hại sinh linh kẻo chuốc ác báo tương tàn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660528?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
