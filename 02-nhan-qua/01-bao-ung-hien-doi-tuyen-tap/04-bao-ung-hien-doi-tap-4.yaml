    - id: 47
      title: Lý do tôi đến với đạo
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thuật của một thanh niên 32 tuổi ở thành phố Mai Châu, thời niên thiếu bất hảo theo băng nhóm quậy phá học đường, kết bè đánh lộn giang hồ.
        Hành vi tạo nghiệp: Bỏ học lưu đãng, sống phóng túng sa đọa vào cờ bạc, gái gú tà dâm, trộm cắp và bức hại người thế cô, khinh thường lời khuyên dạy của cha mẹ thầy cô.
        Quả báo hiện tiền: Cơ thể suy kiệt bệnh tật đầy mình, công việc bấp bênh nợ nần, đêm đêm ác mộng thấy quỷ sứ âm cung đến trói kéo xuống địa ngục tra tấn kinh hoàng.
        Bài học & Chuyển hóa: Giật mình thức tỉnh trước bờ vực địa ngục, anh may mắn gặp được Bồ Tát Địa Tạng điểm hóa trong mơ; quỳ trước Phật sám hối toàn bộ tội lỗi quá khứ, phát nguyện cải tà quy chánh trọn đời tu học.
