    - id: 45
      title: Dứt ác tu thiện
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thuật chân thành của Pháp sư Tịnh Không giảng kinh thuyết pháp hơn 40 năm, nhưng hiện tại vẫn bị nhiều kẻ xấu vô cớ phỉ báng công kích.
        Hành vi tạo nghiệp: Thuở trẻ trước khi biết Phật pháp ngài từng tạo khẩu nghiệp cực nặng, ngông nghênh tuyên bố "Phật giáo là mê tín" và hủy báng Tam Bảo suốt nhiều năm.
        Quả báo hiện tiền: Dù trở thành bậc danh tăng cao đức vẫn phải gánh chịu hoa báo bị người đời chê bai hủy báng để tiêu trừ món nợ khẩu nghiệp trong quá khứ.
        Bài học & Chuyển hóa: Hoan hỷ trả quả báo không một lời oán trách, dứt ác tu thiện tinh tấn hoằng dương chánh pháp; làm gương sáng cho đại chúng thấy sự chuyển hóa ngoạn mục từ kẻ ác thành bậc thiện tri thức.
