      read_label: 📖 Đọc sách
    - id: 42
      title: Phần 2 - Lời sám hối của cô người mẫu
      summary: |-
        Nhân vật & Hoàn cảnh: Lời tự thuật đẫm nước mắt của cô người mẫu trẻ hơn 20 tuổi sinh ra trong gia đình giàu có nhưng thiếu tình thương, sớm sa đọa vào nghề chụp ảnh khỏa thân khêu gợi.
        Hành vi tạo nghiệp: Bán rẻ thân xác chụp ảnh gợi dục cho các tạp chí, kích động tà dâm cho hàng vạn độc giả, sống buông thả trác táng và phá thai nhiều lần.
        Quả báo hiện tiền: Thân thể mắc bệnh phụ khoa nan y lở loét hôi thối hành hạ đau đớn, nhan sắc tàn tạ, tâm thần trầm cảm sợ hãi không dám ngẩng đầu nhìn ai, sống dở chết dở.
        Bài học & Chuyển hóa: Rúng động lương tâm trước luật nhân quả báo ứng, cô phát tâm giã từ nghề người mẫu, quỳ trước Tam Bảo sám hối tội truyền bá tà dâm và khuyên bảo thế nhân chớ đi vào vết xe đổ.
