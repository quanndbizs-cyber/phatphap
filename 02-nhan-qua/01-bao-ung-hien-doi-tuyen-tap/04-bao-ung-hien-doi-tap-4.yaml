    items:
    - id: 1
      title: Loi noi dau
      summary: |-
        Nhân vật & Hoàn cảnh: Quả Hồng (tác giả) từ thời thơ ấu luôn trăn trở suy nghĩ trước gương về bản ngã và ý nghĩa cuộc đời vô thường, sau này hữu duyên gặp Phật pháp và theo học Hòa thượng Diệu Pháp cùng cư sĩ Quả Khanh.
        Hành vi tạo nghiệp: Thấu suốt nỗi khổ trầm luân trong sinh tử luân hồi do chúng sinh vô minh tạo nghiệp thập ác, sát sinh, tà dâm, đắm chìm trong danh lợi thế gian.
        Quả báo hiện tiền: Đời sống phàm phu luôn phải gánh chịu thân tâm bất an, bệnh tật nan y và nghiệp chướng bủa vây không lối thoát nếu không biết đường tu sửa.
        Bài học & Chuyển hóa: Tác giả phát nguyện ghi chép lại những câu chuyện nhân quả chân thực mắt thấy tai nghe nhằm thức tỉnh người đời, khuyên răn mọi người thâm tín nhân quả, ăn chay niệm Phật và tinh tấn sám hối để chuyển hóa số mệnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660490?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-1
      read_label: 📖 Đọc sách
    - id: 2
      title: Bàn về quỷ thần
      summary: |-
        Nhân vật & Hoàn cảnh: Phàm phu thế gian chưa có huệ nhãn thường bài xích cõi vô hình, không tin quy luật nhân quả, lục đạo luân hồi và sự tồn tại của quỷ thần hộ pháp.
        Hành vi tạo nghiệp: Tà kiến vô thần, ngông cuồng báng bổ quỷ thần, coi thường nhân quả, thỏa sức tạo nghiệp sát sinh và các điều bất thiện mà không hề kinh sợ.
        Quả báo hiện tiền: Bị các loài quỷ mị quấy phá, bệnh tật vô cớ phát sinh y học bó tay, tinh thần hoang mang sợ hãi, khi lâm chung đọa thẳng vào ba đường ác chịu khổ muôn kiếp.
        Bài học & Chuyển hóa: Dẫn lời Phật dạy trong kinh Trường A-hàm soi sáng thế giới vô hình; khuyên người tu phải giữ tâm cung kính, trì giới thanh tịnh, nuôi dưỡng lòng từ bi để được chư thiên thiện thần hộ trì gia hộ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660491?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-3
      read_label: 📖 Đọc sách
    - id: 3
      title: Quan Âm cứu nạn
      summary: |-
        Nhân vật & Hoàn cảnh: Quả Hồng trên chuyến xe buýt đêm vắng vẻ năm 1997 sau giờ tan sở, bất ngờ đối mặt với 4 thanh niên say rượu hung hãn mang theo chai rượu bước lên xe gây gổ đe dọa.
        Hành vi tạo nghiệp: Những thanh niên buông tuồng ngỗ nghịch say sưa chè chén, buông lời thô lỗ, toan uy hiếp và giở trò bạo lực với hành khách cô độc trên xe.
        Quả báo hiện tiền: Bị ác nghiệp chiêu cảm khiến tâm trí cuồng loạn sa đọa, dễ vướng vào vòng lao lý tù tội và tai nạn thảm khốc nếu tiếp tục gây nghiệp hung tàn.
        Bài học & Chuyển hóa: Quả Hồng nhiếp tâm chí thành niệm danh hiệu "Nam Mô Quán Thế Âm Bồ Tát", cảm ứng linh diệu khiến nhóm côn đồ dịu xuống và xe ghé trạm an toàn; chứng minh sức mạnh bất khả tư nghì của câu niệm Bồ Tát khi gặp nạn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660492?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-4
      read_label: 📖 Đọc sách
    - id: 4
      title: Chơi cổ phiếu chướng ngại tu hành
      summary: |-
        Nhân vật & Hoàn cảnh: Trương cư sĩ là một người học Phật tại gia thuần thành suốt mười mấy năm, từng tinh tấn phóng sinh, in kinh và trì giới nghiêm cẩn.
        Hành vi tạo nghiệp: Khởi tâm tham lam trước thị trường chứng khoán, đổ vốn chơi cổ phiếu, suốt ngày đêm tâm trí dính chặt vào bảng điện tử, dao động theo giá cả xanh đỏ.
        Quả báo hiện tiền: Tâm tán loạn mất sạch định lực tu tập, bỏ bê kinh kệ bái sám, thua lỗ trắng tay nợ nần chồng chất, tinh thần hoảng loạn và sức khỏe suy sụp nghiêm trọng.
        Bài học & Chuyển hóa: Lòng tham tiền tài là cạm bẫy phá hoại bồ-đề tâm; người tu muốn an lạc giải thoát phải biết thiểu dục tri túc, dứt trừ tâm tham lam đỏ đen để giữ trọn giới hạnh thanh tịnh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660493?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-5
      read_label: 📖 Đọc sách
    - id: 5
      title: Sức mạnh của sám hối
      summary: |-
        Nhân vật & Hoàn cảnh: Luận giải sâu sắc về giáo pháp sám hối trong đạo Phật, dành cho những người mang thân tâm nặng trĩu nghiệp chướng tội lỗi từ vô lượng kiếp.
        Hành vi tạo nghiệp: Do vô minh sai khiến từ nhiều đời nhiều kiếp đã lỡ tạo ác nghiệp sát sinh, trộm cắp, tà dâm, dối trá, làm ô nhiễm tự tánh thanh tịnh.
        Quả báo hiện tiền: Bị bệnh nan y hành hạ, vận mệnh trắc trở, nội tâm luôn dằn vặt lo sợ và chịu chướng ngại trùng trùng trên đường đời lẫn đường đạo.
        Bài học & Chuyển hóa: Sám hối chân thành như dòng nước cam lồ gột rửa cấu uế; chí tâm quỳ trước Tam Bảo phát lồ lỗi lầm, đọc tụng Lương Hoàng Sám, Kinh Địa Tạng và phát nguyện dứt ác làm lành sẽ tiêu trừ vạn kiếp nghiệp chướng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660494?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-6
      read_label: 📖 Đọc sách
    - id: 6
      title: Liễu nghiệp
      summary: |-
        Nhân vật & Hoàn cảnh: Tiền Khôn là một cư sĩ học Phật lái xe ô tô vào ban đêm trên đoạn đường vắng có đèn chiếu sáng rõ ràng.
        Hành vi tạo nghiệp: Nghiệp chướng nhiều đời vay nợ sinh mạng hoặc gây tổn hại cho người khác đến kỳ trổ quả, che mờ nhận thức và thị giác nơi cõi trần.
        Quả báo hiện tiền: Kính chắn gió bỗng mờ mịt không thấy đường, xe đâm sầm vào dải phân cách gây hư hỏng nặng, đối mặt nguy cơ mất mạng trong tích tắc.
        Bài học & Chuyển hóa: Nhờ có tu học và thâm tín nhân quả, Tiền Khôn bình tĩnh hiểu đây là quả báo "tội nặng báo nhẹ" để trả hết nợ xưa, hoan hỷ đền bù thiệt hại và phát tâm sám hối, chuyển nghiệp bình an.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660495?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-7
      read_label: 📖 Đọc sách
    - id: 7
      title: Thai giáo tuyệt vời
      summary: |-
        Nhân vật & Hoàn cảnh: Đôi vợ chồng trẻ Tiết Đình chuẩn bị đón đứa con đầu lòng, được hướng dẫn phương pháp thai giáo theo giáo lý nhà Phật.
        Hành vi tạo nghiệp: Người đời khi mang thai thường sát sinh bồi bổ vô tội vạ, ăn uống ô uế, tâm tính sân hận cáu gắt khiến thai nhi nhiễm độc khí và oán hận.
        Quả báo hiện tiền: Trẻ sinh ra hay ốm đau quặt quẹo, đêm khóc ngặt, tính tình hung bạo ngỗ nghịch, gia đình bất an do chiêu cảm oan gia trái chủ đầu thai.
        Bài học & Chuyển hóa: Suốt thai kỳ cha mẹ phát tâm ăn chay thanh tịnh, ngày ngày mở kinh và chí tâm niệm danh hiệu Địa Tạng, Quan Âm; nhờ đó sinh con đoan chính, thông minh tuấn tú, dễ nuôi và giàu lòng nhân ái.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660496?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-8
      read_label: 📖 Đọc sách
    - id: 8
      title: Phá thai là tội nặng
      summary: |-
        Nhân vật & Hoàn cảnh: Cô Kim dung mạo thanh tú nhưng nét mặt u tối, thân hình tiều tụy khổ đau tìm đến phòng khám cầu cứu sự trợ giúp.
        Hành vi tạo nghiệp: Trẻ người non dạ nạo phá thai nhiều lần, tước đoạt quyền sống thiêng liêng của chính cốt nhục giọt máu do mình hoài thai.
        Quả báo hiện tiền: Vong thai oán hận bám riết không rời, thân thể cô mắc bệnh phụ khoa hành hạ đau đớn, tinh thần trầm cảm bấn loạn, hạnh phúc hôn nhân đứng bên bờ vực tan vỡ.
        Bài học & Chuyển hóa: Thức tỉnh trước tội ác sát sinh cốt nhục; cô Kim phát tâm sám hối tội lỗi, phóng sinh chuộc mạng và chí thành tụng Kinh Địa Tạng hồi hướng cho thai nhi được siêu thoát.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660497?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-9
      read_label: 📖 Đọc sách
    - id: 9
      title: Mã Thanh
      summary: |-
        Nhân vật & Hoàn cảnh: Mã Thanh là một nam doanh nhân trẻ tài ba thành đạt, thuở nhỏ từng ưa chuộng ngồi thiền tĩnh tọa và sống hiền lành.
        Hành vi tạo nghiệp: Khi thành đạt lao vào thương trường giao tế chè chén, buông lung phạm đủ giới sát, đạo, dâm, vọng, phản bội tình cảm vợ con.
        Quả báo hiện tiền: Khí sắc u ám tối tăm, tim đau thắt như dao cắt y học không tìm ra bệnh, vợ chồng ngày đêm cãi vã đánh nhau dữ dội, hôn nhân trên bờ vực đổ vỡ tan tành.
        Bài học & Chuyển hóa: Được Quả Hồng vạch rõ nhân quả nghiệp chướng, Mã Thanh rúng động lương tâm, quỳ trước Phật sám hối tà dâm sát sinh, ăn chay trường cứu vãn tổ ấm gia đình hòa thuận.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660498?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-4#truyen-10
      read_label: 📖 Đọc sách
    - id: 10
      title: Phật pháp thay đổi tôi
      summary: |-
        Nhân vật & Hoàn cảnh: Cư sĩ Lý Mẫn Huệ (30 tuổi), sinh ra trong gia đình nghèo 10 người con, mồ côi cha sớm, chịu cảnh làm thuê vú em từ nhỏ để mưu sinh.
        Hành vi tạo nghiệp: Do bươn chải kinh doanh và chưa biết Phật pháp, cô từng ôm lòng tranh đấu cay cú, sân hận người đời và gieo nhiều ác khẩu oán thù.
        Quả báo hiện tiền: Cuộc sống đầy ắp tai ương dồn dập, hôn nhân gặp nghịch cảnh oan trái ngang trái, bệnh tật hiểm nghèo bủa vây cùng cực tuyệt vọng muốn tự kết liễu.
        Bài học & Chuyển hóa: Hữu duyên gặp Phật pháp, bà thâm tín nhân quả, ngày đêm quỳ tụng kinh niệm Phật sám hối lỗi xưa; nhờ Phật lực gia trì số mệnh chuyển nguy thành an, tâm hồn tràn ngập hỷ lạc.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/d3543013-412d-425d-8ecf-dfe2649fe285/file/660499?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
