      read_label: 📖 Đọc sách
    - id: 2
      title: Ba mỹ nhân
      summary: Ba người đẹp ỷ vào sắc nước hương trời làm bao người điêu đứng, mê
        đắm danh lợi sắc dục; cuối đời gánh chịu quả báo tàn phai, cô độc, bệnh tật
        cùng quẫn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660416?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-1
      read_label: 📖 Đọc sách
    - id: 3
      title: Nước lèo trứ danh
      summary: Chủ quán nước lèo nổi tiếng chuyên hầm xác xương động vật, lươn ốc
        sống; sau mắc chứng bệnh lở loét hôi thối khắp mình mẩy, nếm trải quả báo
        thống khổ từ nghề sát.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660417?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-2
      read_label: 📖 Đọc sách
    - id: 4
      title: Nguyên nhân đáng sợ
      summary: Bác sĩ trẻ Trương Vĩ Lục tự sát vì biến đổi thể chất bất lực; điều
        tra hé lộ ông nội và cha từng làm nghề thiến heo, thiến gà suốt đời, chiêu
        cảm nghiệp tuyệt tự đời cháu.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660418?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-3
      read_label: 📖 Đọc sách
    - id: 5
      title: Đám tang chó
      summary: Người chủ làm tang lễ tươm tất cho chú chó trung nghĩa; câu chuyện
        thức tỉnh tình thương loài vật và cảnh báo nghiệp phụ ân phản bạn của con
        người.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660419?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-4
      read_label: 📖 Đọc sách
    - id: 6
      title: Người ưa câu cá
      summary: Người say mê thú câu cá, xem việc cá bị móc họng giãy giụa làm niềm
        vui; về sau chịu quả báo ung thư vòm họng và mắc lưỡi câu rách miệng đau đớn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660420?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-5
      read_label: 📖 Đọc sách
    - id: 7
      title: Thức ngon đặc chế
      summary: Chế biến các món ăn tàn bạo từ động vật sống để làm thức ngon đặc chế;
        người chủ phải trả giá bằng căn bệnh viêm loét nội tạng không thuốc nào chữa
        khỏi.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660421?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-6
      read_label: 📖 Đọc sách
    - id: 8
      title: Người chân voi
      summary: Thái tiên sinh bắt ngỗng sống đứng nhảy múa trên bàn sắt nung đỏ để
        ăn chân ngỗng nướng; chiêu cảm quả báo hai chân sưng phồng đau buốt như chân
        voi suốt 6 năm ròng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660422?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-7
      read_label: 📖 Đọc sách
    - id: 9
      title: Bắt rắn mối
      summary: Quả báo khủng khiếp của người chuyên săn bắt, mua bán và giết hại rắn
        mối còn sống, toàn thân phát bệnh vảy ngứa, lở loét và chịu nỗi đau da thịt
        khôn xiết.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660423?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-9
      read_label: 📖 Đọc sách
    - id: 10
      title: Cá câu người
      summary: Kẻ thích buông câu giết cá rốt cuộc bị rơi xuống nước chết chìm; cảnh
        tỉnh thú vui sát sinh tàn nhẫn lấy sinh mạng chúng sinh làm trò tiêu khiển.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660424?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-10
      read_label: 📖 Đọc sách
    - id: 11
      title: Bệnh của Văn Lai
      summary: Câu chuyện nhân quả sâu sắc về đề tài Bệnh của Văn Lai; làm sáng tỏ
        quy luật nghiệp báo 'nhân duyên hội đủ ắt trổ quả', khuyến hóa người đời ăn
        chay sám hối, lánh ác làm lành và niệm Phật tiêu nghiệp.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660425?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-11
      read_label: 📖 Đọc sách
    - id: 12
      title: Tiểu thư khỉ
      summary: Cô gái sinh ra có hình dạng và hành vi kỳ lạ giống loài khỉ do kiếp
        trước khinh mạn, chế giễu hình tướng người khác và nghiệp sát loài linh trưởng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660426?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-12
      read_label: 📖 Đọc sách
    - id: 13
      title: Trộm công giảm liệu
      summary: Nhà thầu bớt xén vật tư công trình mưu lợi bất chính, chiêu cảm quả
        báo công trình sụp đổ, bản thân phá sản lâm vào cảnh tù tội khốn cùng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660427?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-11
      read_label: 📖 Đọc sách
    - id: 14
      title: Người chồng tài hoa
      summary: Người chồng tài hoa trác việt nhưng phóng túng tà dâm, bội bạc vợ hiền;
        chuốc lấy quả báo tiêu tan danh vọng, thân bại danh liệt trong cay đắng.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660428?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-12
      read_label: 📖 Đọc sách
    - id: 15
      title: Pháp quan kỳ án
      summary: Vị thẩm phán xử oan sai hại người lương thiện; âm luật phân minh, nghiệp
        báo gõ cửa khiến bản thân mắc bạo bệnh và chịu cảnh ác báo rùng rợn.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660429?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-13
      read_label: 📖 Đọc sách
    - id: 16
      title: Những kẻ buôn người
      summary: Tội ác bắt cóc, buôn bán phụ nữ và trẻ em gây cảnh tan nát gia đình;
        kẻ chủ mưu gánh chịu quả báo con cái tàn tật, thân thể thối rữa chết thảm.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660430?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-14
      read_label: 📖 Đọc sách
    - id: 17
      title: Quán ngon cao cấp
      summary: Nhà hàng chuyên phục vụ thịt thú rừng tươi sống chiêu cảm tai họa hỏa
        hoạn, chủ quán mắc bệnh nan y hiểm nghèo do oán khí sinh linh tích tụ.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660431?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-15
      read_label: 📖 Đọc sách
    - id: 18
      title: Đi câu bị cảm động
      summary: Người đi câu chứng kiến tình mẫu tử thiêng liêng của loài cá sẵn sàng
        chết vì con, thức tỉnh lương tri bẻ gãy cần câu, trọn đời phát tâm ăn chay
        phóng sinh.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660432?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-16
      read_label: 📖 Đọc sách
    - id: 19
      title: Chuyện nơi lâm trường
      summary: Những người phá rừng sát hại muôn thú nơi rừng sâu chịu quả báo tai
        nạn cây đè, rắn cắn và đời sống lụi tàn; dạy bài học tôn trọng sinh thái và
        tự nhiên.
      audio_src: https://qts-home.duckdns.org/audiobookshelf/api/items/49d883ec-3e0f-44c8-b1af-56a626f40eab/file/660433?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI1MDJiZTBkZS0yMzIzLTQzODgtYjgzMi04ODNhZjVmZDRlMzIiLCJ1c2VybmFtZSI6ImFkaWRhcGhhdCIsImlhdCI6MTc4OTgwNTYwNH0.5Snxo8jtfIl5i1XOFnfVALetYFk3RMXHfKlqACaLai8
      read_url: /nhan-qua/doc-sach/bao-ung-hien-doi-tap-2#truyen-17
      read_label: 📖 Đọc sách
    - id: 20
      title: Khi máy mổ hoàn tất
      summary: Sáng chế máy mổ thịt động vật hàng loạt tự động, tưởng lập công nhưng
        thực chất tạo nghiệp sát vô biên, người chế tạo rốt cuộc chết thảm trong chính
        cỗ máy.
