      title: Anh Bạn Sinh Viên
      summary: TÚ là bạn học chung trường với tôi. Anh cao vừa tầm, dung mạo bình
        thường, gia cảnh nghèo, tính nhút nhát hay mắc cỡ, anh giống tôi ở chỗ ưa
        lướt net vui chơi, học tập nhàn nhã. Chúng tôi đồng học Văn khoa, cùng chưa
        xong năm tư.
