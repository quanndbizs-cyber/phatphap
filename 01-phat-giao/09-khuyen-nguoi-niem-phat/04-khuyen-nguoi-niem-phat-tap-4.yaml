      title: Mấy Dòng Tỏ Bày – Nhất Môn Thâm Nhập Trường Kỳ Huân Tu
      duration: 2664
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/68%20T4%20M%E1%BA%A5y%20D%C3%B2ng%20T%E1%BB%8F%20B%C3%A0y%20%E2%80%93%20Nh%E1%BA%A5t%20M%C3%B4n%20Th%C3%A2m%20Nh%E1%BA%ADp%20Tr%C6%B0%E1%BB%9Dng%20K%E1%BB%B3%20Hu%C3%A2n%20Tu.mp3
      video_url: https://www.youtube.com/watch?v=q7EafDm7hsw
      read_url: https://cusidieuam.com/2022/04/21/66-nhat-mon-tham-nhap-truong-ky-huan-tu/
      read_label: 📖 Xem bài gốc
      summary: 'Pháp môn niệm Phật là pháp rất khó tin, như trong kinh Phật nói là
        nan tín chi pháp!

        Chính vì thế, nói ra mà người ta không tin tưởng là chuyện thường tình, không
        có gì xa lạ.

        Nhưng một người nào đó vừa mới nghe nhắc đến câu A-di-đà Phật mà phát tâm
        tu hành, ngày đêm cố gắng chấp trì danh hiệu để niệm, một lòng cầu nguyện
        vãng sanh thì thật sự là đặc biệt, nhất định không thể là người tầm thường.

        Những người này trong quá khứ chắc chắn đã cúng dường vô số đức Phật mà chúng
        ta không biết.

        Chính nhờ thiện căn vô cùng lớn đó mới tạo tín tâm vào pháp môn một đời thành
        Phật này.

        Nói như vậy, để cho cô Lệ Tân cùng quý cô bác đang lập nhóm liên hữu ở thôn
        Cây Quân thấy rõ được rằng, nếu chân thành niệm Phật, chí kính lễ Phật, với
        đầy đủ niềm tin, tha thiết nguyện cầu vãng sanh, thì có thể biết được thiện
        căn của mình lớn lắm và xác định vị trí của từng người ở Liên Trì Hải Hội.

        Niệm Phật vãng sanh về Cực-lạc, dự phần ở ao sen thất bảo là điều chắc chắn,
        không thể sai lệch.

        Người nào quyết lòng theo đúng lời Phật dạy để tu hành, thì sự thành đạo ở
        ngay trong đời này.

        Diệu Âm xin thành tâm chúc mừng tất cả quý đạo hữu.

        Mấy vấn đề của cô Lệ Tân đưa ra khá thực tế, rất hữu ích.

        Diệu Âm sẽ cố gắng nêu ra đây một vài ý kiến cá nhân đã học hỏi được, rồi
        xin tùy duyên nhận xét, chứ không dám nhận lãnh tiếng chỉ bảo như cô Lệ Tân
        nói đâu.

        Vấn đề đầu tiên của cô Lệ Tân đưa ra có liên quan đến sự tụng kinh cầu an,
        cầu siêu, cầu tiêu tai giải nạn, tụng kinh báo hiếu mùa vu lan.'
    - id: 2
      tap: 4
      global_idx: 69
      title: Ý Thức Về Sự Chướng Ngại
      duration: 2507
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/69%20T4%20%C3%9D%20Th%E1%BB%A9c%20V%E1%BB%81%20S%E1%BB%B1%20Ch%C6%B0%E1%BB%9Bng%20Ng%E1%BA%A1i.mp3
      video_url: https://www.youtube.com/watch?v=LOErOk4ZzH4
      read_url: https://cusidieuam.com/2022/04/21/67-y-thuc-ve-su-chuong-ngai/
      read_label: 📖 Xem bài gốc
      summary: 'Kinh gởi cô Lệ Tân cùng cô bác cộng tu!

        Thời này tu hành có nhiều chướng ngại lắm.

        Chướng ngại có ba loại, một là phiền não chướng, hai là nghiệp chướng, ba
        là báo chướng.

        Phiền não chướng là tham-sân-si; Cô bác muốn tu hành cho thành tựu thì nên
        tìm cách giảm bớt ba chất độc này, mỗi ngày mỗi giảm cho đến hết luôn mới
        dễ trốn thoát ba cảnh đọa lạc.

        Tham lam là đường ngã quỷ, sân khuể là đường địa ngục, ngu si là đường súc
        sanh.

        Nghiệp chướng là ngũ nghịch thập ác, sát đạo dâm vọng.

        Muốn tu thì cố gắng giữ năm giới, nhất là giới sát sanh.

        Hãy giữ lòng từ bi thương mạng chúng nó, có thế thì ta dễ được thoát nạn.

        Báo chướng là hậu quả bị đọa lạc trong ba đường khổ: địa ngục, ngạ quỷ, súc
        sanh.

        Phiền não nghiệp chướng là nhân, báo chướng là quả.

        Nhân nào quả đó, nhân duyên quả báo không sai một ly một tấc.

        Khi thấy được đường tu hành mới biết rằng trong quá khứ chính mình đã sơ ý
        tạo ra quá nhiều nghiệp ác như giết hại chúng sanh, tham lạm công quỹ, chống
        báng Phật pháp, sân giận, đố kỵ, vọng ngôn, xảo ngữ, trộm cướp, lường gạt,
        ganh tỵ, thị phi, v.v nay gặp được Phật pháp mới hay quả báo này toàn là địa
        ngục, không địa ngục thì ngạ quỷ, không ngạ quỷ cũng là đường súc vật thì
        sợ đến đêm ngày ăn ngủ không yên!'
    - id: 3
      tap: 4
      global_idx: 70
      title: Khóc Lóc Mối Nguy Hại Cho Người Lúc Lâm Chung
      duration: 2563
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/70%20T4%20Kh%C3%B3c%20L%C3%B3c%20M%E1%BB%91i%20Nguy%20H%E1%BA%A1i%20Cho%20Ng%C6%B0%E1%BB%9Di%20L%C3%BAc%20L%C3%A2m%20Chung.mp3
      video_url: https://www.youtube.com/watch?v=cLMa-miU1Ao
      read_url: https://cusidieuam.com/2022/04/21/68-khoc-loc-moi-nguy-hai-cho-nguoi-luc-lam-chung/
      read_label: 📖 Xem bài gốc
      summary: 'Cô Lệ Tân cùng quý đạo hữu!

        Đời người thật ngắn ngủi, sống chết là chuyện thường tình.

        Có người coi cái chết nhẹ tợ lông hồng, nhưng có người coi cái chết nặng hơn
        dãy núi Trường sơn.

        Người hiểu Phật đạo không sợ chết, họ an nhiên tự tại vãng sanh.

        Người không hiểu Phật pháp họ sợ cảnh ra đi làm cho tâm hồn thường trực đối
        diện với nỗi hãi hùng khủng bố!

        Chung quanh chuyện người lâm chung, trước đây có một vài đạo hữu có nêu lên
        vấn đề chướng ngại do con cháu khóc lóc, người thân yêu trong gia đình không
        hiểu đạo gây ra sự ồn náo.

        Thư của cô Lệ Tân cũng có nêu lên những khó khăn tương tự.

        Hai thư trước giải quyết một ít chuyện.

        Hôm nay Diệu Âm xin cố gắng bàn đến những chuyện khá phổ biến này.

        Những chướng ngại này, nếu nhẹ thì làm mất phần siêu thoát, nếu nặng có thể
        đày đọa người thân vào ba đường ác để chịu vạn kiếp khổ đau.

        Những chướng ngại ở đây suy cho cùng thì thật quá oan uổng, vì nó chính lại
        là hậu quả của tình cảm, thương yêu mà vụng dại!

        Bình thường, con người hẹp hòi, ganh ghét, đố kỵ mới hại nhau, đây là chuyện
        thường tình của thế nhân.'
    - id: 4
      tap: 4
      global_idx: 71
      title: Hộ Niệm Khó Hay Dễ – Vấn Đề Đạo Lý Và Tâm Lý
      duration: 2474
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/71%20T4%20H%E1%BB%99%20Ni%E1%BB%87m%20Kh%C3%B3%20Hay%20D%E1%BB%85%20%E2%80%93%20V%E1%BA%A5n%20%C4%90%E1%BB%81%20%C4%90%E1%BA%A1o%20L%C3%BD%20V%C3%A0%20T%C3%A2m%20L%C3%BD.mp3
      video_url: https://www.youtube.com/watch?v=r1zFWtArzSY
      read_url: https://cusidieuam.com/2022/04/21/69-ho-niem-kho-hay-de-van-de-dao-ly-va-tam-ly/
      read_label: 📖 Xem bài gốc
      summary: 'Kinh gửi cô Lệ Tân và quý đồng tu,

        Chúng ta tiếp tục bàn chuyện còn đang dở dang:

        việc hộ niệm khó quá, nó mới mẻ quá, có người chấp nhận, có người lại cho
        rằng bố mẹ ra đi con cái phải khóc, không khóc thì thiên hạ bảo là bất hiếu

        Vấn đề con cháu khóc lóc khi người thân ra đi là một đại nạn cho người chết,
        chúng ta đã bàn qua trong thư trước.

        Xin cô bác đồng tu nhớ kỹ, đừng vì một chút tình cảm thế tục mà vô tình hãm
        hại người thân của mình trong tam đồ ác đạo vạn kiếp.

        Hôm nay xin nói về việc hộ niệm khó quá, mới mẻ quá !

        Người ta nghĩ hộ niệm khó quá cũng có thể đúng đấy!

        Tuy nhiên không phải quá khó như nhiều người tưởng, vì chính tôi cũng từng
        hộ niệm cho người vãng sanh.

        Còn sự hộ niệm có vẻ mới mẻ, thì chỉ mới mẻ đối với người Việt Nam chứ không
        xa lạ lắm đối với người học Phật Trung Quốc và các nơi khác.

        Hơn nữa, người niệm Phật cầu sanh Cực-lạc thì sự hộ niệm lại rất quen thuộc,
        đây là điều cần thiết để bảo đảm sự vãng sanh được chắc chắn.

        Riêng ở một số nơi, sự thực hành Phật giáo bị thiên lệch, thiếu người hoằng
        dương chánh pháp, nhiều người đi chùa lễ Phật tụng kinh lâu năm, nhưng tình
        thực mà nói, hầu hết chưa hiểu rõ Phật pháp là gì.

        Thành ra cứ thấy có tới chùa tới miễu quỳ lạy các pho tượng cầu tài, cầu lộc,
        cầu mua may bán đắc, v.v..'
    - id: 5
      tap: 4
      global_idx: 72
      title: Hộ Niệm Khó Hay Dễ – Niềm Tin Con Người Và Hoàn Cảnh
      duration: 2664
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/72%20T4%20H%E1%BB%99%20Ni%E1%BB%87m%20Kh%C3%B3%20Hay%20D%E1%BB%85%20%E2%80%93%20Ni%E1%BB%81m%20Tin%20Con%20Ng%C6%B0%E1%BB%9Di%20V%C3%A0%20Ho%C3%A0n%20C%E1%BA%A3nh.mp3
      video_url: https://www.youtube.com/watch?v=QSUaT3S9x_Y
      read_url: https://cusidieuam.com/2022/04/21/70-ho-niem-kho-hay-de-niem-tin-con-nguoi-va-hoan-canh/
      read_label: 📖 Xem bài gốc
      summary: 'Kính gởi các cô bác đồng tu,

        Xin tiếp tục vấn đề hộ niệm khó hay dễ.

        Có người cho rằng hộ niệm khó quá, mới mẻ quá, nhưng ở mấy dòng cuối của thư
        trước tôi có kể qua cho cô bác nghe là chúng tôi vừa mới hộ niệm cho một người
        khác nữa vãng sanh.

        Đó là chị Vũ Thị Hậu, 51 tuổi, bỏ báo thân vào khoảng 2 giờ sáng ngày 21/10/05
        và hỏa thiêu vào lúc 11 giờ ngày 25/10/05.

        Suốt 4 ngày tại nhà quàng đều có làm lễ cầu siêu bình thường như mọi đám tang
        khác, hằng ngày cũng có nhiều người viếng điếu, nhưng có lẽ ít ai thấy được
        sự quí hóa vô giá của đám tang này

        Chị Vũ Thị Hậu đã vãng sanh chứ không phải chết.

        Trước ngày ra đi gần ba tuần lễ, chị được thầy Thích Thiện Huệ và các đồng
        tu niệm Phật hộ niệm mỗi đêm, và được hộ niệm tám tiếng đồng hồ sau khi bỏ
        xác thân.

        Chị niệm Phật và ra đi trong tiếng niệm Phật của chồng chị, của mẹ chị, của
        nhiều đồng tu hộ niệm.

        Ra đi xong, thân xác chị mềm mại, càng lúc càng mềm, càng lúc càng tươi, tiếp
        tục suốt bốn ngày sau khi tắt thở vẫn mềm mại, vẫn tươi nhuận, diện mạo vẫn
        hồng hào, tay chân không xanh không tái cho đến khi hỏa thiêu.

        Mỗi ngày tại nhà quàng từ 9 giờ sáng đến 11 giờ đều có thầy Thích Thiện Hữu,
        trụ trì chùa Phật Đà cùng một số Phật tử đến đọc kinh cầu siêu.

        Trong suốt mấy ngày liền tôi vẫn thấy thân xác chị tươi nhuận mềm mại như
        người đang ngủ.

        Đến ngày thứ ba, thì nhóm hộ niệm có nhiều người rảnh và cùng nhau tới dự
        lễ.'
    - id: 6
      tap: 4
      global_idx: 73
      title: Cần Biết Rõ Đường Vãng Sanh
      duration: 2524
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/73%20T4%20C%E1%BA%A7n%20Bi%E1%BA%BFt%20R%C3%B5%20%C4%90%C6%B0%E1%BB%9Dng%20V%C3%A3ng%20Sanh.mp3
      video_url: https://www.youtube.com/watch?v=3SZefnpAT_U
      read_url: https://cusidieuam.com/2022/04/21/71-can-biet-ro-duong-vang-sanh/
      read_label: 📖 Xem bài gốc
      summary: 'Kính gởi đạo huynh Thiện Khánh,

        Diệu Âm có chút duyên sự phải đi Pháp, Âu châu hơn một tháng, vừa về thì nhận
        được thư của anh và một số thư khác.

        Việc may mắn đầu tiên là khi vừa về tới Úc thì tôi đã sớm có dịp được bái
        kiến HT Tịnh-Không và trình bày lên Ngài cái nguyện vọng của anh.

        Nhưng trong thời gian này Ngài rất bận, vừa mới xong mấy đại lễ thì Ngài phải
        bôn ba xuất ngoại để hoằng pháp.

        Thôi thì cũng tùy duyên, có duyên thì “Hữu cầu tất ứng” chứ không nên vội.

        Nếu anh có được thủ pháp của Ngài thì thật là quý hóa lắm vậy.

        Kính anh Thiện Khánh, có lẽ chúng ta có duyên với nhau nên đời này ở xa mà
        thành gần.

        Tôi rất sung sướng được làm quen với một người biết làm thơ, biết tu hành
        và tâm hồn nhiệt thành như anh.

        Đọc thư anh tôi rất lấy làm cảm kích, nhưng thật sự không dám nhận những lời
        tán thán và cảm ơn của anh.

        Khi gặp được pháp môn niệm Phật thì tôi tin tưởng, rồi lấy lòng tín ngưỡng
        đó mà thành tâm khuyên người niệm Phật.

        Lòng chân thành khuyên giải, mong cho những ai nghe được phát khởi lòng tin,
        muốn được vãng sanh, chí tâm niệm Phật.

        Cầu xin tất cả đắc được thiện lợi.'
    - id: 7
      tap: 4
      global_idx: 74
      title: Niệm Phật Xuất Tam Giới Bất Khả Tư Nghì
      duration: 2830
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/74%20T4%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20Xu%E1%BA%A5t%20Tam%20Gi%E1%BB%9Bi%20B%E1%BA%A5t%20Kh%E1%BA%A3%20T%C6%B0%20Ngh%C3%AC.mp3
      video_url: https://www.youtube.com/watch?v=GJHIsLpDcj4
      read_url: https://cusidieuam.com/2022/04/21/72-niem-phat-xuat-tam-gioi-bat-kha-tu-nghi/
      read_label: 📖 Xem bài gốc
      summary: 'Niệm Phật bất khả tư nghì!

        Trước đây chị chỉ nghe nói sự vi diệu của pháp niệm Phật, chứ chắc chưa từng
        thấy qua.

        Nay chính người mẹ đã vãng sanh, chị đã thấy được tận mắt những hiện tượng
        bất khả tư nghì.

        Phải chăng đây là một bài hiện thân thuyết pháp, làm cho chị cùng gia đình
        tăng trưởng niềm tin vào pháp niệm Phật.

        Xin thành tâm chúc mừng cho chị, chúc mừng cho cả gia đình và thành kính chúc
        mừng cho Bác.

        Nguyện cầu hương linh Bác vãng sanh cao phẩm, sớm ngày trở lại cõi Ta-bà cứu
        độ chúng sanh.

        Phật nói: Bất khả dĩ thiểu thiện căn phước đức nhân duyên đắc sanh bỉ quốc.

        Người ít thiện căn, ít phước đức, ít nhân duyên không thể nào được vãng sanh
        về thế giới Tây-phương Cực-lạc của đức Phật A-di-đà.

        Nghĩa là, vãng sanh được về thế giới Cực-lạc không phải là chuyện dễ.

        Nhiều người tu hành lâu năm, khổ cực dụng công, sức tu tập thật giỏi, nhưng
        cuối cùng chưa chắc đã biết đâu là chỗ quy hướng tối thắng.

        Thế mà, Bác vừa được vãng sanh, Bác đã hưởng được một đại thiện căn, đại phước
        đức, đại nhân duyên.

        Cái thiện căn phước đức này mấy ai sánh bằng?'
