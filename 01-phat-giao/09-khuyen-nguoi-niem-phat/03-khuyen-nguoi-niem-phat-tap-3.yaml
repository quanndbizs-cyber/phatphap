      summary: '(Tiếp theo lời thư 44 nói về “Cảnh giới Trung ấm”, Khuyên người niệm
        Phật, tập 2).

        Câu chuyện cô Lương Thị Chuẩn, con ông Lương Văn Liêm ở làng Vần, xã Yên Thắng,
        huyện Long Chánh, tỉnh Thanh Hóa chết năm 1988 đã đầu thai thành cô Hà Thị
        Khuyên con ông bà Hà Văn Lợi và Lò Thị Sơn ở làng Buốc, xã Lâm Phú, cùng trong
        huyện Long Chánh là đề tài còn khá hay!

        Thư trước cậu đã trả lời được vài câu hỏi nhưng chưa xong.

        Hôm nay cậu tiếp tục tới phần còn sót lại.

        Trả lời một thư phải gián đoạn mấy tháng trường là vì cậu khá bận, chắc cháu
        hiểu được việc này!

        Hy vọng cháu cũng có đọc những lời thư khác và giúp ích được ít nhiều cho
        cháu.

        Cháu có nhiều suy nghĩ khá sắc bén, đáng khen.

        Hỏi: Hiện tượng này có liên quan gì đến Phật pháp không?

        Đây là hiện tượng sanh tử luân hồi mà trong Phật giáo nói rất rõ.

        Đối với Phật pháp, thì câu chuyện của cháu kể rất có giá trị, chứng minh được
        rằng chết rồi không phải hết, mà chết chỉ là đổi cái thân.

        Năm 1988 cô Chuẩn chết, nhưng đó chỉ là thân xác của cô chết, chứ thần thức
        của cô không chết, đã lang thang theo đám tang rồi đầu thai trở lại thành
        cô Hà Thị Khuyên.

        Những chuyện này nên phổ biến cho nhiều người biết, rất là hay!'
    - id: 11
      tap: 3
