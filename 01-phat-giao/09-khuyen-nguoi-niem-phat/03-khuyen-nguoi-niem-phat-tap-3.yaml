      summary: 'Tết sắp đến rồi con viết thư về thăm cha má.

        Có lẽ sau tết con sẽ về, cha má và anh chị em cố gắng sắp xếp thì giờ niệm
        Phật với con.

        Đời này nóng lạnh vài mươi năm, sanh-lão-bệnh-tử, lăn lóc trong trần đời khổ
        hải vô biên rồi sau cùng thân xác cũng phải trả về với cát bụi!

        Cuộc đời này như mộng, thế gian như huyễn, thân mạng vô thường, tuổi đã về
        chiều thì còn lo lắng chuyện đời làm chi?

        Tạo sự nghiệp gì nữa đây?!

        Còn tham luyến thế trần chi nữa mà coi chừng bị vướng nạn.

        Lỡ vướng nạn rồi thì chịu khổ hàng vạn vạn năm, thậm chí hàng vạn kiếp!

        Hãy mạnh dạn buông xả để lo tu hành.

        Những thứ ruộng vườn, nhà cửa, tiền bạc, xe cộ, danh vọng, tiếng tăm, tất
        cả rồi đây cũng thành số 0!

        Chỉ còn chăng là khối nghiệp mang theo, dìm mãi thần thức của ta trong bể
        khổ!

        Cha má hãy quyết tâm hàng ngày niệm Phật cầu mong cuối đời mình được vãng
        sanh, an nhiên tự tại, hưởng được đại phúc báu, đại trí huệ ở cõi nhất chân
        pháp giới, đừng nên chần chờ dụ dự mà lỡ bị đọa đày thì tội nghiệp cho cha
        má lắm!

        Vì biết được con đường viên mãn đạo quả trong đời, cho nên con phải thưa cho
        cạn lời, để mong cho cha má thức tỉnh kịp thời, quay đầu kịp lúc, tự cứu lấy
        mình.'
