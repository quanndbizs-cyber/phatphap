      video_url: https://www.youtube.com/watch?v=nqNTbNaIlFY
      read_url: https://cusidieuam.com/2022/04/21/62-dia-nguc-va-van-de-nhan-qua/
      read_label: 📖 Xem bài gốc
      summary: 'Trong cuối tháng tư vừa qua, ở Tịnh Tông Học Viện có tổ chức lễ kỷ
        niệm bảy năm ngày bà quảng tràng họ Hàn vãng sanh.

        Trong giờ ăn trưa, vào phòng trai đường con thấy trên vách có dán những tấm
        “Địa ngục đồ”.

        Những tấm hình diễn tả lại những cảnh tra tấn quá dã man dưới địa ngục, nhìn
        thấy phải khiếp sợ!

        Chỗ này nạn nhân bị thảy vào chảo dầu sôi, chỗ kia bị cưa thân làm từng mảnh.

        Có chỗ bị cắt lưỡi, có chỗ bị chặt đầu máu me tung tóe.

        Chỗ này bị chó sắt cắn xé, chỗ nọ thì cọp beo vồ chụp, banh thân moi ruột,
        v.v Toàn là những hình ảnh quá khiếp hãi!

        Có một ông bác, đang theo dự khóa Phật thất, có lẽ vui tính rồi sẵn dịp hỏi
        con: “Người làm ác thì xuống địa ngục bị hành tội, còn những người ở dưới
        địa ngục đi hành hạ tội nhân đủ cách quá ư dã man, như vậy họ có tội không?”.

        Nghe câu hỏi làm con giựt mình.

        Thưa cha má, trong thư trước con bàn sâu đến chuyện tạo phước để hỗ trợ việc
        vãng sanh.

        Hôm nay con bàn đến chuyện sám nghiệp.

        Sám nghiệp liên quan đến nghiệp chướng, nhân quả, địa ngục.

        Những vấn đề này trước đây con cũng thường nói qua, nhưng mỗi một lần nhắc
        đến con đi sâu thêm một chút.'
