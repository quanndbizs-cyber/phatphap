    - id: 3
      tap: 3
      global_idx: 53
      title: Lời Khuyên Người Em Trai – Cảnh Giới
      duration: 2398
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/53%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Em%20Trai%20%E2%80%93%20C%E1%BA%A3nh%20Gi%E1%BB%9Bi.mp3
      video_url: https://www.youtube.com/watch?v=Q15ZzxiBPOc
      read_url: https://cusidieuam.com/2022/04/21/50-canh-gioi/
      read_label: 📖 Xem bài gốc
      summary: 'Anh đã viết cho hai em nói về sự khổ, nói về cách đọc tụng kinh, hy
        vọng nó giúp các em giải quyết được phần nào chướng ngại phải không?

        Hôm nay anh lại mở thư em ra đọc lại để đi đến vấn đề khó khăn khác.

        Những điều khó khăn này, nếu cho anh hay sớm hơn, thì có lẽ đến nay các em
        cảm thấy thoải mái và tự tại nhiều rồi, chứ đâu đến nỗi bây giờ mà “ em phải
        lần mò đi tìm từng chút ” có vẻ khó khăn dữ vậy.

        Tìm hiểu thì tốt, nhưng có lúc tìm được, có nơi không có tài liệu thì tìm
        đâu cho ra.

        Tìm không ra tức là “Cầu bất đắc khổ”.

        Đời đã là khổ lại còn đi cầu thêm cái khổ làm chi?

        Tục ngữ VN có câu, “đi một ngày đàng, học một sàng khôn”, cái khôn này do
        đi mà thấy, chứ không phải ngồi ở nhà tra cứu trong sách vở mà có đâu.

        Muốn tu sửa thì phải thực hành mới có ích lợi.

        Thôi anh bắt đầu trả lời tiếp những câu hỏi của em đây.

        Hỏi: Cửu pháp giới, tam đồ, lục đạo sanh tử luân hồi là gì?

        Trả lời: Cửu pháp giới là chín pháp giới.

        Chúng sanh ở trong lục đạo phải chịu chết-sống, sống-chết thường xuyên nên
        gọi là “Sanh tử”.'
    - id: 4
      tap: 3
      global_idx: 54
      title: Lời Khuyên Vợ Chồng Người Em – Cảnh Giới Người
      duration: 2234
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/54%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20V%E1%BB%A3%20Ch%E1%BB%93ng%20Ng%C6%B0%E1%BB%9Di%20Em%20%E2%80%93%20C%E1%BA%A3nh%20Gi%E1%BB%9Bi%20Ng%C6%B0%E1%BB%9Di.mp3
      video_url: https://www.youtube.com/watch?v=gRVoL5xx3uw
      read_url: https://cusidieuam.com/2022/04/21/51-canh-gioi-nguoi/
      read_label: 📖 Xem bài gốc
      summary: 'Hiểu về cảnh giới giúp cho ta có cái nhìn tổng quát về vũ trụ nhân
        sinh, khỏi mập mờ chạy theo những chốn hiểm nạn, thấy được rõ ràng đường đi
        cho tương lai.

        Nên đi về những cảnh giới thiện.

        Hãy tránh xa những cảnh giới ác.

        Đối với địa ngục thì cảnh ngã quỉ là thiện, đối với ngã quỉ thì cảnh súc sanh
        là thiện, đối với súc sanh thì cảnh giới người là thiện.

        Chúng ta đang ở trong một cảnh giới thiện là người, nhưng cái thiện của cảnh
        giới người chỉ so sánh được đối với loài súc sanh, loài ngã quỉ, với các loài
        chúng sanh đã bị rơi vào địa ngục mà thôi, chứ không thể so bì được với các
        cảnh giới cao hơn!

        Do đó, tu hành mà không thể vượt lên khỏi cảnh người thì khó trốn thoát khổ
        nạn.

        Đã là người, lại tu hành để thành người, thì cuộc đời này có tu mà không có
        tiến, sự chuyển hóa đành phải giậm chân tại chỗ!

        Vạn sự vạn vật luôn luôn tiến hóa.

        Cảnh giới của vũ trụ nhân sinh chuyển biến không ngừng.

        Thì trong dòng nhân sinh này con người phải biết lèo lái con thuyền huệ mạng
        của mình tiến về cội nguồn hạnh phúc.

        Nếu đứng lại là lùi, dòng nghiệp lực sẽ lôi ta tới tận cùng của sự thảm hại!

        Tu mà không tiến thật là oan uổng vậy!'
    - id: 5
      tap: 3
      global_idx: 55
      title: Lời Khuyên Người Em Trai – Lý Sự Cơ
      duration: 2168
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/55%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Em%20Trai%20%E2%80%93%20L%C3%BD%20S%E1%BB%B1%20C%C6%A1.mp3
      video_url: https://www.youtube.com/watch?v=eaAs25-6TJ8
      read_url: https://cusidieuam.com/2022/04/21/52-ly-su-co/
      read_label: 📖 Xem bài gốc
      summary: 'Học Phật cần phải biết nhẫn nại, từ từ mà hiểu thì mới có thể thâm
        nhập vào Phật pháp.

        Một câu hỏi của em về lục đạo luân hồi đã liên quan đến những cảnh giới rộng
        lớn, anh muốn tóm gọn một cách tổng quát, nhưng đã trải dài qua bao nhiêu
        trang giấy rồi mà chưa giải quyết xong.

        Thấy được điều này nên ngay từ đầu anh đã nói, đừng bao giờ nghĩ rằng những
        thắc mắc của mình là nhỏ nhặt.

        Nhỏ là vì mình chưa thấy, chứ nếu thấy được thì cái nhỏ đó có thể sẽ lớn bao
        trùm cả hư không pháp giới.

        Một là tất cả, tất cả là một.

        Hiểu được pháp Phật thì từ một điểm có thể thấy đến cảnh giới vô lượng vô
        biên, trong vô lượng vô biên cảnh giới ta có thể thâu tóm lại thành một điểm.

        Càng hiểu càng sâu, càng thấy càng rộng.

        Phật pháp thật là thậm thâm vi diệu, nếu hời hợt đứng bên ngoài nhìn vào thì
        khó liễu ngộ được chân tướng vậy!

        Đối với đạo pháp quá sức thâm sâu cao diệu, muốn hiểu phải lấy cái tâm thanh
        tịnh mà hiểu, đừng nên chú trọng quá nhiều vào hình thức.

        Anh thường nói rằng, người thích nghiên cứu có tỉ lệ thành tựu thấp hơn người
        chí thành tu tập.

        Nghiên cứu nhiều thì cái tâm của mình thường chạy ra ngoài để lượm lặt những
        thứ kiến thức hữu lậu vô thường của thế gian, đó là sống theo vọng tâm, hay
        gọi là “Ngoại đạo”.

        Người chí thành tu tập thì họ chuyên nhất vào chuyện chính yếu để thoát ly
        sanh tử luân hồi, họ lo thúc liễm thân tâm, làm cho tâm định lại, có sức sống
        nội tâm mạnh, đó là “Nội đạo”.'
    - id: 6
      tap: 3
      global_idx: 56
      title: Lời Khuyên Người Em Trai – Mơ Về Tiên Cảnh
      duration: 2489
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/56%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Em%20Trai%20%E2%80%93%20M%C6%A1%20V%E1%BB%81%20Ti%C3%AAn%20C%E1%BA%A3nh.mp3
      video_url: https://www.youtube.com/watch?v=eaAs25-6TJ8
      read_url: https://cusidieuam.com/2022/04/21/53-mo-ve-tien-canh/
      read_label: 📖 Xem bài gốc
      summary: 'Phật pháp lý đạo cao siêu, thậm thâm vô ngần, quảng đại vô biên!

        Muốn tìm hiểu về Phật pháp không phải chỉ dựa vào kiến thức thế gian mà liễu
        ngộ được!

        Như vậy muốn hiểu sâu về Phật pháp ta phải làm sao?

        “Phật” có nghĩa là “Giác”.

        Niệm Giác thì được giác ngộ.

        Danh hiệu A-di-đà có nghĩa là Vô Lượng; “A” là Vô; “Di-Đà” là Lượng.

        “A-di-đà Phật” là “Vô-Lượng-Giác”.

        Niệm “A-di-đà Phật” là niệm Vô-lượng Giác.

        Vô-Lượng-Giác nghĩa là giác ngộ rốt ráo, hiểu rõ về thái hư pháp giới, thấu
        rõ chân tướng của vũ trụ nhân sinh.

        Tất cả cảnh giới vô lượng vô biên đều bao hàm trong câu A-di-đà Phật.

        “Vô Lượng” có nghĩa là nhiều vô cùng, vô tận, vô số, vô biên, không kể xiết.

        Trong cái “Vô-Lượng” đó, thì “Vô-Lượng-Thọ” và “Vô-Lượng-Quang” là đại biểu
        cho tất cả “Vô-Lượng”.'
    - id: 7
      tap: 3
      global_idx: 57
      title: Lời Khuyên Người Bạn Ở Paris – Một Đường Thẳng Tiến
      duration: 2302
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/57%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20B%E1%BA%A1n%20%E1%BB%9E%20Paris%20%E2%80%93%20M%E1%BB%99t%20%C4%90%C6%B0%E1%BB%9Dng%20Th%E1%BA%B3ng%20Ti%E1%BA%BFn.mp3
      video_url: https://www.youtube.com/watch?v=PpxSjYwldi0
      read_url: https://cusidieuam.com/2022/04/21/53-mot-duong-tien-thang/
      read_label: 📖 Xem bài gốc
      summary: 'Kính gởi đạo hữu Huệ Sanh,

        Con người sinh ra lặn hụp trong biển khổ sanh tử luân hồi khổ không nói hết.

        Có người cố gắng trồi lên mặt nước, hớp một hơi không khí, rồi chìm xuống
        lại dưới đáy đại dương.

        Có người cố gắng bơi, nhưng bơi lòng vòng, sau cùng cũng chìm xuống đó.

        Đây là hai cảnh giới mình đã bàn với nhau trong sáu tháng trước.

        Nay lại được nói chuyện với chị, lần này tôi xin tiếp tục lá thư dang dở,
        nói đến cảnh thứ ba mà thầy Trí Tu đề cập đến: Có người sinh ra họ bơi thẳng
        một đường qua bờ bên kia, bờ giải thoát.

        Trước tiên tôi thấy rất phấn khởi khi biết chị Huệ Sanh có phát tâm nguyện
        lớn, càng ngày tu càng nhiều, pháp hỉ sung mãn, tươi vui hơn ra.

        Đây là hiện tượng khá tốt.

        Học Phật nếu biết rõ đường đi nước bước thì lòng tin của mình được cũng cố,
        chí nguyện mạnh mẽ, sự tu vững vàng.

        Tín-hạnh-nguyện đầy đủ là con đường thành tựu đạo quả.

        Xin nhận lời giúp cho quí đạo hữu ở Paris tìm hiểu về sự hộ niệm và cách thức
        cộng tu niệm Phật, thư tới Diệu Âm sẽ cố gắng nói chuyện này.

        Cảnh thứ nhất: trồi lên hụp xuống, chỉ cho người không chịu tu hành, chúng
        ta đã bỏ đường này rồi, khỏi cần vướng bận đến nữa.'
