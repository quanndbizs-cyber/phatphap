      title: Lời Khuyên Người Em – Đọc Tụng Kinh Điển Theo Tín Giải Hạnh Chứng
      duration: 2434
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/48%20T2%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Em%20%E2%80%93%20%C4%90%E1%BB%8Dc%20T%E1%BB%A5ng%20Kinh%20%C4%90i%E1%BB%83n%20Theo%20T%C3%ADn%20Gi%E1%BA%A3i%20H%E1%BA%A1nh%20Ch%E1%BB%A9ng.mp3
      video_url: ''
      read_url: https://cusidieuam.com/2022/04/21/46-doc-tung-kinh-dien-theo-tin-giai-hanh-chung/
      read_label: 📖 Xem bài gốc
      summary: 'Anh muốn lập lại lời nói của em một lần nữa:

        “Đời này quá khổ, không biết bao nhiêu nỗi khổ kể cho hết ”.

        Thư trước anh giải bày cho em về sự khổ não, chắc em đã nhận được và hiểu
        thêm chút ít về sự khổ của cuộc đời.

        Anh đem pháp Tứ Diệu Đế để nói về khổ.

        Giờ đây chúng ta hãy xét lại coi, rốt cuộc khổ não từ đâu mà có?

        Phật dạy, “Nhất thiết hữu vi pháp như mộng huyễn bào ảnh”, nghĩa là tất cả
        vạn sự vạn vật là tuồng như mộng như huyễn, hư vọng, không thực.

        Pháp hữu vi là những gì có thể thấy được, sự khổ đau là một pháp hữu vi, thì
        nó cũng phải hư vọng.

        Nói rõ hơn nữa, những sự khổ đau mà ta thường xuyên chịu đựng có thể chỉ là
        chuyện huyễn hóa chứ không phải có thực!

        Vì tâm hồn ta đang khổ thì ta thấy khổ!

        Nếu cùng một hoàn cảnh như vậy nhưng tâm hồn ta đang vui thì ta thấy vui.

        Sự vui hay buồn chỉ là sự phản chiếu những gì đang có trong tâm mà thôi!

        Nói cách khác, khổ đau chỉ là sản phẩm do tâm hồn ta tạo ra!'
    - id: 23
      tap: 2
      global_idx: 49
      title: Lời Khuyên Người Em – Quyết Tâm Cứu Độ Chúng Sanh
      duration: 2842
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/49%20T2%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Em%20%E2%80%93%20Quy%E1%BA%BFt%20T%C3%A2m%20C%E1%BB%A9u%20%C4%90%E1%BB%99%20Ch%C3%BAng%20Sanh.mp3
      video_url: https://www.youtube.com/watch?v=4mk83lZ7YWE
      read_url: https://cusidieuam.com/2022/04/21/47-quyet-tam-cuu-do-chung-sanh/
      read_label: 📖 Xem bài gốc
      summary: 'Anh gửi cho Hải, anh gửi cho Thứ,

        Anh viết gởi cho cả hai em, anh thương hai em nhiều lắm.

        Có điều đáng tiếc là hình như hai em không chịu đọc kỹ thư anh.

        Mỗi lần viết thư cho các em, anh Năm nắn nót từng chữ, trân trọng từng câu,
        cẩn thận từng ý, mà các em không chịu tiếp thu cẩn thận.

        Cuộc đời chúng ta sống qua mấy chục năm, một năm 365 ngày, một ngày 24 giờ
        cho các em chịu khổ, vậy mà các em còn chịu được, trong khi đọc thư của anh
        chỉ mất 30 phút, 30 phút có thể giúp các em khỏi khổ, thế mà các em lại lười
        biếng.

        Thấy vậy mà anh vừa thương, vừa trách!

        Có khi nào các em tự hỏi rằng, vì đâu mà chúng ta lại khổ?

        Vì cái gì mà chúng ta chịu khổ?

        Tại vì sao mà chúng ta phải suốt đời bận bịu trong khổ đau?

        Bận bịu đến nỗi không có được một vài phút yên tĩnh để bàn luận chuyện thoát
        khổ, và bây giờ phải đối diện với khổ đau mà rơi nước mắt!

        Các em có lần nào giựt mình tự hỏi tại sao như vậy không?

        Cái khổ của cuộc đời này lớn lắm đó!'
