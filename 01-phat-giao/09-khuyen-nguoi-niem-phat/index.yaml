        Nếu anh có được thủ pháp của Ngài thì thật là quý hóa lắm vậy.

        Kính anh Thiện Khánh, có lẽ chúng ta có duyên với nhau nên đời này ở xa mà
        thành gần.

        Tôi rất sung sướng được làm quen với một người biết làm thơ, biết tu hành
        và tâm hồn nhiệt thành như anh.

        Đọc thư anh tôi rất lấy làm cảm kích, nhưng thật sự không dám nhận những lời
        tán thán và cảm ơn của anh.

        Khi gặp được pháp môn niệm Phật thì tôi tin tưởng, rồi lấy lòng tín ngưỡng
        đó mà thành tâm khuyên người niệm Phật.

        Lòng chân thành khuyên giải, mong cho những ai nghe được phát khởi lòng tin,
        muốn được vãng sanh, chí tâm niệm Phật.

        Cầu xin tất cả đắc được thiện lợi.'
