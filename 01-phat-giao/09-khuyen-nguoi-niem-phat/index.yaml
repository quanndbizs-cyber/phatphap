      read_label: 📖 Xem bài gốc
      summary: 'Cha Má kính thương, (thư này tiếp theo thư ngày 5/6/2001)

        Vì khai triển về ý nghĩa hai mươi chữ trên tượng đức Phật A-di-đà quá rộng,
        ở đây con cố gắng thâu tóm lại ngắn gọn.

        Một người tu Phật nếu hiểu được hai mươi chữ này thôi cũng đủ đắc đạo vãng
        sanhï.

        Một đời tu hành của Hòa-Thượng Tịnh-Không, đến nay đã bốn mươi hai năm thuyết
        kinh giảng đạo, tóm lược trong hai mươi chữ này với câu Phật hiệu A-di-đà.

        Hàng triệu người khắp nơi trên thế giới ngày đêm tinh tấn tu hành và từng
        người từng người giải thoát khỏi tam giới, khỏi lục đạo luân hồi, vãng sanh
        Tây-phương cũng từ pháp tu Niệm Phật đó cha má ạ.

        Chân-Thành, Thanh-Tịnh, Bình-Đẳng, Chánh-Giác, Từ-Bi.

        Khán-Phá, Phóng-Hạ, Tự-Tại, Tùy-Duyên, Niệm-Phật.

        Khởi đầu là “Chân-Thành”, kết thúc là “Niệm-Phật”.

        “Chân Thành Niệm Phật” là pháp môn thành Phật.

        “Niệm-Phật” thật “Chân-Thành” thì chỉ trong một đời này thôi ta sẽ vĩnh viễn
        thoát ly bể khổ sinh tử, luân hồi, nghiệp báo.

        Không niệm Phật không thể thành Phật được!

        Chữ đầu và chữ cuối đã thâu tóm cả một pháp môn thành Phật tối vi diệu, bằng
        một sự hành trì rất đơn giản, dễ dàng, ai ai cũng có thể tu trì được, ai ai
        cũng thoát khỏi tam giới vô an này được.'
