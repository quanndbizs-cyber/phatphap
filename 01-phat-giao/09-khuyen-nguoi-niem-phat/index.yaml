      summary: 'Kinh gởi cô Lệ Tân cùng cô bác cộng tu!

        Thời này tu hành có nhiều chướng ngại lắm.

        Chướng ngại có ba loại, một là phiền não chướng, hai là nghiệp chướng, ba
        là báo chướng.

        Phiền não chướng là tham-sân-si; Cô bác muốn tu hành cho thành tựu thì nên
        tìm cách giảm bớt ba chất độc này, mỗi ngày mỗi giảm cho đến hết luôn mới
        dễ trốn thoát ba cảnh đọa lạc.

        Tham lam là đường ngã quỷ, sân khuể là đường địa ngục, ngu si là đường súc
        sanh.

        Nghiệp chướng là ngũ nghịch thập ác, sát đạo dâm vọng.

        Muốn tu thì cố gắng giữ năm giới, nhất là giới sát sanh.

        Hãy giữ lòng từ bi thương mạng chúng nó, có thế thì ta dễ được thoát nạn.

        Báo chướng là hậu quả bị đọa lạc trong ba đường khổ: địa ngục, ngạ quỷ, súc
        sanh.

        Phiền não nghiệp chướng là nhân, báo chướng là quả.

        Nhân nào quả đó, nhân duyên quả báo không sai một ly một tấc.

        Khi thấy được đường tu hành mới biết rằng trong quá khứ chính mình đã sơ ý
        tạo ra quá nhiều nghiệp ác như giết hại chúng sanh, tham lạm công quỹ, chống
        báng Phật pháp, sân giận, đố kỵ, vọng ngôn, xảo ngữ, trộm cướp, lường gạt,
        ganh tỵ, thị phi, v.v nay gặp được Phật pháp mới hay quả báo này toàn là địa
        ngục, không địa ngục thì ngạ quỷ, không ngạ quỷ cũng là đường súc vật thì
        sợ đến đêm ngày ăn ngủ không yên!'
