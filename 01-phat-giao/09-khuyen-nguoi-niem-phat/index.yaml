      read_label: 📖 Xem bài gốc
      summary: 'Nhận được thư Diệu Nhàn, không có thời giờ viết thư trả lời, Diệu
        Âm đành phải gởi mấy băng giảng kinh của HT Tịnh-Không cho đạo hữu coi trước,
        kèm theo đó có cuộn “Tự tại vãng sanh”, quay lại cụ Ngụy Quốc Hưng vãng sanh
        vào tháng 2/2003.

        Đạo hữu cố gắng dành thời giờ coi qua.

        Cuộc vãng sanh này bất khả tư nghì!

        Diệu Nhàn nên cố gắng sang thêm để cúng dường nhiều người cùng xem.

        Xây dựng lòng tin Phật pháp cho họ, giúp nhiều người phát tâm niệm Phật, công
        đức này lớn lắm đó.

        Tự tại vãng sanh, danh từ tuy đơn sơ, nhưng trên đời người nào thực hiện được
        chuyện này thì hưởng được một phước báu vô cùng vô tận, cái phước thành tựu
        đạo Bồ-đề, cái phước được làm Phật, cái phước mà một chúng sanh có thể phải
        tu vô lượng kiếp mới có được, chứ không phải tầm thường!

        Xem cuộn “Tự tại vãng sanh”, mới thấy Phật pháp nhiệm mầu!

        Trước đây có cuộn “Hoa khai kiến Phật”, ta đã thấy sự vi diệu của câu Phật
        hiệu, nay xem thêm “Tự tại vãng sanh” lại thấy càng vi diệu hơn.

        Năm 2001, tôi đi qua Honolulu, có biết qua một cuộn phim khác quay lại cuộc
        vãng sanh của một vị cư sĩ trẻ vãng sanh cũng thật là vi diệu.

        Nhưng vì thời gian lưu lại quá ít, không kịp xin bản lưu, chứ nếu được thì
        chúng ta có thêm những chứng liệu vô giá về sự vãng sanh Tây-phương Cực-lạc.

        Người con Phật chúng ta phải khẳng định rằng lời Phật nói đúng sự thật, có
        nhiều sự chứng minh cụ thể, chứ không phải là những loại “Quyền Thuyết” đâu.

        Thông thường chúng ta biết rằng, muốn có ngày chứng quả vị Phật một chúng
        sanh phải tu trải qua vô lượng kiếp thời gian chứ không phải đơn giản.'
