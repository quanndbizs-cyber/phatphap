      title: Lời Khuyên Song Thân – Làm Thiện Tích Phước Để Hỗ Trợ Vãng Sanh
      duration: 2559
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/64%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Song%20Th%C3%A2n%20%E2%80%93%20L%C3%A0m%20Thi%E1%BB%87n%20T%C3%ADch%20Ph%C6%B0%E1%BB%9Bc%20%C4%90%E1%BB%83%20H%E1%BB%97%20Tr%E1%BB%A3%20V%C3%A3ng%20Sanh.mp3
      video_url: https://www.youtube.com/watch?v=ZMzZBMG9h0Q
      read_url: https://cusidieuam.com/2022/04/21/61-dia-nguc-va-van-de-nhan-qua/
      read_label: 📖 Xem bài gốc
      summary: 'Một chúng sanh đầy nghiệp chướng như chúng ta, muốn thoát ly tam giới,
        thoát ly sanh tử luân hồi, so sánh ra còn khó hơn chuyện mò kim dưới đáy biển!

        Trong số người tu hành, tìm được một người thành tựu lại càng khó!

        Thế nhưng, nghe thấy những người vãng sanh Tây-phương thì con nghĩ cha má
        sẽ phấn khởi, vững lòng tin tưởng pháp niệm Phật cầu sanh Tịnh-độ đang dẫn
        mình đến chỗ thành tựu.

        Người có lòng tin thâm sâu vào lời Phật dạy, thành tâm niệm Phật, tha thiết
        nguyện vãng sanh Tây-phương đều được vãng sanh.

        Chuyện vãng sanh đến nay đã quá nhiều, đây là sự thực, chắc cha má không còn
        nghi ngờ nữa.

        Có nhiều cuộc vãng sanh giống như một sự biểu diễn.

        Trong thế kỷ 20, Ngài Cô Lô Giang, đệ tử của HT Đế-Nhàn, ba năm niệm Phật
        rồi đứng vãng sanh, nhục thân đứng im như vậy trong ba ngày để chờ sư phụ
        về mai táng.

        Vào khoảng thập niên 40, cụ Hạ Liên Cư cũng đứng vãng sanh, con chuột của
        cụ nuôi cũng đứng vãng sanh theo.

        Năm 2003, thầy Thích Ngộ Toàn, (đệ tử của HT Tịnh-Không), ngài vừa mới đi
        thăm phòng thờ của cụ về kể lại thêm một phát hiện mới, là cặp đèn cầy mà
        trong tiền thời cụ Hạ dùng dang dở, đang giữ lại tại chỗ thờ làm kỷ niệm,
        đã biến thành ngọc xá lợi từ hồi nào mà không ai hay!

        Quá nhiều điều lạ, ngoài sức tưởng tượng của chúng ta!

        Nhất là chuyện lạ này lại xảy ra trong thời đại mà nền văn minh khoa học đã
        phát triển mạnh, con người đã bắt đầu đặt chân lên sao hỏa, có hướng muốn
        chinh phục không gian!

        Đạo tràng niệm Phật ở đây thường xuyên nhận được những tin tức về sự vãng
        sanh.'
