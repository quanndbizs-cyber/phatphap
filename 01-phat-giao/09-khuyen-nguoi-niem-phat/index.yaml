      summary: 'Tu hành nhằm để “Ly khổ đắc lạc”, nghĩa là thoát khổ được vui.

        Trên đời này thiên hạ sợ nhất là chết, người niệm Phật coi sự chết sống là
        chuyện tự nhiên, bình thường như những chuyện bình thường khác.

        Quyết lòng làm lành lánh dữ, ngày ngày niệm Phật cầu sanh Tịnh-độ.

        Giữ vững niềm tin, phát nguyện vãng sanh tha thiết, chân chánh tu hành.

        Vậy thì còn điều gì lớn hơn nữa để lo âu phiền muộn?!

        Anh kính lời thăm tất cả cô bác tại đạo tràng.

        Anh luôn luôn nhớ đến tất cả đồng tu ở Long Khánh.

        Mỗi lần về thăm quê, anh đều cảm nhận được lòng quí mến của cô bác, anh xin
        cảm niệm tấm thịnh tình này.

        Mong quí Cô Bác cố gắng tinh tấn niệm Phật, sự thành tựu đang chờ mọi người
        đó.

        Mới mở đầu thư, em viết như vầy: “ Hôm nay viết thư cho anh mà cũng là lần
        đầu em sợ nhất ”.

        Nghe đến tiếng Sợ nhất làm anh giựt mình nên phải đọc thật kỹ để coi thử chuyện
        gì có vẻ dễ sợ vậy!

        Nhưng tìm hoài không thấy.'
