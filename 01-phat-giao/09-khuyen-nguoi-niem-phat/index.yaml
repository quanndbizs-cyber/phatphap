      read_label: 📖 Xem bài gốc
      summary: 'Niệm Phật được mười điều lợi ích, trong đó cái lợi sau cùng là được
        vãng sanh về Tâyphương Cực-lạc thế giới, một đời này thôi ta thoát khỏi sinh-tử
        luân-hồi.

        Đây là cái lợi ích chung cuộc.

        Không có cái lợi ích này thì tất cả những lợi ích kia chỉ là mộng-huyễn, vì
        có thu lợi nhiều đến mấy đi nữa nhưng rồi cũng chết, gắng gượng sống thêm
        một vài năm bệnh hoạn trong cái xã hội đầy sầu não, sau cùng chính thần-thức
        của mình bị đọa lạc, thì có gì đâu mà lợi?!

        “Chuyển thân thọ thân, cải hình dị đạo”.

        Cố gắng tu hành nhắm thẳng tới sự giải thoát viên mãn, đừng nên bám víu vào
        những điều lợi vụn vặt mà tự hại ngàn đời.

        Bây giờ, trí-huệ đang trói trong cái nhục thân phàm tục cho nên mình không
        thấy, chứ một khi đã thấy rồi thì sự việc này quan hệ lớn lắm.

        Bị đọa lạc kinh khủng lắm!

        Không thể lơ là bừa bãi được đâu.

        Nhiều lá thư rồi con nhắc đến chuyện này, mong cha má thức ngộ, làm gương
        cho gia đình, bà con cô bác, cùng tỉnh cơn mê, cùng nhìn ra sự thật, cố gắng
        tu hành tránh hiểm nạn.

        Về quê, tuy thời gian ngắn ngủi, nhưng con thấy cũng khá nhiều điều, có dịp
        con lần lượt nói ra cho mọi người nghe.

        Tu hành coi vậy chứ có nhiều nẻo lắt léo, chú ý lắm may ra mới thấy vấn đề!

        Hòa-Thượng Tịnh-Không ít khi nói thẳng tên, sửa thẳng việc, nhưng một khi
        Ngài thấy cái sai lầm của người nào thì trong những buổi thăng tòa giảng kinh
        Ngài nói ra sự việc đó.'
    - id: 24
      tap: 1
      global_idx: 24
      title: Định Mệnh Nhân Quả Danh Vọng
      duration: 2083
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/24%20T1%20%C4%90%E1%BB%8Bnh%20M%E1%BB%87nh%20Nh%C3%A2n%20Qu%E1%BA%A3%20Danh%20V%E1%BB%8Dng.mp3
      video_url: https://www.youtube.com/watch?v=ZPlGzLt9c8g
      read_url: https://cusidieuam.com/2022/04/21/23-dinh-menh-nhan-qua-danh-vong/
      read_label: 📖 Xem bài gốc
      summary: 'Tất cả vạn sự sự vật không có gì thoát khỏi định luật nhân quả.

        Thiên cơ, định mệnh chỉ là một cách gọi khác của định luật nhân-quả mà thôi.

        Trồng dưa được dưa, trồng đậu được đậu, chính vì vậy mà An nó tìm cách cho
        cha má có cơ hội bố thí làm phước để tạo thêm phước báu lót đường tương lai
        cho cha má.

        Trong những ngày về thăm, An nó tâm sự với con rằng, “ mình làm sao cho cha
        má an tâm không lo gì về tiền bạc, hơn nữa còn phải coi nhẹ tiền bạc.

        Mỗi tháng tiêu dùng nếu thiếu mình bồi đắp cho đủ, nếu dư cha má phải đem
        cho người ta hết, cho nhiều mình sẽ bù vào nhiều cho cha má, nếu còn dư mình
        trừ số tiền đó trong phần cấp dưỡng tháng sau ”.

        Nghĩ tới lời này mà con thương em nó, trong tất cả những người con của cha
        má không biết còn có ai thành tâm, thành ý hiếu thảo lo lắng cho cha má như
        An nữa không?

        “Bổ bất túc, tổn hữu dư”, (bù chỗ thiếu, lấy phần dư) là đạo lý của Lão-học,
        là triết lý của dịch-học, không biết An nó học sách Thánh-Hiền từ hồi nào
        mà nói lên được đạo lý này.

        Cha má bố thí nhiều, mình nguyện cung ứng thêm cho cha má làm phước cứu giúp
        người.

        Cha má để dành lại thì coi như tiêu dùng còn dư mình phải lấy lại phần đó.

        An đề nghị như vậy là nó không muốn cha má tiếc tiền trong việc bố thí giúp
        người.

        Nghĩ tới ý tưởng này con mới giựt mình vì con vẫn còn có nhiều sơ sót, một
        đề nghị đơn giản như vậy mà chính con chưa nghĩ ra.

        Tư tưởng này người bình thường khó hiểu tới, nhưng người thông hiểu được đạo
        mới thấy chí lý, cao siêu.'
    - id: 25
      tap: 1
      global_idx: 25
      title: Phật Ở Trong Nhà Có Cầu Có Ứng
      duration: 1531
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/25%20T1%20Ph%E1%BA%ADt%20%E1%BB%9E%20Trong%20Nh%C3%A0%20C%C3%B3%20C%E1%BA%A7u%20C%C3%B3%20%E1%BB%A8ng.mp3
      video_url: https://www.youtube.com/watch?v=qdrndDN0Uv8
      read_url: https://cusidieuam.com/2022/04/21/24-phat-o-trong-nha-co-cau-co-ung/
      read_label: 📖 Xem bài gốc
      summary: 'Thành kính niệm Phật tự nhiên sẽ được Phật lực gia trì, sự cảm ứng
        bất khả tư nghì.

        Những sự cảm ứng này nhiều khi nó hiển hiện trước mắt, hoặc âm thầm xảy ra
        sát bên cạnh mà mình không hay.

        Ví dụ, chuyến về thăm gia đình, thăm cha bệnh trong tháng Sáu vừa rồi là con
        đã làm một việc khá liều lĩnh, bây giờ tất cả đã xong con mới dám nói lại.

        Thời gian con về là lúc con đang bệnh, bác sĩ cấm con không được lái xe, không
        được đi xa, không được đi máy bay.

        Bịnh của con rất kỵ trời nắng nóng, hễ nóng lên có thể bị xỉu liền.

        Thế mà khi vừa nghe cha ngã bịnh, vì phải cần cứu cha, con quyết định liều
        lĩnh bay về ngay trong thời điểm thời tiết Việt-Nam rất nóng.

        Chuyến đi ngắn ngủi nhưng tất cả những thủ tục bảo hiểm đều trả hết, và Ngọc
        chuẩn bị sẵn sàng bốc con ngược trở lại Úc bất cứ lúc nào.

        Vậy mà sự việc lại êm xuôi không có gì trở ngại.

        Cha má nhớ không, ngày đầu tiên con vừa bước chân về tới nhà thì trời chuyển
        mưa tầm tã, rồi suốt những ngày sau đó thời tiết dịu lại, trời tiếp tục mưa
        lai rai.

        Thật là một chuyện may mắn hiếm có, nhờ thế mà con ở lại quê được lâu.

        Có thể đây là một chuyện trùng hợp, nhưng dù sao đi nữa, nhờ vậy mới giúp
        cho con làm tròn những gì con muốn làm khi gặp cha má.

        Gần hai ngày trước khi lên máy bay, hầu như con tự giam mình trong niệm Phật
        đường, để ngày đêm nguyện cầu đức A-di-đà Phật gia trì những việc con đang
        làm để cho con trả phần nào chữ hiếu.'
    - id: 26
