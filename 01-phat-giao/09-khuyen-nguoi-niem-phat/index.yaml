        lành, anh nhớ từng khuôn mặt dễ thương của tất cả quý bác và anh chị em ở
        An Thái, nhưng tên thì có người còn nhớ, có người chưa biết.

        Nếu có dịp chụp chung một bô hình rồi ghi hết tên gởi sang Úc thì hay quá.

        Hãy cố gắng giúp đỡ lẫn nhau, khuyến tấn tu hành, Ngọc thấy có gì cần anh
        giúp đỡ thì cho anh biết.

        Nguyện cầu A-di-đà Phật gia trì cứu độ tất cả được vãng sanh Tịnh-độ, một
        báo thân này viên thành Phật đạo.

        Anh không bao giờ quên em cùng quý bác, quý anh chị em ở An Thái đã lặn lội
        xa xăm vào niệm Phật với anh.

        Anh Năm rất sung sướng và cảm động khi nghe em nói rằng tất cả quý bác sẵn
        sàng vào hộ niệm cho cha má anh khi cần.

        Anh rất tán thán ý kiến này, đây là tâm lượng Bồ-tát.

        Người tu hành chân chánh là vậy đó, khi đã biết được con đường giải thoát
        thì nên thành tâm phát nguyện cứu giúp người khác, bằng cách khuyên người
        niệm Phật, quyết tâm hộ niệm cho nhau, mong cho từng người được vãng sanh
        Tây-phương Cựclạc.

        Hãy chân thành để làm thì tự nhiên có sự cảm ứng.

        Cứu người không ngại khó khăn, không cần trả ơn, nghe được một người vãng
        sanh ta mừng như chính ta được vãng sanh vậy.'
