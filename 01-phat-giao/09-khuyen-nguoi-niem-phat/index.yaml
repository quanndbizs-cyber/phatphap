    - id: 1
      tap: 4
      global_idx: 68
      title: Mấy Dòng Tỏ Bày – Nhất Môn Thâm Nhập Trường Kỳ Huân Tu
      duration: 2664
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/68%20T4%20M%E1%BA%A5y%20D%C3%B2ng%20T%E1%BB%8F%20B%C3%A0y%20%E2%80%93%20Nh%E1%BA%A5t%20M%C3%B4n%20Th%C3%A2m%20Nh%E1%BA%ADp%20Tr%C6%B0%E1%BB%9Dng%20K%E1%BB%B3%20Hu%C3%A2n%20Tu.mp3
      video_url: https://www.youtube.com/watch?v=q7EafDm7hsw
      read_url: https://cusidieuam.com/2022/04/21/66-nhat-mon-tham-nhap-truong-ky-huan-tu/
      read_label: 📖 Xem bài gốc
      summary: 'Pháp môn niệm Phật là pháp rất khó tin, như trong kinh Phật nói là
        nan tín chi pháp!

        Chính vì thế, nói ra mà người ta không tin tưởng là chuyện thường tình, không
        có gì xa lạ.

        Nhưng một người nào đó vừa mới nghe nhắc đến câu A-di-đà Phật mà phát tâm
        tu hành, ngày đêm cố gắng chấp trì danh hiệu để niệm, một lòng cầu nguyện
        vãng sanh thì thật sự là đặc biệt, nhất định không thể là người tầm thường.

        Những người này trong quá khứ chắc chắn đã cúng dường vô số đức Phật mà chúng
        ta không biết.

        Chính nhờ thiện căn vô cùng lớn đó mới tạo tín tâm vào pháp môn một đời thành
        Phật này.

        Nói như vậy, để cho cô Lệ Tân cùng quý cô bác đang lập nhóm liên hữu ở thôn
        Cây Quân thấy rõ được rằng, nếu chân thành niệm Phật, chí kính lễ Phật, với
        đầy đủ niềm tin, tha thiết nguyện cầu vãng sanh, thì có thể biết được thiện
        căn của mình lớn lắm và xác định vị trí của từng người ở Liên Trì Hải Hội.

        Niệm Phật vãng sanh về Cực-lạc, dự phần ở ao sen thất bảo là điều chắc chắn,
        không thể sai lệch.

        Người nào quyết lòng theo đúng lời Phật dạy để tu hành, thì sự thành đạo ở
        ngay trong đời này.

        Diệu Âm xin thành tâm chúc mừng tất cả quý đạo hữu.

        Mấy vấn đề của cô Lệ Tân đưa ra khá thực tế, rất hữu ích.

        Diệu Âm sẽ cố gắng nêu ra đây một vài ý kiến cá nhân đã học hỏi được, rồi
        xin tùy duyên nhận xét, chứ không dám nhận lãnh tiếng chỉ bảo như cô Lệ Tân
        nói đâu.

        Vấn đề đầu tiên của cô Lệ Tân đưa ra có liên quan đến sự tụng kinh cầu an,
        cầu siêu, cầu tiêu tai giải nạn, tụng kinh báo hiếu mùa vu lan.'
