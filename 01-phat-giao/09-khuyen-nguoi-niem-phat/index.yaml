      summary: 'Tuổi trẻ mà khuyên họ buông xả thì khó lắm, vì tình trần còn đang
        lừng lẫy, tương lai còn đầy tham vọng thì làm sao buông xả được.

        Còn người khi tuổi đã về chiều, nhìn lại cuộc đời mới thấy như trò huyễn hóa,
        nên dễ đi về với đạo, dễ ngộ đạo hơn tuổi trẻ.

        Thế nhưng, trong gia đình mình mấy đứa em đã biến chuyển làm con mừng lắm.

        Em Thứ đã phát tâm niệm Phật, em An cũng đã bắt đầu phát tâm tu tập.

        Đây là hiện tượng cảm ứng rất tốt.

        Riêng gia đình cô Sáu có mấy người ăn chay trường, tu hành khá tốt.

        Cháu NgọcHiền, con của Ngọc đi xuất gia, đây là duyên lành khó kiếm và đáng
        quý.

        Huy-Hồng cũng đã phát tâm tu hành rất tinh tấn.

        Hôm trước ở đây có sư cô Diệu-Anh về Việt-Nam, con kêu tụi nó tới gặp Sư Cô,
        khi qua lại Úc, Sư Cô cho con biết là tất cả đều tinh tấn niệm Phật, An lúc
        nào cũng thầm niệm Phật, Hồng thì quyết tâm cầu về Tây-phương.

        Nghe nói như vậy, con sung sướng không còn gì hơn.

        Tất cả đều là duyên lành thiện căn phúc đức từ nhiều kiếp.

        Trong gia đình mình, nếu ai đọc được những thư này mà trực nhận thấy được
        con đường đi thì không còn gì quý hơn.'
    - id: 12
      tap: 1
      global_idx: 12
      title: Cụ Triệu Vĩnh Phương Vãng Sanh
      duration: 1092
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/12%20T1%20C%E1%BB%A5%20Tri%E1%BB%87u%20V%C4%A9nh%20Ph%C6%B0%C6%A1ng%20V%C3%A3ng%20Sanh.mp3
      video_url: https://www.youtube.com/watch?v=DbNGVJBfqy0
      read_url: https://cusidieuam.com/2022/04/21/khuyen-nguoi-niem-phat-quyet-long-niem-phat-01/
      read_label: 📖 Xem bài gốc
      summary: 'Trong thư này, như đã hứa từ thư trước, con sẽ kể cha má nghe chuyện
        một bà cụ chín mươi bốn tuổi vãng sanh lưu lại ngọc xá lợi.

        Vãng sanh là chuyện thường tình như những chuyện khác, giống như những cuộn
        băng và sách con gởi về cho cha má về niệm Phật vãng sanh lưu xá-lợi.

        Nhưng đặc biệt chuyện vãng sanh này đã được họ quay phim tại chỗ từ đầu tới
        cuối.

        Bà cụ không những lưu lại xá-lợi mà còn lưu lại cả đến “XÁ LỢI HÌNH PHẬT”,
        một hiện tượng rất hiếm có.

        Bà cụ ấy tên là Triệu-Vinh-Phương, người Trung-Hoa, bà bình tĩnh niệm Phật
        đến hơi thở cuối cùng, đến giây phút cuối cùng bà vẫn còn mở mắt nhìn tượng
        Phật A-di-đà trước khi từ từ nhắm lại ra đi.

        Hồi giờ nghe nói thì nhiều, ít khi nhìn thấy, khi đã nhìn thấy rõ ràng trước
        mắt, từng chi tiết một con không tránh khỏi ngạc nhiên về sự vi diệu của tiếng
        niệm Phật.

        Chính con đã từng nghe qua, từng niệm Phật, đã từng nhìn thấy rất nhiều hình
        chụp lại.

        Nhưng nhìn hình ảnh, đọc sách chỉ có cảm giác bình thường, còn thấy được hiện
        tượng đang diễn biến thật là cảm kích.

        Bà cụ Triệu-Vinh-Phương được cái phước đức to lớn là nguyên cả một đại gia
        đình đều tu Phật, hiểu Phật, đều niệm Phật, cho nên họ đã làm đúng theo như
        kinh Phật chỉ dạy.

        Bà biết được ngày giờ ra đi, ba ngày trước ngày vãng sanh con cháu đều tề
        tựu về cùng nhau hộ-niệm cho bà.

        Cuộc vãng sanh này được quay phim để lưu lại làm kỷ niệm.

        Vô tình cuộn phim đó được phổ biến rộng ra ngoài, Hội-Tịnh-tông họ làm thành
        VCD để phổ biến, nhờ thế mà con được coi.'
    - id: 13
      tap: 1
      global_idx: 13
      title: Hộ Niệm
      duration: 1259
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/13%20T1%20H%E1%BB%99%20Ni%E1%BB%87m.mp3
      video_url: https://www.youtube.com/watch?v=V8pU2qv0rJo
      read_url: https://cusidieuam.com/2022/04/21/khuyen-nguoi-niem-phat-phat-de-thanh-phat-02/
      read_label: 📖 Xem bài gốc
      summary: 'Cuộc đời một người rất ngắn ngủi, thân này chỉ một thoáng qua là đi
        vào hư không, trả về cát bụi, làm sao mà tồn tại trường thọ qua thời gian.

        Người tuổi trẻ nhìn thấy cuộc đời sáu bảy chục năm nữa tưởng là lâu lắm!

        Nhưng khi tuổi xế chiều mà không tính trước chuyện thoát thân thì thật là
        một điều sơ sót đáng tội nghiệp!

        Ai mà không muốn người thân yêu ở mãi với ta, nhưng khôn ngoan hơn một chút
        nữa, thì suy tính cho cuộc sống tương lai dài lâu mới là người trí huệ, liễu
        ngộ rốt ráo.

        Hôm qua là ta, hôm nay là ta và ngày mai cũng chính là ta, xin cha má cẩn
        thận.

        Trong phần thư trước con nói chuyện HỘ-NIỆM, đây là điều tối quan trọng cho
        một người muốn một đời này thoát khỏi đọa lạc.

        Vì trước giờ mình không học Phật, không hiểu Phật, không biết đâu là đường
        giải thoát, cho nên danh từ HỘ-NIỆM mới nghe cảm thấy lạ, còn người hiểu Phật
        pháp rồi thì họ rất chú trọng và đặc biệt quan tâm.

        Hộ-niệm cho người ra đi cần phải chuẩn bị về vấn đề tâm lý.

        Tâm lý của chính người ra đi, tâm lý của thân nhân con cái và người đến hộ
        niệm.

        Con xin nhắc đi nhắc lại với cha má là con người ai cũng có số phần cả, ngoài
        những người tu hành đạt được đạo cao, tự họ có thể đi hay ở tùy ý, còn tất
        cả đều đã được đặt để bởi định mệnh sẵn.

        Hộ-niệm hay không hộ-niệm thì năm, tháng, ngày, giờ, ra đi vẫn đúng như theo
        định số, khó thể thay đổi.

        Nói rõ thêm nữa, người không niệm Phật, hoặc có niệm Phật cầu về Tây-phương
        thì ngày bỏ xác thân trần tục của họ cũng không thay đổi, chỉ có khác nhau
        là người niệm Phật cầu sanh Tịnh-độ thì lúc lâm chung được an nhiên tự tại,
        tâm hồn bình tĩnh sáng suốt, không đau đớn, hoặc nếu có bị đau bệnh cũng được
        nhẹ đi rất nhiều, (đau bệnh là do nghiệp chướng của mình chưa phá nổi), và
        sau cùng cái quý báu nhất là được vãng sanh về thế giới Cực-lạc với Phật.'
