      video_url: https://www.youtube.com/watch?v=j6cD8YFPsz0
      read_url: https://cusidieuam.com/2021/08/27/khuyen-nguoi-niem-phat-8/
      read_label: 📖 Xem bài gốc
      summary: 'Sắp sửa có người về Việt-Nam, con gửi thư về thăm cha má cộng với
        mấy băng thuyết pháp, và mấy món quà nhỏ cho em Thứ niệm Phật.

        Trong anh chị em nhà mình đã có người nghe theo lời con khuyên vậy cũng là
        đại phước rồi.

        Em Thứ niệm Phật, em Thứ được hưởng thiện lợi, cha má niệm Phật cha má được
        hưởng thiện lợi.

        Ai tu nấy đắc, không ai tu giùm cho ai được cả.

        Cái lo lắng lớn nhất của con hiện giờ là cha má tuổi già sức yếu, viêïc tu
        hành giải thoát trở thành vấn đề tối cấp bách và quan trọng.

        Khi cha má nhận được một số băng thuyết pháp thì cố gắng nương theo đó tu
        tập, những thư này chỉ là cái mối đầu cho cha má tiếp nhận lời pháp thôi.

        Trong suốt thời gian qua con liên tục viết thư về cha má, cũng chỉ nhắm tới
        một chuyện là cố gắng khơi cho được cái đầu mối đó, để từ đó cha má đi vào
        con đường Phật đạo, pháp môn giải thoát.

        Khả năng của con nhiều lắm cũng chỉ giúp cha má thấy rõ cái đầu mối đó thôi,
        còn có ngộ nhập vào sự giải thoát hay không hoàn toàn tùy theo quyết tâm của
        cha má, chứ con không thể nào đi giùm cho cha má được.

        Nhận thư, con không biết cha má có giờ đọc không?

        Có nhận thấy được cái tầm quan trọng của nó không?

        Nếu càng đọc mà cha má càng cảm thấy vui, cảm thấy phấn khởi thì con mừng
        lắm, một ngày rất gần cha má sẽ thấy được sự an lạc vì tìm được nguồn sáng
        để đi.

        Còn nếu ngược lại, thì đó là do căn phần của cha má.'
