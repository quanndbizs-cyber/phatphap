    - id: 3
      tap: 3
      global_idx: 53
      title: Lời Khuyên Người Em Trai – Cảnh Giới
      duration: 2398
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/53%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Em%20Trai%20%E2%80%93%20C%E1%BA%A3nh%20Gi%E1%BB%9Bi.mp3
      video_url: https://www.youtube.com/watch?v=Q15ZzxiBPOc
      read_url: https://cusidieuam.com/2022/04/21/50-canh-gioi/
      read_label: 📖 Xem bài gốc
      summary: 'Anh đã viết cho hai em nói về sự khổ, nói về cách đọc tụng kinh, hy
        vọng nó giúp các em giải quyết được phần nào chướng ngại phải không?

        Hôm nay anh lại mở thư em ra đọc lại để đi đến vấn đề khó khăn khác.

        Những điều khó khăn này, nếu cho anh hay sớm hơn, thì có lẽ đến nay các em
        cảm thấy thoải mái và tự tại nhiều rồi, chứ đâu đến nỗi bây giờ mà “ em phải
        lần mò đi tìm từng chút ” có vẻ khó khăn dữ vậy.

        Tìm hiểu thì tốt, nhưng có lúc tìm được, có nơi không có tài liệu thì tìm
        đâu cho ra.

        Tìm không ra tức là “Cầu bất đắc khổ”.

        Đời đã là khổ lại còn đi cầu thêm cái khổ làm chi?

        Tục ngữ VN có câu, “đi một ngày đàng, học một sàng khôn”, cái khôn này do
        đi mà thấy, chứ không phải ngồi ở nhà tra cứu trong sách vở mà có đâu.

        Muốn tu sửa thì phải thực hành mới có ích lợi.

        Thôi anh bắt đầu trả lời tiếp những câu hỏi của em đây.

        Hỏi: Cửu pháp giới, tam đồ, lục đạo sanh tử luân hồi là gì?

        Trả lời: Cửu pháp giới là chín pháp giới.

        Chúng sanh ở trong lục đạo phải chịu chết-sống, sống-chết thường xuyên nên
        gọi là “Sanh tử”.'
    - id: 4
      tap: 3
      global_idx: 54
      title: Lời Khuyên Vợ Chồng Người Em – Cảnh Giới Người
      duration: 2234
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/54%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20V%E1%BB%A3%20Ch%E1%BB%93ng%20Ng%C6%B0%E1%BB%9Di%20Em%20%E2%80%93%20C%E1%BA%A3nh%20Gi%E1%BB%9Bi%20Ng%C6%B0%E1%BB%9Di.mp3
      video_url: https://www.youtube.com/watch?v=gRVoL5xx3uw
      read_url: https://cusidieuam.com/2022/04/21/51-canh-gioi-nguoi/
      read_label: 📖 Xem bài gốc
      summary: 'Hiểu về cảnh giới giúp cho ta có cái nhìn tổng quát về vũ trụ nhân
        sinh, khỏi mập mờ chạy theo những chốn hiểm nạn, thấy được rõ ràng đường đi
        cho tương lai.

        Nên đi về những cảnh giới thiện.

        Hãy tránh xa những cảnh giới ác.

        Đối với địa ngục thì cảnh ngã quỉ là thiện, đối với ngã quỉ thì cảnh súc sanh
        là thiện, đối với súc sanh thì cảnh giới người là thiện.

        Chúng ta đang ở trong một cảnh giới thiện là người, nhưng cái thiện của cảnh
        giới người chỉ so sánh được đối với loài súc sanh, loài ngã quỉ, với các loài
        chúng sanh đã bị rơi vào địa ngục mà thôi, chứ không thể so bì được với các
        cảnh giới cao hơn!

        Do đó, tu hành mà không thể vượt lên khỏi cảnh người thì khó trốn thoát khổ
        nạn.

        Đã là người, lại tu hành để thành người, thì cuộc đời này có tu mà không có
        tiến, sự chuyển hóa đành phải giậm chân tại chỗ!

        Vạn sự vạn vật luôn luôn tiến hóa.

        Cảnh giới của vũ trụ nhân sinh chuyển biến không ngừng.

        Thì trong dòng nhân sinh này con người phải biết lèo lái con thuyền huệ mạng
