    - id: 1
      tap: 3
      global_idx: 51
      title: Lời Giới Thiệu
      duration: 1609
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/51%20T3%20L%E1%BB%9Di%20Gi%E1%BB%9Bi%20Thi%E1%BB%87u.mp3
      video_url: https://www.youtube.com/watch?v=8-gDz9GAe2s
      read_url: https://cusidieuam.com/2022/04/21/49-quyen-3-tam-chi-thanh-kinh/
      read_label: 📖 Xem bài gốc
      summary: 'Tâm chí thành, chí kính tự nó tạo ra công đức.

        Chư Tổ dạy, một phần thành kính được một phần công đức, mười phần thành kính
        được mười phần công đức.

        Nhất thiết phải có tâm thành kính mới thâm nhập vào Phật đạo, mới khai ngộ
        được chơn tánh.

        Người không có tâm thành kính Phật Bồ-tát thì dù cho có thông minh, tài cao,
        là trượng phu quân tử hay anh hùng hào kiệt, thì nhiều lắm cũng chỉ là sự
        thành công trong thiện pháp của thế gian mà thôi!

        Nghĩa là, đường thiện có thể đi, nhưng luân hồi sanh tử chắc chắn khó thoát
        khỏi!

        Kính gởi quí đạo hữu Niệm Phật Đường An Thái và Như Ngọc,

        Hôm trước có nhận được một số hình chụp quí bác và anh chị em đang niệm Phật.

        Những tấm hình này quí lắm, một kỷ niệm thật thân thương.

        Nhìn thấy quí đạo hữu tinh tấn tu hành ai cũng phải khen.

        Với một niệm Phật đường nho nhỏ, phương tiện thì eo hẹp, nhưng thấy mọi người
        đều có sắc diện nghiêm trang, kính cẩn, tay chuỗi, tay chắp, chí tâm niệm
        Phật thật là cảm phục.

        Trong những thư trước viết cho Như Ngọc, cho quí bác, hôm nay xin viết về
        thăm chị Sáu, anh Ba, anh Hai, v.v Nói chung Diệu Âm này không dám quên một
        người nào hết.

        Chỉ vì đồng tu nhiều quá không thể nào viết đến từng người.'
