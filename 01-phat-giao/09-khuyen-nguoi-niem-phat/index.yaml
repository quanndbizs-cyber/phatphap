        đây cũng là một cơ duyên hiếm có.

        Anh phát hiện được cái thậm thâm vi diệu của Phật pháp, cái sự thật của vũ
        trụ nhân sinh, cho nên anh tha thiết khuyên em, cùng tất cả giòng họ mình,
        bà con trong làng xóm, tất cả mọi người, hãy mau mau tỉnh ngộ, nhất là những
        người lớn tuổi với tháng ngày mong manh còn sót lại, hãy nên niệm Phật cầu
        sanh Tịnh-độ, đây là phước đức lớn vô tận.

        Thơ này phần đầu anh nói cho em vài lý đạo thật căn bản của Phật học.

