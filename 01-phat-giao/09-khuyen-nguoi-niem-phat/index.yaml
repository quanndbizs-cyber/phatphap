      summary: 'Niệm Phật bất khả tư nghì!

        Trước đây chị chỉ nghe nói sự vi diệu của pháp niệm Phật, chứ chắc chưa từng
        thấy qua.

        Nay chính người mẹ đã vãng sanh, chị đã thấy được tận mắt những hiện tượng
        bất khả tư nghì.

        Phải chăng đây là một bài hiện thân thuyết pháp, làm cho chị cùng gia đình
        tăng trưởng niềm tin vào pháp niệm Phật.

        Xin thành tâm chúc mừng cho chị, chúc mừng cho cả gia đình và thành kính chúc
        mừng cho Bác.

        Nguyện cầu hương linh Bác vãng sanh cao phẩm, sớm ngày trở lại cõi Ta-bà cứu
        độ chúng sanh.

        Phật nói: Bất khả dĩ thiểu thiện căn phước đức nhân duyên đắc sanh bỉ quốc.

        Người ít thiện căn, ít phước đức, ít nhân duyên không thể nào được vãng sanh
        về thế giới Tây-phương Cực-lạc của đức Phật A-di-đà.

        Nghĩa là, vãng sanh được về thế giới Cực-lạc không phải là chuyện dễ.

        Nhiều người tu hành lâu năm, khổ cực dụng công, sức tu tập thật giỏi, nhưng
        cuối cùng chưa chắc đã biết đâu là chỗ quy hướng tối thắng.

        Thế mà, Bác vừa được vãng sanh, Bác đã hưởng được một đại thiện căn, đại phước
        đức, đại nhân duyên.

        Cái thiện căn phước đức này mấy ai sánh bằng?'
