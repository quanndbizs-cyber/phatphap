      summary: 'Thư gởi đạo hữu Tâm Minh, cùng quí liên hữu Tịnh Thư Quán!

        Thành thật cảm ơn rất nhiều về một số disc DVD, MP3, VCD pháp của đạo hữu
        Tâm Minh gởi tặng.

        Diệu Âm cũng có chung một tâm nguyện với quí liên hữu, cố gắng ấn hành những
        băng đĩa khuyến tu niệm Phật.

        Thời mạt pháp này mà rời câu A-di-đà Phật, thì chúng ta không còn có hy vọng
        nào khác để thành tựu chánh quả.

        Đã lỡ vô ý chịu trầm luân khổ nạn vô lượng kiếp qua rồi, nay cơ duyên thành
        Phật đã đến, xin quí liên hữu hãy một lòng trì giữ câu A-di-đà Phật để một
        đời này được vãng sanh thành Phật.

        Sự hoạt động của đạo hữu cùng anh chị em Tịnh Thư Quán đã đem lại rất nhiều
        tiện ích thiết thực trong việc truyền bá pháp Phật, nhất là xiển dương pháp
        môn Tịnh độ cho người Việt Nam.

        Anh chị em đã làm một công việc vì lợi ích chúng sanh, vì Phật pháp trường
        tồn, chắc chắn sẽ được chư Phật Bồ-tát gia trì.

        Riêng Diệu Âm thì thành thật cảm kích và khâm phục.

        Mong anh chị em cố gắng hoạt động mạnh mẽ để người Việt Nam khắp thế giới
        được sự nương nhờ.

        Chúng ta mỗi người góp một tay lưu truyền đạo pháp, giúp người vãng sanh.

        Cầu nguyện cho tất cả quí anh chị em trong một báo thân này đều thành tựu
        đại nguyện.

        Cuối năm 2006 đầu năm 2007, Diệu Âm về Việt Nam thời gian ba tháng.'
