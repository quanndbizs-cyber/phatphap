      summary: 'Tu hành phải vạch ra mục đích rõ ràng.

        Nhờ có mục đích sẵn ta mới khỏi bị lạc đường, tâm ta mới khỏi vướng mắc những
        cám dỗ hoặc trở ngại trên đường tu tập.

        Thường sự thất bại không phải ở những sự cố lớn mà chính là những trở ngại
        âm thầm, vô hình tướng trong tâm.

        Thông thường người ta cho những sự hao mất tiền bạc, gặp tai nạn, bị bệnh
        hoạn là lớn, chứ thực ra đây chưa phải là lớn lắm đâu.

        Cái chuyện thực sự lớn, vô cùng lớn, chính là sự đọa lạc hàng triệu kiếp mà
        mình không hề biết tới.

        Vì không biết đường thoát thân, tâm tâm cứ dính chặt trong tam đồ lục đạo,
        sanh tử luân hồi để chờ nhận lãnh nghiệp báo.

        Đây mới chính là chuyện lớn cần phải được chú ý cho kiếp nhân sinh.

        Nhân thiện quả thiện, nhân ác quả ác.

        Tu hành là thiện pháp, chắc chắn được thiện quả, nhưng khi bắt đầu tu hành
        thì đầu tiên là không tạo ác duyên mới, không có ác nghiệp mới, chứ đâu phải
        dễ dàng xóa được nghiệp chướng cũ, nợ cũ đã được kết tập từ vô lượng kiếp
        đến nay.

        Định luật nhân quả là có nợ có trả.

        Như vậy dù tu hay không tu, nợ nần chúng ta đều phải thanh toán.

        Chỉ có khác nhau một điều, người không biết tu hành thì nghiệp duyên dai dẳng,
        nghiệp chướng chất chồng, nghiệp báo bất tận.'
    - id: 21
      tap: 2
      global_idx: 47
      title: Lời Khuyên Người Em – Khổ Tứ Diệu Thánh Đế
      duration: 2492
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/47%20T2%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Em%20%E2%80%93%20Kh%E1%BB%95%20T%E1%BB%A9%20Di%E1%BB%87u%20Th%C3%A1nh%20%C4%90%E1%BA%BF.mp3
      video_url: https://www.youtube.com/watch?v=GclWZYv1Y9g
      read_url: https://cusidieuam.com/2022/04/21/45-kho-tu-dieu-thanh-de/
      read_label: 📖 Xem bài gốc
      summary: 'Gởi vợ chồng em Đường – Thạnh,

        Đọc thư em, anh cảm nhận được cả vui lẫn buồn, anh rất thông cảm hoàn cảnh
        của hai em.

        Thư này anh viết cho cả hai em cùng đọc để từ từ thấm lần vào Phật pháp.

        Tất cả những câu hỏi của em, chắc chắn anh sẽ lần lượt trả lời rõ ràng.

        Anh rất thường viết thư trả lời thắc mắc, khuyên người tu tập, nhưng những
        cái căn bản nhất anh lại quên, ít bao giờ để ý tới.

        Từ nay có gì thắc mắc cứ tiếp tục hỏi, phải hỏi liền để hiểu, hỏi để em hiểu,
        hỏi cho anh khôn ra.

        Đây là sự thực, chứ không nên nghĩ rằng: “ Chẳng lẽ một chút cũng viết thư
        hỏi.

        Đây cũng là điều bất tiện ”.

        Nhiều người cứ mãi lo nghĩ đến chuyện “sông sâu, biển rộng”, có ngờ đâu lại
        bị vấp ngã chỉ vì một “lỗ chân trâu”.

        Em nên nhớ, một sự nghi ngờ nhỏ nếu không giải tỏa nó sẽ trở thành chướng
        ngại lớn, có thể phá tan sự nghiệp hay bẻ gãy cái ý nguyện tốt đẹp ban đầu
        của mình chứ không phải thường đâu.

        Đừng bao giờ nghĩ rằng những thắc mắc của mình là nhỏ, không mấy quan trọng.

        Ngược lại, cũng đừng bao giờ tự cho mình là người thông minh hiểu rộng.'
    - id: 22
