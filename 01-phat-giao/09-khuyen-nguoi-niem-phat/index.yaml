      summary: 'Con vừa mới hay được tin là em Chương, con cô Sáu ở Bình-Dương, thay
        mặt Cô Sáu cùng tất cả anh chị em trong gia đình, xuống Sài-Gòn gặp An để
        bàn việc cấp dưỡng cho cha má để cha má an tâm tu hành.

        Nghe được tin này, con vô cùng cảm động và thật sự tán thán công đức của Cô
        và tất cả các em.

        Có lẽ đây là niềm an ủi rất lớn cho cha má trong tuổi về già.

        Hay được việc các em ở Bình-Dương đã phát tâm cúng dường cho cậu mợ Hai an
        tâm niệm Phật, con lại nghĩ đến một điều khá hay!

        Trong thư trước, con nói đến “Phật tại môn trung, hữu cầu tất ứng”.

        Con viết vừa xong thư đó thì thì hay được tin này.

        Sự ứng cảm của Phật, Bồ-tát đa hình, đa dạng, vô hình, hữu hình, hiện thực,
        vô thực khó có thể lường biết được.

        Đây là một phước đức mà chỉ có người thực tâm tu hành mới cảm thọ được.

        Thưa cha má, cái phước từ đâu mà có?

        Chư Tổ dạy rằng, một lòng nhất tâm niệm Phật, thì một câu Nam-mô A-diđà Phật
        có thể phá được tám mươi ức kiếp nghiệp chướng trọng tội.

        Nói cách khác, một câu chí tâm niệm Phật có một công đức, phước báu, lớn bằng
        tám mươi ức kiếp làm lành.

        Đây là một công đức mà chư Phật gọi là “bất khả tư nghì”, nghĩa là không thể
        bàn luận được, không thể giải thích được.'
