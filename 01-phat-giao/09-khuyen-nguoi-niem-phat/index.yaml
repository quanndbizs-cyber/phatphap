      read_label: 📖 Xem bài gốc
      summary: 'Tu hành mà hiểu thấu được Phật pháp thì thấy lý thú, vững lòng tin,
        tinh tấn tiến bước.

        Mỗi lá thư, đầu tiên con đều nói một chút lý đạo.

        Cho nên, nếu đọc nhiều thư của con cũng thấy vui với nguồn đạo, thấm lần vào
        Phật pháp.

        Còn phần sau của thư thường con nói đến những điểm cụ thể cần thực hiện, cần
        cho cha má và cũng cần cho những ai muốn niệm Phật cầu sanh về Tịnh-độ.

        Con biết được hoàn cảnh của cha má, anh chị em, bà con, cô bác ở quê nhà rất
        khó khăn để nghe được Phật pháp, thành ra con phải dùng cách này để từng bước
        giải bày.

        Xin cha má cố gắng đọc kỹ.

        Cha hoặc má hãy bảo con cháu mỗi người thay phiên nhau đọc cho cha má nghe.

        Điều này rất có lợi vì nhờ vậy mà con cháu cũng hiểu được đạo, cũng có thể
        cùng phát tâm tu hành ..

        nhứt là người nào chưa tin Phật pháp thì cha má cứ nhờ đọc nhiều lần, biết
        đâu cha má cứu được người đó.

        Hễ cha má thích con cháu đọc thì con cháu cũng thích đọc cho cha má nghe,
        hễ có đọc thì có cơ hội hiểu.

        Nếu khuyến khích con cái trong nhà đều niệm Phật thì chính cha má đã tạo được
        một công đức lớn.

        Nhờ đó mà thiện căn của chính mình tăng trưởng, và cái lợi ích thiết thực
        nhất là khi lâm chung mình đã có một số người hùng hậu vây quanh để hộ-niệm
        bảo vệ mình, có vậy mới tránh được cái nạn oán thân, trái chủ.'
    - id: 21
