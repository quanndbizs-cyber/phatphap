      summary: 'Hôm trước con mới nhận được thư cháu Tuyết con chị hai, cháu nói bà
        nội cháu yếu rất nặng khó có thể qua khỏi.

        Bác trong thời gian chờ ngày ra đi đã nghe lời khuyên phát tâm ngày đêm niệm
        Phật.

        Nghe như vậy con mừng lắm vì đây là cơ may hiếm có của bác, do thiện căn phúc
        đức lớn nên cuối đời có người đến chỉ con “ Đường-Về Cực-lạc”.

        Nếu bác đã tin tưởng đã phát tâm dũng mãnh, biết buông xả tất cả để niệm Phật
        cầu sanh Tịnh-độ thì cơ hội để cho bác hưởng một đại phúc báu vô cùng vô tận
        cho một đời người, khó có ai so sánh được.

        Chắc đến giờ này thì cha má đã nhận được cuộn video “Hoa-Khai Kiến-Phật”,
        cuộn phim quay cuộc vãng sanh của cụ Triệu-Vinh-Phương rồi.

        Xin cha má hãy coi đi coi lại thật kỹ câu chuyện đó để thấy được sự tối linh
        nghiệm của pháp tu niệm Phật.

        Cuộn phim này là cả một bài pháp sống thực, một bài “hiện thân thuyết pháp”
        cho những ai còn mập mờ trên con đường tu hành.

        Xin cha má hãy trân trọng suy nghiệm.

        Đến đây thì coi như con đã hoàn tất được một đoạn đường quan trọng những gì
        con muốn nói với cha má.

        Đầu tiên khi vừa phát hiện một sự thật quý báu là con đường vãng sanh Tây-phương
        Cực-lạc, con đường giải thoát trọn vẹn mà đức Thế-Tôn đã để lại cho chúng
        sanh, con bắt đầu viết thư cho cha má hay liền.

        Con mau mắn viết thư đến nỗi nhiều lúc làm cha bực mình, nhưng thực ra tâm
        của con cũng chỉ một lòng lo lắng cho cha má, con sợ chỉ cần chậm trễ một
        chút là ngàn đời ân hận.

        Người phát tâm niệm Phật dũng mãnh cầu sanh về cõi Phật thì có thể thành tựu
        con đường giải thoát ngay trong một đời này.'
    - id: 15
      tap: 1
      global_idx: 15
      title: Cần Cẩn Thận Lúc Lâm Chung
      duration: 2378
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/15%20T1%20C%E1%BA%A7n%20C%E1%BA%A9n%20Th%E1%BA%ADn%20L%C3%BAc%20L%C3%A2m%20Chung.mp3
      video_url: https://www.youtube.com/watch?v=vCdWGVngoMc
      read_url: https://cusidieuam.com/2022/04/21/khuyen-nguoi-niem-phat-tap-03-niem-phat-cau-dat-den-dinh-cao/
      read_label: 📖 Xem bài gốc
      summary: 'Thế giới trong tương lai có thể sẽ xảy ra nhiều tai ương hiểm nạn
        kinh khủng lắm, cường độ có thể khó tưởng tượng chứ không phải tầm thường!

        Muốn cứu vãn phần nào tình thế này không còn cách nào khác hơn là khuyên người
        tu hành cho nhiều, nhờ đó mà xoay chuyển phần nào cái khổ nạn xã hội.

        Nhưng cứu người không những chỉ thoát khỏi vài cái tại nạn thiên nhiên, hoặc
        sống sót sau vài cuộc chiến tranh là đủ đâu.

        Vì nghiệp chướng vẫn còn đó, làm sao con người tránh khỏi nghiệp báo?

        Giảm nạn thế gian là sự ảnh hưởng tự nhiên của việc tu hành, còn cứu độ chúng
        sanh vượt qua được tam giới để vãng sanh Tây-phương mới là điểm chính yếu.

        Hôm Tết nói chuyện được với cha má và anh chị Ba, biết được tất cả đều có
        niệm Phật làm con mừng lắm.

        Giác ngộ cuộc đời sớm chừng nào hay chừng đó, đừng để quá trễ tràng thì không
        còn cứu kịp nữa đâu.

        Nhưng qua điện thoại, con lại phát hiện một vấn đề khá quan trọng mà con không
        dám không nói.

        Đó là chuyện: có người niệm Phật vãng sanh, có người niệm suốt cuộc đời cũng
        không được vãng sanh.

        Mới đây có một Phật tử hỏi thầy Ngộ-Thông như vầy: “Thưa thầy, con cũng quyết
        tâm niệm Phật và cầu vãng sanh, nhưng điều kiện để được vãng sanh Tây-phương
        Cực-lạc là khi lâm chung phải được tỉnh táo và niệm cho được mười câu Phật
        hiệu.

        Con thấy một trăm người chết người nào cũng mê man bất tỉnh hoặc quằn quại
        đau đớn ra đi, thì làm sao niệm Phật được.

        Điều này làm cho con lo lắng vô cùng và nhiều lúc thấy chán nản, vì làm sao
        biết mình sẽ được may mắn, không bị mê man khi ra đi đây?”.'
    - id: 16
      tap: 1
      global_idx: 16
      title: Sân Giận Đường Về Địa Ngục
      duration: 1990
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/16%20T1%20S%C3%A2n%20Gi%E1%BA%ADn%20%C4%90%C6%B0%E1%BB%9Dng%20V%E1%BB%81%20%C4%90%E1%BB%8Ba%20Ng%E1%BB%A5c.mp3
      video_url: https://www.youtube.com/watch?v=aISGnE_mt7E
      read_url: https://cusidieuam.com/2022/04/21/tap-16-san-gian-duong-ve-dia-nguc/
      read_label: 📖 Xem bài gốc
      summary: 'Thực tế mà nói, nếu hiểu được đạo pháp rồi thì mới thấy rằng cuộc
        đời mình hoàn toàn tự mình lựa chọn tương lai, mình muốn đi đâu, muốn sướng
        hay khổ, muốn giải thoát hay đọa lạc đều do chính mình tạo ra cả mà mình không
        hay.

        Ngay cả cái vận mạng của mình cũng là do chính mình tạo lấy, cho nên nếu biết
        cách tu hành thì có thể cải đổi vận mạng được như thường.

        Đây là sự thật, chắc chắn thật.

        Ví dụ, như người tạo tội ác phải đọa địa ngục, chắc chắn phải đọa vào địa
        ngục thiên thu vạn kiếp, nay nếu biết hồi đầu cải sửa vẫn có thể thoát nạn
        và được vãng sanh về tới Tây-phương Cực-lạc.

        Đây là lời kinh Phật nói ..

        Thưa cha má, thà mê mờ không biết thì đành chấp nhận rủi may, chứ khi đã biết
        được đường đi, biết được chân tướng sự thật của vũ trụ nhân sinh thì quyết
        định con đường thoát thân phải đi, đi cho đúng, cho vững, đừng đi quờ quạng
        mà uổng phí một đời luống qua.

        Thời khóa tu hành sắp sẵn không có chỗ hở, nhưng con cũng đã tự phát nguyện
        niệm Phật thêm để cầu cho thế giới hòa bình, chúng sanh khỏi nạn Hằng ngày,
        con đều hồi hướng công đức cho cha má, nguyện cầu cho cha má sớm thức tỉnh
        đường đạo, dũng mãnh tinh tấn niệm Phật cầu sanh Tịnh-độ.

        Con thành tâm động viên cha má hãy vững lòng tin tưởng pháp môn niệm Phật.

        Cha má tin lời Phật, vững lòng phát nguyện cầu vãng sanh Tây-phương, một hướng
        chuyên tâm niệm Phật, và chỉ có niệm Phật thôi, thì con tin chắc chắn cha
        và má sẽ được vãng sanh.

        Tất cả anh chị em, bà con xa gần, ai phát được lòng tin vững chắc, cứ y theo
        lời thư con tu hành thì ai cũng đắc được thiện lợi, một cái thiện lợi có giá
        trị bằng triệu kiếp tu hành, bằng vạn đời cực khổ lao nhọc, vĩnh viễn khỏi
        bị đọa lạc, vô tận thời gian an vui cực lạc chứ không phải nhỏ, xin chớ xem
        thường.

        Cho nên, muốn giải thoát được chỉ có niệm Phật, niệm Phật phải chí tâm, chí
        tâm là nhứt tâm, nhứt tâm là không được xen tạp, xen tạp là vừa niệm Phật
        mà còn ôm đồm những cách tu hành khác, xen tạp là đi sai pháp môn, đi sai
        pháp môn thì trở thành pháp tu tự lực, tự lực là tự mình bỏ rơi sự gia trì
        của 48 đại nguyện của Phật A-di-đà.

        Không có sự gia trì của 48 đại nguyện, thì trong thời đại mạt pháp này khó
        có thể thoát nạn.'
    - id: 17
      tap: 1
      global_idx: 17
      title: Địa Ngục Ở Đâu
      duration: 1294
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/17%20T1%20%C4%90%E1%BB%8Ba%20Ng%E1%BB%A5c%20%E1%BB%9E%20%C4%90%C3%A2u.mp3
      video_url: https://www.youtube.com/watch?v=tfZAAZYCQUs
      read_url: https://cusidieuam.com/2022/04/21/17-dia-nguc-o-dau/
      read_label: 📖 Xem bài gốc
      summary: '“Cuộc đời như áng mây trôi, khi tan, khi hợp, đổi thay không thường”,
        hãy cố gắng tu hành, quyết thoát ly sinh tử, khổ nạn.

        Đừng chần chờ đừng do dự mà mất cơ hội ngàn vàng khó mua này.

        Tu hành pháp môn nào cũng được, đạo nào cũng được, cũng tốt cả.

        Nhưng tu với mục đích quyết giải thoát thì cần nghiên cứu cho kỹ vì không
        phải pháp môn nào cũng dễ đưa đến giải thoát được đâu.

        Trong nhà Phật với tám mươi bốn ngàn pháp môn đã bao trùm tất cả mọi phép
        tu, mọi tôn giáo xuất hiện trên thế gian, khó có một chánh pháp nào lọt ra
        khỏi trong tám mươi bốn ngàn pháp đó.

        Trong đó, đặc biệt Pháp “Niệm Phật” là pháp thù thắng trong tất cả pháp thù
        thắng, là vì không những có khả năng đưa một chúng sanh vượt qua tam giới,
        thoát khỏi luân hồi lục đạo mà còn vãng sanh Tây-phương Cực-lạc Thế-giới để
        một đời thành Phật.

        Nếu hiểu thấu được pháp giới thì mới thấy đây là một chuyện bất khả tư nghì,
        với trí con người không thể nào hiểu tới.

        Đã là thân phận con người ai cũng phải chịu cái khổ “Sanh, Lão, Bệnh, Tử”,
        nhưng người biết chí thành niệm Phật cầu sanh Tây-phương thì thoát được chữ
        “TỬ” này.

        Trong kinh Luận, chư Tổ sư Phật giáo gọi đây là “Pháp Môn Bất Tử”.

        Người được vãng sanh Tâyphương không phải là chết mà họ vẫn tiếp tục sống,
        họ chỉ chuyển thân từ nhục thân thành liên hoa hóa thân.

        Hòa Thượng Tịnh Không nói rõ rằng, vãng sanh không phải là chết rồi mới vãng
        sanh mà đang sống họ đi vãng sanh, tức là họ tự liệng thân xác lại trong lúc
        vẫn còn đang sống để đi theo Phật và tiếp tục sống trong một cảnh giới hoàn
        toàn khác tốt đẹp, vi diệu, thần thông biến hóa tự tại tối thắng phi thường
        và tất cả những sự việc trong đời họ vẫn còn biết rõ rệt.

        Không những thế bắt đầu từ đó họ còn biết luôn cả vô lượng kiếp về trước họ
        đã từng làm gì, tu hành như thế nào, kiếp nào bị đọa, kiếp nào cao sang.'
