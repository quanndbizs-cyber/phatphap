      read_url: https://cusidieuam.com/2022/04/21/40-buong-xa-niem-phat-vang-sanh/
      read_label: 📖 Xem bài gốc
      summary: 'Khi nhận được thư này thì em hãy liên lạc ngay với An để nhận những
        cuộn video giảng pháp của HT Tịnh-Không, rất quý, trong đó có một cuộn có
        tựa đề là “Hoa Khai Kiến Phật”, chính là cuộn “Triệu Vinh Phương lão cư sĩ
        vãng sanh lục ảnh”.

        Cuộn phim này quay tại chỗ sự việc bà cụ Triệu Vinh Phương niệm Phật vãng
        sanh năm 1999 tại Trung Quốc.

        Chắc em đã nghe được rồi trong những thư khác của anh phải không?

        Theo anh Năm nghĩ, người nào coi được cuộn video này là đã có nhiều duyên
        lành lắm đó.

        Không dễ gì coi được tận mắt cảnh “thế nào là Vãng Sanh về Tây-phương Cực-lạc”
        đâu, vì không dễ gì mà có người chịu cho quay phim hay chụp hình lúc họ đang
        vãng sanh.

        Vào thời điểm quan trọng nhất của cuộc đời tu hành, không ai dám sơ ý làm
        vọng động đến thần thức đang vãng sanh, nhưng ở đây gia đình đã biết chắc
        chắn cụ Triệu được vãng sanh mới cho con cháu quay lại tại chỗ, vô tình cuộn
        phim này đã trở thành bảo vật cho những ai tu Phật, là bằng chứng rõ rệt chứng
        minh cụ thể những lời Phật dạy trong kinh không sai một chút nào.

        Chắc chắn là thực, và đây cũng để trả lời cho những ai còn đặt câu hỏi.

        Hẳn nhiên rất nhiều người được vãng sanh, mỗi người vãng sanh một kiểu, nhưng
        tựu trung đều có những điểm giống nhau như: biết trước ngày giờ ra đi, tỉnh
        táo niệm Phật tới hơi thở cuối cùng, thấy Phật A-di-đà đến tiếp dẫn, Phật
        quang chiếu xúc, hương thơm bay ra, hiện ra tướng lành, đôi khi để lại xá
        lợi, v.v Tất cả những hiện tượng này đều được Phật nói rõ ràng trong các kinh
        A-di-đà, Quán Vô Lượng Thọ, Niệm Phật Ba-la-mật, và nhất là kinh Vô-Lượng-Thọ.

        Tại Niệm Phật Đường ở đây cũng vừa nhận được một tin vãng sanh nữa, đó là
        phụ thân của ông thư ký trong Hội Niệm Phật ở Sydney, mới vãng sanh vào ngày
        30/5/2001.

        Đó là cụ Trần Văn Lâm, họ vừa chụp hình dán trên bảng với rất nhiều ngọc xá
        lợi màu xanh lục.

        Nên nhớ xá lợi và ngọc xá lợi khác nhau.

        XÁ LỢI là xương, thịt, máu… tựu cứng rắn lại như ngọc thạch nhưng chưa thành
        viên ngọc, còn NGỌC-XÁ-LỢI thì đã biến thành tròn như viên ngọc, láng như
        ngọc thạch bằng hạt gạo, hạt đậu, hạt bắp v.v Cụ Trần Văn Lâm, trên hình chụp
        để lại có cả hai thứ, anh thấy rất nhiều xá lợi đã biến thành viên ngọc cho
        nên anh gọi là NGỌC-XÁ-LỢI.'
