      summary: 'Tuổi già không có gì cần thiết hơn là cố gắng tinh tấn tu hành để
        tìm phương giải thoát.

        Nhà cửa chắc đã khởi công, tiền bạc chắc cũng đã tạm ổn.

        Nơi thờ phụng ông bà chắc cũng sẽ được khang trang.

        Đây là cơ hội cho cha má yên tâm rũ sạch mọi sự bận bịu để lo niệm Phật tu
        hành.

        Cha hãy giao cho anh chị em nào đó trông coi, chăm sóc việc nhà, chứ cha má
        không nghe theo lời con, cứ lăng xăng vào mấy thứ vặt vãnh thì rốt cuộc không
        làm được gì cả, mà cuộc đời của cha với má cũng không ai cứu nổi nữa đâu.

        Trăm ngàn lần con tha thiết xin cha má hãy nghe lời con, mau mau phát tâm
        niệm A-di-đà Phật, đừng chần chờ nữa.

        Ngày cha má ra đi, cha má không thể nào mang theo cái nhà Từ-Đường gì đó đâu.

        Tiếng khen chê của hàng xóm không cứu được mình ra khỏi địa ngục, không ai
        tới nhà lao chịu khổ giùm cho mình, chịu đau giùm cho mình, chịu rên siết
        giùm cho mình đâu cha má ạ.

        Nếu cha má không chịu tu hành, thì coi như lòng hiếu thảo của con xưa nay
        đã tràn, đã đủ rồi!

        Bây giờ có cấp dưỡng cho cha má ăn uống no say cũng chỉ tạo thêm nghiệp khổ
        cho cha má chứ không ích gì.

        Con quyết chí, đường con vạch ra con sẽ đi.

        Lúc đó cha má khó có thể liên lạc được với con nữa.'
