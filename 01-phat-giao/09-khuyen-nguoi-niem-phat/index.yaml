    - id: 19
      tap: 1
      global_idx: 19
      title: Tu Hành Ví Như Thi Cử
      duration: 2134
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/19%20T1%20Tu%20H%C3%A0nh%20V%C3%AD%20Nh%C6%B0%20Thi%20C%E1%BB%AD.mp3
      video_url: https://www.youtube.com/watch?v=SfPUofV4MZU
      read_url: https://cusidieuam.com/2022/04/21/18-tu-hanh-vi-nhu-thi-cu/
      read_label: 📖 Xem bài gốc
      summary: 'Khi hiểu được đạo pháp mới thấy tu hành cần phải cẩn thận, sơ hở một
        tí có thể chuyển xoay họa phước, hễ đúng thì phước, lệch thành ra họa.

        Vì thế nên người tu thì nhiều mà đắc thì ít.

        Cái khó nhứt là vì thời này đã mạt pháp rồi, tâm con người bị hoàn cảnh vật
        chất chi phối quá nhiều.

        Tâm trí bị ô nhiễm thành ra ai ai cũng thích chạy theo ảo vọng, ít ai lo chuyện
        giải thoát.

        Những người già cả, lớn tuổi, lụm cụm họ cảm nhận được sự hão huyền của kiếp
        người mới thấy mối tu đạo ló dạng.

        Nhưng tu hành lại quá khó, sơ hở là phạm luật, phạm giới, cho nên nếu mình
        thực sự muốn thành tựu đạo quả thì phải để tâm chú ý, chứ không nên tự mạn
        cho rằng mình đã thành công, đã có nhiều công đức.

        Như cha má thấy, tu hành trọn đời chỉ cần một lần sân giận, nóng nảy là tất
        cả công phu đều bị tiêu hủy sạch trơn, bảy tám mươi năm tu tập trở thành số
        không mà người đó không hay, cứ đinh ninh là mình tu hành ngon lành, hơn nhiều
        người khác.

        Cái ngạo mạn nó đóng kín tâm trí lại làm cho họ tự đâm đầu vào ngõ cụt mà
        không hay.

        Còn hại hơn thế nữa, cứ một lần giận dữ thì lại cấy vào tâm thức mình một
        chủng tử địa ngục, khó gỡ ra được.

        Chủng tử địa ngục trong tâm nhiều hơn các thứ khác thì mình sẽ bị thọ báo
        ở địa ngục chứ làm sao tránh khỏi.

        Người tu hành cần ghi nhớ điều này, đừng bao giờ sanh tâm kiêu mạn.

        Chính Ngài Ấn-Quang Đại sư, vị Tổ thứ mười ba của Tịnh-độ Tông Trung-Hoa,
        một vị đại tôn sư mà lúc nào cũng tự nhắc nhở rằng công phu của mình còn kém.'
    - id: 20
