      summary: 'Kính gởi các cô bác đồng tu,

        Xin tiếp tục vấn đề hộ niệm khó hay dễ.

        Có người cho rằng hộ niệm khó quá, mới mẻ quá, nhưng ở mấy dòng cuối của thư
        trước tôi có kể qua cho cô bác nghe là chúng tôi vừa mới hộ niệm cho một người
        khác nữa vãng sanh.

        Đó là chị Vũ Thị Hậu, 51 tuổi, bỏ báo thân vào khoảng 2 giờ sáng ngày 21/10/05
        và hỏa thiêu vào lúc 11 giờ ngày 25/10/05.

        Suốt 4 ngày tại nhà quàng đều có làm lễ cầu siêu bình thường như mọi đám tang
        khác, hằng ngày cũng có nhiều người viếng điếu, nhưng có lẽ ít ai thấy được
        sự quí hóa vô giá của đám tang này

        Chị Vũ Thị Hậu đã vãng sanh chứ không phải chết.

        Trước ngày ra đi gần ba tuần lễ, chị được thầy Thích Thiện Huệ và các đồng
        tu niệm Phật hộ niệm mỗi đêm, và được hộ niệm tám tiếng đồng hồ sau khi bỏ
        xác thân.

        Chị niệm Phật và ra đi trong tiếng niệm Phật của chồng chị, của mẹ chị, của
        nhiều đồng tu hộ niệm.

        Ra đi xong, thân xác chị mềm mại, càng lúc càng mềm, càng lúc càng tươi, tiếp
        tục suốt bốn ngày sau khi tắt thở vẫn mềm mại, vẫn tươi nhuận, diện mạo vẫn
        hồng hào, tay chân không xanh không tái cho đến khi hỏa thiêu.

        Mỗi ngày tại nhà quàng từ 9 giờ sáng đến 11 giờ đều có thầy Thích Thiện Hữu,
        trụ trì chùa Phật Đà cùng một số Phật tử đến đọc kinh cầu siêu.

        Trong suốt mấy ngày liền tôi vẫn thấy thân xác chị tươi nhuận mềm mại như
        người đang ngủ.

        Đến ngày thứ ba, thì nhóm hộ niệm có nhiều người rảnh và cùng nhau tới dự
        lễ.'
