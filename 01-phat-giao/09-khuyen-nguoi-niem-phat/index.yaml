      summary: 'Chuyến về thăm lần này con đã thấy khá nhiều sự việc mà trước nay
        con không thấy, những hiện thực chung quanh con rõ ràng hơn trước đây.

        Trong những ngày ngắn ngủi đó con đã cố gắng niệm Phật trợ lực cho cha.

        Cha tỉnh lại được từ cơn bệnh nặng.

        Trợ niệm cho cha đau nặng nhưng con không mở một lời cầu xin Phật, Bồ-tát
        gia trì cho cha khỏe lại, trái lại con cứ một lòng cầu nguyện vãng sanh cho
        cha.

        Kết quả thì, chỉ vỏn vẹn hai ngày cha bình phục trở lại.

        Cái lý này sâu lắm, vi diệu lắm.

        Thành tâm niệm Phật cầu về Tây-phương không phải là phải chết, mà niệm Phật
        cầu vãng sanh làm nghiệp chướng dễ tiêu tan, nếu báo thân đã mãn thì cha được
        vãng sanh Cực Lạc, nếu chưa mãn thì tự nhiên bình phục rất nhanh.

        Cái lý này vi diệu không thể nói một vài lời được đâu.

        Đây cũng là dịp may, rõ ràng trên đời “đắc thất nan truy họa phước”.

        Cha không đau như vậy đâu có dịp thấy sự hiển linh của câu Phật hiệu.

        Bây giờ cha má đã quyết lòng niệm Phật ngày đêm, má cũng bắt đầu buông xả,
        làm con mừng không thể tả được.

        Nhưng nhìn kỹ thì nghiệp chướng vẫn còn, oan gia vẫn có, trái chủ chưa xa
        đâu.'
    - id: 22
      tap: 1
      global_idx: 22
      title: Niệm Phật Có 10 Đại Thiện Lợi
      duration: 750
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/22%20T1%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20C%C3%B3%2010%20%C4%90%E1%BA%A1i%20Thi%E1%BB%87n%20L%E1%BB%A3i.mp3
      video_url: https://www.youtube.com/watch?v=T5lb6cQYOng
      read_url: https://cusidieuam.com/2022/04/21/21-niem-phat-co-muoi-dai-thien-loi/
      read_label: 📖 Xem bài gốc
      summary: 'Người niệm Phật hưởng được mười đại lợi ích sau đây:

        Thanh tịnh niệm Phật thì tự nhiên được mười điểm lợi trên.

        Tuy nhiên phải nhớ kỹ hai chữ “TỰ-NHIÊN” và “THANH-TỊNH”.

        Tự nhiên là không phải mong cầu, người mong cầu thì không phải là tự nhiên,
        vì mong cầu thì tâm không thanh tịnh.

        Một khi tâm không thanh tịnh thì mở ngõ cho tà khí xâm nhập, vô tình pháp
        tu thì Chánh mà ý niệm sai lệch thành ra là tà.

        Điều thứ tư nói, tất cả ác quỷ dạ-xoa, la-sát, không thể hại người niệm Phật,
        oan gia trái chủ đâu thể đòi nợ được, chính thế mà chúng mới sợ hành giả niệm
        Phật, lo sợ chúng ta có công phu đắc lực.

        Cho nên, người mới khởi tu niệm Phật, công phu đắc lực, ban đầu thường bị
        chúng tới phá đám.

        Chúng giả người thân yêu, giả Bồ-tát tới dụ khị mình, đôi khi chúng có thể
        giả dạng luôn cả Phật để làm cho mình đắm say vào đó.

        Một khi đã thích vào đó rồi thì nó sẽ hướng dẫn mình đi tới chỗ sai đường
        lạc lối, mất phần vãng sanh.

        Điều thứ bảy nói chiêm bao thì thấy điềm tốt, thấy thần kỳ diệu sắc thân Phật
        A-di-đà.

        Đây là quả báo tự nhiên của tâm đã được thanh-tịnh, chứ không phải đêm đêm
        cầu nguyện thấy được Phật, thấy được điềm lành.

        Người niệm Phật không nên cầu xin những thứ lợi lạc tầm thường mà đành bị
        mất phần giải thoát, vì đây là lòng tham luyến trần tục.'
    - id: 23
