        được thư của anh và một số thư khác.

        Việc may mắn đầu tiên là khi vừa về tới Úc thì tôi đã sớm có dịp được bái
        kiến HT Tịnh-Không và trình bày lên Ngài cái nguyện vọng của anh.

        Nhưng trong thời gian này Ngài rất bận, vừa mới xong mấy đại lễ thì Ngài phải
        bôn ba xuất ngoại để hoằng pháp.

