      summary: 'Niệm Phật Khai Mở Trí Huệ


        Cụ Triệu Vĩnh Phương Vãng Sanh


        Cha má kính thương,


        Trong thư này, như đã hứa từ thư trước, con sẽ kể cha má nghe chuyện một bà cụ chín mươi bốn tuổi
        vãng sanh lưu lại ngọc xá lợi. Vãng sanh là chuyện thường tình như những chuyện khác, giống như
        những cuộn băng và sách con gởi về cho cha má về niệm Phật vãng sanh lưu xá-lợi. Nhưng đặc biệt
        chuyện vãng sanh này đã được họ quay phim tại chỗ từ đầu tới cuối. Bà cụ không những lưu lại xá-lợi
        mà còn lưu lại cả đến “XÁ LỢI HÌNH PHẬT”, một hiện tượng rất hiếm có. Bà cụ ấy tên là Triệu-Vinh-Phương,
        người Trung-Hoa, bà bình tĩnh niệm Phật đến hơi thở cuối cùng, đến giây phút cuối cùng bà vẫn
        còn mở mắt nhìn tượng Phật A-di-đà trước khi từ từ nhắm lại ra đi. Hồi giờ nghe nói thì nhiều,
        ít khi nhìn thấy, khi đã nhìn thấy rõ ràng trước mắt, từng chi tiết một con không tránh khỏi ngạc
        nhiên về sự vi diệu của tiếng niệm Phật. Chính con đã từng nghe qua, từng niệm Phật, đã từng nhìn
        thấy rất nhiều hình chụp lại. Nhưng nhìn hình ảnh, đọc sách chỉ có cảm giác bình thường, còn thấy
        được hiện tượng đang diễn biến thật là cảm kích.'
