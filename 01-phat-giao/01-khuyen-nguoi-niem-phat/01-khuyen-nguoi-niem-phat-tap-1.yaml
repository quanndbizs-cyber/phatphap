      title: Lời Giới Thiệu Quyết Lòng Niệm Phật
      duration: 1909
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/01%20T1%20L%E1%BB%9Di%20Gi%E1%BB%9Bi%20Thi%E1%BB%87u%20Quy%E1%BA%BFt%20L%C3%B2ng%20Ni%E1%BB%87m%20Ph%E1%BA%ADt.mp3
      video_url: https://www.youtube.com/watch?v=wp9FQB1HWGE
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=1
      read_label: 📖 Đọc lá thư số 01
      summary: 'Lời khai thị của Đại sư Ấn Quang.

        Bất luận là người tại gia hay xuất gia, cần phải trên kính dưới hòa, nhẫn nhục điều mà người khác
        khó nhẫn được, làm những việc mà người khác khó làm được; thay người làm những việc cực nhọc,
        thành toàn cho người là việc tốt đẹp.

        Khi tĩnh tọa thường nghĩ đến điều lỗi của mình.

        Lúc nhàn đàm đừng bàn đến điều sai trái của người.

        Lúc đi, đứng, nằm, ngồi, ăn, mặc, từ sáng đến tối, từ tối đến sáng chỉ niệm Phật hiệu không để
        gián đoạn: hoặc niệm nho nhỏ, hoặc niệm thầm.

        Ngoài việc niệm Phật, đừng dấy khởi một niệm nào khác.

        Nếu khởi vọng niệm phải tức thời bỏ ngay.

        Thường có lòng hổ thẹn và tâm sám hối.

        Nếu đã tu trì, phải tự hiểu là công phu của ta hãy còn nông cạn, chẳng nên tự kiêu căng, khoa
        trương.

        Chỉ nên chăm sóc việc nhà mình, đừng nên dính vào việc nhà người.

        Chỉ nên nhìn đến những hình dạng tốt đẹp, đừng để mắt tới những hình dạng xấu xa bại hoại.

        Hãy coi mọi người như Bồ-tát, mà ta chỉ là kẻ phàm phu.'
    - id: 2
      tap: 1
      global_idx: 2
      title: Niệm Phật Để Thành Phật
      duration: 1127
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/02%20T1%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20%C4%90%E1%BB%83%20Th%C3%A0nh%20Ph%E1%BA%ADt.mp3
      video_url: https://www.youtube.com/watch?v=dDymKAWdmn0
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=2
      read_label: 📖 Đọc lá thư số 02
      summary: 'Kính cha má thương,………………………………………………………………………..


        Việc tu hành của cha má là quan trọng nhất. Hơn nữa hãy đưa thư của con cho anh chị Hai, anh chị
        Ba, anh chị Bốn, bà con, cô bác coi, nhiều khi họ phát tâm tu hành thì cha má được phước lắm đó.
        Phàm hễ có đi thì mới tới, có thấy mới biết. Con có cơ duyên đi đây đi đó, gặp nhiều duyên tốt
        về Phật pháp cho nên con trực thấy được con đường giải thoát mới vội vã cho cha má biết hầu khuyên
        cha má ngay tức thời hạ thủ công phu NIỆM PHẬT kẻo trễ mất uổng lắm! Hằng ngày, con đều đọc kinh
        niệm Phật, đi chùa. Ngoài giờ đi làm, con ngày ngày lo đọc giảng ký của Hòa Thượng Tịnh Không,
        một vị pháp sư vĩ đại trên thế giới chuyên tu về pháp môn Tịnh-độ. Giảng ký của Ngài dài hàng
        ngàn ngàn trang giấy, được dịch từ tiếng Tàu sang tiếng Việt. Người ta dịch xong con lo chỉnh
        văn lại cho đúng câu đúng nghĩa. Vô tình con học được Phật pháp vi diệu.'
    - id: 3
      tap: 1
      global_idx: 3
      title: Niệm Phật Cầu Đạt Đến Đỉnh Cao
      duration: 1044
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/03%20T1%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20C%E1%BA%A7u%20%C4%90%E1%BA%A1t%20%C4%90%E1%BA%BFn%20%C4%90%E1%BB%89nh%20Cao.mp3
      video_url: https://www.youtube.com/watch?v=aGjPjD0ZQUE
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=3
      read_label: 📖 Đọc lá thư số 03
      summary: 'Cha má kính thương,


        Không phải tự nhiên con cứ nói mãi với cha má về việc tu hành. Ít có người ra nước ngoài rồi viết
        thư về khuyên tu hành, giảng giải như vậy đâu. Vì, thật sự thế gian này sáu tỉ người có mấy ai
        nghĩ đến chuyện tu hành. Sáu tỉ người có đến 5 tỉ 9 chỉ lo làm sao có tiền, có địa vị, có danh
        vọng, có nhà cao cửa rộng, lo ăn nhậu, lo tranh đọat đủ thứ… cho nở mày, nở mặt với bà con cô
        bác! Thậm chí có nhiều người trước khi nhắm mắt trong tay vẫn còn nắm gói tiền, vẫn còn hãnh diện
        cái quá khứ giàu sang vinh hiển của mình.


        Nghĩ cho kỹ cũng khá buồn cười! Không biết họ giữ cái danh đó được bao lâu? Không biết sau khi
        nhắm mắt họ đi về đâu? Sẽ cười hay sẽ khóc? Có đem theo được những cái vinh dự hão huyền mà họ
        suốt đời cặm cụi truy tầm không? Những thứ danh vọng phù phiếm đó có còn lưu mãi trong đời không?
        Hay chỉ vừa nhắm mắt thì tất cả cái hão huyền đều tan theo huyền hão!…'
    - id: 4
      tap: 1
      global_idx: 4
      title: Tu Tịnh Nghiệp Chứ Không Phải Thiện Nghiệp
      duration: 1513
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/04%20T1%20Tu%20T%E1%BB%8Bnh%20Nghi%E1%BB%87p%20Ch%E1%BB%A9%20Kh%C3%B4ng%20Ph%E1%BA%A3i%20Thi%E1%BB%87n%20Nghi%E1%BB%87p.mp3
      video_url: https://www.youtube.com/watch?v=U4STOypGSCI
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=4
      read_label: 📖 Đọc lá thư số 04
      summary: 'Cha má kính,………………………………………………………


        Trong thư này con sẽ nói với cha má một chuyện sắp sửa xảy ra ở đây. Hay vô cùng! Chuyện một người
        cho biết sắp được vãng sanh. Chuyện này ở các nơi thì cho là lạ lùng, còn ở đây với pháp tu tối
        thắng vi diệu, hễ người nào chí thành tu hành đều được vãng sanh về Tây-phương Cực-lạc với Phật
        A-di-đà cả. Quý hóa quá đi mà mãi đến nay, qua bao nhiêu thư của con cha cũng mới có mở một lời
        khen nhẹ thôi chứ chính cha má chưa hạ quyết tâm tu hành. Thật uổng quá. “Triêu tồn tịch vong
        sát na dị thế” mà chờ sao được? Đã có đường cho mình giải thoát mà không chịu đi, cứ ngồi đây
        lý luận, nghi ngờ thì ai có thể cứu mình đây? Vô thường tấn tốc, ngưỡng mong cha má quyết chí
        thành tâm đồng niệm Phật.'
    - id: 5
      tap: 1
      global_idx: 5
      title: Chết Không Phải Là Hết
      duration: 945
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/05%20T1%20Ch%E1%BA%BFt%20Kh%C3%B4ng%20Ph%E1%BA%A3i%20L%C3%A0%20H%E1%BA%BFt.mp3
      video_url: https://www.youtube.com/watch?v=6x3jB45XgH8
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=5
      read_label: 📖 Đọc lá thư số 05
      summary: 'Kính cha má,


        Hội Niệm Phật vừa kết thúc một khóa niệm Phật ba tuần vào ngày 17/12/00. Nhìn thấy người ta tu
        mà con cảm thấy thương hại, tội nghiệp cho cha má, anh chị em, bà con, con cháu của mình. Vì nghiệp
        báo của cuộc đời quá nặng mà mãi mãi trầm luân trong bể khổ, hết lo chuyện này rồi chuyện khác,
        hết kiếm tiền lại nghĩa ơn, hết lo nhà rồi lo nợ đời. Hì hục suốt cuộc đời, rồi đến khi gần già
        trực nhìn lại không được một cái gì hết, chỉ còn một khối nghiệp vĩ đại mang theo, chỉ còn một
        cảnh giới hãi hùng phải chịu trong hàng vạn kiếp. Ôi! Thật tội nghiệp! Thật đáng thương! Mấy tấm
        hình này có tấm con chụp Bà Bảy Tịnh-Bửu, người mà con nói trong thơ trước, còn mấy tấm kia người
        ta chụp còn sót lại trong tháng trước, con gởi về luôn để cha má hình dung phần nào cảnh tu Niệm
        Phật.'
    - id: 6
      tap: 1
      global_idx: 6
      title: Khuyên Người Niệm Phật
      duration: 1172
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/06%20T1%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20Ni%E1%BB%87m%20Ph%E1%BA%ADt.mp3
      video_url: https://www.youtube.com/watch?v=X4cAgY7ZYeU
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=6
      read_label: 📖 Đọc lá thư số 06
      summary: 'Cha má kính thương,


        Thời gian như tên bắn, mạng người vô thường biết còn mất lúc nào mà chờ, mà đợi. Khi con đã quyết
        định nghỉ làm thì con không còn tiền bạc nữa, con chỉ đủ để ăn hàng ngày là được. Về việc phụng
        dưỡng cha má, con cũng xin đóng góp cùng với anh chị em, việc này không ai được quyền từ chối.
        Cái phước đó lớn hay nhỏ tùy theo tâm tu hành của cha má. Con thường nói, hễ người có tu thì tự
        nhiên được hưởng phước, còn người cứ chạy cầu phước thì phước sẽ tận và rồi sẽ lận đận trong trong
        cảnh khó khăn, thoát không được nghiệp báo!


        Cái lo chính là, tuổi già cha má đã có quyết định rõ đường đi chưa? Trong lá thư cha ký tên, còn
        nét chữ là người nào viết (em Thứ phải không?), chứng tỏ cha đã yếu hay đang bị bệnh, sao không
        nói cho con biết lý do? Cuộc đời quá vô thường, cha má không hay biết sao!'
    - id: 7
      tap: 1
      global_idx: 7
      title: Niệm Phật Khai Mở Trí Tuệ
      duration: 1243
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/07%20T1%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20Khai%20M%E1%BB%9F%20Tr%C3%AD%20Tu%E1%BB%87.mp3
      video_url: https://www.youtube.com/watch?v=zHKkcCZeBu8
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=7
      read_label: 📖 Đọc lá thư số 07
      summary: 'Cha má kính thương,


        Sao con cứ muốn viết thư cho cha má hoài, không viết chịu không được. Nếu ngừng vài ngày thì con
        thấy cái điều con muốn nói với cha sao nó tràn ngập lên. Vì thực tế, nếu có viết hoài thì cũng
        viết không hết. Bên cạnh đó, không biết cha má có thâu lượm được tất cả ý của con không? Con vẫn
        cứ sợ cha má lơ là, rồi nghe người này nói vào, người kia nói ra, rốt cuộc bao nhiêu thư con gửi
        về thành ra vô dụng.


        Thưa cha má, vào giữa thời đại này, tìm một người hiểu lý đạo không dễ đâu, thì những người hằng
        ngày đến với cha má, tìm đâu ra một người biết khuyến tấn tu hành, làm thiện, nhất là ủng hộ chuyện
        niệm Phật cầu sanh Cực-lạc Thế-Giới, là chuyện giống như huyền thoại, như trên trời rơi xuống,
        khó cho một người bình thường hiểu tới. Dù ngay trong bà con, anh em, chú bác của mình chưa chắc
        đã có người thức tỉnh chứ đừng nói chi đến người bên ngoài. Ấy thế, đem chuyện giải thoát này
        mà bàn với người không biết đạo thì tốt hơn đừng bàn. Cái bệnh nặng nhất của chúng sanh trong
        thời này là nghiệp chướng, đã kết tập lâu đời nhiều kiếp, nó kết thành một khối vô minh kiên cố,
        muốn phá nó đâu phải dễ. Vô minh lôi kéo theo vô minh. Đã là vô minh thì làm sao họ dễ dàng chấp
        nhận giác ngộ! Mình hồi giờ chung sống trong cái vô minh bất giác đó, mình nhậu lai rai với họ,
        mình ơn nghĩa thị phi với họ, mình đánh cờ tướng với họ… bỗng nhiên mình muốn thoát ra làm sao
        tránh khỏi sự dị nghị dèm pha. Cho nên, nếu tâm mình không vững sẽ không đi được. Niềm tin vừa
        mới lóe lên có thể bị dập tắt liền. Hậu quả đọa lạc vẫn hoàn đọa lạc.'
    - id: 8
      tap: 1
      global_idx: 8
      title: Đới Nghiệp Vãng Sanh
      duration: 1360
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/08%20T1%20%C4%90%E1%BB%9Bi%20Nghi%E1%BB%87p%20V%C3%A3ng%20Sanh.mp3
      video_url: https://www.youtube.com/watch?v=j6cD8YFPsz0
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=8
      read_label: 📖 Đọc lá thư số 08
      summary: 'Kính Cha Má,


        Sắp sửa có người về Việt-Nam, con gửi thư về thăm cha má cộng với mấy băng thuyết pháp, và mấy
        món quà nhỏ cho em Thứ niệm Phật. Trong anh chị em nhà mình đã có người nghe theo lời con khuyên
        vậy cũng là đại phước rồi. Em Thứ niệm Phật, em Thứ được hưởng thiện lợi, cha má niệm Phật cha
        má được hưởng thiện lợi. Ai tu nấy đắc, không ai tu giùm cho ai được cả. Cái lo lắng lớn nhất
        của con hiện giờ là cha má tuổi già sức yếu, việc tu hành giải thoát trở thành vấn đề tối cấp
        bách và quan trọng. Khi cha má nhận được một số băng thuyết pháp thì cố gắng nương theo đó tu
        tập, những thư này chỉ là cái mối đầu cho cha má tiếp nhận lời pháp thôi.'
    - id: 9
      tap: 1
      global_idx: 9
      title: Nhìn Cho Thấu Buông Cho Trót
      duration: 1168
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/09%20T1%20Nh%C3%ACn%20Cho%20Th%E1%BA%A5u%20Bu%C3%B4ng%20Cho%20Tr%C3%B3t.mp3
      video_url: https://www.youtube.com/watch?v=U-0twKA9ytg
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=9
      read_label: 📖 Đọc lá thư số 09
      summary: 'Cha má kính thương,


        Tuổi già không có gì cần thiết hơn là cố gắng tinh tấn tu hành để tìm phương giải thoát. Nhà cửa
        chắc đã khởi công, tiền bạc chắc cũng đã tạm ổn. Nơi thờ phụng ông bà chắc cũng sẽ được khang
        trang. Đây là cơ hội cho cha má yên tâm rũ sạch mọi sự bận bịu để lo niệm Phật tu hành. Cha hãy
        giao cho anh chị em nào đó trông coi, chăm sóc việc nhà, chứ cha má không nghe theo lời con, cứ
        lăng xăng vào mấy thứ vặt vãnh thì rốt cuộc không làm được gì cả, mà cuộc đời của cha với má cũng
        không ai cứu nổi nữa đâu. Trăm ngàn lần con tha thiết xin cha má hãy nghe lời con, mau mau phát
