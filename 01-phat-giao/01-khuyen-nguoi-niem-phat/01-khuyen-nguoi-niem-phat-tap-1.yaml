      read_label: 📖 Đọc lá thư số 11
      summary: 'Thưa cha má,


        Tuổi trẻ mà khuyên họ buông xả thì khó lắm, vì tình trần còn đang lừng lẫy, tương lai còn đầy
        tham vọng thì làm sao buông xả được. Còn người khi tuổi đã về chiều, nhìn lại cuộc đời mới thấy
        như trò huyễn hóa, nên dễ đi về với đạo, dễ ngộ đạo hơn tuổi trẻ. Thế nhưng, trong gia đình mình
        mấy đứa em đã biến chuyển làm con mừng lắm. Em Thứ đã phát tâm niệm Phật, em An cũng đã bắt đầu
        phát tâm tu tập. Đây là hiện tượng cảm ứng rất tốt.


        Riêng gia đình cô Sáu có mấy người ăn chay trường, tu hành khá tốt. Cháu NgọcHiền, con của Ngọc
        đi xuất gia, đây là duyên lành khó kiếm và đáng quý. Huy-Hồng cũng đã phát tâm tu hành rất tinh
        tấn. Hôm trước ở đây có sư cô Diệu-Anh về Việt-Nam, con kêu tụi nó tới gặp Sư Cô, khi qua lại
        Úc, Sư Cô cho con biết là tất cả đều tinh tấn niệm Phật, An lúc nào cũng thầm niệm Phật, Hồng
        thì quyết tâm cầu về Tây-phương. Nghe nói như vậy, con sung sướng không còn gì hơn. Tất cả đều
        là duyên lành thiện căn phúc đức từ nhiều kiếp. Trong gia đình mình, nếu ai đọc được những thư
        này mà trực nhận thấy được con đường đi thì không còn gì quý hơn. Các em tuổi trẻ mà còn ngộ đạo
        như vậy huống chi là cha má, còn chần chờ so đo gì nữa? Cha má hãy nhanh chóng buông xuống tất
        cả để lo phần tu tịnh. Sự phát tâm tu hành của cha má là cái gương cho tất cả con cháu, và là
        chuyện gấp rút cho chính cha với má, cần thiết như cứu lửa cháy đầu. Nếu còn trì hoãn, còn chần
        chờ thì mạng sẽ tiêu, lúc đó không ai có thể bươi tro nặn lại mình được đâu cha má ạ.'
