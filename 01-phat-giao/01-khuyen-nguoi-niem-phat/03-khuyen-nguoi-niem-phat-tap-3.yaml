      title: Lời Khuyên Người Bạn Ở Paris – Phát Tâm Bồ Đề
      duration: 1435
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/62%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20B%E1%BA%A1n%20%E1%BB%9E%20Paris%20%E2%80%93%20Ph%C3%A1t%20T%C3%A2m%20B%E1%BB%93%20%C4%90%E1%BB%81.mp3
      video_url: https://www.youtube.com/watch?v=h7-pWENUhac
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=60
      read_label: 📖 Đọc lá thư số 60
      summary: 'Đạo hữu Huệ Sanh mến,


        Ở đây có một ông bác khi đọc xong tập “Khuyên người niệm Phật” chợt thấy được đường tu hành, hằng
        ngày bác tự lập ba thời khóa niệm Phật rất tốt. Ban ngày thì con cháu ồn ào, bác chỉ thầm niệm
        Phật, đêm đến 12 giờ khuya là bắt đầu thức dậy công phu. Bác nói: “Tôi bắt chước theo sách này,
        gặp ai tôi cũng khuyên họ nên niệm Phật”. Bây giờ thì mỗi lá thư của bác gởi cho bạn bè, cho người
        thân, cho con cháu… đã biến thành thư “Khuyên người niệm Phật”, nội dung hoàn toàn khác với những
        gì bác thường viết trước đây.


        Nhiều người nghe nói đến “Phát Bồ-đề Tâm” thì cảm thấy mông lung, hoặc lo ngại vì thấy chuyện
        này quá lớn! Nhưng có ngờ đâu, nhiều khi chính họ đang làm chuyện Bồ-đề tâm mà không hay biết.
        Ông bác phát được một tâm nguyện nho nhỏ: “gặp ai cũng khuyên họ nên niệm Phật”, là bác đã vô
        tình đang làm một chuyện phát Bồ-đề tâm mà bác không hay.…. Những tâm nguyện thành tâm giúp đời,
        cứu người mong cho chúng sanh thành đạo Bồ-đề đều là những cách phát tâm Bồ-đề. Ngài Tĩnh Am đại
        sư dạy rằng: “Cửa yếu vào đạo lấy sự phát tâm làm đầu, việc cấp thiết tu hành lấy sự lập nguyện
        làm bước trước. Nguyện có lập thì chúng sanh mới độ nổi, tâm có phát thì đạo mới thành tựu”. Phát
        Bồ-đề tâm vô cùng quan trọng.'
