      summary: 'Kính gởi quý đồng tu ở Paris, các cô bác ở An Thái, cùng gia đình ở VN!


        Cùng một số quí đạo hữu ở các nơi khác đã nêu ý kiến muốn bàn thêm về sự hộ niệm. Thư này Diệu
