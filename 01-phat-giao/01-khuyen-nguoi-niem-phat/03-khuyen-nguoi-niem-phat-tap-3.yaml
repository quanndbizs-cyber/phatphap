      read_label: 📖 Đọc lá thư số 55
      summary: 'Em Ngọc,


        Trong mấy câu hỏi của em, có một vấn đề khá quan trọng, anh vội vã trả lời thư liền! Tu hành nhất
        định phải cẩn thận, đời mạt pháp không thể bừa bãi được đâu em ạ. Luôn luôn dựa theo thiện tri
        thức, dựa theo đúng kinh điển Phật, học hiểu những lời chỉ dẫn của chư vị Tổ sư. Còn khi gặp một
        hiện tượng hơi đặc biệt thì cần phải hỏi kỹ, chớ nên vội vã nghe theo. Trả lời thư em anh Năm
        cũng phải dựa theo kinh, theo lời Tổ chứ không dám tự quyền đâu! Khi tới vấn đề quan trọng anh
        sẽ nhấn mạnh cho em thấy.


        Hỏi 1: Em tu nhưng không hành, không sửa nghiệp được, đến bị bệnh lung tung, …!?


        Trả lời: Em nghĩ rằng tu mà không hành cho nên sanh bệnh. Đây là một ý nghĩ hơi ngộ nghĩnh! Em
        nói như vậy làm cho anh nghĩ đến hai trường hợp:'
