      summary: 'Cha má kính thương,


        Tết sắp đến rồi con viết thư về thăm cha má. Có lẽ sau tết con sẽ về, cha má và anh chị em cố
        gắng sắp xếp thì giờ niệm Phật với con. Đời này nóng lạnh vài mươi năm, sanh-lão-bệnh-tử, lăn
