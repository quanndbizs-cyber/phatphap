      summary: 'Đạo hữu Diệu Nhàn!


        Nhận được thư Diệu Nhàn, không có thời giờ viết thư trả lời, Diệu Âm đành phải gởi mấy băng giảng
        kinh của HT Tịnh-Không cho đạo hữu coi trước, kèm theo đó có cuộn “Tự tại vãng sanh”, quay lại
        cụ Ngụy Quốc Hưng vãng sanh vào tháng 2/2003. Đạo hữu cố gắng dành thời giờ coi qua. Cuộc vãng
        sanh này bất khả tư nghì! Diệu Nhàn nên cố gắng sang thêm để cúng dường nhiều người cùng xem.
        Xây dựng lòng tin Phật pháp cho họ, giúp nhiều người phát tâm niệm Phật, công đức này lớn lắm
        đó.


        Tự tại vãng sanh, danh từ tuy đơn sơ, nhưng trên đời người nào thực hiện được chuyện này thì hưởng
        được một phước báu vô cùng vô tận, cái phước thành tựu đạo Bồ-đề, cái phước được làm Phật, cái
        phước mà một chúng sanh có thể phải tu vô lượng kiếp mới có được, chứ không phải tầm thường!'
