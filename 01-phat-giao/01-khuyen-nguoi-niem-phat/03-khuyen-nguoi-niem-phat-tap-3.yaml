        hộ niệm liên hệ tới con cháu trong gia đình. Hôm nay ta xin bàn tới ban hộ niệm.


        Hộ niệm quan trọng lắm. Người niệm Phật quyết lòng cầu sanh Tịnh-độ cần chú ý đọc kỹ những thư
