        quý đạo hữu nên đặc biệt lưu ý. Lời thư này sẽ cố gắng đóng góp cho quý cô bác và đồng tu một
        ý niệm căn bản rồi tùy theo hoàn cảnh mỗi nơi mà uyển chuyển ứng dụng để thực hành sự hộ niệm.
