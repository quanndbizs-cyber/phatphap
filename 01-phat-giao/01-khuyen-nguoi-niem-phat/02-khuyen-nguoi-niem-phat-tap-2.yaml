      summary: 'Em Hồng thương,


        Anh Năm đã nhận được thư em. Đọc thư em anh rất cảm động. Mới cầm thư và thấy cái tên ngoài bìa
        là anh đã nhận ra em ngay. Hồi tưởng lại những ngày còn sống ở cái nhà nhỏ xíu ở đường Bạch Đằng
        Qui Nhơn, thật là vui. Anh còn nhớ anh có người em tên Hồng trắng đẹp như nàng tiên, hiền và dễ
        thương vô cùng. Hồi đó em còn nhỏ xíu, anh Năm thì cũng đã biết xấc lấc rồi. Thế mà thời gian
        đã 30 năm trôi qua. Ba mươi năm! Thời gian giống như một giấc mơ. Anh Năm vẫn tưởng tượng được
        em vẫn xinh xắn, vẫn dễ thương, vẫn hiền như một tiên nữ xưa kia. Anh Năm chúc em cùng gia đình
        hạnh phúc, an lạc.


        Em Hồng, anh rất mừng khi đọc được thư em, rất mừng là vì em hiểu đạo, và cũng rất mừng vì những
        thư anh Năm viết về cho gia đình có nhiều người thích đọc, nhiều người thích nghe. Đó cũng là
        duyên. Khi hiểu được Phật pháp anh Năm mới thấy tội nghiệp cho con người. Vì tham lam mà cứ mải
        mê chạy theo danh văn lợi dưỡng, có biết đâu rằng “vạn pháp giai không”, rốt cuộc cũng trả về
        cho số không! Vì sân khuể mà cứ mải mê quay cuồng đấu tranh chém giết, để tự nhận đời mình vào
        quả báo cực hình thảm khốc! Vì ngu si mê muội mà cứ cống cao ngã mạn, mãi mê nhìn lên trời cao
        mà không hay rằng mình đang đi dần đến cảnh giới bàng sanh trong mai hậu! Thấy thế, anh mới thầm
        nguyện sao cho Phật pháp được hoằng truyền, Pháp môn Tịnh-độ được xiển dương, tiếng Niệm “A-di-đà
        Phật” được nhiều người chú ý đến. Cầu mong cho chúng sanh mau mau tỉnh ngộ, xa lìa đường ác, quay
        về với Phật để được giải thoát trong một đời này.'
