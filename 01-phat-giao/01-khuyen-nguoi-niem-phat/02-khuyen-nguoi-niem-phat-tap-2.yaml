      title: Lời Khuyên Người Bác – Đời Như Một Giấc Mộng
      duration: 1415
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/30%20T2%20L%E1%BB%9Di%20Khuy%C3%AAn%20Ng%C6%B0%E1%BB%9Di%20B%C3%A1c%20%E2%80%93%20%C4%90%E1%BB%9Di%20Nh%C6%B0%20M%E1%BB%99t%20Gi%E1%BA%A5c%20M%E1%BB%99ng.mp3
      video_url: https://www.youtube.com/watch?v=OmMYBGD7-dU
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=28
      read_label: 📖 Đọc lá thư số 28
      summary: 'Kính thăm Bác,


        Hôm trước cháu có nhận được thư cháu Tuyết cho biết bác đang bị bệnh. Từ xa xôi cháu không biết
        gì hơn thành tâm cầu Phật gia trì cho bác. Nghe cháu Tuyết nói rằng bác đã phát tâm niệm Phật,
        cháu mừng lắm. Nếu vững lòng tin, chí thành niệm Phật, nguyện cầu sanh về Tây-phương thì bác dễ
        được sự cảm ứng đạo giao, hoặc là sớm bình phục, hoặc có mãn báo thân này thì bác được hoàn thành
        viên mãn giải thoát. Phật pháp lý đạo cao siêu, thậm thâm vi diệu, không thể nào chỉ trong một
        lá thư tầm thường mà cháu có thể giải thích cho trọn. Hãy lấy niềm tin để đi về đất Phật bác ạ.


        Cuộc đời có khác gì một giấc mộng đâu bác! Ai hiểu đạo thì tìm cách thoát cảnh mộng để trở về
        với cảnh giác. Người mê muội thì vừa thoát cơn mộng này thì chìm vào cơn mộng khác, triền miên
        trong mộng khó có ngày thoát thân. Đêm đêm ta nằm trong tiểu mộng, thì cuộc đời này từ lúc sinh
        ra đến lúc buông tay cũng chỉ là một đại mộng! Khi một người về đến Tây Phương Cực-lạc rồi, họ
        quay nhìn xuống thì bảy tám mươi năm của con người trên thế gian này cũng chỉ là tiểu mộng mà
        thôi, vì đối với thời gian vô cùng vô tận ở cõi Tây-phương thì đây chỉ là một giấc ngủ trưa của
        họ. Cháu thành tâm cầu nguyện cho bác được thoát nạn trong đời.'
    - id: 5
      tap: 2
      global_idx: 31
      title: Lời Khuyên Em Gái – Niệm Phật Con Đường Cứu Mẹ
      duration: 2090
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/31%20T2%20L%E1%BB%9Di%20Khuy%C3%AAn%20Em%20G%C3%A1i%20%E2%80%93%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20Con%20%C4%90%C6%B0%E1%BB%9Dng%20C%E1%BB%A9u%20M%E1%BA%B9.mp3
      video_url: https://www.youtube.com/watch?v=jW3GZIZWELA
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=29
      read_label: 📖 Đọc lá thư số 29
      summary: 'Em Vân,


        Anh Năm vừa thực hiện một chuyến ngao du xa hơn một nửa quả địa cầu mới về. Anh đi ngay trong
        thời điểm mà tụi khủng bố cướp 4 chiếc máy bay tấn công nước Mỹ. Ngày 11/9/01 hai chiếc máy bay
        tông vào hai tòa nhà cao nhất thế giới (trung tâm mậu dịch thế giới) ở New York thì anh Năm đang
        ở bên đó, chỉ mới vừa rời Mỹ đi qua Toronto ở Canada, một nước sát cạnh Mỹ, có thể lái xe qua
        lại được. Khi vừa tới nhà thì anh Năm nhận được thư em. Đầu thư cho anh gởi lời thăm Thành, và
        chúc toàn gia đình em an khương, hạnh phúc.


        Vân, đọc thư em mà anh Năm vui buồn lẫn lộn(!). Vui vì nhìn lại được nét bút của em vẫn như xưa,
        vẫn như ngày mình còn trẻ, em là đứa em dễ thương và có lẽ thương anh Năm nhiều nhất. Buồn vì
        nay lại hay tin cô Bốn bị bệnh đang nằm trong bệnh viện. Cô bệnh mà còn nhớ tới anh Năm và nhắn
        em nhờ anh Năm đọc kinh “Thủy Sám” cho cô. Anh Năm đã để tên cầu an cho cô trong Niệm Phật Đường
        rồi, cầu cho cô sớm giải nạn. Ôi! Đời thật là vô thường, thật là huyễn hóa, phải không em?!…'
    - id: 6
      tap: 2
      global_idx: 32
      title: Lời Khuyên Cô Bốn – Niệm Phật Phương Pháp Giải Nạn
      duration: 2524
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/32%20T2%20L%E1%BB%9Di%20Khuy%C3%AAn%20C%C3%B4%20B%E1%BB%91n%20%E2%80%93%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20Ph%C6%B0%C6%A1ng%20Ph%C3%A1p%20Gi%E1%BA%A3i%20N%E1%BA%A1n.mp3
      video_url: https://www.youtube.com/watch?v=26uBRVcp9MQ
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=30
      read_label: 📖 Đọc lá thư số 30
      summary: 'Cô Bốn kính thương,


        Con nhận được thư của Vân mới hay cô bị bệnh đang nằm trong bệnh viện. Nghe được tin này con buồn
        vô cùng. Trong cơn bệnh cô còn nhớ tới con. Con đã để tên cầu an cho cô trong Niệm Phật Đường
        nơi con thường tới hằng ngày để niệm Phật. Cầu chư Phật mười phương gia hộ cho cô, người cô con
        thương nhất trong đời.


        Thưa cô, trong thư của Vân có nhờ con tụng kinh Thủy-Sám để cầu giải nghiệp cho cô. Con biết chắc
        có lẽ cô Ba cũng đã đọc tụng kinh đó rồi. Cầu xin cho cô được sớm bình phục.


        Kinh Thủy-Sám xuất hiện vào thời nhà Đường bên Trung Quốc, Ngài Ngộ Đạt Thiền Sư gặp nạn mới lập
        đàn đó giải nạn cho Ngài. Vào thời đó con người còn tin Phật, tánh tình còn hiền lương, tâm địa
        còn thanh tịnh. Với lại đàn được lập nên bởi một vị quốc sư thì phải có cả hàng ngàn Tăng Ni trong
        nước thành tâm tụng cầu, toàn dân hộ niệm, mới giải được cho Ngài. Bây giờ đã rơi vào thời mạt
        pháp rồi, lòng người ly loạn, tư tưởng điên đảo, chí hướng chạy theo vật dục, tinh thần xa lìa
        Phật pháp… cái nghiệp chướng của con người thời đại này lớn vô cùng vô tận thì tụng kinh Thủy-Sám
        cũng tốt, nhưng thành thực mà nói thì rất khó giải nạn được?!'
    - id: 7
      tap: 2
      global_idx: 33
      title: Lời Khuyên Em Gái – Niệm Phật Với Lời Phát Nguyện
      duration: 2552
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/33%20T2%20L%E1%BB%9Di%20Khuy%C3%AAn%20Em%20G%C3%A1i%20%E2%80%93%20Ni%E1%BB%87m%20Ph%E1%BA%ADt%20V%E1%BB%9Bi%20L%E1%BB%9Di%20Ph%C3%A1t%20Nguy%E1%BB%87n.mp3
      video_url: https://www.youtube.com/watch?v=OKnah9kVSvw
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=31
      read_label: 📖 Đọc lá thư số 31
      summary: 'Em Thứ,


        Hôm Tết nói chuyện được với em anh Năm mừng lắm. Nếu những lá thư anh gởi về khuyên cha má tu
        hành được anh chị em, bà con xem qua và tin tưởng thực hiện thì không còn gì quý báu hơn. Nó quý
        hơn là được tiền, vì sao? Một triệu đô-la trước sau gì cũng hết, vài chục năm rồi mình cũng bỏ
        mà đi, hơn nữa nhiều tiền chưa chắc đã phước, không khéo sinh ra tự cao tự đại, ỷ giàu có mà gây
        ra tội ác, để sau cùng chịu nạn. Khi không hiểu thì mình sống bừa bãi, khi biết được rồi nhiều
        lúc nghĩ lại những sai lầm của mình làm anh Năm sợ toát mồ hôi!


        Anh Năm may mắn đi khắp nơi, từ Âu sang Á, anh mới mở được con mắt tuệ ra, đây cũng là một cơ
        duyên hiếm có. Anh phát hiện được cái thậm thâm vi diệu của Phật pháp, cái sự thật của vũ trụ
        nhân sinh, cho nên anh tha thiết khuyên em, cùng tất cả giòng họ mình, bà con trong làng xóm,
        tất cả mọi người, hãy mau mau tỉnh ngộ, nhất là những người lớn tuổi với tháng ngày mong manh
        còn sót lại, hãy nên niệm Phật cầu sanh Tịnh-độ, đây là phước đức lớn vô tận.'
