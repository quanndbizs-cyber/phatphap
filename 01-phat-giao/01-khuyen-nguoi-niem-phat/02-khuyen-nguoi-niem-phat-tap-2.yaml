      duration: 2618
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/27%20T2%20C%E1%BB%A9u%20Ng%C6%B0%E1%BB%9Di%20Nh%C6%B0%20C%E1%BB%A9u%20L%E1%BB%ADa%20%E2%80%93%20Tr%E1%BA%A3%20L%E1%BB%9Di%20Th%C6%B0%20Ng%C6%B0%E1%BB%9Di%20Ch%E1%BB%8B.mp3
      video_url: https://www.youtube.com/watch?v=X3ers6D3brA
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=26
      read_label: 📖 Đọc lá thư số 26
      summary: 'QUYỂN 2: Cứu Người Như Cứu Lửa


        Anh chị Hai kính thương,


        Em vừa mới niệm Phật ba tiếng đồng hồ trong niệm Phật đường về nhà thì nhận được thư của chị.
        Đọc thư chị mà em cảm động quá, biết chị tin Phật và có lòng lo lắng cho Bác. Đây là lòng hiếu
        thảo đáng quý của người dâu. “Hiếu dưỡng phụ mẫu” là điều đầu tiên trong 11 điều tu phước của
        Phật giáo, nguồn gốc tu học Phật là báo hiếu cha mẹ, phải tận tâm cứu độ mới được. Cứu người cấp
        bách như lửa cháy đầu, cho nên xin anh chị Hai quyết tâm làm ngay những gì em nói. Em đã gởi về
        anh chị Hai hai lá thư mới nhứt nói về sự “Hộ-Niệm”, xin đọc thật kỹ, rồi đem về đọc cho cha má
        nghe. Hãy đọc cho tất cả anh chị em đều nghe thì tự nhiên biết sẽ làm gì. Hãy chuẩn bị làm ngay
        đừng chần chờ. Thời gian không chờ mình đâu! Làm ngay có nghĩa là tự thực hiện cho chính mình
        và thực hiện khi có người nhà mình ra đi. Còn như vẫn chưa biết làm gì thì cho em biết càng sớm
        càng tốt, em sẽ nói rõ hơn. Em viết cho cha má, nhưng cũng như cho tất cả những cha mẹ khác, tất
        cả những người con khác, xin đừng ngại đọc cho nhau nghe.'
