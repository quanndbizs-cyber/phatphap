        lúc 96 tuổi. Bà không xuất gia, thỉnh thoảng đi chùa. Suốt đời chỉ thờ một bức tượng Phật A-di-đà
        và niệm “Nam-mô A-di-đà Phật” suốt ngày. Khi đó chị Năm còn nhỏ, cả nhà ít ai hiểu gì về Phật
