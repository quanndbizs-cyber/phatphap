      read_label: 📖 Đọc lá thư số 15
      summary: 'Kính cha má,


        Thế giới trong tương lai có thể sẽ xảy ra nhiều tai ương hiểm nạn kinh khủng lắm, cường độ có
        thể khó tưởng tượng chứ không phải tầm thường! Muốn cứu vãn phần nào tình thế này không còn cách
        nào khác hơn là khuyên người tu hành cho nhiều, nhờ đó mà xoay chuyển phần nào cái khổ nạn xã
        hội. Nhưng cứu người không những chỉ thoát khỏi vài cái tại nạn thiên nhiên, hoặc sống sót sau
        vài cuộc chiến tranh là đủ đâu. Vì nghiệp chướng vẫn còn đó, làm sao con người tránh khỏi nghiệp
        báo? Giảm nạn thế gian là sự ảnh hưởng tự nhiên của việc tu hành, còn cứu độ chúng sanh vượt qua
        được tam giới để vãng sanh Tây-phương mới là điểm chính yếu.


        Hôm Tết nói chuyện được với cha má và anh chị Ba, biết được tất cả đều có niệm Phật làm con mừng
        lắm. Giác ngộ cuộc đời sớm chừng nào hay chừng đó, đừng để quá trễ tràng thì không còn cứu kịp
        nữa đâu. Nhưng qua điện thoại, con lại phát hiện một vấn đề khá quan trọng mà con không dám không
        nói. Đó là chuyện: có người niệm Phật vãng sanh, có người niệm suốt cuộc đời cũng không được vãng
        sanh. Tại sao? Mới đây có một Phật tử hỏi thầy Ngộ-Thông như vầy: “Thưa thầy, con cũng quyết tâm
        niệm Phật và cầu vãng sanh, nhưng điều kiện để được vãng sanh Tây-phương Cực-lạc là khi lâm chung
        phải được tỉnh táo và niệm cho được mười câu Phật hiệu. Con thấy một trăm người chết người nào
        cũng mê man bất tỉnh hoặc quằn quại đau đớn ra đi, thì làm sao niệm Phật được. Điều này làm cho
        con lo lắng vô cùng và nhiều lúc thấy chán nản, vì làm sao biết mình sẽ được may mắn, không bị
        mê man khi ra đi đây?”.'
