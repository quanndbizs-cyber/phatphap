      read_label: 📖 Đọc lá thư số 47
      summary: '47 – Lời khuyên người em


        Anh gửi cho Hải, anh gửi cho Thứ,


        Anh viết gởi cho cả hai em, anh thương hai em nhiều lắm. Có điều đáng tiếc là hình như hai em
        không chịu đọc kỹ thư anh. Mỗi lần viết thư cho các em, anh Năm nắn nót từng chữ, trân trọng từng
        câu, cẩn thận từng ý, mà các em không chịu tiếp thu cẩn thận. Đời này khổ lắm! Cuộc đời chúng
        ta sống qua mấy chục năm, một năm 365 ngày, một ngày 24 giờ cho các em chịu khổ, vậy mà các em
        còn chịu được, trong khi đọc thư của anh chỉ mất 30 phút, 30 phút có thể giúp các em khỏi khổ,
        thế mà các em lại lười biếng. Thấy vậy mà anh vừa thương, vừa trách! Có khi nào các em tự hỏi
        rằng, vì đâu mà chúng ta lại khổ? Vì cái gì mà chúng ta chịu khổ? Tại vì sao mà chúng ta phải
        suốt đời bận bịu trong khổ đau? Bận bịu đến nỗi không có được một vài phút yên tĩnh để bàn luận
        chuyện thoát khổ, và bây giờ phải đối diện với khổ đau mà rơi nước mắt! Các em có lần nào giựt
        mình tự hỏi tại sao như vậy không? Cái khổ của cuộc đời này lớn lắm đó! Không khéo lo toan nó
        còn khổ hơn nữa. Vì sao vậy? Vì những cái khổ nạn này lại do chính mình tạo ra mà mình không biết.
        Vì không biết nên cứ tiếp tục lăn xả vào việc tạo khổ. Khổ lại thêm khổ đó các em ạ!'
