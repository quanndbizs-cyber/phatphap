      read_label: 📖 Đọc lá thư số 72
      summary: 'Chị Nhung,


        Niệm Phật bất khả tư nghì! Trước đây chị chỉ nghe nói sự vi diệu của pháp niệm Phật, chứ chắc
        chưa từng thấy qua. Nay chính người mẹ đã vãng sanh, chị đã thấy được tận mắt những hiện tượng
        bất khả tư nghì. Phải chăng đây là một bài hiện thân thuyết pháp, làm cho chị cùng gia đình tăng
        trưởng niềm tin vào pháp niệm Phật. Xin thành tâm chúc mừng cho chị, chúc mừng cho cả gia đình
        và thành kính chúc mừng cho Bác. Nguyện cầu hương linh Bác vãng sanh cao phẩm, sớm ngày trở lại
        cõi Ta-bà cứu độ chúng sanh.


        Phật nói: Bất khả dĩ thiểu thiện căn phước đức nhân duyên đắc sanh bỉ quốc. Người ít thiện căn,
        ít phước đức, ít nhân duyên không thể nào được vãng sanh về thế giới Tây-phương Cực-lạc của đức
        Phật A-di-đà. Nghĩa là, vãng sanh được về thế giới Cực-lạc không phải là chuyện dễ. Nhiều người
        tu hành lâu năm, khổ cực dụng công, sức tu tập thật giỏi, nhưng cuối cùng chưa chắc đã biết đâu
        là chỗ quy hướng tối thắng. Thế mà, Bác vừa được vãng sanh, Bác đã hưởng được một đại thiện căn,
        đại phước đức, đại nhân duyên. Cái thiện căn phước đức này mấy ai sánh bằng?… Và có lẽ, tôi nghĩ
        rằng, cái phước đức mà Bác hưởng được này là lớn nhất trong dòng họ của chị từ trước tới nay chăng(?).
        So sánh xa hơn nữa, chúng ta cứ bình tâm suy nghĩ kỹ thử coi, có phải hàng triệu người, hàng tỉ
        người trên thế gian này liệu có mấy ai được như vậy. Từ xưa tới nay, hàng vô lượng, vô biên, vô
        số người đã chết, chúng ta vẫn chỉ nghe thấy những cảnh lâm chung buồn thảm, tâm thần mê man,
        sắc diện u ám, thần thái khổ đau, vài tiếng đồng hồ sau thì thân xác cứng đơ, tái xanh, trông
        rất khó coi, ít ai đủ can đảm nhìn lâu! Tại sao vậy? Vì họ đã bị chết, chết trong cảnh sợ hãi,
        khủng hoảng, hãi kinh! Tại sao lại có hiện tướng chẳng tốt lành? Vì người đang chết phải đối diện
        với những cảnh giới xấu ác, hung hiểm, nghiệp báo hiện hành, oan gia trái chủ hãm hại… Gặp những
        cảnh ngộ này thì bạc phước lắm vậy! Thế mà Bác đã niệm Phật ra đi an lành trong tiếng niệm Phật
        của chị, của gia đình, của nhiều vị đồng tu hộ niệm. Bác được niệm Phật hộ niệm suốt 32 tiếng
        đồng hồ mới nhập quan mà thân xác vẫn mềm mại, sắc tướng tươi vui, trang nghiêm hơn lúc sống gấp
        bội lần. Thật bất khả tư nghì!'
