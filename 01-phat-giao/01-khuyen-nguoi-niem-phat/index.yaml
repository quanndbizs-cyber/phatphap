      title: Mấy Dòng Tỏ Bày – Nhất Môn Thâm Nhập Trường Kỳ Huân Tu
      duration: 2664
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/68%20T4%20M%E1%BA%A5y%20D%C3%B2ng%20T%E1%BB%8F%20B%C3%A0y%20%E2%80%93%20Nh%E1%BA%A5t%20M%C3%B4n%20Th%C3%A2m%20Nh%E1%BA%ADp%20Tr%C6%B0%E1%BB%9Dng%20K%E1%BB%B3%20Hu%C3%A2n%20Tu.mp3
      video_url: https://www.youtube.com/watch?v=q7EafDm7hsw
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=65
      read_label: 📖 Đọc lá thư số 65
      summary: 'Phát Nguyện Vãng Sanh:


        Nguyện sanh Tây-phương Tịnh-độ trung,

        Cửu phẩm liên hoa vi phụ mẫu,

        Hoa khai kiến Phật ngộ Vô-Sanh,

        Bất-thối Bồ-tát vi bạn lữ.


        Văn Hồi Hướng:


        Nguyện dĩ thử công đức,

        Trang nghiêm Phật Tịnh-độ.

        Thượng báo tứ trọng ân,

        Hạ tế tam đồ khổ.

        Nhược hữu kiến văn giả,

        Tức phát Bồ-đề tâm.

        Tận thử nhất báo thân,

        Đồng sanh Cực-lạc quốc.


        Mấy Dòng Tỏ Bày (Dẫn nhập Tập 4 — Phật lịch 2548 / Dương lịch 2004):


        Bộ sách “Khuyên Người Niệm Phật” Tập 4 tiếp nối tâm nguyện khuyên người niệm Phật cầu sanh Tây-phương
        Cực-lạc thông qua những lá thư trao đổi thực tế với các đạo hữu và liên hữu đồng tu (cô Lệ Tân,
        đạo huynh Thiện Khánh, chị Nhung, em Lộc, đạo hữu Tâm Minh cùng quý liên hữu Tịnh Thư Quán).'
    - id: 2
      tap: 4
      global_idx: 69
      title: Ý Thức Về Sự Chướng Ngại
      duration: 2507
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/69%20T4%20%C3%9D%20Th%E1%BB%A9c%20V%E1%BB%81%20S%E1%BB%B1%20Ch%C6%B0%E1%BB%9Bng%20Ng%E1%BA%A1i.mp3
      video_url: https://www.youtube.com/watch?v=LOErOk4ZzH4
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=67
      read_label: 📖 Đọc lá thư số 67
      summary: '(Viết tiếp thư trước)


        Kính gởi cô Lệ Tân cùng cô bác cộng tu!


        Thời này tu hành có nhiều chướng ngại lắm. Chướng ngại có ba loại, một là phiền não chướng, hai
        là nghiệp chướng, ba là báo chướng. Phiền não chướng là tham-sân-si; Cô bác muốn tu hành cho thành
        tựu thì nên tìm cách giảm bớt ba chất độc này, mỗi ngày mỗi giảm cho đến hết luôn mới dễ trốn
        thoát ba cảnh đọa lạc. Tham lam là đường ngã quỷ, sân khuể là đường địa ngục, ngu si là đường
        súc sanh. Nghiệp chướng là ngũ nghịch thập ác, sát đạo dâm vọng. Muốn tu thì cố gắng giữ năm giới,
        nhất là giới sát sanh. Hãy giữ lòng từ bi thương mạng chúng nó, có thế thì ta dễ được thoát nạn.
        Báo chướng là hậu quả bị đọa lạc trong ba đường khổ: địa ngục, ngạ quỷ, súc sanh. Phiền não nghiệp
        chướng là nhân, báo chướng là quả. Nhân nào quả đó, nhân duyên quả báo không sai một ly một tấc.'
    - id: 3
      tap: 4
      global_idx: 70
      title: Khóc Lóc Mối Nguy Hại Cho Người Lúc Lâm Chung
      duration: 2563
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/70%20T4%20Kh%C3%B3c%20L%C3%B3c%20M%E1%BB%91i%20Nguy%20H%E1%BA%A1i%20Cho%20Ng%C6%B0%E1%BB%9Di%20L%C3%BAc%20L%C3%A2m%20Chung.mp3
      video_url: https://www.youtube.com/watch?v=cLMa-miU1Ao
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=68
      read_label: 📖 Đọc lá thư số 68
      summary: 'Cô Lệ Tân cùng quý đạo hữu!


        Đời người thật ngắn ngủi, sống chết là chuyện thường tình. Có người coi cái chết nhẹ tợ lông hồng,
        nhưng có người coi cái chết nặng hơn dãy núi Trường sơn. Người hiểu Phật đạo không sợ chết, họ
        an nhiên tự tại vãng sanh. Người không hiểu Phật pháp họ sợ cảnh ra đi làm cho tâm hồn thường
        trực đối diện với nỗi hãi hùng khủng bố! Chung quanh chuyện người lâm chung, trước đây có một
        vài đạo hữu có nêu lên vấn đề chướng ngại do con cháu khóc lóc, người thân yêu trong gia đình
        không hiểu đạo gây ra sự ồn náo. Thư của cô Lệ Tân cũng có nêu lên những khó khăn tương tự. Hai
        thư trước giải quyết một ít chuyện. Hôm nay Diệu Âm xin cố gắng bàn đến những chuyện khá phổ biến
