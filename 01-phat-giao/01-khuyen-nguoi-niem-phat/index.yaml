      summary: 'Em Đường – Thạnh,


        Anh đã viết cho hai em nói về sự khổ, nói về cách đọc tụng kinh, hy vọng nó giúp các em giải quyết
        được phần nào chướng ngại phải không? Hôm nay anh lại mở thư em ra đọc lại để đi đến vấn đề khó
        khăn khác. Những điều khó khăn này, nếu cho anh hay sớm hơn, thì có lẽ đến nay các em cảm thấy
        thoải mái và tự tại nhiều rồi, chứ đâu đến nỗi bây giờ mà “… em phải lần mò đi tìm từng chút…”
        có vẻ khó khăn dữ vậy. Tìm hiểu thì tốt, nhưng có lúc tìm được, có nơi không có tài liệu thì tìm
        đâu cho ra. Tìm không ra tức là “Cầu bất đắc khổ”. Đời đã là khổ lại còn đi cầu thêm cái khổ làm
        chi? Tục ngữ VN có câu, “đi một ngày đàng, học một sàng khôn”, cái khôn này do đi mà thấy, chứ
        không phải ngồi ở nhà tra cứu trong sách vở mà có đâu. Muốn tu sửa thì phải thực hành mới có ích
        lợi. Thôi anh bắt đầu trả lời tiếp những câu hỏi của em đây.'
