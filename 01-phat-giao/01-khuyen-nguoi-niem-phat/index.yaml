      read_label: 📖 Đọc lá thư số 49
      summary: 'Kính gởi quí đạo hữu Niệm Phật Đường An Thái và Như Ngọc,


        Hôm trước có nhận được một số hình chụp quí bác và anh chị em đang niệm Phật. Những tấm hình này
        quí lắm, một kỷ niệm thật thân thương. Nhìn thấy quí đạo hữu tinh tấn tu hành ai cũng phải khen.
        Với một niệm Phật đường nho nhỏ, phương tiện thì eo hẹp, nhưng thấy mọi người đều có sắc diện
        nghiêm trang, kính cẩn, tay chuỗi, tay chắp, chí tâm niệm Phật thật là cảm phục.


        Trong những thư trước viết cho Như Ngọc, cho quí bác, hôm nay xin viết về thăm chị Sáu, anh Ba,
        anh Hai, v.v… Nói chung Diệu Âm này không dám quên một người nào hết. Chỉ vì đồng tu nhiều quá
        không thể nào viết đến từng người. Chắc rằng, tất cả quí anh chị em hoan hỉ về chuyện này.'
