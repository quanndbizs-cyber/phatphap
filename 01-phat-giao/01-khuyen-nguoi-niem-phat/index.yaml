      summary: 'Kính gởi đạo hữu Huệ Sanh,


        Con người sinh ra lặn hụp trong biển khổ sanh tử luân hồi khổ không nói hết. Có người cố gắng
        trồi lên mặt nước, hớp một hơi không khí, rồi chìm xuống lại dưới đáy đại dương. Có người cố gắng
        bơi, nhưng bơi lòng vòng, sau cùng cũng chìm xuống đó. Đây là hai cảnh giới mình đã bàn với nhau
        trong sáu tháng trước. Nay lại được nói chuyện với chị, lần này tôi xin tiếp tục lá thư dang dở,
        nói đến cảnh thứ ba mà thầy Trí Tu đề cập đến: Có người sinh ra họ bơi thẳng một đường qua bờ
        bên kia, bờ giải thoát.


        Trước tiên tôi thấy rất phấn khởi khi biết chị Huệ Sanh có phát tâm nguyện lớn, càng ngày tu càng
        nhiều, pháp hỉ sung mãn, tươi vui hơn ra. Đây là hiện tượng khá tốt. Xin thành tâm chúc mừng.
        Học Phật nếu biết rõ đường đi nước bước thì lòng tin của mình được cũng cố, chí nguyện mạnh mẽ,
        sự tu vững vàng. Tín-hạnh-nguyện đầy đủ là con đường thành tựu đạo quả. Xin nhận lời giúp cho
        quí đạo hữu ở Paris tìm hiểu về sự hộ niệm và cách thức cộng tu niệm Phật, thư tới Diệu Âm sẽ
        cố gắng nói chuyện này.'
