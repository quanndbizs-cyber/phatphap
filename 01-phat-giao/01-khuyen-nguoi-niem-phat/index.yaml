      summary: 'Em Đường – Thạnh,


        Anh muốn lập lại lời nói của em một lần nữa:


        “Đời này quá khổ, không biết bao nhiêu nỗi khổ kể cho hết…”.


        Thư trước anh giải bày cho em về sự khổ não, chắc em đã nhận được và hiểu thêm chút ít về sự khổ
        của cuộc đời. Anh đem pháp Tứ Diệu Đế để nói về khổ. Giờ đây chúng ta hãy xét lại coi, rốt cuộc
        khổ não từ đâu mà có? Nó thực hay giả?


        Phật dạy, “Nhất thiết hữu vi pháp như mộng huyễn bào ảnh”, nghĩa là tất cả vạn sự vạn vật là tuồng
        như mộng như huyễn, hư vọng, không thực. Pháp hữu vi là những gì có thể thấy được, sự khổ đau
        là một pháp hữu vi, thì nó cũng phải hư vọng. Nói rõ hơn nữa, những sự khổ đau mà ta thường xuyên
        chịu đựng có thể chỉ là chuyện huyễn hóa chứ không phải có thực! Vì sao vậy? Vì tâm hồn ta đang
        khổ thì ta thấy khổ! Nếu cùng một hoàn cảnh như vậy nhưng tâm hồn ta đang vui thì ta thấy vui.
        Sự vui hay buồn chỉ là sự phản chiếu những gì đang có trong tâm mà thôi! Nói cách khác, khổ đau
        chỉ là sản phẩm do tâm hồn ta tạo ra!'
