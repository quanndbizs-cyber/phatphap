      summary: 'Đường em,


        Học Phật cần phải biết nhẫn nại, từ từ mà hiểu thì mới có thể thâm nhập vào Phật pháp. Một câu
        hỏi của em về lục đạo luân hồi đã liên quan đến những cảnh giới rộng lớn, anh muốn tóm gọn một
        cách tổng quát, nhưng đã trải dài qua bao nhiêu trang giấy rồi mà chưa giải quyết xong.


        Thấy được điều này nên ngay từ đầu anh đã nói, đừng bao giờ nghĩ rằng những thắc mắc của mình
        là nhỏ nhặt. Nhỏ là vì mình chưa thấy, chứ nếu thấy được thì cái nhỏ đó có thể sẽ lớn bao trùm
        cả hư không pháp giới. Một là tất cả, tất cả là một. Hiểu được pháp Phật thì từ một điểm có thể
        thấy đến cảnh giới vô lượng vô biên, trong vô lượng vô biên cảnh giới ta có thể thâu tóm lại thành
        một điểm. Càng hiểu càng sâu, càng thấy càng rộng. Phật pháp thật là thậm thâm vi diệu, nếu hời
        hợt đứng bên ngoài nhìn vào thì khó liễu ngộ được chân tướng vậy!'
