      title: Lời Khuyên Vợ Chồng Người Em – Cảnh Giới Người
      duration: 2234
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/54%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20V%E1%BB%A3%20Ch%E1%BB%93ng%20Ng%C6%B0%E1%BB%9Di%20Em%20%E2%80%93%20C%E1%BA%A3nh%20Gi%E1%BB%9Bi%20Ng%C6%B0%E1%BB%9Di.mp3
      video_url: https://www.youtube.com/watch?v=gRVoL5xx3uw
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=51
      read_label: 📖 Đọc lá thư số 51
      summary: 'Em Đường – Thạnh,


        Hiểu về cảnh giới giúp cho ta có cái nhìn tổng quát về vũ trụ nhân sinh, khỏi mập mờ chạy theo
        những chốn hiểm nạn, thấy được rõ ràng đường đi cho tương lai.


        (*) Đi về đâu? Nên đi về những cảnh giới thiện. Hãy tránh xa những cảnh giới ác. Cảnh giới nào
        là thiện? Đối với địa ngục thì cảnh ngã quỉ là thiện, đối với ngã quỉ thì cảnh súc sanh là thiện,
        đối với súc sanh thì cảnh giới người là thiện. Chúng ta đang ở trong một cảnh giới thiện là người,
        nhưng cái thiện của cảnh giới người chỉ so sánh được đối với loài súc sanh, loài ngã quỉ, với
        các loài chúng sanh đã bị rơi vào địa ngục mà thôi, chứ không thể so bì được với các cảnh giới
        cao hơn! Do đó, tu hành mà không thể vượt lên khỏi cảnh người thì khó trốn thoát khổ nạn. Đã là
        người, lại tu hành để thành người, thì cuộc đời này có tu mà không có tiến, sự chuyển hóa đành
        phải giậm chân tại chỗ! Vạn sự vạn vật luôn luôn tiến hóa. Cảnh giới của vũ trụ nhân sinh chuyển
        biến không ngừng. Thì trong dòng nhân sinh này con người phải biết lèo lái con thuyền huệ mạng
        của mình tiến về cội nguồn hạnh phúc. Nếu đứng lại là lùi, dòng nghiệp lực sẽ lôi ta tới tận cùng
        của sự thảm hại! Tu mà không tiến thật là oan uổng vậy!'
