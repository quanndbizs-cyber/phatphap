        liều lĩnh, bây giờ tất cả đã xong con mới dám nói lại. Thời gian con về là lúc con đang bệnh,
        bác sĩ cấm con không được lái xe, không được đi xa, không được đi máy bay. Bịnh của con rất kỵ
        trời nắng nóng, hễ nóng lên có thể bị xỉu liền. (Nay thì đã đỡ lắm rồi). Thế mà khi vừa nghe cha
        ngã bịnh, vì phải cần cứu cha, con quyết định liều lĩnh bay về ngay trong thời điểm thời tiết
        Việt-Nam rất nóng. Chuyến đi ngắn ngủi nhưng tất cả những thủ tục bảo hiểm đều trả hết, và Ngọc
        chuẩn bị sẵn sàng bốc con ngược trở lại Úc bất cứ lúc nào. Vậy mà sự việc lại êm xuôi không có
        gì trở ngại. Cha má nhớ không, ngày đầu tiên con vừa bước chân về tới nhà thì trời chuyển mưa
        tầm tã, rồi suốt những ngày sau đó thời tiết dịu lại, trời tiếp tục mưa lai rai. Thật là một chuyện
        may mắn hiếm có, nhờ thế mà con ở lại quê được lâu.'
    - id: 26
      tap: 1
      global_idx: 26
      title: Sự Gia Trì
      duration: 1879
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/26%20T1%20S%E1%BB%B1%20Gia%20Tr%C3%AC.mp3
      video_url: https://www.youtube.com/watch?v=tH3f_JDKWSc
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=25
      read_label: 📖 Đọc lá thư số 25
      summary: 'Cha má kính thương,


        Con vừa mới hay được tin là em Chương, con cô Sáu ở Bình-Dương, thay mặt Cô Sáu cùng tất cả anh
        chị em trong gia đình, xuống Sài-Gòn gặp An để bàn việc cấp dưỡng cho cha má để cha má an tâm
        tu hành. Nghe được tin này, con vô cùng cảm động và thật sự tán thán công đức của Cô và tất cả
        các em. Có lẽ đây là niềm an ủi rất lớn cho cha má trong tuổi về già. Hay được việc các em ở Bình-Dương
        đã phát tâm cúng dường cho cậu mợ Hai an tâm niệm Phật, con lại nghĩ đến một điều khá hay!


        Trong thư trước, con nói đến “Phật tại môn trung, hữu cầu tất ứng”. Con viết vừa xong thư đó thì
        thì hay được tin này. Sự ứng cảm của Phật, Bồ-tát đa hình, đa dạng, vô hình, hữu hình, hiện thực,
        vô thực… khó có thể lường biết được. Đây là một phước đức mà chỉ có người thực tâm tu hành mới
        cảm thọ được. Thưa cha má, cái phước từ đâu mà có? Từ câu Phật hiệu mà có. Chư Tổ dạy rằng, một
        lòng nhất tâm niệm Phật, thì một câu Nam-mô A-diđà Phật có thể phá được tám mươi ức kiếp nghiệp
        chướng trọng tội. Nói cách khác, một câu chí tâm niệm Phật có một công đức, phước báu, lớn bằng
        tám mươi ức kiếp làm lành. Đây là một công đức mà chư Phật gọi là “bất khả tư nghì”, nghĩa là
        không thể bàn luận được, không thể giải thích được. Ngài Phổ-Hiền Bồ-tát, trong kinh Niệm-Phật-Ba-La-Mật
        nói, “Danh hiệu Nam-mô A-di-đà Phật vốn đầy đủ vô lượng, vô biên, hằng sa công đức…”. Trong nhiều
        kinh điển, Phật nói danh hiệu Nam-mô A-di-đà Phật là “Vạn đức hồng danh”. Đã gọi là vô lượng vô
        biên rồi thì nó không có giới hạn. Đã không có giới hạn thì làm sao mà giải thích. Chư Phật, chư
        Bồ-tát đều tán thán như vậy, trong khi con người vốn đã thiếu phước đức mà không tin lời Phật
        dạy thì bao giờ mới có phần thiện lợi.'
