      duration: 1434
      audio_src: https://ph.tinhtong.vn/ftp/MP3/-%20z%20CS%20Dieu%20Am/Khuyen%20Nguoi%20Niem%20Phat%20-%20DPA%2032kbps/65%20T3%20L%E1%BB%9Di%20Khuy%C3%AAn%20Song%20Th%C3%A2n%20%E2%80%93%20%C4%90%E1%BB%8Ba%20Ng%E1%BB%A5c%20V%C3%A0%20V%E1%BA%A5n%20%C4%90%E1%BB%81%20Nh%C3%A2n%20Qu%E1%BA%A3.mp3
      video_url: https://www.youtube.com/watch?v=nqNTbNaIlFY
      read_url: /phat-giao/khuyen-nguoi-niem-phat/doc-khuyen-nguoi-niem-phat?thu=62
      read_label: 📖 Đọc lá thư số 62
      summary: 'Kính cha má,


        Trong cuối tháng tư vừa qua, ở Tịnh Tông Học Viện có tổ chức lễ kỷ niệm bảy năm ngày bà quảng
        tràng họ Hàn vãng sanh. Trong giờ ăn trưa, vào phòng trai đường con thấy trên vách có dán những
        tấm “Địa ngục đồ”. Những tấm hình diễn tả lại những cảnh tra tấn quá dã man dưới địa ngục, nhìn
        thấy phải khiếp sợ! Chỗ này nạn nhân bị thảy vào chảo dầu sôi, chỗ kia bị cưa thân làm từng mảnh.
        Có chỗ bị cắt lưỡi, có chỗ bị chặt đầu máu me tung tóe. Chỗ này bị chó sắt cắn xé, chỗ nọ thì
        cọp beo vồ chụp, banh thân moi ruột, v.v… Toàn là những hình ảnh quá khiếp hãi! Có một ông bác,
        đang theo dự khóa Phật thất, có lẽ vui tính rồi sẵn dịp hỏi con: “Người làm ác thì xuống địa ngục
        bị hành tội, còn những người ở dưới địa ngục đi hành hạ tội nhân đủ cách quá ư dã man, như vậy
        họ có tội không?”. Nghe câu hỏi làm con giựt mình. Thực sự giựt mình!'
