        thu vạn kiếp, nay nếu biết hồi đầu cải sửa vẫn có thể thoát nạn và được vãng sanh về tới Tây-phương
        Cực-lạc. Đây là lời kinh Phật nói…..


        Thưa cha má, thà mê mờ không biết thì đành chấp nhận rủi may, chứ khi đã biết được đường đi, biết
        được chân tướng sự thật của vũ trụ nhân sinh thì quyết định con đường thoát thân phải đi, đi cho
        đúng, cho vững, đừng đi quờ quạng mà uổng phí một đời luống qua. Thời khóa tu hành sắp sẵn không
        có chỗ hở, nhưng con cũng đã tự phát nguyện niệm Phật thêm để cầu cho thế giới hòa bình, chúng
        sanh khỏi nạn… Hằng ngày, con đều hồi hướng công đức cho cha má, nguyện cầu cho cha má sớm thức
        tỉnh đường đạo, dũng mãnh tinh tấn niệm Phật cầu sanh Tịnh-độ. Con thành tâm động viên cha má
        hãy vững lòng tin tưởng pháp môn niệm Phật. Cha má tin lời Phật, vững lòng phát nguyện cầu vãng
        sanh Tây-phương, một hướng chuyên tâm niệm Phật, và chỉ có niệm Phật thôi, thì con tin chắc chắn
        cha và má sẽ được vãng sanh. Tất cả anh chị em, bà con xa gần, ai phát được lòng tin vững chắc,
        cứ y theo lời thư con tu hành thì ai cũng đắc được thiện lợi, một cái thiện lợi có giá trị bằng
        triệu kiếp tu hành, bằng vạn đời cực khổ lao nhọc, vĩnh viễn khỏi bị đọa lạc, vô tận thời gian
        an vui cực lạc chứ không phải nhỏ, xin chớ xem thường.'
