      summary: 'Kính gửi cô Lệ Tân và quý đồng tu,


        Chúng ta tiếp tục bàn chuyện còn đang dở dang:


        “… việc hộ niệm khó quá, nó mới mẻ quá, có người chấp nhận, có người lại cho rằng bố mẹ ra đi
        con cái phải khóc, không khóc thì thiên hạ bảo là bất hiếu…”


        Vấn đề con cháu khóc lóc khi người thân ra đi là một đại nạn cho người chết, chúng ta đã bàn qua
        trong thư trước. Xin cô bác đồng tu nhớ kỹ, đừng vì một chút tình cảm thế tục mà vô tình hãm hại
        người thân của mình trong tam đồ ác đạo vạn kiếp. Tội nghiệp lắm! Hôm nay xin nói về “… việc hộ
        niệm khó quá, mới mẻ quá…!”.


        Người ta nghĩ hộ niệm khó quá cũng có thể đúng đấy! Tuy nhiên không phải quá khó như nhiều người
        tưởng, vì chính tôi cũng từng hộ niệm cho người vãng sanh. Còn sự hộ niệm có vẻ mới mẻ, thì chỉ
        mới mẻ đối với người Việt Nam chứ không xa lạ lắm đối với người học Phật Trung Quốc và các nơi
        khác. Hơn nữa, người niệm Phật cầu sanh Cực-lạc thì sự hộ niệm lại rất quen thuộc, đây là điều
        cần thiết để bảo đảm sự vãng sanh được chắc chắn. Riêng ở một số nơi, sự thực hành Phật giáo bị
        thiên lệch, thiếu người hoằng dương chánh pháp, nhiều người đi chùa lễ Phật tụng kinh lâu năm,
        nhưng tình thực mà nói, hầu hết chưa hiểu rõ Phật pháp là gì. Thành ra cứ thấy có tới chùa tới
        miễu quỳ lạy các pho tượng cầu tài, cầu lộc, cầu mua may bán đắc, v.v.. thì tưởng mình đã tu theo
        Phật. Có người còn âm thầm thực hành theo những pháp ngoại đạo, không có trong kinh Phật mà cứ
