      read_label: 📖 Đọc lá thư số 48
      summary: Chị Huệ Sanh, Nghĩ đi nghĩ lại tôi là người được khá nhiều may mắn, trong đó quen được
        chị là cái may mắn khá vui và khá nhiều kỷ niệm đẹp của cái duyên học Phật. Tôi đang nhớ lại cuộc
        nói chuyện qua điện thoại xuyên quốc gia dài cả tiếng đồng hồ mà cứ đòi nói thêm, lại còn dặn
        dò “hãy viết thư cho tôi thật dài, càng dài càng tốt...” nữa chứ. Có người thì nói thư dài quá,
        còn chị thì đòi dài hơn. Đúng là vạn pháp do tâm! Chị Huệ Sanh ạ, mục đích của những lời thư này
        là khuyên người niệm Phật, dù viết dài hay ngắn cũng chỉ xoay quanh câu ‘Nammô A-di-đà Phật”.
        Tôi thành tâm cầu mong người người đều sớm thức tỉnh đường tu, phát tâm niệm Phật. Câu Phật hiệu
        thực sự bất khả tư nghì, cứu chúng sanh một đời vĩnh ly ác khổ, ở đây tôi có bằng chứng về sự
        vãng sanh Tây-phương Cực-lạc một cách rõ rệt, tôi muốn rồi đây chính Huệ Sanh sẽ kể cho tôi nghe
        chứ không cần tới tôi nữa. Bây giờ, thấy rõ đường đi rồi thì Huệ Sanh phải quyết tâm trì niệm
        “A-di-đà Phật”, cứ như vậy thì chỉ cần đọc một câu là có thể sẽ thấy toàn thư. Cố gắng khuyến
        tấn quý đạo hữu trong nhóm ở Paris cùng niệm Phật. Khi đã gặp được pháp môn này thì nhất định
        phải biết giữ chặt cơ hội này để vãng sanh, đừng sơ ý mà mất phần thành đạo uổng lắm. Niệm Phật
        phải niệm thật thành tâm, niệm liên tục, đi đứng nằm ngồi trong tâm đều niệm Phật, thì thử hỏi
        bao nhiêu trang giấy mới chứa cho hết những câu Phật hiệu đây? Một ngày nào đó, cả bầu trời Paris
        sẽ tràn ngập công đức niệm Phật của Huệ Sanh, lấy công đức đó hồi hướng cho chúng sanh, cho thế
        giới hòa bình, cho người dân tiêu tai miễn nạn, và cũng đừng quên hồi hướng công đức trang nghiêm
        Tịnh-độ. Công đức thật sự vô lượng! Kính lời thăm tất cả quý chư Tăng Ni, quý đạo hữu ở Paris.
        Những thứ Huệ Sanh yêu cầu tôi đang tìm cách giải quyết, lâu mau tùy duyên. Thành tâm cầu chúc
        tất cả đều tinh tấn niệm phật.
