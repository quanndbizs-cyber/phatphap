      summary: 'viết tiếp thư trước)


        Em Đường,


        Phật pháp lý đạo cao siêu, thậm thâm vô ngần, quảng đại vô biên! Muốn tìm hiểu về Phật pháp không
        phải chỉ dựa vào kiến thức thế gian mà liễu ngộ được!


        Như vậy muốn hiểu sâu về Phật pháp ta phải làm sao? Phải giác ngộ! Làm sao giác ngộ? Niệm Phật!
        “Phật” có nghĩa là “Giác”. Niệm Phật là niệm Giác. Niệm Giác thì được giác ngộ. Danh hiệu A-di-đà
        có nghĩa là Vô Lượng; “A” là Vô; “Di-Đà” là Lượng. “A-di-đà Phật” là “Vô-Lượng-Giác”. Niệm “A-di-đà
        Phật” là niệm Vô-lượng Giác. Vô-Lượng-Giác nghĩa là giác ngộ rốt ráo, hiểu rõ về thái hư pháp
        giới, thấu rõ chân tướng của vũ trụ nhân sinh. Tất cả cảnh giới vô lượng vô biên đều bao hàm trong
        câu A-di-đà Phật. “Vô Lượng” có nghĩa là nhiều vô cùng, vô tận, vô số, vô biên, không kể xiết.
        Trong cái “Vô-Lượng” đó, thì “Vô-Lượng-Thọ” và “Vô-Lượng-Quang” là đại biểu cho tất cả “Vô-Lượng”.
        Vô-Lượng-Thọ là chỉ cho thời gian, Vô-Lượng-Quang là chỉ không gian. Pháp giới, vũ trụ, vạn sự,
        vạn vật không có gì nằm ngoài thời gian và không gian cả. Muốn hiểu rõ về pháp giới không phải
        đọc những lời giải thích này mà có thể hiểu được, mà đây chỉ là sự hướng dẫn để quay trở về với
        danh hiệu A-di-đà Phật. Nói tóm lại, muốn hiểu được cảnh giới vô lượng vô biên thì phải niệm “A-di-đà
        Phật”. Lý đạo này chúng ta cần phải nhớ.'
