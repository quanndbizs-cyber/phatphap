name: MediaPlayer & Content Kit
version: 1.1.0
description: 'Multi-source Media Hub (Audiobookshelf, Audio.com, YouTube, Local MP3), Searchable Tracklist, and Visual Backend Settings for Typemill.'
author: quannd
homepage: https://github.com/quanndbizs-cyber/phatphap
license: MIT

settings:
  defaultHeight: '680px'
  themeMode: 'dark'

forms:
  fields:
    defaultHeight:
      type: text
      label: 'Default Player Height'
      placeholder: '680px'
    themeMode:
      type: select
      label: 'Media Hub Color Theme'
      options:
        dark: 'Dark Studio (Recommended for Audio/Video)'
        light: 'Light Clean'

metatabs:
  mediaplayer:
    fields:
      player_fieldset:
        type: fieldset
        legend: 'Cấu hình Trình phát Audio & Playlist'
        fields:
          player_mode:
            type: select
            label: 'Chế độ hiển thị Media trên trang'
            options:
              none: 'Chỉ hiển thị khi chèn Shortcode trong bài viết'
              buhdview_top: 'Tự động hiển thị Tab Kép (Audio MP3 + Tóm tắt) ở ĐẦU bài viết'
              buhdview_bottom: 'Tự động hiển thị Tab Kép (Audio MP3 + Tóm tắt) ở CUỐI bài viết'
              absplayer_top: 'Tự động hiển thị Trình phát Audio MP3 ở ĐẦU bài viết'
              absplayer_bottom: 'Tự động hiển thị Trình phát Audio MP3 ở CUỐI bài viết'
            description: 'Chọn hiển thị tự động nếu không muốn gõ shortcode trong nội dung.'
          title:
            type: text
            label: 'Tiêu đề Player / Album Playlist'
            placeholder: 'Ví dụ: Báo Ứng Hiện Đời — Tập 3 (Trọn bộ 46 bài MP3)'
            description: 'Tiêu đề hiển thị trên thanh phát audio.'
          abs_key:
            type: text
            label: 'Audiobookshelf Key (Mã album phát)'
            placeholder: 'Ví dụ: buhd3 hoặc buhd1,buhd2'
            description: 'Key đã khai báo trong abs_catalog.json (hỗ trợ nhiều key cách nhau bằng dấu phẩy).'
          exturl:
            type: text
            label: 'Link bộ sưu tập Audio ngoài'
            placeholder: 'https://audio.com/quan-nguyen-duc-1/collections/...'
            description: 'Link bộ sưu tập Audio.com hoặc kho lưu trữ bên ngoài.'
      links_fieldset:
        type: fieldset
        legend: 'Liên kết Sách Đọc & File Đính Kèm'
        fields:
          read_url:
            type: text
            label: 'Đường dẫn đọc sách trực tuyến'
            placeholder: '/nhan-qua/doc-sach/bao-ung-hien-doi-tap-3'
            description: 'Link nội bộ hệ thống hoặc liên kết web mở bản chữ.'
          pdf_url:
            type: text
            label: 'Đường dẫn file PDF tải về'
            placeholder: '/media/files/bao-ung-hien-doi-tap-3.pdf'
            description: 'Link tài liệu PDF tải về.'
      data_fieldset:
        type: fieldset
        legend: 'Dữ liệu Bài / Truyện Tùy Chỉnh (Tùy chọn)'
        fields:
          stories_yaml:
            type: textarea
            label: 'Danh sách bài / truyện (định dạng YAML)'
            description: 'Nếu muốn quản lý bài trực quan ngay tại đây, nhập YAML cấu trúc items (title, summary, audio_src, read_url, video_url).'
