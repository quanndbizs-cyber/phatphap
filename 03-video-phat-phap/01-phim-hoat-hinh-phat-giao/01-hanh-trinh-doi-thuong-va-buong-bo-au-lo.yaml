  title: 'Phần 1: Đời Thường, An Nhiên & Buông Bỏ Âu Lo — Hoạt Hình Chú Tiểu Chân Tâm (12 Tập)'
  description: '12 tập phim hoạt hình Phật giáo gần gũi giúp các bạn trẻ hóa giải tâm lý so sánh, đối diện vô thường chia ly, thấu hiểu cảm xúc và sống an nhiên giữa đời thường.'
  owner: 'quannd'
  author: 'Hải Triều Âm (@haitrieuamvn) • Biên tập: Tịnh Độ Liên Hoa'
